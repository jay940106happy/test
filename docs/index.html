,"phrase":"make a decision","category":"會議與商務溝通","id":"w0141","number":141,"examples":[{"en":"The decision will be announced soon.","zh":"決定將很快公布。"},{"en":"After careful consideration, the company decided to postpone the launch date.","zh":"經過仔細考慮，公司決定延遲發布日期。"}],"tips":["常見動詞搭配：在 TOEIC 考試中，decision 最常與動詞 'make' 或 'reach' 連用，例如 'make a decision' (做決定) 或 'reach a final decision' (達成最終決定)，考生應注意動詞與名詞的固定組合。"],"forms":["decision","decisions","decides","deciding","decided"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"approve","pos":"v.","meaning":"核准；批准","phrase":"approve a proposal","category":"會議與商務溝通","id":"w0142","number":142,"examples":[{"en":"The manager will approve the request.","zh":"經理將會核准這項請求。"},{"en":"Your request has been approved.","zh":"你的請求已獲核准。"}],"tips":["例句1是主管執行動作；例句2改以 request 為主詞，has been approved 表示「已被核准」。"],"forms":["approve","approves","approving","approved"],"exampleSource":"Wordstep original examples"},{"word":"approval","pos":"n.","meaning":"核准；批准","phrase":"receive approval","category":"會議與商務溝通","id":"w0143","number":143,"examples":[{"en":"Your approval is needed before we start.","zh":"開始之前需要你的核准。"},{"en":"We are awaiting approval of the budget proposal.","zh":"我們正在等待預算提案的批准。"}],"tips":["常見搭配詞組：常用 'obtain/get approval' (獲得批准) 或 'subject to approval' (取決於批准)，後者在合約與政策說明中極為常見。"],"forms":["approval","approvals","approves","approving","approved"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"postpone","pos":"v.","meaning":"延後；延期","phrase":"postpone a meeting","category":"會議與商務溝通","id":"w0144","number":144,"examples":[{"en":"We can postpone the meeting until Friday.","zh":"我們可以把會議延到星期五。"},{"en":"The meeting has been postponed to accommodate the CEO's schedule.","zh":"為了配合執行長的時間安排，會議已被延遲。"}],"tips":["語法重點：postpone 後方必須接動名詞 (V-ing) 而非不定詞 (to V)，例如 postpone making a decision，這是多益 Part 5 常考的文法點。"],"forms":["postpone","postpones","postponing","postponed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cancel","pos":"v.","meaning":"取消","phrase":"cancel an appointment","category":"會議與商務溝通","id":"w0145","number":145,"examples":[{"en":"You can cancel the booking online.","zh":"你可以在線上取消預訂。"},{"en":"Please cancel my reservation for tomorrow's flight.","zh":"請取消我明天航班的預訂。"}],"tips":["常見搭配詞與片語：在多益考試中常出現 cancel a meeting (取消會議)、cancel a subscription (取消訂閱) 或 cancel an order (取消訂單)。此外，名詞形式 cancellation 常用於 cancellation policy (取消政策)，這在 Part 7 的閱讀測驗中極為常見。"],"forms":["cancel","cancels","canceling","canceled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"arrange","pos":"v.","meaning":"安排","phrase":"arrange a meeting","category":"會議與商務溝通","id":"w0146","number":146,"examples":[{"en":"I can arrange a meeting with the manager.","zh":"我可以安排一場與經理的會議。"},{"en":"The travel agent arranged our flights and hotel accommodations.","zh":"旅行社為我們安排了機票和酒店住宿。"}],"tips":["常見搭配詞組：常用於 'arrange a meeting' (安排會議)、'arrange transportation' (安排交通工具) 以及 'arrange for something' (為某事做準備)。"],"forms":["arrange","arranges","arranging","arranged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reschedule","pos":"v.","meaning":"重新安排時間","phrase":"reschedule an appointment","category":"會議與商務溝通","id":"w0147","number":147,"examples":[{"en":"We can reschedule your appointment.","zh":"我們可以重新安排你的預約時間。"},{"en":"Due to unforeseen circumstances, we need to reschedule the meeting to next week.","zh":"由於突發狀況，我們需要將會議重新安排到下週。"}],"tips":["常見搭配詞與用法：常用於 'reschedule a meeting/appointment/flight'。介係詞常用 'for' 或 'to'，例如 'reschedule the interview for next Tuesday'。"],"forms":["reschedule","reschedules","rescheduling","rescheduled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"attend","pos":"v.","meaning":"出席；參加","phrase":"attend a conference","category":"會議與商務溝通","id":"w0148","number":148,"examples":[{"en":"Will you attend the meeting tomorrow?","zh":"你明天會參加會議嗎？"},{"en":"All employees must attend safety training.","zh":"所有員工都必須參加安全訓練。"}],"tips":["常見搭配詞：attend a meeting (參加會議)、attend a seminar (參加研討會)、attend a workshop (參加工作坊)。"],"forms":["attend","attends","attending","attended"],"exampleSource":"Wordstep original examples"},{"word":"participate","pos":"v.","meaning":"參與","phrase":"participate in a discussion","category":"會議與商務溝通","id":"w0149","number":149,"examples":[{"en":"You can participate in the discussion online.","zh":"你可以在線上參與討論。"},{"en":"All employees are encouraged to participate in the company's wellness program.","zh":"鼓勵所有員工參與公司的健康促進計畫。"}],"tips":["必考介系詞搭配：participate 是不及物動詞，最重要的用法是「participate in + 活動/事件」，在 Part 5 填空題中常考介系詞 in 的選用。"],"forms":["participate","participates","participating","participated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"summarize","pos":"v.","meaning":"總結；摘要","phrase":"summarize the discussion","category":"會議與商務溝通","id":"w0150","number":150,"examples":[{"en":"I can summarize the main points.","zh":"我可以總結重點。"},{"en":"Could you please summarize the key findings of the market research report?","zh":"您能請您總結一下市場調查報告的重點發現嗎？"}],"tips":["常見搭配詞：常用於 summarize the main points (總結重點)、summarize findings (總結研究結果) 或 summarize a meeting (摘要會議內容)。"],"forms":["summarize","summarizes","summarizing","summarized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"company","pos":"n.","meaning":"公司","phrase":"work for a company","category":"公司與管理","id":"w0151","number":151,"examples":[{"en":"Our company is hiring new employees.","zh":"我們的公司正在徵人。"},{"en":"Our company is committed to providing high-quality products and services.","zh":"我們公司致力於提供高品質的產品和服務。"}],"tips":["多義性辨析：在 TOEIC 中，除了最常見的「公司」外，亦常考「陪伴」或「同伴」之意，如「keep someone company」 (陪伴某人)。"],"forms":["company","companies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"corporation","pos":"n.","meaning":"公司；企業","phrase":"large corporation","category":"公司與管理","id":"w0152","number":152,"examples":[{"en":"This corporation is expanding overseas.","zh":"這家企業正在向海外擴張。"},{"en":"The corporation announced record profits for the fiscal year.","zh":"該公司宣布本財年的創紀錄利潤。"}],"tips":["常見搭配詞：multinational corporation (跨國企業)、parent corporation (母公司)、non-profit corporation (非營利法人)。"],"forms":["corporation","corporations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"organization","pos":"n.","meaning":"組織；機構","phrase":"business organization","category":"公司與管理","id":"w0153","number":153,"examples":[{"en":"The organization is based in Taipei.","zh":"這個組織的總部位於台北。"},{"en":"Our organization is committed to providing excellent customer service.","zh":"我們公司致力於提供卓越的客戶服務。"}],"tips":["常見搭配詞：多益考試中頻繁出現 'non-profit organization' (非營利組織)、'charitable organization' (慈善組織) 及 'professional organization' (專業機構) 等固定用法。"],"forms":["organization","organizations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"enterprise","pos":"n.","meaning":"企業；事業","phrase":"business enterprise","category":"公司與管理","id":"w0154","number":154,"examples":[{"en":"The enterprise is growing quickly.","zh":"這家企業正在快速成長。"},{"en":"Our company is a global enterprise with offices in over 50 countries.","zh":"我們公司是一家在全球擁有超過 50 個辦事處的國際企業。"}],"tips":["多重義辨析：在多益中最常見的含義是「企業、公司」，特別是「small and medium-sized enterprises (SMEs, 中小企業)」或「state-owned enterprise (國營企業)」；其次是指「大型計畫或事業」。"],"forms":["enterprise","enterprises"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"headquarters","pos":"n.","meaning":"總部","phrase":"company headquarters","category":"公司與管理","id":"w0155","number":155,"examples":[{"en":"The company headquarters are near the station.","zh":"公司總部在車站附近。"},{"en":"All important decisions are made at the headquarters.","zh":"所有重要的決定都在總部做出。"}],"tips":["單複數同形與動詞一致性：headquarters 雖然以 s 結尾，但在文法上可視為單數或複數。在 TOEIC 閱讀中，若指稱單一地點，動詞常用單數（如：The headquarters is located in London.），考生需注意主詞動詞一致性的陷阱。"],"forms":["headquarters"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"branch","pos":"n.","meaning":"分公司；分店","phrase":"branch office","category":"公司與管理","id":"w0156","number":156,"examples":[{"en":"Our new branch will open next month.","zh":"我們的新分店將於下個月開幕。"},{"en":"Our company has several branches located throughout Asia.","zh":"我們公司在亞洲各地設有數個分支機構。"}],"tips":["常見搭配詞組：常用於 branch manager（分店/分行經理）、branch office（分公司）以及 open a new branch（開設新分店）。在金融情境中，bank branch 指的是銀行分行。"],"forms":["branch","branches","branching","branched"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"division","pos":"n.","meaning":"部門；事業部","phrase":"sales division","category":"公司與管理","id":"w0157","number":157,"examples":[{"en":"The sales division is on the third floor.","zh":"業務部在三樓。"},{"en":"After the reorganization, the sales division reported a significant increase in revenue.","zh":"重組後，銷售部門報告了顯著的收入增長。"}],"tips":["常見搭配詞：'marketing division' (行銷部門)、'division head' (部門主管) 與 'division of labor' (分工)，在 TOEIC 閱讀的徵才廣告或組織公告中極為常見。"],"forms":["division","divisions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subsidiary","pos":"n.","meaning":"子公司","phrase":"overseas subsidiary","category":"公司與管理","id":"w0158","number":158,"examples":[{"en":"The subsidiary is based in Japan.","zh":"這間子公司位於日本。"},{"en":"Each international subsidiary operates under local regulations while maintaining brand consistency.","zh":"每個國際subsidiary都在當地法規下運營，同時保持品牌一致性。"}],"tips":["常見搭配詞與組織結構：在多益考試中，subsidiary 常與母公司 parent company 對應出現，常見詞組包括 wholly-owned subsidiary（全資子公司）或 a subsidiary of [Company Name]。"],"forms":["subsidiary"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"executive","pos":"n./adj.","meaning":"主管；高階主管的","phrase":"senior executive","category":"公司與管理","id":"w0159","number":159,"examples":[{"en":"A senior executive will visit tomorrow.","zh":"一位高階主管明天會來訪。"},{"en":"The executive assistant manages the CEO's schedule and travel arrangements.","zh":"行政助理負責管理執行長的時間表和差旅安排。"}],"tips":["常見搭配與職稱：該單字常出現在職稱中，如 Chief Executive Officer (CEO) 或 Account Executive (業務專員)。在閱讀測驗中，Executive Summary (執行摘要) 是商業報告中常見的標題，意指報告的精簡重點。"],"forms":["executive","executives"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"manager","pos":"n.","meaning":"經理；管理者","phrase":"general manager","category":"公司與管理","id":"w0160","number":160,"examples":[{"en":"The manager is in her office.","zh":"經理在她的辦公室裡。"},{"en":"I would like to speak to the manager.","zh":"我想和經理談一談。"}],"tips":["例句1描述人在哪裡；例句2的 to speak to 表示「和某人說話」，不是只背 manager 的中文。"],"forms":["manager","managers"],"exampleSource":"Wordstep original examples"},{"word":"director","pos":"n.","meaning":"主管；董事","phrase":"board of directors","category":"公司與管理","id":"w0161","number":161,"examples":[{"en":"The director will join the meeting.","zh":"主管將參加會議。"},{"en":"The marketing director presented the new campaign strategy at the quarterly meeting.","zh":"行銷總監在季會上提出了新的行銷策略。"}],"tips":["常見搭配詞：最常考的詞組為 \"Board of Directors\" (董事會)，以及特定職稱如 \"Marketing Director\" (行銷總監) 或 \"Executive Director\" (執行長/董事)。"],"forms":["director","directors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"president","pos":"n.","meaning":"公司總裁；董事長","phrase":"company president","category":"公司與管理","id":"w0162","number":162,"examples":[{"en":"The company president is visiting the factory.","zh":"公司總裁正在參觀工廠。"},{"en":"The president announced a new strategy to improve company performance.","zh":"社長宣布了一項新的策略以提升公司績效。"}],"tips":["常見搭配詞：包括 \"Vice President\" (副總裁/副校長)、\"Company President\" (公司總裁)、\"President of the Board\" (董事會主席)。"],"forms":["president","presidents"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"chairman","pos":"n.","meaning":"主席；董事長","phrase":"board chairman","category":"公司與管理","id":"w0163","number":163,"examples":[{"en":"The chairman will open the meeting.","zh":"主席將宣布會議開始。"},{"en":"The chairman opened the meeting by thanking everyone for attending.","zh":"主席感謝所有出席者，並開啟了會議。"}],"tips":["常見搭配詞：'Chairman of the board' (董事長) 是多益考題中最常見的固定搭配，另外還有 'acting chairman' (代理主席) 與 'executive chairman' (執行主席) 等職稱。"],"forms":["chairman","chairmen"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"board","pos":"n.","meaning":"董事會；委員會","phrase":"board meeting","category":"公司與管理","id":"w0164","number":164,"examples":[{"en":"The board will vote on the proposal.","zh":"董事會將對提案進行表決。"},{"en":"The board of directors approved the new marketing strategy.","zh":"董事會批准了新的行銷策略。"}],"tips":["多義詞辨析：'Board' 在 TOEIC 中極為常見，名詞可指「董事會」(Board of Directors) 或「公佈欄」(Bulletin Board)；動詞則指「登（機、船、車）」。考生須根據上下文判斷是商務行政還是交通旅遊情境。"],"forms":["board","boards"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"management","pos":"n.","meaning":"管理；管理階層","phrase":"senior management","category":"公司與管理","id":"w0165","number":165,"examples":[{"en":"The management approved our request.","zh":"管理階層核准了我們的請求。"},{"en":"Good time management makes work easier.","zh":"良好的時間管理讓工作更輕鬆。"}],"tips":["常見搭配詞：'senior management' (高層管理人員)、'middle management' (中層管理)、'under new management' (在新的經營團隊下) 以及 'time management' (時間管理)，這些片語頻繁出現在 Part 5 填充題。"],"forms":["management","managements","manages","managing","managed"],"exampleSource":"Wordstep original examples"},{"word":"leadership","pos":"n.","meaning":"領導；領導能力","phrase":"leadership skills","category":"公司與管理","id":"w0166","number":166,"examples":[{"en":"Good leadership can improve teamwork.","zh":"良好的領導可以改善團隊合作。"},{"en":"Effective leadership is essential for managing cross‑functional project teams.","zh":"有效的領導能力對於管理跨部門專案團隊至關重要。"}],"tips":["常見搭配詞：常用於 'strong leadership skills' (強大的領導能力) 或 'under the leadership of' (在...的領導下)。在多益閱讀中，'leadership role' 也常指涉管理職位。"],"forms":["leadership","leaderships"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"strategy","pos":"n.","meaning":"策略","phrase":"business strategy","category":"公司與管理","id":"w0167","number":167,"examples":[{"en":"Our strategy is to improve customer service.","zh":"我們的策略是改善顧客服務。"},{"en":"The company's new marketing strategy focuses on reaching a younger demographic.","zh":"公司新的行銷策略著重於接觸年輕族群。"}],"tips":["常見搭配詞與組：在 TOEIC 中常出現 'marketing strategy' (行銷策略)、'exit strategy' (退場機制) 及 'implementation strategy' (執行策略)。此外，'strategic planning' (策略規劃) 常出現在 Part 7 的公司年度展望報告中。"],"forms":["strategy","strategies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"objective","pos":"n.","meaning":"目標","phrase":"business objective","category":"公司與管理","id":"w0168","number":168,"examples":[{"en":"Our main objective is to reduce costs.","zh":"我們的主要目標是降低成本。"},{"en":"Did the team achieve its objective?","zh":"團隊有達成目標嗎？"}],"tips":["詞性雙重身分：objective 同時具備名詞與形容詞功能。名詞意為「目標」或「目的」，常用於企業年度計畫或績效評估（如：meet/achieve objectives）；形容詞意為「客觀的」，常用於報告分析（如：objective evaluation/criteria）。"],"forms":["objective","objectives","more objective","most objective"],"exampleSource":"Wordstep original examples"},{"word":"goal","pos":"n.","meaning":"目標","phrase":"achieve a goal","category":"公司與管理","id":"w0169","number":169,"examples":[{"en":"Our goal is to finish by Friday.","zh":"我們的目標是在星期五前完成。"},{"en":"Our sales team set a quarterly goal of increasing revenue by 10 percent.","zh":"我們的銷售團隊設定了本季將營收提升 10% 的目標。"}],"tips":["常見搭配詞：在 TOEIC 閱讀與聽力中，常與動詞 set (設定)、achieve (達成)、reach (達到)、pursue (追求) 連用。形容詞常見 long-term (長期的) 或 short-term (短期的) goal。"],"forms":["goal","goals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"plan","pos":"n./v.","meaning":"計畫；規劃","phrase":"business plan","category":"公司與管理","id":"w0170","number":170,"examples":[{"en":"The plan is ready for review.","zh":"計畫可以審閱了。"},{"en":"The marketing team is developing a comprehensive plan to launch the new product.","zh":"行銷團隊正在制定一份全面的計畫，以推出新產品。"}],"tips":["常見搭配詞與文法：'plan' 作為動詞時，後方常接不定詞 'plan to do something'；作為名詞時常見 'business plan' (商業企劃)、'contingency plan' (應變計畫) 及 'floor plan' (樓層平面圖)。"],"forms":["plan","plans","planning","planned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"project","pos":"n.","meaning":"專案；計畫","phrase":"manage a project","category":"公司與管理","id":"w0171","number":171,"examples":[{"en":"The project will begin next week.","zh":"專案將於下星期開始。"},{"en":"We projected a 15% increase in sales for the upcoming quarter.","zh":"我們預測下個季度銷售額將增加 15%。"}],"tips":["詞性與發音辨析：當名詞時讀作 [ˈprɒdʒekt]（重音在第一音節），指「計畫、專案」；當動詞時讀作 [prəˈdʒekt]（重音在第二音節），意為「預測、推算」。在多益中，後者的「預測」用法常出現在 Part 7 的財務報告。"],"forms":["project","projects","projecting","projected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"operation","pos":"n.","meaning":"營運；作業","phrase":"business operations","category":"公司與管理","id":"w0172","number":172,"examples":[{"en":"The machine is now in operation.","zh":"這台機器目前正在運轉。"},{"en":"The new system will improve our daily operations.","zh":"新系統將改善我們的日常作業。"}],"tips":["常見搭配詞：注意「in operation」（運作中）、「business operations」（業務營運）、「operating hours」（營業/操作時間）及「smooth operation」（順利運作）。在閱讀測驗中，這些組合常整組出現。"],"forms":["operation","operations","operates","operating","operated"],"exampleSource":"Wordstep original examples"},{"word":"procedure","pos":"n.","meaning":"程序；流程","phrase":"follow a procedure","category":"公司與管理","id":"w0173","number":173,"examples":[{"en":"This procedure is easy to follow.","zh":"這個程序很容易遵循。"},{"en":"Please follow the standard procedure for submitting expense reports.","zh":"請依照標準程序提交費用報銷。"}],"tips":["常見搭配詞與固定用法：多益中常出現 Standard Operating Procedure (SOP，標準作業程序)、follow/adhere to/observe a procedure (遵循程序)、safety/security procedures (安全程序) 以及 application procedure (申請手續)。"],"forms":["procedure","procedures"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"policy","pos":"n.","meaning":"政策；規定","phrase":"company policy","category":"公司與管理","id":"w0174","number":174,"examples":[{"en":"The new policy will start in July.","zh":"新政策將於七月開始實施。"},{"en":"The company's policy regarding remote work is outlined in the employee handbook.","zh":"公司關於遠端工作的政策已在員工手冊中說明。"}],"tips":["常見搭配詞與動詞組合：在多益中常出現 implement a policy (實施政策)、adhere to a policy (遵守政策) 及 revise a policy (修訂政策)。形容詞搭配則有 strict policy (嚴格規定) 或 standard policy (標準做法)。"],"forms":["policy","policies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"regulation","pos":"n.","meaning":"規定；法規","phrase":"safety regulations","category":"公司與管理","id":"w0175","number":175,"examples":[{"en":"This regulation is about workplace safety.","zh":"這項規定是關於工作場所安全。"},{"en":"The company must comply with all relevant safety regulations.","zh":"公司必須遵守所有相關的安全法規。"}],"tips":["常見搭配詞與慣用語：在 TOEIC 中常出現 'safety regulations' (安全法規)、'environmental regulations' (環保法規) 以及 'comply with regulations' (遵守規定)，應整組記憶。"],"forms":["regulation","regulations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"guideline","pos":"n.","meaning":"準則；指導方針","phrase":"follow the guidelines","category":"公司與管理","id":"w0176","number":176,"examples":[{"en":"The guideline is available online.","zh":"這份指導方針可以在線上取得。"},{"en":"Department heads discussed the guideline strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了guideline策略。"}],"tips":["常見搭配詞：guideline 通常以複數形式 guidelines 出現，動詞常搭配 follow/adhere to (遵循)、establish/issue (發布)、implement (實施) 或 set (制定)；形容詞常搭配 strict (嚴格的)、safety (安全的) 或 clear (明確的)。"],"forms":["guideline"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"standard","pos":"n./adj.","meaning":"標準；標準的","phrase":"quality standards","category":"公司與管理","id":"w0177","number":177,"examples":[{"en":"The product meets our quality standard.","zh":"這項產品符合我們的品質標準。"},{"en":"Our company adheres to international quality standards for all products.","zh":"我們公司所有產品都符合國際品質標準。"}],"tips":["常見搭配詞：常與動詞 meet, exceed, set 連用，例如 meet the safety standards（符合安全標準）或 set a high standard（樹立高標準）。在考試中看到這些動詞時，應聯想到 standard。"],"forms":["standard","standards","more standard","most standard"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"responsibility","pos":"n.","meaning":"責任；職責","phrase":"take responsibility","category":"公司與管理","id":"w0178","number":178,"examples":[{"en":"Safety is everyone's responsibility.","zh":"安全是每個人的責任。"},{"en":"Who will take responsibility for this project?","zh":"誰將負責這個專案？"}],"tips":["常見搭配詞組：常用動詞包含 'take/assume/accept responsibility for' (承擔責任) 或 'delegate responsibility' (委派職責)；形容詞常見 'primary responsibility' (主要職責)。"],"forms":["responsibility","responsibilities"],"exampleSource":"Wordstep original examples"},{"word":"authority","pos":"n.","meaning":"權限；權力","phrase":"have the authority","category":"公司與管理","id":"w0179","number":179,"examples":[{"en":"You can ask someone with the authority to approve it.","zh":"你可以請有核准權限的人處理。"},{"en":"The project manager has the authority to approve expenses up to $5,000.","zh":"專案經理有權批准最高 5,000 美元的費用。"}],"tips":["常見搭配詞與句型：'authority on' 後接特定領域表示該領域的專家，例如 'an authority on international trade'；'have the authority to + 動詞' 表示有權做某事；'the relevant authorities' 指相關主管機關。"],"forms":["authority","authorities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"budget","pos":"n.","meaning":"預算","phrase":"annual budget","category":"公司與管理","id":"w0180","number":180,"examples":[{"en":"The budget is lower than last year's.","zh":"這次的預算比去年的低。"},{"en":"We need to budget carefully to stay within our financial limits this quarter.","zh":"我們需要仔細編列預算，以確保本季在財務範圍內。"}],"tips":["常見搭配詞：考生須掌握 'stay within budget' (在預算內)、'exceed the budget' (超出預算) 以及 'allocate a budget' (撥款/分配預算)，這些組合常出現在 Part 7 的內部郵件中。"],"forms":["budget","budgets","budgeting","budgeted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"expense","pos":"n.","meaning":"費用；支出","phrase":"business expenses","category":"公司與管理","id":"w0181","number":181,"examples":[{"en":"You can claim this travel expense.","zh":"你可以申報這筆差旅費用。"},{"en":"The company reimbursed the employee for travel expenses.","zh":"公司已向員工報銷了差旅費用。"}],"tips":["常見搭配詞與固定短語：'travel expense' (差旅費)、'expense report' (費用報銷單)、'at the expense of' (以...為代價)。在多益閱讀 Part 5 與 Part 6 中，'submit an expense report' 是極高頻出現的固定用法。"],"forms":["expense","expenses","expensing","expensed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cost","pos":"n./v.","meaning":"成本；花費","phrase":"reduce costs","category":"公司與管理","id":"w0182","number":182,"examples":[{"en":"The total cost is shown below.","zh":"總成本顯示在下方。"},{"en":"The company needs to reduce operational costs to improve profitability.","zh":"公司需要降低營運成本以提高利潤。"}],"tips":["常見搭配詞與短語：'cost-effective' (具成本效益的) 是多益高頻詞，另有 'at no extra cost' (不需額外費用) 常見於廣告或促銷情境。"],"forms":["cost","costs","costing"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"revenue","pos":"n.","meaning":"營收；收入","phrase":"annual revenue","category":"公司與管理","id":"w0183","number":183,"examples":[{"en":"Our revenue is higher this quarter.","zh":"我們這一季的營收比較高。"},{"en":"The company's revenue increased by 15% this quarter.","zh":"本季公司營收增長了 15%。"}],"tips":["常見搭配詞：常用於 generate revenue (產生營收)、annual revenue (年營收) 或 revenue growth (營收成長)，在多益財務報告與公司簡報中極為常見。"],"forms":["revenue","revenues"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"profit","pos":"n.","meaning":"利潤","phrase":"increase profits","category":"公司與管理","id":"w0184","number":184,"examples":[{"en":"The company will report a profit this year.","zh":"公司今年將公布獲利。"},{"en":"The company's profit increased by 15% last quarter.","zh":"公司上季的盈餘增長了 15%。"}],"tips":["常見搭配詞：'generate/make a profit' (獲利)、'profit margin' (利潤率)、'gross/net profit' (毛利/淨利)。"],"forms":["profit","profits","profiting","profited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"loss","pos":"n.","meaning":"虧損；損失","phrase":"report a loss","category":"公司與管理","id":"w0185","number":185,"examples":[{"en":"The loss was smaller than expected.","zh":"虧損比預期的小。"},{"en":"We need to minimize losses by improving operational efficiency.","zh":"我們需要透過提高營運效率來減少損失。"}],"tips":["常見搭配詞組：'net loss' (淨損)、'at a loss' (困惑或虧本)、'cut one's losses' (及時止損)，財務報表中常見 'Profit and Loss Statement' (損益表)。"],"forms":["loss","losses","loses","losing","lost"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"growth","pos":"n.","meaning":"成長；增長","phrase":"business growth","category":"公司與管理","id":"w0186","number":186,"examples":[{"en":"Business growth is slowing down.","zh":"業務成長正在放緩。"},{"en":"The company experienced significant growth in its overseas market last year.","zh":"去年，該公司在海外市場取得了顯著增長。"}],"tips":["常見搭配詞：在 TOEIC 中常與形容詞連用，如 'rapid growth' (快速增長)、'steady growth' (穩定增長) 或 'economic growth' (經濟成長)，考生應熟記這些固定組合。"],"forms":["growth","growths","grows","growing","grew","grown"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"expansion","pos":"n.","meaning":"擴張；拓展","phrase":"business expansion","category":"公司與管理","id":"w0187","number":187,"examples":[{"en":"The company is planning an expansion.","zh":"公司正在規劃擴張。"},{"en":"The expansion will create more jobs.","zh":"這次擴張將創造更多工作機會。"}],"tips":["常見搭配詞：在 TOEIC 中頻繁出現 'business expansion' (企業擴張)、'market expansion' (市場拓展) 以及 'overseas expansion' (海外擴張) 等片語。"],"forms":["expansion","expansions","expands","expanding","expanded"],"exampleSource":"Wordstep original examples"},{"word":"merger","pos":"n.","meaning":"合併","phrase":"company merger","category":"公司與管理","id":"w0188","number":188,"examples":[{"en":"The merger is expected to finish in June.","zh":"這次合併預計在六月完成。"},{"en":"The two companies announced a merger to increase market share.","zh":"這兩家公司宣布合併以提高市場佔有率。"}],"tips":["常見搭配詞與慣用語：最常與 acquisition 連用組成固定詞組 merger and acquisition (M&A，併購)；動詞常用 finalize a merger (完成合併) 或 propose a merger (提議合併)。"],"forms":["merger","mergers","merges","merging","merged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"acquire","pos":"v.","meaning":"收購；取得","phrase":"acquire a company","category":"公司與管理","id":"w0189","number":189,"examples":[{"en":"The company will acquire a smaller business.","zh":"公司將收購一家較小的企業。"},{"en":"The company aims to acquire a new software license to improve operational efficiency.","zh":"公司計畫購買新的軟體授權，以提高營運效率。"}],"tips":["企業併購情境：acquire 常見於商業新聞或閱讀測驗（Part 7），特別是在公司併購（Mergers and Acquisitions, M&A）的情境中，指一間公司收購另一間公司。"],"forms":["acquire","acquires","acquiring","acquired"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"acquisition","pos":"n.","meaning":"收購；取得","phrase":"business acquisition","category":"公司與管理","id":"w0190","number":190,"examples":[{"en":"The acquisition will be completed next month.","zh":"收購將於下個月完成。"},{"en":"The successful acquisition significantly boosted the company's revenue and profitability.","zh":"這次成功的收購顯著提升了公司的收入和盈利能力。"}],"tips":["常見搭配詞：最常出現在『Mergers and Acquisitions (M&A)』(併購) 術語中，也常與『talent acquisition』(人才招聘) 或『recent acquisition』(近期收購的資產或公司) 連用。"],"forms":["acquisition","acquisitions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"establish","pos":"v.","meaning":"建立；成立","phrase":"establish a company","category":"公司與管理","id":"w0191","number":191,"examples":[{"en":"We will establish a new office here.","zh":"我們將在這裡設立新辦公室。"},{"en":"We need to establish clear communication channels between departments to improve efficiency.","zh":"為了提高效率，我們需要建立部門之間清晰的溝通管道。"}],"tips":["常見搭配詞：常與抽象名詞連用，如 establish a reputation (建立名聲)、establish a branch (開設分店)、establish guidelines (制定準則)。"],"forms":["establish","establishes","establishing","established"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"operate","pos":"v.","meaning":"營運；經營","phrase":"operate a business","category":"公司與管理","id":"w0192","number":192,"examples":[{"en":"You can operate the machine with this button.","zh":"你可以用這個按鈕操作機器。"},{"en":"The new software system is designed to operate efficiently with minimal human intervention.","zh":"這個新的軟體系統設計用於在最小的人工干預下高效運作。"}],"tips":["常見搭配詞與短語：operate machinery/equipment (操作機械/設備)、operate a business/branch (經營企業/分店)、operating hours (營業時間)、operating costs/expenses (營運成本)。"],"forms":["operate","operates","operating","operated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"manage","pos":"v.","meaning":"管理；經營","phrase":"manage a department","category":"公司與管理","id":"w0193","number":193,"examples":[{"en":"She can manage the project.","zh":"她可以管理這個專案。"},{"en":"We need to manage our expenses carefully to stay within budget.","zh":"我們需要仔細管理我們的開支，以保持在預算內。"}],"tips":["常見搭配詞與句型：最常出現在「manage to + 原形動詞」的用法中，意為「設法完成某事」，強調在困難情況下成功做到。商務常用詞組包含 manage a project (管理專案)、manage expectations (管理預期) 以及 manage time (管理時間)。"],"forms":["manage","manages","managing","managed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"supervise","pos":"v.","meaning":"監督；管理","phrase":"supervise employees","category":"公司與管理","id":"w0194","number":194,"examples":[{"en":"The team leader will supervise the trainees.","zh":"組長將督導受訓人員。"},{"en":"The quality control department supervises the manufacturing process to maintain high standards.","zh":"品質管制部門監督製造流程，以維持高標準。"}],"tips":["常見搭配詞與情境：supervise 常與 closely 或 directly 連用，表示「密切或直接監督」。在商務情境中，對象通常是 project (專案)、operation (營運) 或 staff/interns (員工/實習生)。"],"forms":["supervise","supervises","supervising","supervised"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"implement","pos":"v.","meaning":"實施；執行","phrase":"implement a policy","category":"公司與管理","id":"w0195","number":195,"examples":[{"en":"We will implement the new policy on Monday.","zh":"我們將於星期一實施新政策。"},{"en":"We need to implement the changes outlined in the project plan immediately.","zh":"我們需要立即實施專案計劃中概述的變更。"}],"tips":["常見搭配詞組：此單字最常用於執行特定任務或計畫，如 implement a policy (執行政策)、implement a strategy (實施策略)、implement a plan (實施計畫) 以及 implement a new system (導入新系統)。"],"forms":["implement","implements","implementing","implemented"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"achieve","pos":"v.","meaning":"達成","phrase":"achieve an objective","category":"公司與管理","id":"w0196","number":196,"examples":[{"en":"We can achieve this goal together.","zh":"我們可以一起達成這個目標。"},{"en":"The company aims to achieve a 15% increase in sales this quarter.","zh":"本公司本季目標達成 15% 的銷售額增長。"}],"tips":["常見搭配詞組：常用於 achieve a goal (達成目標)、achieve a target (達到指標)、achieve success (獲得成功) 或 achieve a milestone (達成里程碑)。"],"forms":["achieve","achieves","achieving","achieved"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"improve","pos":"v.","meaning":"改善；提升","phrase":"improve efficiency","category":"公司與管理","id":"w0197","number":197,"examples":[{"en":"Practice can improve your skills.","zh":"練習可以提升你的技能。"},{"en":"Regular training sessions can improve employee skills and performance.","zh":"定期的培訓課程可以提升員工的技能和績效。"}],"tips":["常見搭配詞：在多益中常與效率 (efficiency)、品質 (quality)、績效 (performance) 及技術 (skills) 搭配，例如：'improve efficiency' 或 'room for improvement' (有進步空間)。"],"forms":["improve","improves","improving","improved"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reduce","pos":"v.","meaning":"減少；降低","phrase":"reduce expenses","category":"公司與管理","id":"w0198","number":198,"examples":[{"en":"We can reduce waste by reusing paper.","zh":"我們可以藉由重複使用紙張來減少浪費。"},{"en":"The company aims to reduce operating costs by streamlining its processes.","zh":"公司旨在透過優化流程來降低營運成本。"}],"tips":["常見搭配詞與商業情境：在 TOEIC 考試中，reduce 常出現在成本管控與營運報告中。常見組合包括 reduce costs (降低成本)、reduce expenses (減少開支) 及 reduce overhead (縮減經常性支出)。"],"forms":["reduce","reduces","reducing","reduced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"increase","pos":"v./n.","meaning":"增加；提高","phrase":"increase revenue","category":"公司與管理","id":"w0199","number":199,"examples":[{"en":"The company will increase production.","zh":"公司將增加產量。"},{"en":"To meet the growing demand, we need to increase production capacity.","zh":"為了滿足不斷增長的需求，我們需要提高生產能力。"}],"tips":["常見搭配詞與介係詞：'significant increase' (大幅增加)、'slight increase' (小幅增加)。需特別注意介係詞用法，'increase in' 後接增加的領域（如：increase in profits），'increase by' 後接增加的幅度（如：increase by 15%），'increase to' 後接增加後的最終數值。"],"forms":["increase","increases","increasing","increased"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"efficient","pos":"adj.","meaning":"有效率的","phrase":"efficient operation","category":"公司與管理","id":"w0200","number":200,"examples":[{"en":"This new system is more efficient.","zh":"這個新系統更有效率。"},{"en":"Our new software is designed to streamline the workflow and make the team more efficient.","zh":"我們的全新軟體旨在簡化工作流程，使團隊更有效率。"}],"tips":["常見搭配詞：多益常考組合包括 'highly efficient' (效率極高的)、'energy-efficient' (節能的)、'cost-efficient' (具成本效益的) 以及 'in an efficient manner' (以有效率的方式)。"],"forms":["efficient","more efficient","most efficient"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"marketing","pos":"n.","meaning":"行銷","phrase":"marketing strategy","category":"行銷與廣告","id":"w0201","number":201,"examples":[{"en":"She works in marketing.","zh":"她從事行銷工作。"},{"en":"Our marketing team will launch a new campaign.","zh":"我們的行銷團隊將推出一項新活動。"}],"tips":["常見搭配詞：在 TOEIC 中常以複合名詞出現，如 marketing strategy (行銷策略)、marketing campaign (行銷活動)、marketing department (行銷部門) 及 marketing research (市場調查)。"],"forms":["marketing","marketings","markets","marketed"],"exampleSource":"Wordstep original examples"},{"word":"market","pos":"n./v.","meaning":"市場；行銷","phrase":"target market","category":"行銷與廣告","id":"w0202","number":202,"examples":[{"en":"Our main market is in Asia.","zh":"我們的主要市場在亞洲。"},{"en":"Our company is expanding into the Asian market to increase sales.","zh":"我們公司正在擴展到亞洲市場以增加銷售額。"}],"tips":["常見搭配詞組：'market share' (市場佔有率)、'target market' (目標市場)、'emerging market' (新興市場) 及 'market research' (市場調查)，這些詞組常出現在閱讀測驗的商業報告中。"],"forms":["market","markets","marketing","marketed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"advertise","pos":"v.","meaning":"刊登廣告；宣傳","phrase":"advertise a product","category":"行銷與廣告","id":"w0203","number":203,"examples":[{"en":"We can advertise the product online.","zh":"我們可以在線上宣傳這項產品。"},{"en":"The company plans to advertise its new product on social media platforms.","zh":"該公司計畫在社交媒體平台上宣傳其新產品。"}],"tips":["詞性辨析與考點：advertise 是動詞，在 TOEIC Part 5 常考詞性變化。需區分 advertisement（可數名詞，指具體的廣告內容）、advertising（不可數名詞，指廣告業或廣告活動行為）以及 advertiser（廣告主）。"],"forms":["advertise","advertises","advertising","advertised"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"advertisement","pos":"n.","meaning":"廣告","phrase":"place an advertisement","category":"行銷與廣告","id":"w0204","number":204,"examples":[{"en":"The advertisement will appear in tomorrow's newspaper.","zh":"這則廣告將刊登在明天的報紙上。"},{"en":"The advertisement clearly stated the product's features and benefits.","zh":"這則廣告清楚地說明了產品的特性和優點。"}],"tips":["常見動詞搭配：常與動詞 'place', 'run', 或 'put' 連用，例如 'place an advertisement' 表示在報章雜誌上刊登廣告。"],"forms":["advertisement","advertisements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"campaign","pos":"n.","meaning":"行銷活動；宣傳活動","phrase":"advertising campaign","category":"行銷與廣告","id":"w0205","number":205,"examples":[{"en":"The campaign will run for three weeks.","zh":"這場宣傳活動將持續三星期。"},{"en":"The company decided to campaign for greater environmental responsibility.","zh":"公司決定為更大的環境責任進行宣傳。"}],"tips":["常見搭配詞組：多與 launch (發起)、run (執行)、spearhead (帶頭) 等動詞連用。常見詞組如 'marketing campaign' (行銷活動) 或 'promotional campaign' (促銷活動)。"],"forms":["campaign","campaigns","campaigning","campaigned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"promotion","pos":"n.","meaning":"促銷；推廣","phrase":"sales promotion","category":"行銷與廣告","id":"w0206","number":206,"examples":[{"en":"The store is running a summer promotion.","zh":"這家商店正在舉辦夏季促銷。"},{"en":"This promotion ends on Sunday.","zh":"這項促銷活動星期日結束。"}],"tips":["雙重語義辨析：在多益中常考兩大核心意義，一為『職位晉升』(人事管理場景)，二為『促銷活動』(行銷與零售場景)。若出現在公告、備忘錄中常指升職；若出現在廣告、宣傳單中則多指特價。"],"forms":["promotion","promotions","promotes","promoting","promoted"],"exampleSource":"Wordstep original examples"},{"word":"publicity","pos":"n.","meaning":"宣傳；曝光","phrase":"generate publicity","category":"行銷與廣告","id":"w0207","number":207,"examples":[{"en":"The event can generate useful publicity.","zh":"這場活動可以帶來有益的曝光。"},{"en":"Negative publicity can significantly damage a company's reputation and sales.","zh":"負面宣傳會嚴重損害一家公司的聲譽和銷售額。"}],"tips":["常見搭配詞：'generate publicity' (引起關注)、'adverse publicity' (負面宣傳)、'publicity campaign' (宣傳活動) 及 'publicity stunt' (宣傳噱頭)。在多益閱讀中常出現在行銷企劃或公關報導中。"],"forms":["publicity","publicities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"brochure","pos":"n.","meaning":"宣傳冊；簡介","phrase":"company brochure","category":"行銷與廣告","id":"w0208","number":208,"examples":[{"en":"The brochure is available at the front desk.","zh":"櫃檯可以拿到簡介。"},{"en":"Could you please review the new brochure before it's printed?","zh":"您能請您在印刷前審閱新的產品宣傳冊嗎？"}],"tips":["常見搭配詞：hand out/distribute a brochure (發放小冊子)、promotional brochure (宣傳手冊)、travel brochure (旅遊手冊)。"],"forms":["brochure","brochures"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"catalog","pos":"n.","meaning":"目錄；商品型錄","phrase":"product catalog","category":"行銷與廣告","id":"w0209","number":209,"examples":[{"en":"Our new catalog will arrive next week.","zh":"我們的新商品型錄下星期會送到。"},{"en":"The purchasing department is reviewing the latest catalog to identify potential suppliers.","zh":"採購部門正在審閱最新的產品目錄，以識別潛在供應商。"}],"tips":["常見搭配詞與情境：在多益考試中，常見詞組包括 'product catalog' (產品目錄)、'mail-order catalog' (郵購目錄) 及 'online catalog' (線上目錄)。常用於辦公用品採購、商場促銷或供應鏈管理情境。"],"forms":["catalog","catalogs"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"leaflet","pos":"n.","meaning":"傳單；宣傳單","phrase":"promotional leaflet","category":"行銷與廣告","id":"w0210","number":210,"examples":[{"en":"Please take a leaflet at the entrance.","zh":"請在入口拿一張傳單。"},{"en":"The leaflet explains our new services.","zh":"這張傳單介紹我們的新服務。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"poster","pos":"n.","meaning":"海報","phrase":"advertising poster","category":"行銷與廣告","id":"w0211","number":211,"examples":[{"en":"The poster is near the entrance.","zh":"海報在入口附近。"},{"en":"The marketing team designed a vibrant poster to promote the new product launch.","zh":"行銷團隊設計了一張鮮豔的海報來宣傳新產品的上市。"}],"tips":["常見搭配詞：'put up a poster' (張貼海報)、'design a poster' (設計海報)、'promotional poster' (宣傳海報)。在 TOEIC 中，這些組合常出現在公告或任務分配的情境中。"],"forms":["poster","posters"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"banner","pos":"n.","meaning":"橫幅；廣告布條","phrase":"advertising banner","category":"行銷與廣告","id":"w0212","number":212,"examples":[{"en":"The banner will hang above the door.","zh":"橫幅將掛在門的上方。"},{"en":"The website displayed a banner advertising a limited-time discount.","zh":"網站上顯示了一個橫幅，宣傳著限時折扣。"}],"tips":["常見搭配詞與詞組：'advertising banner' (廣告橫幅)、'promotional banner' (促銷布條)、'banner ad' (網頁橫幅廣告)。"],"forms":["banner","banners"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"brand","pos":"n.","meaning":"品牌","phrase":"brand awareness","category":"行銷與廣告","id":"w0213","number":213,"examples":[{"en":"This brand is popular with students.","zh":"這個品牌很受學生歡迎。"},{"en":"Our company is investing heavily in building a strong brand image.","zh":"我們公司正在大力投資以建立強大的品牌形象。"}],"tips":["常見搭配詞：多益常考 'brand loyalty' (品牌忠誠度)、'brand awareness' (品牌知名度)、'brand image' (品牌形象) 以及 'brand recognition' (品牌辨識度)，這些組合常出現在閱讀 Part 7 的行銷報告或商業文章中。"],"forms":["brand","brands"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"logo","pos":"n.","meaning":"標誌；商標圖案","phrase":"company logo","category":"行銷與廣告","id":"w0214","number":214,"examples":[{"en":"Our logo is printed on the bag.","zh":"我們的標誌印在袋子上。"},{"en":"The company redesigned its logo to appeal to a younger demographic.","zh":"該公司重新設計了其商標，以吸引更年輕的消費族群。"}],"tips":["常見搭配詞與短語：例如 company logo (公司標誌)、brand logo (品牌標誌)、design/create a logo (設計標誌)、trademarked logo (註冊標誌)。"],"forms":["logo","logos"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"slogan","pos":"n.","meaning":"標語；廣告口號","phrase":"advertising slogan","category":"行銷與廣告","id":"w0215","number":215,"examples":[{"en":"The slogan is easy to remember.","zh":"這句標語很好記。"},{"en":"The company launched a new advertising campaign with a catchy slogan.","zh":"這家公司發布了一項新的廣告活動，搭配一個朗朗上口的標語。"}],"tips":["常見搭配詞：'catchy slogan' (朗朗上口的口號)、'marketing slogan' (行銷標語)、'advertising slogan' (廣告口號)。"],"forms":["slogans"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"audience","pos":"n.","meaning":"受眾；觀眾","phrase":"target audience","category":"行銷與廣告","id":"w0216","number":216,"examples":[{"en":"Our target audience is young adults.","zh":"我們的目標受眾是年輕成人。"},{"en":"The speaker needs to engage the audience with compelling visuals and a clear message.","zh":"演講者需要透過引人入勝的視覺效果和清晰的信息來吸引聽眾。"}],"tips":["常見搭配詞：'target audience' (目標受眾) 是行銷情境中的高頻詞彙，其他如 'attract an audience' (吸引觀眾) 與 'audience participation' (觀眾參與) 也常出現在會議或活動描述中。"],"forms":["audience","audiences"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consumer","pos":"n.","meaning":"消費者","phrase":"consumer demand","category":"行銷與廣告","id":"w0217","number":217,"examples":[{"en":"A consumer can compare prices online.","zh":"消費者可以在線上比較價格。"},{"en":"The company is conducting market research to understand consumer preferences.","zh":"該公司正在進行市場調查，以了解消費者的偏好。"}],"tips":["常見搭配詞組：consumer confidence (消費者信心)、consumer demand (消費者需求)、consumer protection (消費者保護)、consumer goods (消費品)。"],"forms":["consumer","consumers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"demand","pos":"n./v.","meaning":"需求；要求","phrase":"meet demand","category":"行銷與廣告","id":"w0218","number":218,"examples":[{"en":"Demand is higher during the holidays.","zh":"假日期間的需求比較高。"},{"en":"We demand a full refund due to the defective merchandise.","zh":"由於商品有瑕疵，我們要求全額退款。"}],"tips":["常見搭配詞：'demand for' 表示對某事物的需求，介系詞固定用 for；'meet/satisfy the demand' (滿足需求) 與 'in high demand' (需求量大) 是商務情境中的高頻組合。"],"forms":["demand","demands","demanding","demanded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"survey","pos":"n./v.","meaning":"調查；進行調查","phrase":"customer survey","category":"行銷與廣告","id":"w0219","number":219,"examples":[{"en":"You can complete the survey in five minutes.","zh":"你可以在五分鐘內填完問卷。"},{"en":"The marketing team conducted a customer satisfaction survey to identify areas for improvement.","zh":"行銷團隊進行了一項客戶滿意度調查，以找出需要改進的領域。"}],"tips":["常見動詞搭配：survey 常與 conduct (進行)、carry out (執行)、respond to (回應) 連用。在多益閱讀中，conduct a survey 是極高頻出現的片語。"],"forms":["survey","surveys","surveying","surveyed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"research","pos":"n./v.","meaning":"研究；調查","phrase":"market research","category":"行銷與廣告","id":"w0220","number":220,"examples":[{"en":"The research is about shopping habits.","zh":"這項研究是關於購物習慣。"},{"en":"The marketing team is conducting research to identify new target markets.","zh":"行銷團隊正在進行研究，以識別新的目標市場。"}],"tips":["語法特性：research 在多益中多以不可數名詞出現，不可接 a 或使用複數 researches，常見搭配動詞為 conduct、carry out 或 do。"],"forms":["research","researches","researching","researched"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"trend","pos":"n.","meaning":"趨勢","phrase":"market trend","category":"行銷與廣告","id":"w0221","number":221,"examples":[{"en":"This trend is changing the market.","zh":"這個趨勢正在改變市場。"},{"en":"The latest market trend indicates a growing demand for eco-friendly products.","zh":"最新的市場趨勢顯示對環保產品的需求正在增長。"}],"tips":["常見搭配詞：'upward/downward trend'（上升/下降趨勢）、'market trend'（市場趨勢）、'follow a trend'（跟隨趨勢）。"],"forms":["trend","trends","trending","trended"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"competitor","pos":"n.","meaning":"競爭對手","phrase":"major competitor","category":"行銷與廣告","id":"w0222","number":222,"examples":[{"en":"Our competitor is opening a new store.","zh":"我們的競爭對手正在開設新店。"},{"en":"The new product faces stiff competition from established competitors in the industry.","zh":"這款新產品面臨來自業界既有競爭對手的激烈競爭。"}],"tips":["常見搭配詞：'main competitor' (主要競爭者)、'direct competitor' (直接競爭者) 以及 'outperform a competitor' (超越競爭對手)。"],"forms":["competitor","competitors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"competition","pos":"n.","meaning":"競爭","phrase":"market competition","category":"行銷與廣告","id":"w0223","number":223,"examples":[{"en":"Competition between the two stores is strong.","zh":"這兩家商店之間的競爭很激烈。"},{"en":"Lower prices help us face the competition.","zh":"較低的價格有助於我們面對競爭。"}],"tips":["常見搭配詞：常與 fierce、stiff 或 intense 連用表示「激烈的競爭」，動詞常搭配 face (面臨)、encounter (遇到) 或 beat (擊敗)。"],"forms":["competition","competitions","competes","competing","competed"],"exampleSource":"Wordstep original examples"},{"word":"segment","pos":"n.","meaning":"市場區隔；部分","phrase":"market segment","category":"行銷與廣告","id":"w0224","number":224,"examples":[{"en":"This market segment is growing quickly.","zh":"這個市場區隔正在快速成長。"},{"en":"The marketing team is responsible for the consumer segment.","zh":"行銷團隊負責消費者區段。"}],"tips":["市場行銷情境中的核心詞彙：在 TOEIC 閱讀的商業報告或行銷策略文章中，「market segment」指「市場區隔」，常用於描述針對特定族群的產品定位。"],"forms":["segment","segments","segmenting","segmented"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"target","pos":"n./v.","meaning":"目標；鎖定","phrase":"target customers","category":"行銷與廣告","id":"w0225","number":225,"examples":[{"en":"Our target is to reach more customers.","zh":"我們的目標是接觸更多顧客。"},{"en":"Our primary target market is young professionals aged 25-35.","zh":"我們的主要目標市場是 25 至 35 歲的年輕專業人士。"}],"tips":["常見搭配詞：名詞常用於 'sales target' (銷售目標)、'target audience' (目標受眾) 或 'target market' (目標市場)；動詞則常見 'be targeted at/to' (針對...)。"],"forms":["target","targets","targeting","targeted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"launch","pos":"n./v.","meaning":"推出；上市","phrase":"launch a product","category":"行銷與廣告","id":"w0226","number":226,"examples":[{"en":"We will launch the product in May.","zh":"我們將於五月推出這項產品。"},{"en":"The company plans to launch its new smartphone model next quarter.","zh":"公司計畫在下個季度推出其新款智慧型手機。"}],"tips":["常見搭配詞：多益考試中常出現 launch a new product (推出新產品)、launch a marketing campaign (發起行銷活動)、launch a website (網站上線)。此外，product launch (產品發表會) 作為複合名詞也極為常見。"],"forms":["launch","launches","launching","launched"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"display","pos":"n./v.","meaning":"展示；陳列","phrase":"product display","category":"行銷與廣告","id":"w0227","number":227,"examples":[{"en":"The display is ready for the opening.","zh":"展示陳列已準備好迎接開幕。"},{"en":"The company decided to display its latest products at the international trade fair.","zh":"公司決定在國際貿易展覽會上展示其最新產品。"}],"tips":["常見搭配詞與情境：在 TOEIC 考試中，此字極常以「on display」(展示中) 的片語形式出現，特別是在 Part 1 照片描述題中。常見詞組包括「window display」(櫥窗展示)、「display case」(展示櫃) 及「visual display」(視覺顯示)。"],"forms":["display","displays","displaying","displayed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"exhibit","pos":"n./v.","meaning":"展品；展示","phrase":"exhibit products","category":"行銷與廣告","id":"w0228","number":228,"examples":[{"en":"You can see the exhibit on the first floor.","zh":"你可以在一樓看到這件展品。"},{"en":"The museum features a fascinating exhibit on ancient Egyptian artifacts.","zh":"博物館展示了一個關於古埃及文物迷人的展覽。"}],"tips":["詞性雙重身份：exhibit 可作為動詞「展示、顯露」，亦可作為名詞「展覽品」。在 TOEIC 閱讀中，常出現在博物館或貿易展（trade show）的情境中。"],"forms":["exhibit","exhibits","exhibiting","exhibited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"feature","pos":"n./v.","meaning":"特色；以…為特色","phrase":"product features","category":"行銷與廣告","id":"w0229","number":229,"examples":[{"en":"This feature is included in every model.","zh":"每款型號都有這項功能。"},{"en":"The new software boasts several key features, including enhanced security and improved user interface.","zh":"這款新軟體擁有幾個關鍵特色，包括增強的安全性以及改進的使用者介面。"}],"tips":["詞性與多重義項：在多益考試中，feature 常作為名詞表示『特色、功能、專題報導』，或作為動詞表示『以...為特色、由...主演/主講』。例如 'The new phone has several advanced features.' (名詞) 或 'The concert will feature local musicians.' (動詞)。"],"forms":["feature","features","featuring","featured"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"design","pos":"n./v.","meaning":"設計","phrase":"product design","category":"行銷與廣告","id":"w0230","number":230,"examples":[{"en":"The new design is simple and practical.","zh":"新設計簡單又實用。"},{"en":"We need to design a more efficient workflow to reduce operational costs.","zh":"我們需要設計一個更有效率的工作流程以減少營運成本。"}],"tips":["詞性雙重身份：'design' 在 TOEIC 中常同時以動詞（設計）與名詞（設計、設計圖）形式出現。在 Part 5 語法題中，需根據句子結構判斷其詞性，例如在助動詞後為動詞，在形容詞或冠詞後為名詞。"],"forms":["design","designs","designing","designed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"package","pos":"n./v.","meaning":"包裝；套裝方案","phrase":"promotional package","category":"行銷與廣告","id":"w0231","number":231,"examples":[{"en":"The holiday package includes breakfast.","zh":"這個假期套裝方案包含早餐。"},{"en":"We offer a package deal that includes accommodation, meals, and activities.","zh":"我們提供一個組合方案，包含住宿、餐點和活動。"}],"tips":["多義性應用：在多益中 package 不僅指實體的「包裹」，更常出現在商業情境中指「一整套方案」，例如「compensation package」(薪酬福利方案) 或「vacation package」(套裝旅遊行程)。"],"forms":["package","packages","packaging","packaged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"label","pos":"n./v.","meaning":"標籤；貼標籤","phrase":"product label","category":"行銷與廣告","id":"w0232","number":232,"examples":[{"en":"The label is on the back of the box.","zh":"標籤在盒子的背面。"},{"en":"Please label your luggage with your name and contact information.","zh":"請在您的行李箱上標示您的姓名和聯絡資訊。"}],"tips":["常見搭配詞組：常用於物流或零售情境，如 'shipping label' (出貨標籤)、'warning label' (警告標籤)、'private label' (自有品牌)。"],"forms":["label","labels","labeling","labeled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sample","pos":"n.","meaning":"樣品；試用品","phrase":"free sample","category":"行銷與廣告","id":"w0233","number":233,"examples":[{"en":"You can try a free sample.","zh":"你可以試用一份免費樣品。"},{"en":"Before placing a bulk order, the client requested a sample of the fabric.","zh":"在下單之前，客戶要求提供一份布料的樣本。"}],"tips":["常見搭配詞：'free sample' (免費樣品) 常用於零售與行銷情境；'random sample' (隨機抽樣) 則多見於市場調查報告。"],"forms":["sample","samples","sampling","sampled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"coupon","pos":"n.","meaning":"優惠券","phrase":"discount coupon","category":"行銷與廣告","id":"w0234","number":234,"examples":[{"en":"This coupon is valid until Friday.","zh":"這張優惠券有效至星期五。"},{"en":"The marketing department distributed coupons to attract new clients to the store.","zh":"行銷部門發放優惠券以吸引新客戶到店。"}],"tips":["常見搭配詞：'redeem a coupon' (兌換優惠券) 是最常考的動詞搭配，其他如 'discount coupon' (折扣券) 或 'digital coupon' (電子優惠券) 也常出現在題目中。"],"forms":["coupon","coupons"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"discount","pos":"n./v.","meaning":"折扣；打折","phrase":"offer a discount","category":"行銷與廣告","id":"w0235","number":235,"examples":[{"en":"A discount is available for students.","zh":"學生可以享有折扣。"},{"en":"The supplier discounted the price by $5 per unit after negotiation.","zh":"經過協商，供應商將單價降低了 5 美元。"}],"tips":["常見搭配詞與句型：'offer a discount' (提供折扣)、'at a discounted price' (以折扣價) 以及 'volume discount' (大宗採購折扣)。在閱讀測驗中常出現在廣告或促銷活動信件。"],"forms":["discount","discounts","discounting","discounted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"special","pos":"adj./n.","meaning":"特別的；特價商品","phrase":"special price","category":"行銷與廣告","id":"w0236","number":236,"examples":[{"en":"The special price will end tonight.","zh":"這個特價將於今晚結束。"},{"en":"The company offers a special discount for first-time customers.","zh":"公司為首次顧客提供特別折扣。"}],"tips":["常見搭配詞：包含 special offer (特惠)、special occasion (特殊場合)、special request (特別要求)。在多益聽力 Part 1 或 Part 2 中，若聽到 special offer，答案往往與價格折扣或促銷活動相關。"],"forms":["special","more special","most special"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"offer","pos":"n./v.","meaning":"優惠；提供","phrase":"special offer","category":"行銷與廣告","id":"w0237","number":237,"examples":[{"en":"This offer is available online only.","zh":"這項優惠僅限線上使用。"},{"en":"The supplier offered a 10% discount on the bulk order.","zh":"供應商為批量訂單提供了 10% 的折扣。"}],"tips":["常見搭配詞與結構：offer 具備動詞與名詞雙重身分。動詞常用結構為 offer someone something（提供某人某物）或 offer to do something（主動提議做某事）。常見搭配如 job offer（工作錄取通知）、special offer（特別優惠）、make an offer（報價/出價）。"],"forms":["offer","offers","offering","offered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sponsor","pos":"n./v.","meaning":"贊助者；贊助","phrase":"sponsor an event","category":"行銷與廣告","id":"w0238","number":238,"examples":[{"en":"Our company will sponsor the event.","zh":"我們的公司將贊助這場活動。"},{"en":"The event was generously sponsored by several leading corporations.","zh":"這個活動由多家領先企業慷慨贊助。"}],"tips":["【詞性辨析與衍生字】：sponsor 可作為動詞（贊助）與名詞（贊助商）。在 TOEIC 語法題中常考其名詞形式「sponsorship」（贊助行為/身分），例如：'seek financial sponsorship'。"],"forms":["sponsor","sponsors","sponsoring","sponsored"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sponsorship","pos":"n.","meaning":"贊助","phrase":"corporate sponsorship","category":"行銷與廣告","id":"w0239","number":239,"examples":[{"en":"We are looking for sponsorship for the event.","zh":"我們正在為這場活動尋找贊助。"},{"en":"The company's sponsorship covered our travel costs.","zh":"公司的贊助支付了我們的旅費。"}],"tips":["常見搭配詞組：'corporate sponsorship' (企業贊助)、'seek sponsorship' (尋求贊助)、'under the sponsorship of' (在...的贊助/主辦下)。"],"forms":["sponsorship","sponsorships"],"exampleSource":"Wordstep original examples"},{"word":"media","pos":"n.","meaning":"媒體","phrase":"social media","category":"行銷與廣告","id":"w0240","number":240,"examples":[{"en":"You can follow us on social media.","zh":"你可以在社群媒體上追蹤我們。"},{"en":"Social media marketing has become an essential part of our advertising strategy.","zh":"社群媒體行銷已成為我們廣告策略的重要組成部分。"}],"tips":["單複數用法：media 為 medium 的複數形式，但在現代商業英語中常被視為集合名詞，指代『大眾傳播媒介』時可接單數動詞（如 The media is covering the story），考生應注意其在主動詞一致性考題中的變化。"],"forms":["media"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"commercial","pos":"n./adj.","meaning":"商業廣告；商業的","phrase":"television commercial","category":"行銷與廣告","id":"w0241","number":241,"examples":[{"en":"The commercial will air tonight.","zh":"這支廣告將於今晚播出。"},{"en":"The company invested heavily in commercial advertising to boost sales.","zh":"公司投入大量資金進行商業廣告投放，以提升銷售額。"}],"tips":["詞性雙重性：在多益中常用作形容詞表示「商業的、營利的」，但作為名詞時專指「（電視或廣播）廣告」，需根據上下文判斷詞性。"],"forms":["commercial","more commercial","most commercial","commercials"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"circulation","pos":"n.","meaning":"發行量；流通","phrase":"newspaper circulation","category":"行銷與廣告","id":"w0242","number":242,"examples":[{"en":"The newspaper's circulation is increasing.","zh":"這家報紙的發行量正在增加。"},{"en":"The newspaper's daily circulation has increased significantly this year.","zh":"這家報紙的每日發行量今年顯著增加了。"}],"tips":["出版業情境的『發行量』：在 TOEIC 閱讀測驗中，此字最常代表報章雜誌的銷售份數。常見搭配詞如 circulation figures (發行數字) 或 daily circulation (日發行量)。若文中提到廣告費用調整，通常會以發行量的高低作為理由。"],"forms":["circulation","circulations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subscription","pos":"n.","meaning":"訂閱","phrase":"annual subscription","category":"行銷與廣告","id":"w0243","number":243,"examples":[{"en":"Your subscription will end next month.","zh":"你的訂閱將於下個月到期。"},{"en":"The company offers a monthly subscription for access to its premium software features.","zh":"公司提供每月訂閱費用，以獲得其高級軟體功能的存取權。"}],"tips":["常見搭配詞：包含 'annual/monthly subscription' (年度/每月訂閱)、'subscription fee' (訂閱費) 以及 'renew/cancel a subscription' (續訂/取消訂閱)。"],"forms":["subscription","subscriptions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subscriber","pos":"n.","meaning":"訂閱者","phrase":"new subscriber","category":"行銷與廣告","id":"w0244","number":244,"examples":[{"en":"Each subscriber will receive a welcome email.","zh":"每位訂閱者都會收到歡迎信。"},{"en":"The company offers a premium service for subscribers who want exclusive content.","zh":"公司為想要獲得獨家內容的訂閱者提供高級服務。"}],"tips":["常見搭配詞與結構：常用搭配包括 'new subscriber' (新訂戶)、'potential subscriber' (潛在訂戶) 以及 'subscriber base' (用戶群)。在 TOEIC 閱讀中，常出現 'attract new subscribers' (吸引新訂戶) 的語境。"],"forms":["subscriber","subscribers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reputation","pos":"n.","meaning":"聲譽；名聲","phrase":"company reputation","category":"行銷與廣告","id":"w0245","number":245,"examples":[{"en":"Our reputation is important to us.","zh":"我們很重視自己的聲譽。"},{"en":"The company's reputation for quality and reliability has contributed significantly to its success.","zh":"該公司在品質和可靠性方面的聲譽，對其成功貢獻良多。"}],"tips":["常見搭配詞組：常用搭配包括 'have/earn/build/establish a reputation for' (因...而獲得/建立聲譽) 以及 'stellar/solid/excellent reputation' (極佳/穩健的聲譽)。"],"forms":["reputation","reputations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"image","pos":"n.","meaning":"形象；圖像","phrase":"brand image","category":"行銷與廣告","id":"w0246","number":246,"examples":[{"en":"The new image will appear on the website.","zh":"新圖片將出現在網站上。"},{"en":"The marketing team needs high-resolution images for the new product campaign.","zh":"行銷團隊需要高解析度的圖片來宣傳新產品。"}],"tips":["常見搭配詞：'corporate image' (企業形象)、'brand image' (品牌形象)、'public image' (公眾形象) 及 'project an image' (塑造形象)，常見於市場營銷與公共關係情境。"],"forms":["image","images"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"awareness","pos":"n.","meaning":"認知度；知名度","phrase":"increase brand awareness","category":"行銷與廣告","id":"w0247","number":247,"examples":[{"en":"The campaign can increase brand awareness.","zh":"這場宣傳活動可以提高品牌知名度。"},{"en":"Increased employee awareness of safety protocols is crucial for preventing workplace accidents.","zh":"提高員工對安全協議的認識對於預防職場事故至關重要。"}],"tips":["常見搭配詞：'Raise awareness'（提升意識）、'Brand awareness'（品牌知名度）、'Environmental awareness'（環保意識），在行銷或企業社會責任（CSR）題材中極為常見。"],"forms":["awareness","awarenesses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"attract","pos":"v.","meaning":"吸引","phrase":"attract customers","category":"行銷與廣告","id":"w0248","number":248,"examples":[{"en":"Lower prices can attract more customers.","zh":"較低的價格可以吸引更多顧客。"},{"en":"The company's innovative marketing campaign is designed to attract new customers.","zh":"該公司的創新行銷活動旨在吸引新客戶。"}],"tips":["常見搭配詞組：常用於 attract customers (吸引顧客)、attract investment (吸引投資) 及 attract attention (引起注意)，這些詞組常出現在閱讀 Part 7 的廣告或商業報導中。"],"forms":["attract","attracts","attracting","attracted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"appeal","pos":"n./v.","meaning":"吸引力；吸引","phrase":"appeal to consumers","category":"行銷與廣告","id":"w0249","number":249,"examples":[{"en":"This design will appeal to younger buyers.","zh":"這項設計會吸引較年輕的買家。"},{"en":"The company decided to appeal the court's decision.","zh":"公司決定對法院的決定提出上訴。"}],"tips":["常見搭配與介係詞：當動詞表示『吸引』時，必須搭配 to，例如 'The new design appeals to younger demographics'；當表示『呼籲或請求』時，則常搭配 for，如 'appeal for help'。"],"forms":["appeal","appeals","appealing","appealed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"distribute","pos":"v.","meaning":"分發；配送","phrase":"distribute brochures","category":"行銷與廣告","id":"w0250","number":250,"examples":[{"en":"We will distribute the brochures tomorrow.","zh":"我們明天會分發簡介。"},{"en":"The company will distribute the annual report to all shareholders next week.","zh":"公司將下週向所有股東發放年度報告。"}],"tips":["常見搭配詞：'distribute documents/brochures'（分發文件/手冊）以及固定搭配 'distribute to'（分發給某對象）。"],"forms":["distribute","distributes","distributing","distributed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sale","pos":"n.","meaning":"銷售；特價","phrase":"sales volume","category":"銷售與客戶","id":"w0251","number":251,"examples":[{"en":"The sale will begin tomorrow morning.","zh":"特賣將於明天早上開始。"},{"en":"The company announced a year-end sale to clear out excess inventory.","zh":"公司宣布年末特賣，以清理過剩庫存。"}],"tips":["區分 'on sale' 與 'for sale'：在 TOEIC 閱讀中，'on sale' 表示正在打折特價，而 'for sale' 僅表示物品可供出售，並不一定有折扣。"],"forms":["sale","sales","sells","selling","sold"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"customer","pos":"n.","meaning":"顧客","phrase":"customer service","category":"銷售與客戶","id":"w0252","number":252,"examples":[{"en":"The customer is waiting for assistance.","zh":"顧客正在等候協助。"},{"en":"Our priority is to provide excellent service to every customer.","zh":"我們的首要任務是為每一位顧客提供卓越的服務。"}],"tips":["常見搭配詞：'customer service' (客服)、'customer satisfaction' (客戶滿意度) 及 'loyal customer' (忠實客戶)，這些詞組在聽力與閱讀測驗中極高頻出現。"],"forms":["customer","customers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"client","pos":"n.","meaning":"客戶","phrase":"meet with a client","category":"銷售與客戶","id":"w0253","number":253,"examples":[{"en":"Our client will visit on Thursday.","zh":"我們的客戶星期四會來訪。"},{"en":"Our company strives to build long-term relationships with its clients.","zh":"我們公司致力於與客戶建立長期的合作關係。"}],"tips":["常見搭配詞：在多益中常與 potential (潛在的)、prospective (預期的)、loyal (忠誠的) 連用，例如 client base (客戶群) 或 build a relationship with a client (與客戶建立關係)。"],"forms":["client","clients"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"buyer","pos":"n.","meaning":"買方；買家","phrase":"potential buyer","category":"銷售與客戶","id":"w0254","number":254,"examples":[{"en":"The buyer is interested in this model.","zh":"買方對這款型號有興趣。"},{"en":"The company is actively seeking new buyers for its products in overseas markets.","zh":"該公司正在積極尋找海外市場的新買家。"}],"tips":["常見搭配詞組：常用 'potential buyer' (潛在買家)、'first-time buyer' (首次購屋者) 及 'corporate buyer' (企業採購單位)，在多益閱讀中常出現在地產或大型採購的情境。"],"forms":["buyer","buyers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"purchaser","pos":"n.","meaning":"購買者；採購人員","phrase":"prospective purchaser","category":"銷售與客戶","id":"w0255","number":255,"examples":[{"en":"The purchaser will receive a receipt.","zh":"購買者將收到收據。"},{"en":"The purchaser is responsible for inspecting the goods upon delivery.","zh":"採購者有責任在貨物交付時進行檢查。"}],"tips":["詞性辨析與字尾特性：字尾「-er」明確標示其為「執行動作的人」，在 TOEIC 閱讀 Part 5 詞彙題中，常與 purchase (動詞/名詞) 或 purchasing (動名詞) 一起出現，考生需依據句意判斷是否需要指稱「人」的名詞。"],"forms":["purchaser","purchasers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"retailer","pos":"n.","meaning":"零售商","phrase":"major retailer","category":"銷售與客戶","id":"w0256","number":256,"examples":[{"en":"The retailer is offering a discount.","zh":"零售商正在提供折扣。"},{"en":"Many retailers are struggling to compete with online stores.","zh":"許多零售商正在努力與線上商店競爭。"}],"tips":["常見搭配詞組：'online retailer' (網路零售商)、'leading retailer' (領先的零售業者)、'clothing retailer' (服飾零售商)。"],"forms":["retailer","retailers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"wholesaler","pos":"n.","meaning":"批發商","phrase":"local wholesaler","category":"銷售與客戶","id":"w0257","number":257,"examples":[{"en":"The wholesaler can supply large quantities.","zh":"批發商可以大量供貨。"},{"en":"Department heads discussed the wholesaler strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了wholesaler策略。"}],"tips":["供應鏈角色辨析：在 TOEIC 閱讀中，wholesaler（批發商）是介於製造商（manufacturer）與零售商（retailer）之間的中間商，常考採購流程與供應鏈管理。"],"forms":["wholesaler"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"vendor","pos":"n.","meaning":"供應商；賣方","phrase":"approved vendor","category":"銷售與客戶","id":"w0258","number":258,"examples":[{"en":"The vendor will deliver the chairs tomorrow.","zh":"供應商明天會送來椅子。"},{"en":"Our company is seeking new vendors to supply office stationery.","zh":"我們公司正在尋找新的供應商來提供辦公文具。"}],"tips":["常見搭配詞：'preferred vendor' (首選供應商)、'outside vendor' (外部廠商)、'vendor contract' (供應商合約) 及 'software vendor' (軟體開發商)。在TOEIC中，此字多指企業的第三方服務或產品提供者。"],"forms":["vendor","vendors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"representative","pos":"n.","meaning":"代表；業務代表","phrase":"sales representative","category":"銷售與客戶","id":"w0259","number":259,"examples":[{"en":"A sales representative can explain the options.","zh":"業務代表可以說明各種選項。"},{"en":"This data is not representative of the entire population.","zh":"這些數據並不能代表整個族群。"}],"tips":["詞性辨識技巧：雖然字尾是 -ative 常見於形容詞，但在多益中此字更常以可數名詞出現，意指「代表」或「專員」，常考職位名稱如 customer service representative (客服專員) 或 sales representative (業務代表)。"],"forms":["representative","representatives","more representative","most representative"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"salesperson","pos":"n.","meaning":"銷售人員","phrase":"experienced salesperson","category":"銷售與客戶","id":"w0260","number":260,"examples":[{"en":"A salesperson will help you choose a phone.","zh":"銷售人員會幫你挑選手機。"},{"en":"Please ask the salesperson about the warranty.","zh":"請向銷售人員詢問保固。"}],"tips":["常見搭配詞組：'experienced salesperson' (資深銷售員)、'top-performing salesperson' (業績優異的銷售員)、'commission-based salesperson' (抽成制銷售員)。"],"forms":["salesperson","salespersons"],"exampleSource":"Wordstep original examples"},{"word":"merchandise","pos":"n.","meaning":"商品","phrase":"display merchandise","category":"銷售與客戶","id":"w0261","number":261,"examples":[{"en":"The merchandise is on the upper shelf.","zh":"商品在上層架子上。"},{"en":"The store is having a huge sale on all its merchandise.","zh":"這家商店正在對其所有商品進行大規模促銷。"}],"tips":["不可數名詞特性：merchandise 在 TOEIC 中常作為不可數名詞，表示「商品」的總稱，不可加 s。若要計算單一物件，應使用 items of merchandise。"],"forms":["merchandise","merchandises"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"product","pos":"n.","meaning":"產品","phrase":"new product","category":"銷售與客戶","id":"w0262","number":262,"examples":[{"en":"This product is easy to use.","zh":"這項產品很容易使用。"},{"en":"Our company is launching a new product next month to meet the growing market demand.","zh":"為了滿足不斷增長的市场需求，我們公司下個月將推出一款新產品。"}],"tips":["常見搭配詞：在 TOEIC 中常出現 'product launch' (產品發表)、'product line' (產品線) 以及 'defective product' (瑕疵品)。其中 'defective' 常與退換貨情境結合。"],"forms":["product","products"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"item","pos":"n.","meaning":"商品；品項","phrase":"sale item","category":"銷售與客戶","id":"w0263","number":263,"examples":[{"en":"This item is currently out of stock.","zh":"這個品項目前缺貨。"},{"en":"The inventory system tracks each item's quantity and location.","zh":"庫存系統追蹤每個物品的數量和位置。"}],"tips":["常見搭配詞：line item (預算中的項目), promotional item (促銷贈品), prohibited item (違禁品), agenda item (議程中的討論事項)。"],"forms":["item","items"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"goods","pos":"n.","meaning":"商品；貨物","phrase":"consumer goods","category":"銷售與客戶","id":"w0264","number":264,"examples":[{"en":"The goods will arrive on Friday.","zh":"貨物將於星期五抵達。"},{"en":"The company imports high-quality goods from overseas.","zh":"該公司從海外進口高品質的商品。"}],"tips":["恆為複數名詞：'goods' 在表達商品或貨物時，結尾必定有 s 且動詞需接複數型 (如 The goods are ready for shipment)，不可與 a 連用。"],"forms":["goods"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"service","pos":"n.","meaning":"服務","phrase":"provide a service","category":"銷售與客戶","id":"w0265","number":265,"examples":[{"en":"Delivery service is available in this area.","zh":"這個區域提供配送服務。"},{"en":"The hotel staff provided excellent service, ensuring a comfortable stay for all guests.","zh":"飯店員工提供了優質的服務，確保所有住客都能享受舒適的住宿體驗。"}],"tips":["常見搭配詞組：'customer service' (客服)、'out of service' (故障中/停止服務) 以及 'service charge' (服務費)。在 Part 1 圖片題中，若機器貼有告示，常考 'out of service' 的同義表達。"],"forms":["service","services","serves","serving","served"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"price","pos":"n.","meaning":"價格","phrase":"reasonable price","category":"銷售與客戶","id":"w0266","number":266,"examples":[{"en":"The price is shown on the label.","zh":"價格標示在標籤上。"},{"en":"The supplier quoted a competitive price for the raw materials.","zh":"供應商為原材料報出了有競爭力的價格。"}],"tips":["常見搭配詞組：'competitive price' (具競爭力的價格)、'retail price' (零售價)、'wholesale price' (批發價) 及 'price tag' (價格標籤)。"],"forms":["price","prices"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fee","pos":"n.","meaning":"費用；手續費","phrase":"service fee","category":"銷售與客戶","id":"w0267","number":267,"examples":[{"en":"The service fee is included in the total.","zh":"服務費已包含在總金額中。"},{"en":"Please review the invoice to confirm the service fee.","zh":"請查閱發票以確認服務費用。"}],"tips":["常見搭配詞：在 TOEIC 中常出現的組合包括 admission fee (入場費)、registration fee (報名費)、legal fee (律師費)、late fee (滯納金) 及 service fee (服務費)，通常出現在閱讀測驗的發票或活動通知中。"],"forms":["fee","fees"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"charge","pos":"n./v.","meaning":"費用；收費","phrase":"additional charge","category":"銷售與客戶","id":"w0268","number":268,"examples":[{"en":"There is no extra charge for delivery.","zh":"配送不另收費。"},{"en":"The hotel charged an extra fee for late check-out.","zh":"飯店對延遲退房收取了額外費用。"}],"tips":["多重語義辨析：在 TOEIC 中，charge 最常見的用法是「收費」(n./v.) 或「職責」(n.)。若後面接金額或費用名稱（如 service charge），指代收費；若出現在片語 in charge of 中，則表示「負責、掌管」。"],"forms":["charge","charges","charging","charged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"purchase","pos":"n./v.","meaning":"購買","phrase":"make a purchase","category":"銷售與客戶","id":"w0269","number":269,"examples":[{"en":"You can purchase tickets online.","zh":"你可以在線上購票。"},{"en":"The company plans to purchase new equipment to improve production efficiency.","zh":"公司計劃採購新設備以提高生產效率。"}],"tips":["動詞與名詞雙重身分：在 TOEIC 中，purchase 既可作動詞「購買」也可作名詞「購買行為」或「購買的物品」。例如：'Make a purchase'（名詞用法，進行購買）。"],"forms":["purchase","purchases","purchasing","purchased"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sell","pos":"v.","meaning":"銷售；出售","phrase":"sell a product","category":"銷售與客戶","id":"w0270","number":270,"examples":[{"en":"We can sell the remaining items at a discount.","zh":"我們可以打折出售剩餘商品。"},{"en":"The company aims to sell over 10,000 units of the new product this quarter.","zh":"本公司計劃在本季銷售超過 10,000 個新產品。"}],"tips":["常見搭配詞與短語：TOEIC 中常出現 'sell out' (售罄) 與 'sell like hotcakes' (熱銷)。此外，分詞形式 'best-selling' (最暢銷的) 常作為形容詞修飾產品。"],"forms":["sell","sells","selling","sold"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"transaction","pos":"n.","meaning":"交易","phrase":"complete a transaction","category":"銷售與客戶","id":"w0271","number":271,"examples":[{"en":"The transaction is now complete.","zh":"交易現在已完成。"},{"en":"The bank processed over 10,000 transactions yesterday.","zh":"銀行昨天處理了超過 10,000 筆交易。"}],"tips":["常見搭配詞：包含 'financial transaction' (金融交易)、'online transaction' (線上交易)、'complete a transaction' (完成交易) 與 'process a transaction' (處理交易)。"],"forms":["transaction","transactions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"deal","pos":"n.","meaning":"交易；協議","phrase":"close a deal","category":"銷售與客戶","id":"w0272","number":272,"examples":[{"en":"This deal is available until tomorrow.","zh":"這項優惠有效至明天。"},{"en":"The sales team is dealing with a large number of customer complaints today.","zh":"銷售團隊今天正在處理大量的客戶投訴。"}],"tips":["常見搭配詞：在 TOEIC 中 'deal with' 是極高頻的動詞片語，表示『處理』或『應對』問題（如 deal with a client's complaint）；作為名詞時，常見 'make a deal' (達成協議) 或 'close a deal' (完成交易)。"],"forms":["deal","deals","dealing","dealt"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"contract","pos":"n.","meaning":"合約","phrase":"sign a contract","category":"銷售與客戶","id":"w0273","number":273,"examples":[{"en":"Please read the contract before signing.","zh":"簽署前請先閱讀合約。"},{"en":"The contract will end next month.","zh":"合約將於下個月到期。"}],"tips":["例句1的 before + 動名詞 signing 表示「簽署之前」。例句2用 will 表示未來。"],"forms":["contract","contracts","contracting","contracted"],"exampleSource":"Wordstep original examples"},{"word":"warranty","pos":"n.","meaning":"保固；保證","phrase":"one-year warranty","category":"銷售與客戶","id":"w0274","number":274,"examples":[{"en":"The warranty is valid for one year.","zh":"保固有效期為一年。"},{"en":"The product comes with a one-year warranty against manufacturing defects.","zh":"這產品附有一年保固，針對製造上的瑕疵。"}],"tips":["常見搭配詞組：'under warranty' (在保固期內)、'extended warranty' (延長保固)、'void the warranty' (使保固失效)、'manufacturer's warranty' (原廠保固)。"],"forms":["warranty","warranties"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"guarantee","pos":"n./v.","meaning":"保證；擔保","phrase":"money-back guarantee","category":"銷售與客戶","id":"w0275","number":275,"examples":[{"en":"A money-back guarantee is included.","zh":"這項商品附有退款保證。"},{"en":"We guarantee on-time delivery, or you'll receive a full refund.","zh":"我們保證準時交貨，否則您將獲得全額退款。"}],"tips":["詞性雙重身分：在 TOEIC 中常作為動詞（保證）或名詞（保證書、擔保）。名詞用法常與 warranty 互換，但 guarantee 範圍更廣，可用於服務或抽象承諾，而 warranty 多指產品零件維護。"],"forms":["guarantee","guarantees","guaranteeing","guaranteed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"refund","pos":"n./v.","meaning":"退款；退費","phrase":"request a refund","category":"銷售與客戶","id":"w0276","number":276,"examples":[{"en":"Your refund will arrive within five days.","zh":"你的退款將在五天內入帳。"},{"en":"Please submit your receipt to process your refund request.","zh":"請提交您的收據以處理您的退款申請。"}],"tips":["常見搭配詞：常用動詞搭配包括 issue a refund (發放退款)、request a refund (要求退款)、process a refund (處理退款)；形容詞常搭配 full refund (全額退款) 或 partial refund (部分退款)。"],"forms":["refund","refunds","refunding","refunded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"return","pos":"n./v.","meaning":"退貨；退回","phrase":"return an item","category":"銷售與客戶","id":"w0277","number":277,"examples":[{"en":"You can return the item with the receipt.","zh":"你可以憑收據退貨。"},{"en":"The supplier will return the defective goods within one week.","zh":"供應商將在一週內退回有缺陷的商品。"}],"tips":["常見搭配詞與商務情境：在聽力與短對話中，'return a call' (回電) 是基礎考點；在零售情境中，'return an item' (退貨) 與 'return policy' (退貨政策) 極為常見。"],"forms":["return","returns","returning","returned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"exchange","pos":"n./v.","meaning":"換貨；交換","phrase":"exchange an item","category":"銷售與客戶","id":"w0278","number":278,"examples":[{"en":"You can exchange the shirt for a larger size.","zh":"你可以把襯衫換成較大的尺寸。"},{"en":"Could you please exchange your business card with me?","zh":"請問您可以與我交換您的名片嗎？"}],"tips":["常見搭配詞組：'exchange rate' (匯率)、'foreign exchange' (外匯)、'in exchange for' (作為...的交換)。"],"forms":["exchange","exchanges","exchanging","exchanged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"receipt","pos":"n.","meaning":"收據","phrase":"keep the receipt","category":"銷售與客戶","id":"w0279","number":279,"examples":[{"en":"The receipt is inside the bag.","zh":"收據在袋子裡。"},{"en":"The accounting department requires all expense receipts for reimbursement.","zh":"會計部門需要所有費用收據以供報銷。"}],"tips":["發音重點：字母 'p' 在此單字中不發音，聽力測驗時需留意其發音為 /rɪˈsiːt/。"],"forms":["receipt","receipts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"invoice","pos":"n.","meaning":"發票；請款單","phrase":"issue an invoice","category":"銷售與客戶","id":"w0280","number":280,"examples":[{"en":"Please send me the invoice.","zh":"請把請款單寄給我。"},{"en":"The invoice was sent yesterday.","zh":"請款單昨天已寄出。"}],"tips":["invoice 常用來請款，不等同於付款後取得的 receipt（收據）。was sent 表示「被寄出」。"],"forms":["invoice","invoices"],"exampleSource":"Wordstep original examples"},{"word":"quote","pos":"n./v.","meaning":"報價；報價單","phrase":"request a quote","category":"銷售與客戶","id":"w0281","number":281,"examples":[{"en":"We can send you a quote today.","zh":"我們今天可以把報價寄給你。"},{"en":"Could you please provide a quote for 100 units of this product?","zh":"您能為這款產品的 100 個單位提供報價嗎？"}],"tips":["名詞與動詞用法：在 TOEIC 考試中，quote 常用作名詞表示「報價」或「估價單」，其同義詞為 quotation；動詞用法則指「開出價格」或「引用」。"],"forms":["quote","quotes","quoting","quoted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"estimate","pos":"n./v.","meaning":"估價；估計","phrase":"cost estimate","category":"銷售與客戶","id":"w0282","number":282,"examples":[{"en":"The estimate is based on last year's costs.","zh":"這份估價是根據去年的成本。"},{"en":"The project manager needs to estimate the cost of the new marketing campaign.","zh":"專案經理需要估算新行銷活動的成本。"}],"tips":["常見搭配詞：常用 'rough estimate' (粗略估計) 或 'conservative estimate' (保守估計)；在動詞用法上常接 'submit an estimate' (提交估價單) 或 'provide an estimate' (提供報價)。"],"forms":["estimate","estimates","estimating","estimated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pricing","pos":"n.","meaning":"定價；價格設定","phrase":"pricing strategy","category":"銷售與客戶","id":"w0283","number":283,"examples":[{"en":"Our pricing is listed on the website.","zh":"我們的定價列在網站上。"},{"en":"Competitive pricing is essential for attracting new customers and increasing sales volume.","zh":"具有競爭力的定價對於吸引新客戶和提高銷售量至關重要。"}],"tips":["常見搭配詞：pricing strategy (定價策略)、pricing policy (定價政策)、competitive pricing (具競爭力的定價)、pricing structure (價格結構)。"],"forms":["pricing","pricings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"commission","pos":"n.","meaning":"佣金；抽成","phrase":"sales commission","category":"銷售與客戶","id":"w0284","number":284,"examples":[{"en":"The commission is five percent of the sale.","zh":"佣金是銷售額的百分之五。"},{"e

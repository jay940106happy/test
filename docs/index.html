n":"The salesperson earns a 5% commission on each sale.","zh":"這位銷售人員每筆銷售額都能獲得 5% 的佣金。"}],"tips":["常見搭配詞與情境：在多益中常以『業務佣金』(sales commission) 或『委員會』(commission board) 的形式出現，例如 'earn a 5% commission on sales'。"],"forms":["commission","commissions","commissioning","commissioned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"account","pos":"n.","meaning":"帳戶；客戶帳號","phrase":"customer account","category":"銷售與客戶","id":"w0285","number":285,"examples":[{"en":"Your account is ready to use.","zh":"你的帳戶已可使用。"},{"en":"The company needs to reconcile its bank accounts monthly.","zh":"公司需要每月對帳戶進行核對。"}],"tips":["多重詞義辨析：在多益中 account 具有多種身份。作為名詞常用於「銀行帳戶」(bank account)、「客戶/帳號」(key account 指重要客戶) 或「描述/報導」(a detailed account)；作為動詞則常見於「解釋」或「佔比例」。"],"forms":["account","accounts","accounting","accounted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"loyalty","pos":"n.","meaning":"忠誠度","phrase":"customer loyalty","category":"銷售與客戶","id":"w0286","number":286,"examples":[{"en":"Good service can build customer loyalty.","zh":"良好的服務可以建立顧客忠誠度。"},{"en":"The company values employee loyalty and offers incentives for long-term commitment.","zh":"公司重視員工的忠誠度，並提供長期承諾的獎勵。"}],"tips":["常見搭配詞：在多益考試中常出現於行銷與客戶關係管理場景，如 customer loyalty (客戶忠誠度)、brand loyalty (品牌忠誠度)、loyalty program (忠誠度計畫/會員集點計畫) 以及 reward customer loyalty (回饋客戶忠誠度)。"],"forms":["loyalty","loyalties"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"satisfaction","pos":"n.","meaning":"滿意度","phrase":"customer satisfaction","category":"銷售與客戶","id":"w0287","number":287,"examples":[{"en":"Customer satisfaction is our main goal.","zh":"顧客滿意是我們的主要目標。"},{"en":"Customer satisfaction is our top priority, and we strive to exceed expectations.","zh":"客戶滿意度是我們的首要任務，我們努力超越期望。"}],"tips":["核心搭配詞組：多益最常考「customer satisfaction survey」（顧客滿意度調查）以及「guarantee satisfaction」（保證滿意），特別是在廣告與客服情境。"],"forms":["satisfaction","satisfactions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"complaint","pos":"n.","meaning":"客訴；抱怨","phrase":"customer complaint","category":"銷售與客戶","id":"w0288","number":288,"examples":[{"en":"Your complaint will be reviewed today.","zh":"你的客訴將在今天審閱。"},{"en":"We received a complaint about the delayed shipment.","zh":"我們收到了一份關於延遲交貨的投訴。"}],"tips":["常見搭配詞：正式用法中常搭配動詞 file、lodge 或 make，例如「file a complaint against someone」。處理投訴則使用 handle、address 或 resolve a complaint。"],"forms":["complaint","complaints","complains","complaining","complained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"complain","pos":"v.","meaning":"抱怨；投訴","phrase":"complain about a service","category":"銷售與客戶","id":"w0289","number":289,"examples":[{"en":"You can complain to the service manager.","zh":"你可以向客服經理投訴。"},{"en":"Several customers have complained about the long waiting times.","zh":"許多客戶抱怨了漫長的等待時間。"}],"tips":["介系詞用法：complain 常與 about 連用表示抱怨的內容，或與 to 連用表示抱怨的對象。"],"forms":["complain","complains","complaining","complained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"inquiry","pos":"n.","meaning":"詢問；查詢","phrase":"customer inquiry","category":"銷售與客戶","id":"w0290","number":290,"examples":[{"en":"Your inquiry will be answered shortly.","zh":"你的詢問將很快得到回覆。"},{"en":"We received an inquiry regarding the product's warranty.","zh":"我們收到了一份關於產品保固的詢問。"}],"tips":["常見搭配詞組：慣用語包括 'make an inquiry' (進行詢問)、'receive an inquiry' (收到查詢) 以及 'general inquiry' (一般性諮詢)。在商業信件開頭常看到 'Thank you for your inquiry about...'。"],"forms":["inquiry","inquiries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"assistance","pos":"n.","meaning":"協助；幫助","phrase":"provide assistance","category":"銷售與客戶","id":"w0291","number":291,"examples":[{"en":"Assistance is available at the front desk.","zh":"櫃檯可以提供協助。"},{"en":"The IT department provides technical assistance to all employees.","zh":"資訊部門為所有員工提供技術支援。"}],"tips":["常用搭配詞組：此單字最常與動詞 provide, offer, require 連用。例如：'provide technical assistance' (提供技術支援) 或 'If you require further assistance' (如果您需要進一步協助)。"],"forms":["assistance","assistances"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"assist","pos":"v.","meaning":"協助","phrase":"assist a customer","category":"銷售與客戶","id":"w0292","number":292,"examples":[{"en":"Our staff can assist you with the order.","zh":"我們的員工可以協助你處理訂單。"},{"en":"The junior staff members assist the senior managers with their daily tasks.","zh":"初級員工協助資深經理處理他們的日常工作。"}],"tips":["常見搭配詞：'assist with + 事物'（協助處理某事）或 'assist someone in doing something'（協助某人做某事），TOEIC 閱讀中常考介系詞 with 的搭配。"],"forms":["assist","assists","assisting","assisted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"serve","pos":"v.","meaning":"服務；接待","phrase":"serve customers","category":"銷售與客戶","id":"w0293","number":293,"examples":[{"en":"We can serve the next customer now.","zh":"我們現在可以服務下一位顧客。"},{"en":"Our company serves over 10,000 customers worldwide.","zh":"我們公司在全球服務超過一萬名客戶。"}],"tips":["常用搭配詞與介係詞：'serve as' 表示「擔任某職位」或「充當某用途」，例如 'serve as a consultant' (擔任顧問)；'serve on' 則用於委員會或董事會，如 'serve on the board of directors'。"],"forms":["serve","serves","serving","served"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"resolve","pos":"v.","meaning":"解決","phrase":"resolve a complaint","category":"銷售與客戶","id":"w0294","number":294,"examples":[{"en":"We can resolve the problem by tomorrow.","zh":"我們可以在明天前解決問題。"},{"en":"The manager worked diligently to resolve the conflict between the two employees.","zh":"經理努力工作，以解決兩名員工之間的衝突。"}],"tips":["常見搭配詞與情境：在 TOEIC 中常以 'resolve a dispute' (解決糾紛)、'resolve an issue' (解決問題) 或 'resolve a conflict' (化解衝突) 出現，特別常出現在客服回覆、人力資源管理或法律合約情境中。"],"forms":["resolve","resolves","resolving","resolved"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"replace","pos":"v.","meaning":"更換；替換","phrase":"replace a defective item","category":"銷售與客戶","id":"w0295","number":295,"examples":[{"en":"We will replace the damaged item.","zh":"我們會更換損壞的商品。"},{"en":"We need to replace the faulty printer before the end of the day.","zh":"我們需要在今天結束前更換故障的印表機。"}],"tips":["常見搭配詞與介系詞：最常出現在 Part 5 的考點是「replace A with B」（用 B 取代 A），需注意與介系詞 with 的連用。"],"forms":["replace","replaces","replacing","replaced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"retain","pos":"v.","meaning":"留住；保留","phrase":"retain customers","category":"銷售與客戶","id":"w0296","number":296,"examples":[{"en":"Good service can help us retain customers.","zh":"良好的服務可以幫助我們留住顧客。"},{"en":"Please retain all documents related to this project for auditing purposes.","zh":"請保留與此專案相關的所有文件，以供審計之用。"}],"tips":["常見搭配詞組：多益考試中常出現 retain staff/employees (留住員工)、retain customers (留住顧客)、retain original receipts (保留收據正本) 以及 retain a lawyer (聘請/留任律師)。"],"forms":["retain","retains","retaining","retained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accommodate","pos":"v.","meaning":"配合；滿足需求","phrase":"accommodate a request","category":"銷售與客戶","id":"w0297","number":297,"examples":[{"en":"We can accommodate your request.","zh":"我們可以配合你的要求。"},{"en":"Our flexible schedule can accommodate your team's availability.","zh":"我們的彈性排程可以滿足貴團隊的時間安排。"}],"tips":["多重含義辨析：在多益中主要有「提供住宿/空間」與「滿足需求/配合」兩種意思。考題若出現 accommodate a request，意指「滿足/配合請求」而非提供住宿。"],"forms":["accommodate","accommodates","accommodating","accommodated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"available","pos":"adj.","meaning":"可取得的；有貨的","phrase":"currently available","category":"銷售與客戶","id":"w0298","number":298,"examples":[{"en":"The room is available this weekend.","zh":"這個房間本週末可以使用。"},{"en":"We are available to discuss your proposal at your earliest convenience.","zh":"我們很樂意在您方便時討論您的提案。"}],"tips":["常見搭配詞：常用於 'be available for + 事物' (例如：available for a meeting) 或 'be available to + 動詞' (例如：available to attend)。"],"forms":["available","more available","most available"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"popular","pos":"adj.","meaning":"受歡迎的","phrase":"popular product","category":"銷售與客戶","id":"w0299","number":299,"examples":[{"en":"This product is popular with travelers.","zh":"這項產品很受旅客歡迎。"},{"en":"Our new product is becoming increasingly popular among young consumers.","zh":"我們的最新產品在年輕消費者中越來越受歡迎。"}],"tips":["常見搭配詞：在 TOEIC 考試中常考介系詞搭配，如 'popular with' 或 'popular among'，表示受某群體歡迎；此外也常出現 'popular choice' (熱門選擇) 或 'prove popular' (證明受歡迎)。"],"forms":["popular","more popular","most popular"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"competitive","pos":"adj.","meaning":"有競爭力的","phrase":"competitive price","category":"銷售與客戶","id":"w0300","number":300,"examples":[{"en":"Our prices are competitive.","zh":"我們的價格有競爭力。"},{"en":"Our company offers competitive prices to attract more customers.","zh":"我們公司提供具競爭力的價格以吸引更多客戶。"}],"tips":["常見搭配詞：'competitive edge' (競爭優勢)、'competitive salary' (具競爭力的薪資)、'competitive prices' (具競爭力的價格/低廉的價格)。"],"forms":["competitive","more competitive","most competitive"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bank","pos":"n.","meaning":"銀行","phrase":"local bank","category":"金融與銀行","id":"w0301","number":301,"examples":[{"en":"The bank is across the street.","zh":"銀行就在街道對面。"},{"en":"We need to open a bank account to manage our international payments.","zh":"我們需要開立銀行帳戶以管理我們的國際支付。"}],"tips":["多重詞義辨析：除了最常見的「銀行」外，在多益聽力中偶爾會出現「河岸」的意思。此外，動詞短語「bank on」表示「依靠」或「指望」，常出現在商務對話中表示對某個計畫或結果的期待。"],"forms":["bank","banks","banking","banked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"banking","pos":"n.","meaning":"銀行業務","phrase":"online banking","category":"金融與銀行","id":"w0302","number":302,"examples":[{"en":"Online banking is available all day.","zh":"網路銀行全天可以使用。"},{"en":"The company is seeking a consultant with expertise in international banking regulations.","zh":"公司正在尋找一位在國際銀行法規方面有專業知識的顧問。"}],"tips":["常見搭配詞組 (Collocations)：在多益中常出現 'online banking' (網路銀行)、'banking hours' (銀行營業時間)、'banking transaction' (銀行交易) 以及 'investment banking' (投資銀行業)。熟悉這些詞組有助於快速掌握聽力對話的主題。"],"forms":["banking","banks"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"finance","pos":"n./v.","meaning":"財務；融資","phrase":"finance a project","category":"金融與銀行","id":"w0303","number":303,"examples":[{"en":"The bank can finance the project.","zh":"銀行可以為這個專案提供融資。"},{"en":"The finance department will prepare the quarterly budget report by next Monday.","zh":"財務部門將於下週一前完成本季預算報告的編製。"}],"tips":["詞性雙重身分：finance 在 TOEIC 中常作為名詞（財政、金融、資金）與動詞（提供資金）。作為動詞時，常出現在 Part 7 關於企業擴張或新計畫的報導中。"],"forms":["finance","finances","financing","financed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"financial","pos":"adj.","meaning":"財務的；金融的","phrase":"financial report","category":"金融與銀行","id":"w0304","number":304,"examples":[{"en":"The financial report is ready.","zh":"財務報告已準備好。"},{"en":"The company is facing a financial crisis due to declining sales.","zh":"由於銷售額下降，該公司正面臨財務危機。"}],"tips":["常見搭配詞組：financial statements (財務報表)、financial advisor (財務顧問)、financial year (會計年度) 與 financial support (財務支援)。這些詞組頻繁出現在閱讀測驗的商業報導與書信中。"],"forms":["financial","more financial","most financial"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"investment","pos":"n.","meaning":"投資","phrase":"make an investment","category":"金融與銀行","id":"w0305","number":305,"examples":[{"en":"This investment is part of our long-term plan.","zh":"這項投資是我們長期計畫的一部分。"},{"en":"The company is considering a significant investment in renewable energy.","zh":"公司正在考慮對再生能源進行一項重大投資。"}],"tips":["固定搭配與介係詞：investment 之後常接介係詞 'in'，表示投資於某領域，如 'investment in new technology'。常見片語包含 'make an investment' (進行投資) 與 'return on investment (ROI)' (投資報酬率)。"],"forms":["investment","investments","invests","investing","invested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"invest","pos":"v.","meaning":"投資","phrase":"invest in a company","category":"金融與銀行","id":"w0306","number":306,"examples":[{"en":"The company will invest in new equipment.","zh":"公司將投資新設備。"},{"en":"Investors are encouraged to invest wisely to maximize their returns.","zh":"鼓勵投資者審慎投資，以最大化回報。"}],"tips":["常見搭配詞與介系詞：invest 最常接介系詞 in，形成 invest in something (如：invest in stocks, invest in new technology)，在 Part 5 填空題中，介系詞 in 是極高頻的考點。"],"forms":["invest","investments","invests","investing","invested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"investor","pos":"n.","meaning":"投資者","phrase":"potential investor","category":"金融與銀行","id":"w0307","number":307,"examples":[{"en":"The investor is asking for more information.","zh":"投資者正在要求更多資訊。"},{"en":"The company is seeking new investors to fund its expansion plans.","zh":"該公司正在尋找新的投資者來資助其擴張計劃。"}],"tips":["常見搭配詞：包括 potential investor (潛在投資者)、institutional investor (機構投資人)、attract investors (吸引投資者)。"],"forms":["investor","investors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fund","pos":"n./v.","meaning":"資金；提供資金","phrase":"investment fund","category":"金融與銀行","id":"w0308","number":308,"examples":[{"en":"The fund will support small businesses.","zh":"這筆基金將支持小型企業。"},{"en":"The project is currently being funded by a government grant.","zh":"該項目目前由政府補助金資助。"}],"tips":["詞性與多義性辨析：fund 可作為名詞意為「資金」或「基金」，亦可作為動詞意為「資助」或「為...提供資金」。在 TOEIC 閱讀 Part 5 中，需根據句子結構判斷其詞性，例如在 'The project is fully funded' 中為動詞用法。"],"forms":["fund","funds","funding","funded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"capital","pos":"n.","meaning":"資本；資金","phrase":"raise capital","category":"金融與銀行","id":"w0309","number":309,"examples":[{"en":"More capital is needed for the expansion.","zh":"擴張需要更多資金。"},{"en":"The company's capital investment in research and development is crucial for innovation.","zh":"公司在研發方面的資本投入對於創新至關重要。"}],"tips":["多重字義辨析：在多益考試中，capital 最常作為『資金、資本』使用，如 working capital (營運資金) 或 venture capital (風險投資)；其次為『大寫字母』及『首都』。"],"forms":["capital","capitals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"asset","pos":"n.","meaning":"資產","phrase":"company assets","category":"金融與銀行","id":"w0310","number":310,"examples":[{"en":"The building is a company asset.","zh":"這棟建築物是公司資產。"},{"en":"The company's most valuable asset is its skilled workforce.","zh":"公司最寶貴的資產是其技術熟練的員工。"}],"tips":["常見搭配詞：'valuable asset' (寶貴資產) 常用於形容員工，'liquid asset' (流動資產) 指現金或易變現物，'fixed asset' (固定資產) 如地產或大型設備。"],"forms":["asset","assets"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"liability","pos":"n.","meaning":"負債；責任","phrase":"financial liabilities","category":"金融與銀行","id":"w0311","number":311,"examples":[{"en":"The loan is recorded as a liability.","zh":"這筆貸款被記錄為負債。"},{"en":"The company's total liabilities include accounts payable and outstanding loans.","zh":"該公司的總負債包括應付帳款和未償貸款。"}],"tips":["財務會計核心概念：在多益閱讀 Part 7 的商業報表中，'liabilities' (複數) 常指出『負債』，與 'assets' (資產) 相對，是資產負債表 (Balance Sheet) 中的固定項目。"],"forms":["liability","liabilities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"loan","pos":"n.","meaning":"貸款","phrase":"apply for a loan","category":"金融與銀行","id":"w0312","number":312,"examples":[{"en":"Your loan application is under review.","zh":"你的貸款申請正在審核中。"},{"en":"Please submit your loan application with all required documents.","zh":"請提交包含所有所需文件的貸款申請。"}],"tips":["常見搭配詞：常用於 'take out a loan' (辦理貸款)、'apply for a loan' (申請貸款)、'loan application' (貸款申請書) 以及 'repay/settle a loan' (償還貸款)。"],"forms":["loan","loans","loaning","loaned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"mortgage","pos":"n.","meaning":"房屋貸款；抵押貸款","phrase":"mortgage payment","category":"金融與銀行","id":"w0313","number":313,"examples":[{"en":"The mortgage payment is due on Monday.","zh":"房貸款項星期一到期。"},{"en":"The company is offering low mortgage rates to attract new homebuyers.","zh":"該公司正在提供低利率的房貸，以吸引新的購房者。"}],"tips":["常見搭配詞組：常用動詞如 apply for a mortgage (申請房貸)、take out a mortgage (辦理貸款)、pay off a mortgage (還清貸款)；名詞搭配則有 mortgage rate (房貸利率) 與 fixed-rate/adjustable-rate mortgage (固定/浮動利率房貸)。"],"forms":["mortgage","mortgages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"interest","pos":"n.","meaning":"利息","phrase":"interest rate","category":"金融與銀行","id":"w0314","number":314,"examples":[{"en":"The interest rate is fixed for one year.","zh":"利率固定一年。"},{"en":"The bank charges interest on overdue accounts.","zh":"銀行對逾期帳戶收取利息。"}],"tips":["多義性辨析：在多益中常考兩大意涵：一是「興趣」或「愛好」，二是「利息」或「利益」。例如 \"interest rate\"（利率）是金融情境的高頻詞彙。"],"forms":["interest","interests","interesting","interested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"rate","pos":"n.","meaning":"比率；利率","phrase":"exchange rate","category":"金融與銀行","id":"w0315","number":315,"examples":[{"en":"The exchange rate is shown on the screen.","zh":"匯率顯示在螢幕上。"},{"en":"The hotel offers a competitive rate for long-term stays.","zh":"該酒店為長期住宿提供具有競爭力的費率。"}],"tips":["多重詞義與場景：在多益中「rate」常作為名詞使用，意指「費率」或「費用」，常見於 interest rate (利率)、exchange rate (匯率) 及 shipping rate (運費)；亦可指「速度」，如 at an alarming rate (以驚人的速度)。"],"forms":["rate","rates","rating","rated","higher","highest"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"credit","pos":"n.","meaning":"信用；貸方","phrase":"credit card","category":"金融與銀行","id":"w0316","number":316,"examples":[{"en":"You can pay with a credit card.","zh":"你可以使用信用卡付款。"},{"en":"The company offers credit terms of 30 days to its clients.","zh":"公司向客戶提供 30 天的信用期限。"}],"tips":["多樣化語意：在 TOEIC 中，credit 可作為名詞代表『信用』、『學分』、『入帳額度』，或作為動詞代表『撥入款項』、『歸功於』。"],"forms":["credit","credits","crediting","credited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"debit","pos":"n.","meaning":"借方；扣款","phrase":"debit card","category":"金融與銀行","id":"w0317","number":317,"examples":[{"en":"Your debit card is ready to collect.","zh":"你的金融卡可以領取了。"},{"en":"The bank will debit your account for the invoice amount.","zh":"銀行將從您的帳戶中扣除發票金額。"}],"tips":["常見搭配詞與短語：'debit card' (提款卡/借記卡) 是最常見的詞彙；'direct debit' 指定期自動扣款授權，常出現在帳單支付或銀行服務描述中；'debit balance' 則指帳戶呈現借方餘額（通常為負數或支出）。"],"forms":["debit","debits","debiting","debited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"deposit","pos":"n./v.","meaning":"存款；存入","phrase":"make a deposit","category":"金融與銀行","id":"w0318","number":318,"examples":[{"en":"You can make a deposit at this machine.","zh":"你可以在這台機器存款。"},{"en":"The client deposited a security deposit before the equipment was shipped.","zh":"客戶在設備發貨前已繳納保證金。"}],"tips":["多重詞性與語意：在TOEIC中，該字常作為名詞指「存款」或「押金」，亦可作為動詞指「存入金錢」。在租賃情境中，security deposit（押金）是極高頻出現的詞組。"],"forms":["deposit","deposits","depositing","deposited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"withdraw","pos":"v.","meaning":"提款；提領","phrase":"withdraw money","category":"金融與銀行","id":"w0319","number":319,"examples":[{"en":"You can withdraw cash here.","zh":"你可以在這裡提領現金。"},{"en":"The company decided to withdraw its merger offer.","zh":"該公司決定撤回其合併提議。"}],"tips":["金融銀行情境：此單字在多益中最常見於銀行交易，表示「提款」，常見搭配詞為 'withdraw money from an account'，其反義詞為 'deposit' (存款)。"],"forms":["withdraws","withdrew","withdrawn","withdrawing"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"withdrawal","pos":"n.","meaning":"提款；提領","phrase":"cash withdrawal","category":"金融與銀行","id":"w0320","number":320,"examples":[{"en":"The withdrawal is shown on your statement.","zh":"這筆提款顯示在你的對帳單上。"},{"en":"The bank processed the client's large withdrawal request within standard security protocols.","zh":"銀行在標準安全協議內處理了客戶的大額withdrawal請求。"}],"tips":["銀行金融情境：在多益中最常見於銀行交易，固定片語為 \"make a withdrawal\" (提款)，對義詞為 \"make a deposit\" (存款)，常出現在聽力 Part 3 櫃檯對話或閱讀 Part 7 帳單說明中。"],"forms":["withdrawal"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"balance","pos":"n.","meaning":"餘額；結餘","phrase":"account balance","category":"金融與銀行","id":"w0321","number":321,"examples":[{"en":"Your account balance is shown below.","zh":"你的帳戶餘額顯示在下方。"},{"en":"The company needs to balance its budget to ensure profitability.","zh":"公司需要平衡預算以確保盈利能力。"}],"tips":["帳務與金融核心語意：在 TOEIC 閱讀及聽力測驗中，balance 最常出現的含義是「帳戶餘額」或「未結清的款項」。常見搭配詞包含 bank balance (銀行餘額)、outstanding balance (未付餘額)、remaining balance (剩餘餘額)，常出現在銀行對帳單或催款信函中。"],"forms":["balance","balances","balancing","balanced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cash","pos":"n.","meaning":"現金","phrase":"pay in cash","category":"金融與銀行","id":"w0322","number":322,"examples":[{"en":"You can pay in cash.","zh":"你可以付現金。"},{"en":"We prefer to receive payment in cash for large orders.","zh":"我們喜歡收到大訂單的現金付款。"}],"tips":["常見搭配詞組：'cash flow' (現金流量) 常出現在閱讀測驗的財務報表中；'petty cash' (零用金) 則常在辦公室行政情境中提及；'cash on delivery' (COD, 貨到付款) 是電子商務情境的重點詞彙。"],"forms":["cash"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"currency","pos":"n.","meaning":"貨幣","phrase":"foreign currency","category":"金融與銀行","id":"w0323","number":323,"examples":[{"en":"You can exchange currency at the airport.","zh":"你可以在機場兌換貨幣。"},{"en":"Which currency do you accept?","zh":"你們接受哪一種貨幣？"}],"tips":["常見搭配詞組：此單字最常出現在 'foreign currency' (外幣)、'currency exchange' (貨幣兌換) 及 'currency fluctuation' (匯率波動) 等詞組中。"],"forms":["currency","currencies"],"exampleSource":"Wordstep original examples"},{"word":"conversion","pos":"n.","meaning":"兌換；轉換","phrase":"currency conversion","category":"金融與銀行","id":"w0324","number":324,"examples":[{"en":"A conversion fee is included in the total.","zh":"總額中包含兌換手續費。"},{"en":"Department heads discussed the conversion strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了conversion策略。"}],"tips":["常見搭配詞：在行銷領域常考 'conversion rate' (轉化率)，指潛在客戶變為實際購買者的比例；在金融或商務旅行情境中則有 'currency conversion' (貨幣兌換)。"],"forms":["conversion"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dollar","pos":"n.","meaning":"美元；元","phrase":"U.S. dollar","category":"金融與銀行","id":"w0325","number":325,"examples":[{"en":"The dollar amount is written on the form.","zh":"美元金額寫在表格上。"},{"en":"Please remit payment in US dollars.","zh":"請以美元付款。"}],"tips":["常見搭配詞與商業用法：在 TOEIC 考試中，dollar 常與強弱勢相關的形容詞連用，例如 strong dollar (強勢美元) 或 weak dollar (弱勢美元)，這在 Part 7 經濟新聞報導中非常常見，用來討論匯率對進出口貿易的影響。"],"forms":["dollar","dollars"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"amount","pos":"n.","meaning":"金額；數量","phrase":"total amount","category":"金融與銀行","id":"w0326","number":326,"examples":[{"en":"The amount is correct.","zh":"金額是正確的。"},{"en":"Please submit an amount of your expenses for reimbursement.","zh":"請提交您的費用總額以供報銷。"}],"tips":["搭配不可數名詞：amount 僅能與不可數名詞（如 money, time, information, data）連用，而 number 則用於可數名詞，這是 Part 5 常考的語法陷阱。"],"forms":["amount","amounts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"check","pos":"n.","meaning":"支票","phrase":"write a check","category":"金融與銀行","id":"w0327","number":327,"examples":[{"en":"You can pay by check.","zh":"你可以使用支票付款。"},{"en":"Please check the invoice for any discrepancies before making payment.","zh":"付款前，請核對發票是否有任何差異。"}],"tips":["多重詞義辨析：在 TOEIC 中，'check' 作動詞時最常表示『核對、檢查』，如 'check the schedule' (核對行程)；作名詞時則常出現在餐廳情境指『帳單』(The check, please.)，或金融情境指『支票』(pay by check)。"],"forms":["check","checks","checking","checked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"savings","pos":"n.","meaning":"存款；儲蓄","phrase":"savings account","category":"金融與銀行","id":"w0328","number":328,"examples":[{"en":"Your savings are in a separate account.","zh":"你的存款在另一個帳戶裡。"},{"en":"The company is encouraging employees to increase their retirement savings.","zh":"公司鼓勵員工增加退休儲蓄。"}],"tips":["常見搭配詞組：'savings account' (儲蓄帳戶)、'cost savings' (節省成本)、'substantial/significant savings' (大幅節省)。在多益中，這些詞組常出現在銀行廣告、公司財務報表或成本控制的會議記錄中。"],"forms":["savings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"checking","pos":"n.","meaning":"支票帳戶業務","phrase":"checking account","category":"金融與銀行","id":"w0329","number":329,"examples":[{"en":"I would like to open a checking account.","zh":"我想開立一個支票帳戶。"},{"en":"Please deposit the money into my checking account.","zh":"請把這筆錢存進我的支票帳戶。"}],"tips":["最常見搭配為「checking account」(支票/活期帳戶)，常與「savings account」(儲蓄帳戶)在銀行情境中對比出現。"],"forms":["checking","checks","checked"],"exampleSource":"Wordstep original examples"},{"word":"statement","pos":"n.","meaning":"對帳單；報表","phrase":"bank statement","category":"金融與銀行","id":"w0330","number":330,"examples":[{"en":"Your bank statement is ready to download.","zh":"你的銀行對帳單可以下載了。"},{"en":"The company released a public statement addressing the recent product recall.","zh":"該公司發布了一份公開聲明，說明了最近的產品召回事件。"}],"tips":["常見搭配詞：bank statement (銀行對帳單)、financial statement (財務報表)、press statement (新聞稿)、mission statement (企業宗旨)。"],"forms":["statement","statements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"institution","pos":"n.","meaning":"機構","phrase":"financial institution","category":"金融與銀行","id":"w0331","number":331,"examples":[{"en":"This institution is a local bank.","zh":"這家機構是一間本地銀行。"},{"en":"She is a respected researcher at a leading financial institution.","zh":"她是領先的金融機構中一位受人尊敬的研究人員。"}],"tips":["常見搭配詞：在多益中最常出現的是 'financial institution' (金融機構)，此外還有 'educational institution' (教育機構) 或 'public institution' (公共機構)。"],"forms":["institution","institutions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lender","pos":"n.","meaning":"貸款方；放款人","phrase":"mortgage lender","category":"金融與銀行","id":"w0332","number":332,"examples":[{"en":"The lender will review the application.","zh":"貸款方將審核申請。"},{"en":"The bank acts as a lender for home mortgages.","zh":"這家銀行是房屋抵押貸款的出借人。"}],"tips":["常見搭配詞組：'mortgage lender' (房貸貸方)、'private lender' (私營貸款機構) 與 'commercial lender' (商業貸款銀行)。"],"forms":["lender","lenders"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"borrower","pos":"n.","meaning":"借款人","phrase":"qualified borrower","category":"金融與銀行","id":"w0333","number":333,"examples":[{"en":"The borrower is responsible for the monthly payments.","zh":"借款人負責每月還款。"},{"en":"The borrower must repay the loan by the agreed-upon date.","zh":"借款人必須在約定日期前償還貸款。"}],"tips":["常見搭配詞：'individual borrower' (個人借款人)、'corporate borrower' (企業借款人) 及 'potential borrower' (潛在借款人)。此外，'borrower's creditworthiness' (借款人的信用狀況) 是銀行貸款情境中的常見組合。"],"forms":["borrower","borrowers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"debt","pos":"n.","meaning":"債務","phrase":"repay a debt","category":"金融與銀行","id":"w0334","number":334,"examples":[{"en":"The debt will be repaid next year.","zh":"這筆債務將於明年償還。"},{"en":"The company is struggling with a large amount of debt.","zh":"這家公司正為巨額債務所苦。"}],"tips":["聽力發音重點：單字中的字母 b 不發音，正確發音為 /det/，在聽力 Part 3 與 Part 4 中若聽出 /deb-t/ 會造成解讀錯誤。"],"forms":["debts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"owe","pos":"v.","meaning":"欠款；欠","phrase":"owe money","category":"金融與銀行","id":"w0335","number":335,"examples":[{"en":"You still owe the store ten dollars.","zh":"你還欠商店十美元。"},{"en":"We need to owe this carefully.","zh":"我們需要仔細欠。"}],"tips":["常見句型與搭配：主要用法為 'owe someone something' 或 'owe something to someone'。在多益考試中常出現在財務報表或發票通知，如 'the amount owed' (欠款金額)。"],"forms":["owe","owes","owing","owed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"repay","pos":"v.","meaning":"償還","phrase":"repay a loan","category":"金融與銀行","id":"w0336","number":336,"examples":[{"en":"We can repay the loan early.","zh":"我們可以提早償還貸款。"},{"en":"I will repay your kindness someday.","zh":"我有一天會報答你的恩情。"}],"tips":["常見搭配詞組：常用於金融與法律情境，最常見的受詞包括 loan (貸款)、debt (債務)、mortgage (抵押貸款) 或 interest (利息)。"],"forms":["repays","repaying","repaid"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"secure","pos":"v./adj.","meaning":"取得；有保障的","phrase":"secure financing","category":"金融與銀行","id":"w0337","number":337,"examples":[{"en":"The company will secure funding for the project.","zh":"公司將為專案取得資金。"},{"en":"Please secure your presentation files on the cloud storage for easy access.","zh":"請將您的簡報檔案保存在雲端儲存空間，以便輕鬆存取。"}],"tips":["多重詞性考點：secure 在 TOEIC 中常同時作為動詞與形容詞考查。作為動詞時，常見於商務合約或金融情境，意為『獲得』或『取得』（如 secure a contract, secure a loan）；作為形容詞則代表『安全的』或『穩定的』。"],"forms":["secure","secures","securing","secured","more secure","most secure"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"wealth","pos":"n.","meaning":"財富","phrase":"wealth management","category":"金融與銀行","id":"w0338","number":338,"examples":[{"en":"The report is about wealth management.","zh":"這份報告是關於財富管理。"},{"en":"Accumulating wealth requires careful financial planning and consistent investment.","zh":"累積財富需要仔細的財務規劃和持續的投資。"}],"tips":["常見搭配詞：常以「a wealth of + 名詞」的結構出現，意為「大量的」或「豐富的」（如 a wealth of experience/information），在閱讀測驗中可作為 plenty of 的高級替換詞。"],"forms":["wealth","wealths"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"portfolio","pos":"n.","meaning":"投資組合","phrase":"investment portfolio","category":"金融與銀行","id":"w0339","number":339,"examples":[{"en":"The portfolio includes several different companies.","zh":"這個投資組合包含幾家不同的公司。"},{"en":"The applicant should submit a portfolio showcasing their design skills.","zh":"申請人應提交一份作品集，展示其設計技能。"}],"tips":["常見搭配詞：'investment portfolio' (投資組合)、'product portfolio' (產品系列)以及'diversified portfolio' (多元化組合)。"],"forms":["portfolio","portfolios"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"stock","pos":"n.","meaning":"股票","phrase":"stock market","category":"金融與銀行","id":"w0340","number":340,"examples":[{"en":"The stock price is lower today.","zh":"今天的股價比較低。"},{"en":"The company's stock price surged after the announcement of record profits.","zh":"公司在宣布創紀錄利潤後，股價大幅上漲。"}],"tips":["雙重語義辨析：在 TOEIC 中 stock 最常出現的兩個意思是「股票」與「存貨」。在金融情境如財報或投資分析中指股份，而在零售或物流情境如訂單確認信中則指庫存。"],"forms":["stock","stocks","stocking","stocked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"share","pos":"n.","meaning":"股份；股票","phrase":"company shares","category":"金融與銀行","id":"w0341","number":341,"examples":[{"en":"Each share is worth ten dollars in this example.","zh":"在這個例子中每股價值十美元。"},{"en":"Please share your presentation slides with the team after the meeting.","zh":"會議結束後，請與團隊分享您的簡報文件。"}],"tips":["商業名詞用法：在 TOEIC 閱讀與聽力中，share 常指「股份」或「股票」。常見詞組如 market share (市場佔有率) 與 share price (股價)，考生應將其視為金融與公司營運情境的關鍵詞。"],"forms":["share","shares","sharing","shared"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bond","pos":"n.","meaning":"債券","phrase":"government bond","category":"金融與銀行","id":"w0342","number":342,"examples":[{"en":"The bond will mature next year.","zh":"這張債券將於明年到期。"},{"en":"The company issued new bonds to finance its expansion plans.","zh":"該公司發行新的債券以資助其擴張計劃。"}],"tips":["財務與金融情境：在TOEIC閱讀測驗（尤其是Part 7）中，bond最常用於指「債券」，如government bond（公債）或corporate bond（公司債）。考生應能區分其與stock（股票）的差異：債券代表借貸關係，而股票代表所有權。"],"forms":["bond","bonds","bonding","bonded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dividend","pos":"n.","meaning":"股利；股息","phrase":"pay a dividend","category":"金融與銀行","id":"w0343","number":343,"examples":[{"en":"The dividend will be paid in June.","zh":"股利將於六月發放。"},{"en":"The board declared a quarterly dividend of $0.75 per share.","zh":"董事會宣布每股0.75美元的季度dividend。"}],"tips":["常見搭配詞與結構：在 TOEIC 閱讀中常出現 'pay/distribute a dividend' (發放股利)、'dividend yield' (股息殖利率) 及 'quarterly dividend' (每季股息)。當文章提及 'shareholders' (股東) 或 'stockholders' 時，'dividend' 是極高頻出現的相關詞彙。"],"forms":["dividend"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"yield","pos":"n./v.","meaning":"收益；產生收益","phrase":"investment yield","category":"金融與銀行","id":"w0344","number":344,"examples":[{"en":"The yield is shown in the report.","zh":"收益率顯示在報告中。"},{"en":"The factory's annual yield of widgets increased by 15% this year.","zh":"今年工廠的零件產量增加了 15%。"}],"tips":["多義性辨析：在多益中，yield 作為動詞最常表示「產生、產出（利潤、結果）」，作為名詞則指「產量、收益、殖利率」。但在交通情境中，意為「讓路」。"],"forms":["yield","yields","yielding","yielded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"economy","pos":"n.","meaning":"經濟","phrase":"global economy","category":"金融與銀行","id":"w0345","number":345,"examples":[{"en":"The economy is growing slowly.","zh":"經濟正在緩慢成長。"},{"en":"A strong domestic economy has increased demand for our products.","zh":"強勁的國內經濟提升了我們產品的需求。"}],"tips":["辨析形容詞用法：'economic' 指與經濟、產業相關的（如 economic growth 經濟成長），而 'economical' 則指節省的、實惠的（如 an economical car 省油的車），此區別在 Part 5 詞彙辨析題中是常考重點。"],"forms":["economy","economies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"economic","pos":"adj.","meaning":"經濟的","phrase":"economic growth","category":"金融與銀行","id":"w0346","number":346,"examples":[{"en":"Economic conditions are changing.","zh":"經濟情況正在改變。"},{"en":"The economic downturn has led to a decrease in consumer spending.","zh":"經濟衰退導致消費者支出減少。"}],"tips":["嚴格區分 economic 與 economical：這是 TOEIC 最常見的陷阱題。economic 意指「經濟上的、與經濟相關的」，常用於宏觀層面（如 economic growth）；而 economical 則指「節約的、省錢的、划算的」（如 an economical car）。"],"forms":["economic","more economic","most economic"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"inflation","pos":"n.","meaning":"通貨膨脹","phrase":"inflation rate","category":"金融與銀行","id":"w0347","number":347,"examples":[{"en":"Inflation is discussed in this article.","zh":"這篇文章討論了通貨膨脹。"},{"en":"The company is closely monitoring inflation rates to adjust pricing strategies.","zh":"公司正密切關注通貨膨脹率，以調整定價策略。"}],"tips":["常見搭配詞組：'inflation rate' (通貨膨脹率)、'combat/curb inflation' (抑制通膨) 及 'skyrocketing inflation' (飆升的通膨)。"],"forms":["inflation","inflations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fluctuate","pos":"v.","meaning":"波動；起伏","phrase":"prices fluctuate","category":"金融與銀行","id":"w0348","number":348,"examples":[{"en":"Prices can fluctuate throughout the year.","zh":"價格可能在一年之中波動。"},{"en":"The stock market often fluctuates due to global economic factors.","zh":"由於全球經濟因素，股市經常波動。"}],"tips":["常見搭配詞與語法：常與介系詞 between 或 from...to... 連用，例如 'fluctuate between 10% and 20%'；副詞常搭配 wildly（劇烈地）或 slightly（稍微地）。"],"forms":["fluctuate","fluctuates","fluctuating","fluctuated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"decline","pos":"n./v.","meaning":"下降；減少","phrase":"decline in sales","category":"金融與銀行","id":"w0349","number":349,"examples":[{"en":"There is a decline in demand.","zh":"需求正在下降。"},{"en":"The company declined the offer due to budget constraints.","zh":"由於預算限制，公司婉拒了這項提議。"}],"tips":["雙重語義辨析：在多益考試中，decline 同時具備『下降/衰退』與『婉拒/拒絕』兩種完全不同的意義。在閱讀測驗 Part 7 的商業報告中常指數據下降（如 a decline in profits），而在 Part 5 或 Part 6 的商務書信中則常用於禮貌性地拒絕邀請或提議（如 decline an offer）。"],"forms":["decline","declines","declining","declined"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"recover","pos":"v.","meaning":"復甦；恢復","phrase":"economy recovers","category":"金融與銀行","id":"w0350","number":350,"examples":[{"en":"The business can recover from the loss.","zh":"這家企業可以從虧損中恢復。"},{"en":"The company is recovering from the recent economic downturn.","zh":"該公司正在從最近的經濟衰退中恢復過來。"}],"tips":["介係詞固定搭配：在 TOEIC 語法題中，recover 常與 from 連用（recover from something），例如 recover from a recession（從經濟衰退中復甦）或 recover from an illness。"],"forms":["recover","recovers","recovering","recovered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accounting","pos":"n.","meaning":"會計；會計業務","phrase":"accounting department","category":"會計與付款","id":"w0351","number":351,"examples":[{"en":"The accounting department is on the second floor.","zh":"會計部在二樓。"},{"en":"The accounting department will finalize the quarterly financial statements by Friday.","zh":"會計部門將於週五完成本季財務報表的最終整理。"}],"tips":["常見搭配詞組：常用於 accounting firm (會計師事務所)、accounting department (會計部門) 以及 accounting software (會計軟體)。在多益閱讀中，常出現在徵才廣告或公司組織結構說明中。"],"forms":["accounting","accountings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accountant","pos":"n.","meaning":"會計師；會計人員","phrase":"certified accountant","category":"會計與付款","id":"w0352","number":352,"examples":[{"en":"Our accountant will check the figures.","zh":"我們的會計師會核對數字。"},{"en":"The company hired an accountant to manage their financial records.","zh":"公司聘請了一位會計師來管理他們的財務記錄。"}],"tips":["常見搭配詞：Certified Public Accountant (CPA, 會計師執照)、hire an accountant (聘請會計師)、senior accountant (資深會計師)。"],"forms":["accountant","accountants"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"audit","pos":"n./v.","meaning":"稽核；審計","phrase":"conduct an audit","category":"會計與付款","id":"w0353","number":353,"examples":[{"en":"The audit will begin next week.","zh":"審計將於下星期開始。"},{"en":"The internal audit department will review all expense reports.","zh":"內部審計部門將審查所有費用報告。"}],"tips":["常見搭配詞與用法：'conduct an audit' (進行稽核)、'internal/external audit' (內部/外部稽核)、'financial audit' (財務審計)。在多益考試中，此單字常與會計、財務或合規性檢查（compliance）情境一同出現。"],"forms":["audit","audits","auditing","audited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"auditor","pos":"n.","meaning":"稽核員；審計人員","phrase":"independent auditor","category":"會計與付款","id":"w0354","number":354,"examples":[{"en":"The auditor is reviewing the accounts.","zh":"稽核員正在審查帳目。"},{"en":"The external auditor reviewed the company's financial statements.","zh":"外部查帳員審查了公司的財務報表。"}],"tips":["常見搭配詞：'external auditor' (外部查帳員)、'internal auditor' (內部稽核員)、'independent auditor' (獨立審計師)。這些詞彙常出現在公司年度報告或正式新聞稿中。"],"forms":["auditor","auditors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bookkeeping","pos":"n.","meaning":"簿記；記帳","phrase":"bookkeeping services","category":"會計與付款","id":"w0355","number":355,"examples":[{"en":"She handles the bookkeeping for our store.","zh":"她負責我們商店的記帳工作。"},{"en":"This software makes bookkeeping easier.","zh":"這套軟體讓記帳更容易。"}],"tips":["常見搭配詞與動詞運用：常與動詞 maintain 或 keep 連用，例如 maintain accurate bookkeeping records (維持精確的簿記紀錄)。常見詞組包括 bookkeeping department (簿記部門) 或 bookkeeping system (簿記系統)。"],"forms":["bookkeeping","bookkeepings"],"exampleSource":"Wordstep original examples"},{"word":"payment","pos":"n.","meaning":"付款；款項","phrase":"make a payment","category":"會計與付款","id":"w0356","number":356,"examples":[{"en":"We received your payment today.","zh":"我們今天收到你的款項。"},{"en":"Payment is due by Friday.","zh":"最遲必須在星期五付款。"}],"tips":["pay 是動詞，payment 是名詞。例句2的 is due 表示款項「到期應付」。"],"forms":["payment","payments"],"exampleSource":"Wordstep original examples"},{"word":"pay","pos":"v./n.","meaning":"付款；薪資","phrase":"pay a bill","category":"會計與付款","id":"w0357","number":357,"examples":[{"en":"You can pay the bill online.","zh":"你可以在線上支付帳單。"},{"en":"The company will pay employees a bonus based on their performance.","zh":"公司將根據員工的績效給予獎金。"}],"tips":["常見搭配詞組：'pay attention to' (注意)、'pay off a loan' (還清貸款)、'pay in installments' (分期付款)。"],"forms":["pay","pays","paying","paid","payments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"payable","pos":"adj./n.","meaning":"應付的；應付款","phrase":"accounts payable","category":"會計與付款","id":"w0358","number":358,"examples":[{"en":"The fee is payable in cash.","zh":"這筆費用可以現金支付。"},{"en":"We require a down payment to make the order payable.","zh":"為了使訂單可以支付，我們需要一筆定金。"}],"tips":["常見搭配詞組：'Accounts Payable' (應付帳款) 是會計財務中的核心詞彙；'Checks made payable to...' (支票抬頭人為...) 常用於描述支付對象；'payable in installments' (分期付款) 則常見於貸款合約。"],"forms":["payable","more payable","most payable"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"receivable","pos":"adj./n.","meaning":"應收的；應收款","phrase":"accounts receivable","category":"會計與付款","id":"w0359","number":359,"examples":[{"en":"Accounts receivable are listed in the report.","zh":"應收帳款列在報告裡。"},{"en":"The company needs to manage its accounts receivable carefully to maintain cash flow.","zh":"公司需要仔細管理其應收帳款以維持現金流。"}],"tips":["常見搭配詞：最常出現在「accounts receivable」（應收帳款）這一固定片語中，表示公司已提供商品或服務但尚未收到的款項。"],"forms":["receivable","receivables"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bill","pos":"n./v.","meaning":"帳單；開帳單","phrase":"pay a bill","category":"會計與付款","id":"w0360","number":360,"examples":[{"en":"The bill is on the table.","zh":"帳單在桌上。"},{"en":"Could you please settle the bill before you leave the restaurant?","zh":"請您在離開餐廳前結帳。"}],"tips":["多重語意辨析：在商業情境中最常作為「帳單」，如 utility bill (水電費)；但在法律或政策相關文章中則指「法案」。"],"forms":["bill","bills"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"billing","pos":"n.","meaning":"帳務；開立帳單","phrase":"billing information","category":"會計與付款","id":"w0361","number":361,"examples":[{"en":"Your billing information is out of date.","zh":"你的帳單資料已過時。"},{"en":"The accounting department is responsible for processing all customer billings.","zh":"會計部門負責處理所有客戶帳單。"}],"tips":["常見搭配詞組：billing address (帳單地址)、billing cycle (出帳週期)、billing statement (帳單明細) 及 billing department (帳務部門)。這些詞彙在 Part 7 的商業書信、電子郵件與發票範本中出現頻率極高。"],"forms":["billing","billings","bills","billed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"total","pos":"n./adj.","meaning":"總額；總計的","phrase":"total cost","category":"會計與付款","id":"w0362","number":362,"examples":[{"en":"The total is printed at the bottom.","zh":"總額印在底部。"},{"en":"The total sales for the quarter exceeded our projections.","zh":"本季的總銷售額超過了我們的預測。"}],"tips":["常見搭配詞與情境：在 TOEIC 閱讀的發票、收據或財務報表中，常出現 'total cost' (總成本)、'total revenue' (總營收) 或 'total amount' (總額)。慣用語 'a total of' 常見於報告，指 '總計有...'。"],"forms":["total","totals","totaler","totalest"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subtotal","pos":"n.","meaning":"小計","phrase":"calculate the subtotal","category":"會計與付款","id":"w0363","number":363,"examples":[{"en":"The subtotal is shown before tax.","zh":"小計顯示的是未稅金額。"},{"en":"The subtotal for the order is $500, and the shipping cost is $25.","zh":"訂單的小計是 500 美元，運費是 25 美元。"}],"tips":["常見於多益閱讀第七部分的收據、發票(Invoice)或訂單表格中，表示在加計稅金、運費或扣除折扣前的「小計」金額。"],"forms":["subtotal","subtotals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tax","pos":"n.","meaning":"稅；稅款","phrase":"income tax","category":"會計與付款","id":"w0364","number":364,"examples":[{"en":"The tax is included in the price.","zh":"稅款已包含在價格中。"},{"en":"The government is considering a tax reduction to stimulate the economy.","zh":"政府正在考慮減稅以刺激經濟。"}],"tips":["常見搭配詞：多益考試中常出現 'tax return' (納稅申報單) 而非指退稅，'tax refund' 才是退稅；其他如 'income tax' (所得稅)、'tax exemption' (免稅) 也是高頻詞組。"],"forms":["tax","taxes","taxing","taxed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"taxable","pos":"adj.","meaning":"應課稅的","phrase":"taxable income","category":"會計與付款","id":"w0365","number":365,"examples":[{"en":"This income is taxable.","zh":"這筆收入需要課稅。"},{"en":"Only taxable income is subject to income tax.","zh":"只有應課稅所得才需要繳納所得稅。"}],"tips":["常見搭配詞與詞組：最常與 income (所得)、benefits (福利)、assets (資產) 或 goods (商品) 連用。例如「taxable income」指應課稅所得。"],"forms":["taxable","taxability","taxably"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"income","pos":"n.","meaning":"收入；所得","phrase":"annual income","category":"會計與付款","id":"w0366","number":366,"examples":[{"en":"Your monthly income is listed here.","zh":"你的月收入列在這裡。"},{"en":"The company's quarterly income increased by 8% compared to last year.","zh":"公司本季的收入較去年同期增長了 8%。"}],"tips":["常見搭配詞：年度收入 (annual income)、淨收入 (net income)、總收入 (gross income)、固定收入 (fixed income)、收入來源 (source of income)。"],"forms":["income","incomes"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"earnings","pos":"n.","meaning":"收益；所得","phrase":"quarterly earnings","category":"會計與付款","id":"w0367","number":367,"examples":[{"en":"The earnings report will be released tomorrow.","zh":"收益報告將於明天公布。"},{"en":"The company announced record earnings for the fiscal year.","zh":"該公司宣布了本財政年度創紀錄的收入。"}],"tips":["常見搭配詞：常與 annual (年度)、quarterly (季度) 或 report (報告) 連用，例如 'earnings forecast' 指利潤預測。"],"forms":["earnings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"expenditure","pos":"n.","meaning":"支出；開支","phrase":"capital expenditure","category":"會計與付款","id":"w0368","number":368,"examples":[{"en":"Our expenditure is higher this month.","zh":"我們這個月的支出比較高。"},{"en":"The project's expenditure exceeded the initial budget by 15%.","zh":"專案的支出超出最初預算 15%。"}],"tips":["常見搭配詞組：常用於「capital expenditure」(資本支出，縮寫為 CAPEX)、「annual expenditure」(年度支出) 以及「reduce/limit expenditure」(縮減支出)，這些詞組經常出現在財務預算報告或公司公告中。"],"forms":["expenditure","expenditures"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"deduction","pos":"n.","meaning":"扣除額；扣款","phrase":"tax deduction","category":"會計與付款","id":"w0369","number":369,"examples":[{"en":"There is a tax deduction on my payslip.","zh":"我的薪資單上有一筆稅款扣除額。"},{"en":"Please check each deduction carefully.","zh":"請仔細檢查每一筆扣款。"}],"tips":["商業與財務情境：在多益考試中，deduction 最常用於「扣除額」或「減免」。常出現在 Part 7 的薪資單 (payroll)、稅務文件或保險合約中，如 'tax deduction' (稅務減免) 或 'payroll deduction' (薪資扣項)。"],"forms":["deduction","deductions","deduces","deducing","deduced"],"exampleSource":"Wordstep original examples"},{"word":"deduct","pos":"v.","meaning":"扣除","phrase":"deduct an amount","category":"會計與付款","id":"w0370","number":370,"examples":[{"en":"We will deduct the discount from the total.","zh":"我們會從總金額中扣除折扣。"},{"en":"The company will deduct the employee's travel expenses from their salary.","zh":"公司將從員工的薪水中扣除差旅費用。"}],"tips":["常見搭配詞：常與介系詞 'from' 連用，形成 'deduct A from B' (從 B 扣除 A) 的結構，常見受詞包括 taxes (稅金)、expenses (開支) 與 fees (費用)。"],"forms":["deduct","deducts","deducting","deducted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"allowance","pos":"n.","meaning":"津貼；補助","phrase":"travel allowance","category":"會計與付款","id":"w0371","number":371,"examples":[{"en":"The travel allowance will cover your meals.","zh":"差旅津貼將支付你的餐費。"},{"en":"The company provides a generous housing allowance for expatriate employees.","zh":"公司為外派員工提供豐厚的住房津貼。"}],"tips":["常見搭配詞：'baggage allowance' (行李限額) 常出現在多益聽力及閱讀的旅遊情境；'housing allowance' (住房補貼) 及 'daily allowance' (日支津貼) 常用於 HR 福利制度描述。"],"forms":["allowance","allowances"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reimbursement","pos":"n.","meaning":"報銷；償還款","phrase":"expense reimbursement","category":"會計與付款","id":"w0372","number":372,"examples":[{"en":"Your reimbursement is being processed.","zh":"你的報銷款正在處理中。"},{"en":"Please submit your expense report for reimbursement by the end of the month.","zh":"請在月底前提交您的費用報表以進行報銷。"}],"tips":["常見搭配詞：'travel reimbursement' (差旅費報銷)、'submit a reimbursement request' (提交報銷申請)、'seek reimbursement for expenses' (尋求費用報銷)。"],"forms":["reimbursement","reimbursements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reimburse","pos":"v.","meaning":"報銷；償還","phrase":"reimburse expenses","category":"會計與付款","id":"w0373","number":373,"examples":[{"en":"The company will reimburse your travel costs.","zh":"公司會報銷你的交通費用。"},{"en":"The company will reimburse employees for travel expenses incurred during the conference.","zh":"公司將會退償員工在會議期間產生的差旅費用。"}],"tips":["常見搭配詞組與結構：最核心的句型為 'reimburse someone for something'，例如 'The company will reimburse you for your travel expenses.'（公司將會報銷你的差旅費）。其名詞形式 reimbursement 也常出現在 'reimbursement policy'（報銷政策）或 'submit a reimbursement claim'（提交報銷申請）等片語中。"],"forms":["reimburse","reimburses","reimbursing","reimbursed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"due","pos":"adj.","meaning":"到期的；應付的","phrase":"payment due","category":"會計與付款","id":"w0374","number":374,"examples":[{"en":"The payment is due by Friday.","zh":"款項最遲星期五要付清。"},{"en":"The invoice is due on the 15th of next month.","zh":"發票的到期日是下個月的 15 號。"}],"tips":["多重含義與搭配詞：在多益中最常見的含義是『到期的』或『預定的』。常用搭配詞包括 'due date' (截止日期)、'be due to + 原型動詞' (預定要...)、以及 'in due course' (在適當的時候)。"],"forms":["due","dewer","dewest"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"overdue","pos":"adj.","meaning":"逾期的","phrase":"overdue payment","category":"會計與付款","id":"w0375","number":375,"examples":[{"en":"This payment is overdue.","zh":"這筆款項已逾期。"},{"en":"The report was overdue by a week, causing delays in the project.","zh":"報告逾期一周，導致專案延遲。"}],"tips":["常見搭配詞：此單字最常出現在財務與進度管理情境，如 'overdue payment' (過期款項)、'overdue notice' (催繳通知) 與 'long overdue' (遲到已久的)。"],"forms":["overdue","more overdue","most overdue"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"outstanding","pos":"adj.","meaning":"未支付的；未結清的","phrase":"outstanding balance","category":"會計與付款","id":"w0376","number":376,"examples":[{"en":"The outstanding balance is fifty dollars.","zh":"尚未結清的餘額是五十美元。"},{"en":"The employee's performance was outstanding, exceeding all expectations.","zh":"這位員工的表現非常傑出，遠超所有期望。"}],"tips":["掌握雙重字義：此字在多益中具有兩個極為重要的意思，分別是「傑出的、卓越的」與「未支付的、未解決的」。考生必須依據上下文判斷其含義。"],"forms":["outstanding","better","best"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"installment","pos":"n.","meaning":"分期付款的一期","phrase":"monthly installment","category":"會計與付款","id":"w0377","number":377,"examples":[{"en":"The next installment is due in May.","zh":"下一期分期款於五月到期。"},{"en":"The company offers a payment plan with three monthly installments.","zh":"公司提供分期付款計畫，包含三個每月一期的付款。"}],"tips":["常見搭配詞：'monthly installments'（每月分期付款）、'pay in installments'（分期支付）、'the final installment'（最後一期款項）。"],"forms":["installment","installments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"balance sheet","pos":"n.","meaning":"資產負債表","phrase":"prepare a balance sheet","category":"會計與付款","id":"w0378","number":378,"examples":[{"en":"Please review the balance sheet.","zh":"請查看資產負債表。"},{"en":"The balance sheet shows the company's assets and debts.","zh":"資產負債表顯示公司的資產與負債。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"advance","pos":"n./adj.","meaning":"預付款；預先的","phrase":"advance payment","category":"會計與付款","id":"w0379","number":379,"examples":[{"en":"An advance payment is required.","zh":"必須預先付款。"},{"en":"The company decided to advance the project deadline by a week.","zh":"公司決定將專案截止日期提前一週。"}],"tips":["常見片語與搭配詞：'in advance' (事先) 是多益最核心的片語，常與 payment、notice、booking 連用，例如 'Please let us know in advance'。此外，'advance notice' (事先通知) 也是辦公室通告中極常見的組合。"],"forms":["advance","advances","advancing","advanced","more advanced","most advanced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"prepayment","pos":"n.","meaning":"預付款","phrase":"require prepayment","category":"會計與付款","id":"w0380","number":380,"examples":[{"en":"Your prepayment will be applied to the total.","zh":"你的預付款將抵扣總金額。"},{"en":"The tenant made a prepayment of three months' rent.","zh":"承租人預付了三個月的租金。"}],"tips":["常見搭配詞組：包含「prepayment penalty」（提前還款違約金）、「require prepayment」（要求預付款）及「full prepayment」（全額預付）。"],"forms":["prepayment","prepayments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"penalty","pos":"n.","meaning":"罰款；違約金","phrase":"late-payment penalty","category":"會計與付款","id":"w0381","number":381,"examples":[{"en":"A penalty may apply to late payments.","zh":"逾期付款可能會有罰款。"},{"en":"Late payment of invoices will incur a penalty charge.","zh":"逾期支付發票將產生罰金。"}],"tips":["常見搭配詞：常用於 pay a penalty (支付罰金)、late payment penalty (逾期付款罰款)、penalty clause (違約條款) 等法律或商業情境中。"],"forms":["penalty","penalties"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"surcharge","pos":"n.","meaning":"附加費","phrase":"fuel surcharge","category":"會計與付款","id":"w0382","number":382,"examples":[{"en":"There is a surcharge for express delivery.","zh":"快遞服務需要支付附加費。"},{"en":"Does the price include the fuel surcharge?","zh":"這個價格包含燃油附加費嗎？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"payee","pos":"n.","meaning":"收款人","phrase":"name of the payee","category":"會計與付款","id":"w0383","number":383,"examples":[{"en":"Write the payee's name on the check.","zh":"請在支票上填寫收款人的姓名。"},{"en":"Please confirm the payee before sending the payment.","zh":"付款前請確認收款人。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"fare","pos":"n.","meaning":"票價；車資","phrase":"taxi fare","category":"會計與付款","id":"w0384","number":384,"examples":[{"en":"The fare is lower with a student card.","zh":"使用學生證的票價較低。"},{"en":"The taxi fare to the airport is approximately $30.","zh":"到機場的計程車車資大約是 30 美元。"}],"tips":["常見搭配詞：'fare' 專指搭乘交通工具的費用，常見搭配如 'bus fare' (公車費)、'train fare' (火車費) 以及 'airfare' (機票費)。"],"forms":["fare","fares"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tuition","pos":"n.","meaning":"學費","phrase":"tuition fee","category":"會計與付款","id":"w0385","number":385,"examples":[{"en":"Tuition is due before classes start.","zh":"學費必須在開課前繳交。"},{"en":"She received a scholarship that covers her full tuition.","zh":"她獲得了一筆獎學金，涵蓋了她全部的學費。"}],"tips":["常見搭配詞與情境：在 TOEIC 中最常出現於企業福利 (employee benefits) 情境，特別是 'tuition reimbursement' (學費報銷/補助) 或 'tuition fees' (學費)。這類單字常出現在公司規章或招募廣告中。"],"forms":["tuition"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"rent","pos":"n./v.","meaning":"租金；租用","phrase":"monthly rent","category":"會計與付款","id":"w0386","number":386,"examples":[{"en":"The rent will increase next year.","zh":"租金明年將調漲。"},{"en":"The company needs to rent a larger office space to accommodate the growing team.","zh":"為了容納日益擴大的團隊，公司需要租賃更大的辦公空間。"}],"tips":["詞性與常見搭配：rent 可作為動詞（租用）或名詞（租金）。在名詞用法中，常見搭配有 pay the rent (付租金) 與 monthly rent (月租金)；在動詞用法中，常用於 rent an office (租辦公室) 或 rent a vehicle (租車)。"],"forms":["rent","rents","renting","rented"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"creditor","pos":"n.","meaning":"債權人","phrase":"pay a creditor","category":"會計與付款","id":"w0387","number":387,"examples":[{"en":"The creditor will receive payment next week.","zh":"債權人下星期會收到款項。"},{"en":"The company is working to improve its relationship with its creditors after facing financial difficulties.","zh":"在面臨財務困難後，該公司正在努力改善與債權人的關係。"}],"tips":["核心定義與區分：Creditor 指的是「債權人」或「貸方」，即借錢給他人或提供賒帳服務的人或機構。在 TOEIC 考試中，務必將其與 debtor（債務人）明確區分。記憶口訣：提供 credit（信用/貸款）的是 creditor，背負 debt（債務）的是 debtor。"],"forms":["creditor","creditors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"premium","pos":"n.","meaning":"保費","phrase":"insurance premium","category":"會計與付款","id":"w0388","number":388,"examples":[{"en":"The insurance premium is paid monthly.","zh":"保費每月繳納。"},{"en":"Our company offers a premium subscription that includes additional support and analytics.","zh":"本公司提供的高級訂閱方案包含額外的支援與分析服務。"}],"tips":["多重詞義辨析：在多益中 premium 常見三種用法：名詞指『保險費』(insurance premium) 或『額外費用』，形容詞則指『高級的、優質的』(premium quality)。考生須根據上下文判定其詞性。"],"forms":["premium","premiums","more premium","most premium"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"calculate","pos":"v.","meaning":"計算","phrase":"calculate the total","category":"會計與付款","id":"w0389","number":389,"examples":[{"en":"You can calculate the total with this tool.","zh":"你可以用這個工具計算總額。"},{"en":"The finance department needs to calculate the company's quarterly profits.","zh":"財務部門需要計算公司的季度利潤。"}],"tips":["常見搭配詞與商業情境：常用於財務與物流，如 calculate the total cost (計算總成本)、calculate the estimated delivery time (計算預計遞送時間) 及 calculate tax (計稅)。在商業報告中，此字常與精確數據連結。"],"forms":["calculate","calculates","calculating","calculated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"calculation","pos":"n.","meaning":"計算；計算結果","phrase":"accurate calculation","category":"會計與付款","id":"w0390","number":390,"examples":[{"en":"The calculation is correct.","zh":"這個計算結果是正確的。"},{"en":"The project manager requested a detailed calculation of the estimated costs and timelines.","zh":"專案經理要求提供詳細的成本和時程估算。"}],"tips":["常見搭配詞與結構：常用搭配包括 'make a calculation' (進行計算)、'accurate calculation' (精確的計算) 以及 'based on our calculations' (根據我們的計算)。在多益閱讀中，此詞常伴隨數字、預算或時間表的調整出現。"],"forms":["calculation","calculations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"record","pos":"n./v.","meaning":"紀錄；記錄","phrase":"financial records","category":"會計與付款","id":"w0391","number":391,"examples":[{"en":"You can record the payment in this file.","zh":"你可以把這筆付款記錄在這個檔案中。"},{"en":"Please record the meeting minutes and distribute them to all attendees.","zh":"請記錄會議紀要並發送給所有與會者。"}],"tips":["詞性與發音辨析：作名詞時重音在第一音節（RE-cord），指紀錄或檔案；作動詞時重音在第二音節（re-CORD），指錄製或記載。聽力測驗中，重音位置是判斷詞性的重要依據。"],"forms":["record","records","recording","recorded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ledger","pos":"n.","meaning":"分類帳；總帳","phrase":"general ledger","category":"會計與付款","id":"w0392","number":392,"examples":[{"en":"The ledger is updated every day.","zh":"分類帳每天都會更新。"},{"en":"The accountant is responsible for maintaining an accurate ledger of all company expenses.","zh":"會計師負責維護公司所有費用的準確總帳。"}],"tips":["常見搭配詞：'General ledger' (總帳) 是多益中最常出現的搭配，通常與 'reconcile' (對帳)、'update' 或 'entry' (分錄) 連用，表示財務紀錄的維護與核對。"],"forms":["ledger","ledgers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"entry","pos":"n.","meaning":"帳目；記錄項目","phrase":"accounting entry","category":"會計與付款","id":"w0393","number":393,"examples":[{"en":"This entry shows yesterday's payment.","zh":"這筆帳目顯示昨天的付款。"},{"en":"Please correct the entry in the account book.","zh":"請更正帳簿中的這筆記錄。"}],"tips":["常見搭配詞與商業情境：entry-level position 指「基層/入門級職位」，data entry 為「資料輸入」。在市場分析中，market entry 指「進入市場」。"],"forms":["entry","entries","enters","entering","entered"],"exampleSource":"Wordstep original examples"},{"word":"quarterly","pos":"adj./adv.","meaning":"每季的；每季","phrase":"quarterly report","category":"會計與付款","id":"w0394","number":394,"examples":[{"en":"The quarterly report is ready.","zh":"季度報告已準備好。"},{"en":"The company releases its quarterly earnings report every three months.","zh":"該公司每三個月發布一次季度盈利報告。"}],"tips":["常見搭配詞：'quarterly report' (季度報告)、'quarterly earnings' (季度盈餘) 及 'quarterly performance review' (季度績效評估)，常用於描述公司固定週期性的財務或行政流程。"],"forms":["quarterly","more quarterly","most quarterly"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"annually","pos":"adv.","meaning":"每年","phrase":"review annually","category":"會計與付款","id":"w0395","number":395,"examples":[{"en":"The fee is paid annually.","zh":"這筆費用每年支付一次。"},{"en":"The company reports its financial results annually.","zh":"公司每年報告其財務業績。"}],"tips":["常見搭配詞：'held annually' (每年舉行)、'review annually' (每年審查) 與 'updated annually' (每年更新)，常用來描述公司例行性活動。"],"forms":["annually"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fiscal","pos":"adj.","meaning":"財政的；會計年度的","phrase":"fiscal year","category":"會計與付款","id":"w0396","number":396,"examples":[{"en":"Our fiscal year will end in March.","zh":"我們的會計年度將於三月結束。"},{"en":"The government announced a new fiscal policy to stimulate economic growth.","zh":"政府宣布了一項新的財政政策以刺激經濟增長。"}],"tips":["常見搭配詞：最常出現在 'fiscal year' (會計年度)、'fiscal policy' (財政政策) 以及 'fiscal deficit' (財政赤字) 等固定詞組中。"],"forms":["fiscal","more fiscal","most fiscal"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"deficit","pos":"n.","meaning":"赤字；虧絀","phrase":"budget deficit","category":"會計與付款","id":"w0397","number":397,"examples":[{"en":"The budget deficit is smaller this year.","zh":"今年的預算赤字較小。"},{"en":"The quarterly budget deficit prompted immediate cost-reduction measures across departments.","zh":"季度預算deficit促使各部門立即採取降低成本措施。"}],"tips":["常見搭配詞組：常用於財務與貿易情境，如 'trade deficit' (貿易赤字)、'budget deficit' (預算赤字) 及動詞短語 'run a deficit' (出現赤字/虧損)。"],"forms":["deficit"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"surplus","pos":"n.","meaning":"盈餘；剩餘","phrase":"budget surplus","category":"會計與付款","id":"w0398","number":398,"examples":[{"en":"The surplus will be used for repairs.","zh":"盈餘將用於維修。"},{"en":"We need to manage the surplus inventory to avoid storage costs.","zh":"我們需要管理剩餘庫存，以避免儲存成本。"}],"tips":["常見搭配詞：'budget surplus'（預算盈餘）、'trade surplus'（貿易順差）、'surplus inventory'（過剩庫存）、'surplus funds'（剩餘資金）。"],"forms":["surplus","surpluses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reconcile","pos":"v.","meaning":"核對；調節帳目","phrase":"reconcile accounts","category":"會計與付款","id":"w0399","number":399,"examples":[{"en":"The accountant will reconcile the accounts.","zh":"會計師將核對帳目。"},{"en":"The accountant needs to reconcile the bank statement with the company's records.","zh":"會計師需要將銀行對帳單與公司記錄進行對帳。"}],"tips":["常見搭配詞與句型：最常以 reconcile A with B 的形式出現，表示使 A 與 B 達成一致、調和矛盾。在財務情境中，reconcile a bank statement (核對銀行對帳單) 是極高頻的用法。"],"forms":["reconcile","reconciles","reconciling","reconciled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"allocate","pos":"v.","meaning":"分配；撥款","phrase":"allocate funds","category":"會計與付款","id":"w0400","number":400,"examples":[{"en":"We will allocate more funds to training.","zh":"我們將撥出更多資金用於培訓。"},{"en":"The company needs to allocate more resources to the marketing department to boost sales.","zh":"公司需要將更多資源分配給行銷部門以提升銷售業績。"}],"tips":["常見搭配詞：allocate funds, allocate resources, allocate budget。在 TOEIC 考試中，此單字經常出現在預算分配、專案計畫或資源管理的正式書信中。"],"forms":["allocate","allocates","allocating","allocated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"order","pos":"n./v.","meaning":"訂單；訂購","phrase":"place an order","category":"採購與訂單","id":"w0401","number":401,"examples":[{"en":"Your order will arrive tomorrow.","zh":"你的訂單明天會送達。"},{"en":"The manager gave the order to ship the products immediately.","zh":"經理下令立即出貨。"}],"tips":["多重詞性與語意：在TOEIC中，order常作為名詞表示「訂單」或動詞「訂購」，但在Part 5/6也常考其「順序」(in chronological order) 或「規則/秩序」 (out of order) 的用法。"],"forms":["order","orders","ordering","ordered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"supplier","pos":"n.","meaning":"供應商","phrase":"reliable supplier","category":"採購與訂單","id":"w0402","number":402,"examples":[{"en":"Our supplier can provide the materials.","zh":"我們的供應商可以提供材料。"},{"en":"Our company is seeking reliable suppliers for raw materials.","zh":"我們公司正在尋找可靠的原材料供應商。"}],"tips":["常見搭配詞：'reliable supplier' (可靠的供應商)、'primary supplier' (主要供應商)、'local supplier' (當地供應商)，以及 'supply chain' (供應鏈)。"],"forms":["supplier","suppliers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"procurement","pos":"n.","meaning":"採購","phrase":"procurement process","category":"採購與訂單","id":"w0403","number":403,"examples":[{"en":"The procurement team is comparing prices.","zh":"採購團隊正在比較價格。"},{"en":"Streamlined procurement processes reduced purchasing costs by 15%.","zh":"簡化的procurement流程將採購成本降低了15%。"}],"tips":["常見搭配詞組：'procurement department' (採購部門)、'procurement process' (採購流程)、'public procurement' (政府/公共採購) 以及 'procurement officer' (採購主管)，常出現於企業內部組織說明或招標公告中。"],"forms":["procurement"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"inventory","pos":"n.","meaning":"庫存；存貨","phrase":"check inventory","category":"採購與訂單","id":"w0404","number":404,"examples":[{"en":"The inventory is checked every week.","zh":"庫存每星期都會清點。"},{"en":"We need to reduce our inventory costs to improve profitability.","zh":"我們需要降低庫存成本以提高盈利能力。"}],"tips":["常見搭配詞：包含 take inventory (盤點庫存)、inventory control (庫存管理) 以及 excess inventory (過剩庫存)。"],"forms":["inventory","inventories"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"stockroom","pos":"n.","meaning":"庫房；儲藏室","phrase":"stockroom inventory","category":"採購與訂單","id":"w0405","number":405,"examples":[{"en":"The stockroom is behind the shop.","zh":"庫房在商店後方。"},{"en":"Could you please check the stockroom for extra printer paper?","zh":"您能請檢查一下庫房裡是否有額外的影印紙嗎？"}],"tips":["常見搭配詞：'inventory in the stockroom' (儲藏室庫存) 或 'check the stockroom' (檢查儲藏室)，常用於零售業或辦公室物資管理情境。"],"forms":["stockroom","stockrooms"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"quantity","pos":"n.","meaning":"數量","phrase":"order quantity","category":"採購與訂單","id":"w0406","number":406,"examples":[{"en":"The quantity is listed on the order form.","zh":"數量列在訂購單上。"},{"en":"We need to confirm the quantity of the order before proceeding with production.","zh":"在開始生產之前，我們需要確認訂單的數量。"}],"tips":["常見搭配詞：包含 'large/small quantity' (大量/小量)、'in quantity' (大量地) 以及 'quantity discount' (大宗採購折扣)，此類詞組常出現在商務採購對話中。"],"forms":["quantity","quantities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"unit","pos":"n.","meaning":"單位；件","phrase":"unit price","category":"採購與訂單","id":"w0407","number":407,"examples":[{"en":"The unit price is ten dollars.","zh":"單價是十美元。"},{"en":"Our marketing unit will launch the new campaign next month.","zh":"我們的行銷部門將於下個月推出新活動。"}],"tips":["常見搭配詞與商業情境：在 TOEIC 閱讀測驗（Part 7）的發票、訂購單或庫存報告中，經常出現「unit price」（單價）與「per unit」（每單位）等詞彙，考生應熟悉其計算邏輯。"],"forms":["unit","units"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bulk","pos":"n./adj.","meaning":"大量；大量的","phrase":"bulk order","category":"採購與訂單","id":"w0408","number":408,"examples":[{"en":"A bulk order can reduce the price.","zh":"大量訂購可以降低價格。"},{"en":"We purchase raw materials in bulk to reduce costs.","zh":"我們大量採購原材料以降低成本。"}],"tips":["常見搭配詞：'in bulk' (大量地) 與 'bulk order' (大宗訂單) 是多益中最常出現的短語，常用於採購與庫存管理。"],"forms":["bulk","bulks"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"wholesale","pos":"n./adj.","meaning":"批發；批發的","phrase":"wholesale price","category":"採購與訂單","id":"w0409","number":409,"examples":[{"en":"The wholesale price is lower.","zh":"批發價格比較低。"},{"en":"Our wholesale clients appreciate competitive pricing and reliable delivery schedules.","zh":"我們的wholesale客戶喜歡有競爭力的價格和可靠的交付時間表。"}],"tips":["詞義辨析與對比：在 TOEIC 考試中，wholesale（批發）常與 retail（零售）成對出現。批發是指大宗購買並轉售給企業，而零售則是賣給最終消費者。"],"forms":["wholesale"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"retail","pos":"n./adj.","meaning":"零售；零售的","phrase":"retail price","category":"採購與訂單","id":"w0410","number":410,"examples":[{"en":"The retail price is on the label.","zh":"零售價格標示在標籤上。"},{"en":"Retail sales increased significantly during the holiday season.","zh":"在節假日期間，零售銷售額顯著增長。"}],"tips":["常見搭配詞組：'retail price' (零售價)、'retail outlet' (零售門市)、'retail chain' (連鎖零售店) 與 'retail sales' (零售銷售額)，這些詞彙常出現在商業新聞或公司年度報告中。"],"forms":["retail","retails"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"availability","pos":"n.","meaning":"供應情況；可取得性","phrase":"check availability","category":"採購與訂單","id":"w0411","number":411,"examples":[{"en":"You can check availability online.","zh":"你可以在線上查詢供應情況。"},{"en":"Please check the manager's availability before scheduling a meeting.","zh":"請在安排會議前確認經理的空閒時間。"}],"tips":["常見搭配詞與情境：在多益中常出現在飯店訂房、機票預訂或庫存查詢的情境中，常見片語如 'check availability' (確認是否有空位/現貨) 或 'limited availability' (供應有限)。"],"forms":["availability","availabilities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"specification","pos":"n.","meaning":"規格；規範","phrase":"product specifications","category":"採購與訂單","id":"w0412","number":412,"examples":[{"en":"This specification is important for the design.","zh":"這項規格對設計很重要。"},{"en":"Before placing the order, please review the technical specifications to ensure compatibility.","zh":"在下單之前，請務必審閱技術規格以確保相容性。"}],"tips":["常見搭配詞：'meet the specifications'（符合規格）是考題常客，另有 'technical specifications'（技術規格）與 'detailed specifications'（詳細說明書）。"],"forms":["specification","specifications"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"requisition","pos":"n.","meaning":"請購單；申請","phrase":"purchase requisition","category":"採購與訂單","id":"w0413","number":413,"examples":[{"en":"The requisition is ready for approval.","zh":"請購單可以送審了。"},{"en":"The department submitted a requisition for new office supplies.","zh":"部門提交了一份購買新辦公用品的申請。"}],"tips":["常見搭配詞與型態：'purchase requisition' (採購申請)、'requisition form' (申請單) 與 'submit a requisition' (提交申請)，常用於描述公司內部正式的行政流程。"],"forms":["requisition","requisitions","requisitioning","requisitioned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"quotation","pos":"n.","meaning":"報價；報價單","phrase":"request a quotation","category":"採購與訂單","id":"w0414","number":414,"examples":[{"en":"The quotation is valid for thirty days.","zh":"這份報價有效期為三十天。"},{"en":"We are awaiting the quotation for the new office furniture.","zh":"我們正在等待關於新辦公室家具的報價。"}],"tips":["常見搭配詞：'request a quotation' (索取報價單)、'submit a quotation' (提交報價單)、'competitive quotation' (具競爭力的報價)。"],"forms":["quotation","quotations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bid","pos":"n./v.","meaning":"投標；出價","phrase":"submit a bid","category":"採購與訂單","id":"w0415","number":415,"examples":[{"en":"You can submit a bid online.","zh":"你可以在線上提交投標書。"},{"en":"The company submitted a bid for the construction project.","zh":"該公司提交了該建築項目的出價。"}],"tips":["常見搭配詞組：此單字常與動詞連用，如 submit a bid (提交投標)、win a bid (中標) 或 accept a bid (接受投標)；在拍賣情境下常用 place a bid。"],"forms":["bid","bids","bidding"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tender","pos":"n.","meaning":"投標；標案","phrase":"submit a tender","category":"採購與訂單","id":"w0416","number":416,"examples":[{"en":"The tender will close on Friday.","zh":"這個標案將於星期五截止。"},{"en":"She gave her baby a tender hug.","zh":"她溫柔地擁抱了她的寶寶。"}],"tips":["商業名詞用法：在多益中 tender 常指「投標」或「標案」，常見搭配如 submit a tender (遞交投標書)、invite tenders (招標) 或 put out to tender (公開招標)。"],"forms":["tenderer","tenderest","tendered","tendering","tenders"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"terms","pos":"n.","meaning":"條款；條件","phrase":"payment terms","category":"採購與訂單","id":"w0417","number":417,"examples":[{"en":"The payment terms are in the contract.","zh":"付款條件寫在合約裡。"},{"en":"The payment terms are net 30 days.","zh":"付款條件是 30 天內結清。"}],"tips":["常見搭配詞組：'terms and conditions'（條款與條件）是多益閱讀中最常出現的固定組合，常見於合約、服務協議或退貨政策中；'payment terms' 則指付款條件，常在發票或採購單中出現。"],"forms":["terms"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"condition","pos":"n.","meaning":"條件；狀況","phrase":"terms and conditions","category":"採購與訂單","id":"w0418","number":418,"examples":[{"en":"The equipment is in good condition.","zh":"設備狀況良好。"},{"en":"The company's financial condition has improved significantly this quarter.","zh":"本季公司財務狀況已顯著改善。"}],"tips":["多重字義辨析：在 TOEIC 考試中應區分『狀態』與『條款』兩種主要用法。在產品描述中，in excellent condition 指物品狀態良好；在法律或合約情境中，terms and conditions 則指履約條款。"],"forms":["condition","conditions","better","best"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"provision","pos":"n.","meaning":"條款；規定","phrase":"contract provision","category":"採購與訂單","id":"w0419","number":419,"examples":[{"en":"This provision is part of the agreement.","zh":"這項條款是協議的一部分。"},{"en":"The contract includes a provision for handling unforeseen circumstances.","zh":"這份合約包含處理不可預見情況的條款。"}],"tips":["法律與合約情境：在 TOEIC 閱讀（特別是 Part 7 的合約或規章）中，provision 常指「條款」或「規定」。常見片語如 'under the provisions of the contract'（根據合約規定）。"],"forms":["provision","provisions","provides","providing","provided"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"authorize","pos":"v.","meaning":"授權；核准","phrase":"authorize a purchase","category":"採購與訂單","id":"w0420","number":420,"examples":[{"en":"The manager can authorize the purchase.","zh":"經理可以核准這筆採購。"},{"en":"Please authorize the payment to the vendor within the agreed timeframe.","zh":"請在約定的時間範圍內授權支付給供應商。"}],"tips":["常見搭配詞組：常用於「authorize a payment」（授權付款）、「authorize a transaction」（授權交易）或「be authorized to do something」（被授權做某事）。"],"forms":["authorize","authorizes","authorizing","authorized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"authorization","pos":"n.","meaning":"授權；核准","phrase":"obtain authorization","category":"採購與訂單","id":"w0421","number":421,"examples":[{"en":"Written authorization is required.","zh":"必須取得書面授權。"},{"en":"Department heads discussed the authorization strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了authorization策略。"}],"tips":["常見搭配詞：考生應熟記 'prior authorization' (事先授權)、'written authorization' (書面授權) 以及 'obtain authorization' (獲得授權)，這些詞組常出現在辦公室備忘錄或契約中。"],"forms":["authorization"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"confirmation","pos":"n.","meaning":"確認；確認通知","phrase":"order confirmation","category":"採購與訂單","id":"w0422","number":422,"examples":[{"en":"You will receive a confirmation by email.","zh":"你將透過電子郵件收到確認通知。"},{"en":"Please keep your booking confirmation.","zh":"請保留你的預訂確認通知。"}],"tips":["常見搭配詞與短語：在多益中常出現 'confirmation number' (確認碼/編號)、'confirmation letter/email' (確認信) 以及 'booking/reservation confirmation' (預訂確認)。這些詞組經常出現在聽力第三、四部分的商務對話或廣播中。"],"forms":["confirmation","confirmations","confirms","confirming","confirmed"],"exampleSource":"Wordstep original examples"},{"word":"process","pos":"n./v.","meaning":"流程；處理","phrase":"process an order","category":"採購與訂單","id":"w0423","number":423,"examples":[{"en":"We can process your order today.","zh":"我們今天可以處理你的訂單。"},{"en":"The company is streamlining its order processing to improve efficiency.","zh":"公司正在簡化訂單處理流程以提高效率。"}],"tips":["詞性雙重性：在多益中 process 常用作動詞「處理」與名詞「過程」。動詞常見於「process an application/order/payment」(處理申請/訂單/付款)，名詞常見於「recruitment process」(招聘流程) 或「manufacturing process」(製造過程)。"],"forms":["process","processes","processing","processed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"place","pos":"v.","meaning":"下訂；提出","phrase":"place an order","category":"採購與訂單","id":"w0424","number":424,"examples":[{"en":"I would like to place an order.","zh":"我想下訂單。"},{"en":"Please place your order before noon.","zh":"請在中午前下訂單。"}],"tips":["常見固定搭配『place an order』：在多益聽力與閱讀（特別是 Part 7）中極高頻出現，意指『下訂單』，常出現在購物、物流或企業採購情境中。"],"forms":["place","places","placing","placed"],"exampleSource":"Wordstep original examples"},{"word":"reserve","pos":"v.","meaning":"預留；預訂","phrase":"reserve an item","category":"採購與訂單","id":"w0425","number":425,"examples":[{"en":"We can reserve one for you.","zh":"我們可以為你預留一個。"},{"en":"Please reserve a seat on the next flight to New York.","zh":"請幫我預訂下一班飛往紐約的航班座位。"}],"tips":["常見搭配詞與同義詞：在多益考試中，reserve 常與 table, seat, room 或 flight 搭配使用，其同義詞為 book。名詞形式 reservation 則常出現在 'make a reservation' (預約) 這一固定搭配中。"],"forms":["reserve","reserves","reserving","reserved"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reservation","pos":"n.","meaning":"預訂；保留","phrase":"make a reservation","category":"採購與訂單","id":"w0426","number":426,"examples":[{"en":"I have a reservation for two.","zh":"我有一個兩人的訂位。"},{"en":"Can I cancel my reservation?","zh":"我可以取消預訂嗎？"}],"tips":["a reservation for two 在餐廳常指「兩人的訂位」。例句2的 cancel 表示取消。"],"forms":["reservation","reservations","reserves","reserving","reserved"],"exampleSource":"Wordstep original examples"},{"word":"cancellation","pos":"n.","meaning":"取消","phrase":"order cancellation","category":"採購與訂單","id":"w0427","number":427,"examples":[{"en":"A cancellation fee may apply.","zh":"可能需要支付取消手續費。"},{"en":"The hotel requires a 24-hour cancellation notice to avoid a penalty charge.","zh":"飯店要求 24 小時的取消通知，以避免罰款。"}],"tips":["常見搭配詞：cancellation policy（取消政策）、cancellation fee（取消手續費）、last-minute cancellation（最後一刻取消）、subject to cancellation（可能會被取消）。"],"forms":["cancellation","cancellations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"modify","pos":"v.","meaning":"修改；變更","phrase":"modify an order","category":"採購與訂單","id":"w0428","number":428,"examples":[{"en":"You can modify the order before shipping.","zh":"你可以在出貨前修改訂單。"},{"en":"Please modify the contract to include the revised payment terms.","zh":"請修改合約，以包含修改後的付款條款。"}],"tips":["常見搭配詞與同義詞：在 TOEIC 中 'modify' 常與 'plan'、'contract'、'schedule' 或 'policy' 連用，表示對現有內容進行部分調整。其同義詞常考 'alter'、'amend' (多用於法律或合約) 或 'adjust'。"],"forms":["modify","modifies","modifying","modified"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"modification","pos":"n.","meaning":"修改；變更","phrase":"order modification","category":"採購與訂單","id":"w0429","number":429,"examples":[{"en":"This modification is included in the price.","zh":"這項修改已包含在價格中。"},{"en":"The department implemented innovative modification procedures to improve operational efficiency.","zh":"部門實施創新的modification程序以提高營運效率。"}],"tips":["常見搭配詞：慣用 'make modifications to' (進行修改) 或形容詞搭配 'minor/major modification' (微調/重大修改)；此外 'subject to modification' (可能會有變動) 常出現在公告中。"],"forms":["modification","modifications","modifies","modifying","modified"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"substitute","pos":"n./v.","meaning":"替代品；替代","phrase":"substitute product","category":"採購與訂單","id":"w0430","number":430,"examples":[{"en":"A substitute product is available.","zh":"有替代商品可以供應。"},{"en":"We need a substitute supplier for this component as our current vendor is facing production delays.","zh":"由於我們目前的供應商面臨生產延遲，我們需要這個零件的替代供應商。"}],"tips":["介系詞用法陷阱：substitute 最常考的介系詞搭配是 'substitute A for B'

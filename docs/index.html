68/toeic-vocab-tw context sentence"},{"word":"crowd","pos":"n.","meaning":"人群；群眾","phrase":"large crowd","category":"活動與娛樂","id":"w0873","number":873,"examples":[{"en":"The crowd is waiting at the entrance.","zh":"人群正在入口等候。"},{"en":"The conference hall was packed with a large crowd of attendees.","zh":"會議廳擠滿了大量與會者。"}],"tips":["詞性與常見搭配：crowd 可作為名詞表示「人群」，亦可作為動詞表示「擠滿」。在 TOEIC 中常見形容詞形式 'crowded'，常搭配介系詞 with，如 'The station is crowded with commuters'（車站擠滿了通勤者）。"],"forms":["crowd","crowds"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"performer","pos":"n.","meaning":"表演者","phrase":"guest performer","category":"活動與娛樂","id":"w0874","number":874,"examples":[{"en":"The performer is on the stage.","zh":"表演者在舞臺上。"},{"en":"The company hired a professional performer to entertain guests at the product launch event.","zh":"為了在產品發表會上娛樂賓客，公司聘請了一位專業的表演者。"}],"tips":["常見搭配詞與商業情境：在多益中，performer 不僅指演藝人員，更常用於職場描述「表現...的人」。常見用法如 'top performer' (表現最優異的員工) 或 'high performer'。在績效評估 (performance review) 的文章中經常出現。"],"forms":["performer","performers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"problem","pos":"n.","meaning":"問題；困難","phrase":"solve a problem","category":"活動與娛樂","id":"w0875","number":875,"examples":[{"en":"The problem can be solved today.","zh":"這個問題今天就能解決。"},{"en":"We need to identify the root problem causing the production delays.","zh":"我們需要找出造成生產延遲的根本問題。"}],"tips":["常見搭配詞：常用動詞如 solve, resolve, address, tackle 或 fix 與 problem 連用；形容詞則常搭配 technical, financial, 或 unexpected。"],"forms":["problem","problems","problemming","problemmed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sign","pos":"n./v.","meaning":"標誌；簽署","phrase":"sign up for an event","category":"活動與娛樂","id":"w0876","number":876,"examples":[{"en":"The sign is easy to read.","zh":"標誌很容易看清楚。"},{"en":"The 'No Parking' sign clearly indicates where vehicles are prohibited.","zh":"「禁止停車」的標誌清楚地指示了車輛禁止停放的區域。"}],"tips":["詞性辨析與易混淆詞：在TOEIC中，sign常作為動詞「簽名」或名詞「告示牌」。最常考的是它與signature（名詞：簽名）的區別，考生常在填空題中誤選。請記住：sign a contract (動詞)，而 Please provide your signature (名詞)。"],"forms":["sign","signs","signing","signed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"artwork","pos":"n.","meaning":"藝術作品","phrase":"display artwork","category":"活動與娛樂","id":"w0877","number":877,"examples":[{"en":"The artwork is on display.","zh":"這件藝術作品正在展出。"},{"en":"The hotel's lobby features a collection of modern artworks, creating a sophisticated atmosphere for guests.","zh":"飯店大廳展示了現代藝術作品的收藏，為客人營造了精緻的氛圍。"}],"tips":["【名詞特性與用法】：在 TOEIC 中，artwork 通常視為集合名詞，指代藝術作品。雖然它可以指單件作品，但在聽力與閱讀中常以不可數形式出現，如 'Some artwork is displayed'。若要明確表達多件作品，亦可使用 'works of art'。"],"forms":["artwork","artworks"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"collection","pos":"n.","meaning":"收藏；作品集","phrase":"art collection","category":"活動與娛樂","id":"w0878","number":878,"examples":[{"en":"The collection includes modern paintings.","zh":"這個收藏系列包含現代畫作。"},{"en":"The company has a vast collection of market research data to analyze.","zh":"公司擁有龐大的市場研究數據彙總，可供分析。"}],"tips":["常見搭配詞與短語：'a collection of' (一系列的/一組)、'debt collection' (催收欠款)、'waste collection' (垃圾清運)、'spring/summer collection' (春夏系列服裝)。"],"forms":["collection","collections"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lineup","pos":"n.","meaning":"活動陣容；節目安排","phrase":"event lineup","category":"活動與娛樂","id":"w0879","number":879,"examples":[{"en":"The lineup will be announced tomorrow.","zh":"演出陣容將於明天公布。"},{"en":"The manager announced the starting lineup for the upcoming game.","zh":"經理宣布了即將到來的比賽的先發陣容。"}],"tips":["常見搭配詞與結構：在多益中常以 'product lineup' (產品陣容/系列) 或 'speaker lineup' (演講者名單) 的形式出現。常見形容詞搭配包括 'impressive,' 'stellar,' 或 'diverse'，用以強調陣容的高水準或多樣性。"],"forms":["lineup","lineups"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"premiere","pos":"n./v.","meaning":"首映；首次演出","phrase":"film premiere","category":"活動與娛樂","id":"w0880","number":880,"examples":[{"en":"The premiere is on Friday.","zh":"首映在星期五舉行。"},{"en":"The film's premiere was attended by numerous celebrities and industry professionals.","zh":"這部電影的首映式吸引了眾多名人及業界人士。"}],"tips":["常見搭配詞與情境：此單字常出現在 TOEIC 閱讀 Part 7 的宣傳手冊、邀請函或新聞發布中。常見搭配如 world premiere (全球首映)、season premiere (影集首播) 或 gala premiere (首映盛典)。"],"forms":["premiere","premieres","premiering","premiered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"organizer","pos":"n.","meaning":"主辦人；活動籌辦者","phrase":"event organizer","category":"活動與娛樂","id":"w0881","number":881,"examples":[{"en":"The organizer will contact you soon.","zh":"主辦人很快就會聯絡你。"},{"en":"The event organizer ensured everything ran smoothly from registration to closing remarks.","zh":"活動組織者確保從報到到閉幕致詞的所有流程順利進行。"}],"tips":["常見搭配詞：'event organizer' (活動主辦者)、'conference organizer' (會議籌辦者) 以及 'personal organizer' (個人萬用手冊/記事本)，在多益中這兩個維度（人與物）皆可能出現。"],"forms":["organizer","organizers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"planning","pos":"n.","meaning":"規劃；籌備","phrase":"event planning","category":"活動與娛樂","id":"w0882","number":882,"examples":[{"en":"The planning is almost complete.","zh":"籌備工作即將完成。"},{"en":"The marketing team is currently planning a new product launch campaign.","zh":"行銷團隊目前正在規劃一個新產品上市活動。"}],"tips":["常見搭配詞組：常用於 strategic planning (策略規劃)、financial planning (財務規劃) 及 event planning (活動企劃)，這些詞組在 Part 5 詞彙題中出現頻率極高。"],"forms":["planning","plannings","plans","planned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"promote","pos":"v.","meaning":"宣傳；推廣","phrase":"promote an event","category":"活動與娛樂","id":"w0883","number":883,"examples":[{"en":"We will promote the event online.","zh":"我們將在線上宣傳這場活動。"},{"en":"The company will promote the new product through a series of online advertisements.","zh":"公司將透過一系列線上廣告來推廣新產品。"}],"tips":["多義性辨析：在多益中主要有兩大核心含義：『晉升職位』與『促銷/推廣產品』。考生需根據上下文判斷是人事異動還是行銷活動。"],"forms":["promote","promotes","promoting","promoted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"publicize","pos":"v.","meaning":"宣傳；公布","phrase":"publicize an event","category":"活動與娛樂","id":"w0884","number":884,"examples":[{"en":"We can publicize the opening in the newspaper.","zh":"我們可以在報紙上宣傳開幕活動。"},{"en":"We need to publicize the upcoming conference to attract more attendees.","zh":"我們需要宣傳即將到來的會議，以吸引更多參與者。"}],"tips":["常見搭配詞組：常用於 'widely publicized'（廣為宣傳）或 'publicize the new product'（宣傳新產品）。"],"forms":["publicize","publicizes","publicizing","publicized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"participation","pos":"n.","meaning":"參與；參加","phrase":"encourage participation","category":"活動與娛樂","id":"w0885","number":885,"examples":[{"en":"Your participation is welcome.","zh":"我們歡迎你的參與。"},{"en":"Employee participation in decision-making is encouraged here.","zh":"這裡鼓勵員工參與決策。"}],"tips":["常見搭配詞與介係詞：該單字最常與介係詞 'in' 連用（participation in + 事件），常見搭配包含 'active participation' (積極參與)、'participation fee' (報名/參與費用) 以及 'confirm one's participation' (確認某人的參與)。"],"forms":["participation","participate","participates","participating","participated","participative","participatory"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"compete","pos":"v.","meaning":"競爭；參賽","phrase":"compete in a contest","category":"活動與娛樂","id":"w0886","number":886,"examples":[{"en":"Students can compete in the contest.","zh":"學生可以參加這項比賽。"},{"en":"Our company strives to compete effectively in the global market.","zh":"我們公司努力在國際市場上有效地競爭。"}],"tips":["掌握介係詞的固定搭配：在TOEIC中，常見 'compete with/against' 表示與對手競爭，以及 'compete for' 表示爭取某項事物（如：market share 市佔率或 contract 合約）。"],"forms":["compete","competes","competing","competed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"contest","pos":"n.","meaning":"比賽；競賽","phrase":"enter a contest","category":"活動與娛樂","id":"w0887","number":887,"examples":[{"en":"The contest is open to everyone.","zh":"所有人都可以參加這項比賽。"},{"en":"The marketing department decided to contest the competitor's claim of market dominance.","zh":"行銷部門決定對競爭對手的市場主導地位提出異議。"}],"tips":["常見搭配詞組：常用 enter a contest (參加比賽)、win a contest (贏得比賽) 或 hold/host a contest (舉辦比賽)。在行銷情境中常出現 promotional contest (促銷抽獎/競賽)。"],"forms":["contest","contests","contesting","contested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"prize","pos":"n.","meaning":"獎品；獎項","phrase":"win a prize","category":"活動與娛樂","id":"w0888","number":888,"examples":[{"en":"The prize will be sent to the winner.","zh":"獎品將寄給得獎者。"},{"en":"Winning the industry award was the highest prize for our team's hard work.","zh":"獲得該行業獎項是我們團隊辛勤工作的最高獎勵。"}],"tips":["常見搭配詞：win a prize (獲獎)、cash prize (現金獎)、first prize (頭獎)、door prize (抽獎獎品)。"],"forms":["prize","prizes"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"award","pos":"n./v.","meaning":"獎項；授予","phrase":"receive an award","category":"活動與娛樂","id":"w0889","number":889,"examples":[{"en":"The award will be presented tonight.","zh":"獎項將於今晚頒發。"},{"en":"The company will award a bonus to employees who exceed their sales targets.","zh":"公司將會對超過銷售目標的員工頒發獎金。"}],"tips":["區分 award 與 reward：award 通常指正式、公開的獎項或榮譽（如：win an award for excellence），而 reward 則多指對某項具體行為或努力的實質回饋或報償（如：a cash reward）。"],"forms":["award","awards","awarding","awarded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"decrease","pos":"n./v.","meaning":"減少；下降","phrase":"decrease in attendance","category":"活動與娛樂","id":"w0890","number":890,"examples":[{"en":"The price will decrease next month.","zh":"價格將於下個月下降。"},{"en":"The company's profits decreased by 10% due to the economic downturn.","zh":"由於經濟下滑，該公司的利潤下降了 10%。"}],"tips":["詞性與介係詞搭配：當作名詞時，最常接介係詞 'in' 表示在某方面的減少（如 a decrease in sales），若接 'of' 則指具體數額（如 a decrease of 10%）。"],"forms":["decrease","decreases","decreasing","decreased"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"upcoming","pos":"adj.","meaning":"即將到來的","phrase":"upcoming event","category":"活動與娛樂","id":"w0891","number":891,"examples":[{"en":"The upcoming event is on our website.","zh":"即將舉辦的活動已刊登在我們的網站上。"},{"en":"The company announced several upcoming product launches at the conference.","zh":"公司在會議上宣布了幾個即將發布的新產品。"}],"tips":["常見搭配詞組：此單字最常修飾活動、會議或日期，如 upcoming event (即將到來的活動)、upcoming election (即將舉行的選舉) 或 upcoming merger (即將進行的合併)。"],"forms":["upcoming","more upcoming","most upcoming"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"annual","pos":"adj.","meaning":"每年的；年度的","phrase":"annual event","category":"活動與娛樂","id":"w0892","number":892,"examples":[{"en":"The annual festival is held in June.","zh":"年度節慶活動在六月舉行。"},{"en":"The company will hold its annual shareholders' meeting next Thursday.","zh":"公司將於下週四舉行年度股東大會。"}],"tips":["常見搭配詞：'annual report' (年度報告)、'annual general meeting' (股東週年大會)、'annual leave' (年假) 及 'annual budget' (年度預算)。"],"forms":["annual","more annual","most annual"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"monthly","pos":"adj./adv.","meaning":"每月的；每月","phrase":"monthly meeting","category":"活動與娛樂","id":"w0893","number":893,"examples":[{"en":"The monthly meeting is tomorrow.","zh":"每月例行會議就在明天。"},{"en":"We receive monthly sales reports from each department.","zh":"我們從各部門收到每月銷售報告。"}],"tips":["詞性雙重身分：monthly 兼具形容詞（如 monthly report 每月報告）與副詞（如 billed monthly 按月計費）的功能，在多益文法題中，需判斷其修飾名詞或動詞來決定語序。"],"forms":["monthly","more monthly","most monthly"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"local","pos":"adj.","meaning":"當地的","phrase":"local event","category":"活動與娛樂","id":"w0894","number":894,"examples":[{"en":"Local artists will join the exhibition.","zh":"當地藝術家將參加展覽。"},{"en":"The company is committed to sourcing materials from local suppliers.","zh":"公司致力於從當地供應商處採購物料。"}],"tips":["詞性靈活用法：local 可作形容詞（當地的）或名詞（當地居民）。在 Part 5 短句填空時，需注意其位置，若在名詞前則為形容詞，若接在定冠詞 the 後且為複數則常作名詞。"],"forms":["local","more local","most local"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"public","pos":"adj./n.","meaning":"公開的；大眾","phrase":"open to the public","category":"活動與娛樂","id":"w0895","number":895,"examples":[{"en":"The public meeting will start soon.","zh":"公開會議很快就會開始。"},{"en":"The company released a public statement addressing the recent allegations.","zh":"公司發布了一份公開聲明，以回應最近的指控。"}],"tips":["常見搭配詞：在多益中頻繁出現 public relations (公關)、public transportation (大眾運輸) 及 public speaking (公開演說)。"],"forms":["public","more public","most public","publics"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"private","pos":"adj.","meaning":"私人舉辦的；非公開的","phrase":"private event","category":"活動與娛樂","id":"w0896","number":896,"examples":[{"en":"This is a private event.","zh":"這是一場非公開活動。"},{"en":"Please keep this information private until the official announcement.","zh":"請在正式公告前將此資訊保密。"}],"tips":["常見搭配詞：在 TOEIC 閱讀中，'private sector' (私營部門) 常與 'public sector' (公營部門) 對比出現；'private property' (私有財產) 與 'private investigator' (私家偵探) 也是常見組合。"],"forms":["private","more private","most private"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cultural","pos":"adj.","meaning":"文化的","phrase":"cultural event","category":"活動與娛樂","id":"w0897","number":897,"examples":[{"en":"The city hosts many cultural events.","zh":"這座城市舉辦許多文化活動。"},{"en":"We visited a cultural center yesterday.","zh":"我們昨天參觀了一座文化中心。"}],"tips":["常見搭配詞：cultural diversity (文化多樣性)、cultural heritage (文化遺產)、cross-cultural communication (跨文化溝通)，在閱讀測驗中常出現在人力資源或國際市場擴張的文章中。"],"forms":["cultural","more cultural","most cultural"],"exampleSource":"Wordstep original examples"},{"word":"recreational","pos":"adj.","meaning":"休閒的；娛樂的","phrase":"recreational activities","category":"活動與娛樂","id":"w0898","number":898,"examples":[{"en":"Recreational activities are available in the park.","zh":"公園內有休閒活動可以參加。"},{"en":"We need to allocate a budget for recreational activities to boost employee morale.","zh":"我們需要撥款用於休閒活動，以提高員工士氣。"}],"tips":["常見搭配詞：此單字最常出現在 'recreational activities' (休閒活動) 或 'recreational facilities' (休閒設施) 詞組中，常用於描述公司福利或飯店設施，是 Part 5 詞彙題的常客。"],"forms":["recreational","more recreational","most recreational"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"activity","pos":"n.","meaning":"活動","phrase":"group activity","category":"活動與娛樂","id":"w0899","number":899,"examples":[{"en":"The activity is suitable for children.","zh":"這個活動適合兒童。"},{"en":"The company organized a team-building activity to improve employee morale.","zh":"公司組織了一項團隊建設活動以提升員工士氣。"}],"tips":["常見搭配詞與短語：TOEIC 閱讀中常出現 'outdoor activities'（戶外活動）、'economic activity'（經濟活動）及 'promotional activities'（促銷活動）。考生應熟悉這些組合以快速識別語意。"],"forms":["activity","activities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"entertain","pos":"v.","meaning":"娛樂；招待","phrase":"entertain guests","category":"活動與娛樂","id":"w0900","number":900,"examples":[{"en":"The band will entertain the guests.","zh":"樂團將為賓客表演助興。"},{"en":"The company hosted a gala dinner to entertain potential investors.","zh":"公司舉辦了一場盛大的晚宴，以款待潛在投資者。"}],"tips":["多重語意辨析：在多益考試中，除了大眾熟悉的「娛樂」外，更常出現在商務招待（entertaining clients）或「考慮/受理事物」（如 entertain a proposal/offer）的情境中。"],"forms":["entertain","entertains","entertaining","entertained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"health","pos":"n.","meaning":"健康","phrase":"health care","category":"健康與日常服務","id":"w0901","number":901,"examples":[{"en":"Your health is important.","zh":"你的健康很重要。"},{"en":"The company offers comprehensive health insurance to all full-time employees.","zh":"公司為所有全職員工提供全面的健康保險。"}],"tips":["常見搭配詞：多益考試中常出現 'health insurance' (醫療保險)、'health benefits' (健康福利) 與 'health check-up' (健康檢查)，這些字組常出現在人力資源 (HR) 或公司福利政策的篇章中。"],"forms":["health","healths"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"medical","pos":"adj.","meaning":"醫療的","phrase":"medical services","category":"健康與日常服務","id":"w0902","number":902,"examples":[{"en":"Medical services are available nearby.","zh":"附近有提供醫療服務。"},{"en":"The company offers comprehensive medical insurance for all employees.","zh":"公司為所有員工提供全面的醫療保險。"}],"tips":["常見搭配詞：在多益考試中，medical 常與其他名詞結合形成複合名詞，例如『medical check-up』（健康檢查）、『medical records』（病歷）、『medical insurance』（醫療保險）及『medical leave』（病假）。"],"forms":["medical","more medical","most medical"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"clinic","pos":"n.","meaning":"診所","phrase":"local clinic","category":"健康與日常服務","id":"w0903","number":903,"examples":[{"en":"The clinic is open this evening.","zh":"診所今天晚上有看診。"},{"en":"The company offers health insurance that covers visits to local clinics.","zh":"公司提供的健康保險涵蓋了前往當地診所就診的費用。"}],"tips":["常見搭配詞：'walk-in clinic' (不需預約的診所)、'dental clinic' (牙科診所) 與 'clinic hours' (看診時間)。"],"forms":["clinic","clinics"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hospital","pos":"n.","meaning":"醫院","phrase":"local hospital","category":"健康與日常服務","id":"w0904","number":904,"examples":[{"en":"The nearest hospital is two blocks away.","zh":"最近的醫院在兩個街區外。"},{"en":"She works at a local hospital.","zh":"她在當地的一家醫院工作。"}],"tips":["常見搭配詞：常與 'admitted to' (入院) 或 'discharged from' (出院) 連用，在聽力測驗中若聽到這些片語，通常與健康狀況或病假有關。"],"forms":["hospital","hospitals"],"exampleSource":"Wordstep original examples"},{"word":"doctor","pos":"n.","meaning":"醫師","phrase":"see a doctor","category":"健康與日常服務","id":"w0905","number":905,"examples":[{"en":"The doctor will see you next.","zh":"醫師接下來會看你的診。"},{"en":"The company provides comprehensive health insurance, including coverage for doctors' visits.","zh":"公司提供全面的健康保險，包括就診醫生的費用。"}],"tips":["常見搭配詞：'doctor's appointment' (預約看診) 與 'doctor's note' (醫生證明)。在多益閱讀 Part 7 中，醫生證明常作為請病假 (sick leave) 的必要憑證，是商務辦公情境的高頻單字。"],"forms":["doctor","doctors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"physician","pos":"n.","meaning":"醫師","phrase":"consult a physician","category":"健康與日常服務","id":"w0906","number":906,"examples":[{"en":"The physician is available this afternoon.","zh":"醫師今天下午有空。"},{"en":"The company provides comprehensive health insurance coverage for all employees, including physicians.","zh":"公司為所有員工提供全面的健康保險給付，包括醫生。"}],"tips":["易混淆詞辨析：最常與 physicist (物理學家) 混淆。請記住 -cian 字尾通常表示職業身份 (如 musician)，physician 專指「內科醫生」；而 physicist 則源自 physics (物理學)。"],"forms":["physician","physicians"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"nurse","pos":"n.","meaning":"護理師","phrase":"registered nurse","category":"健康與日常服務","id":"w0907","number":907,"examples":[{"en":"The nurse will call your name.","zh":"護理師會叫你的名字。"},{"en":"The nurse administered the medication to the patient according to the doctor's instructions.","zh":"護士按照醫生的指示給病人服用藥物。"}],"tips":["名詞與動詞雙重身分：在 TOEIC 中最常用作名詞表示「護理師」，但要注意動詞用法意為「照料」或「看顧」，在 Part 7 的長篇文章中若提到照顧病患或老人的情境時常會出現。"],"forms":["nurse","nurses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"patient","pos":"n.","meaning":"病患","phrase":"patient information","category":"健康與日常服務","id":"w0908","number":908,"examples":[{"en":"The patient is waiting outside.","zh":"病患正在外面等候。"},{"en":"The customer service representative needs to be patient with difficult clients.","zh":"客戶服務代表需要對難纏的客戶保持耐心。"}],"tips":["詞性與雙重字義：在多益考試中，patient 同時具備形容詞「有耐心的」與名詞「病人」兩種身份。閱讀測驗中，若出現於醫療保險或醫院場景多指名詞；若出現於客服應對或教育訓練，則多指形容詞。"],"forms":["patient","more patient","most patient","patients"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"examination","pos":"n.","meaning":"檢查；檢驗","phrase":"medical examination","category":"健康與日常服務","id":"w0909","number":909,"examples":[{"en":"The examination will take twenty minutes.","zh":"檢查將需要二十分鐘。"},{"en":"The department implemented innovative examination procedures to improve operational efficiency.","zh":"部門實施創新的examination程序以提高營運效率。"}],"tips":["常見搭配詞與縮寫：在 TOEIC 考試中，examination 常見於 'medical examination' (體格檢查) 或 'physical examination'。聽力測驗中常以縮寫 'exam' 出現，需根據上下文判斷是指『考試』還是『檢查』。"],"forms":["examination"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"examine","pos":"v.","meaning":"檢查；診察","phrase":"examine a patient","category":"健康與日常服務","id":"w0910","number":910,"examples":[{"en":"The doctor will examine your knee.","zh":"醫師會檢查你的膝蓋。"},{"en":"The auditor will examine the company's financial records to ensure accuracy.","zh":"審計師將仔細檢查公司的財務記錄，以確保準確性。"}],"tips":["常見搭配詞與短語：考生應熟記「examine the feasibility (評估可行性)」、「examine the documents (審核文件)」及「examine the contract (檢查合約)」，這些是商務閱讀中極高頻的組合。"],"forms":["examine","examines","examining","examined"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"treatment","pos":"n.","meaning":"治療；療程","phrase":"medical treatment","category":"健康與日常服務","id":"w0911","number":911,"examples":[{"en":"The doctor explained the treatment to me.","zh":"醫生向我說明了治療方式。"},{"en":"Does my insurance cover this treatment?","zh":"我的保險有給付這項治療嗎？"}],"tips":["多重語義辨析：在 TOEIC 考試中，treatment 常見於三種主要情境：醫療（治療，如 medical treatment）、工業/環境（處理，如 water treatment plant 水處理廠）以及商務/人際（對待方式，如 preferential treatment 優惠待遇）。考生需根據上下文判斷其確切含義。"],"forms":["treatment","treatments","treats","treating","treated"],"exampleSource":"Wordstep original examples"},{"word":"treat","pos":"v.","meaning":"治療；處理","phrase":"treat a patient","category":"健康與日常服務","id":"w0912","number":912,"examples":[{"en":"The clinic can treat this condition.","zh":"這間診所可以治療這種病症。"},{"en":"We need to treat this customer complaint with utmost care and attention.","zh":"我們需要以極大的小心和關注來處理這項客戶投訴。"}],"tips":["多重語義辨析：在多益考試中，「treat」常考的三種語義為「對待/處理」、「醫治」及「招待」。在 Part 7 閱讀中，需根據上下文判斷是處理商務問題還是醫療行為。"],"forms":["treat","treats","treating","treated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"medicine","pos":"n.","meaning":"藥物；醫藥","phrase":"take medicine","category":"健康與日常服務","id":"w0913","number":913,"examples":[{"en":"The medicine is in the bag.","zh":"藥在袋子裡。"},{"en":"The company provides comprehensive health insurance, including coverage for prescription medicines.","zh":"公司提供全面的健康保險，包括處方藥品的保險。"}],"tips":["常見搭配詞：'take medicine' (服用藥物) 為固定搭配，切勿使用 eat。常見組合還有 'cough medicine' (止咳藥) 與 'practice medicine' (行醫)。"],"forms":["medicine","medicines"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"medication","pos":"n.","meaning":"藥物","phrase":"take medication","category":"健康與日常服務","id":"w0914","number":914,"examples":[{"en":"Your medication is ready to collect.","zh":"你的藥已經可以領取了。"},{"en":"The nurse prepared the patient's morning medication.","zh":"護士準備了病人早上的藥物。"}],"tips":["常見搭配詞：常用的動詞搭配為 'take medication' (服藥)、'prescribe medication' (開藥) 以及 'be on medication' (正在接受藥物治療)。注意在英文中「吃藥」不使用 eat，而必須使用 take。"],"forms":["medication","medications"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"prescription","pos":"n.","meaning":"處方；處方箋","phrase":"fill a prescription","category":"健康與日常服務","id":"w0915","number":915,"examples":[{"en":"A prescription is required for this medicine.","zh":"這種藥需要處方箋。"},{"en":"Please present your prescription to the pharmacist before the medication can be dispensed.","zh":"在藥物可以發放之前，請向藥劑師出示您的處方箋。"}],"tips":["常見搭配詞：考生應熟記「fill a prescription」（按處方抓藥）此一片語，在聽力測驗中常出現於前往藥局（pharmacy）的情境；此外，「prescription drugs/medication」（處方藥）也是核心詞彙。"],"forms":["prescription","prescriptions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pharmacy","pos":"n.","meaning":"藥局","phrase":"local pharmacy","category":"健康與日常服務","id":"w0916","number":916,"examples":[{"en":"The pharmacy is next to the clinic.","zh":"藥局在診所旁邊。"},{"en":"The company is expanding its retail presence by opening new pharmacies in strategic locations.","zh":"該公司正透過在戰略地點開設新的藥局來擴展其零售業務。"}],"tips":["常見搭配詞與短語：'fill a prescription' (按處方配藥) 是多益最常考的用法，其他如 'pharmacy technician' (藥劑助理) 或 'local pharmacy' (當地藥局) 也經常出現。"],"forms":["pharmacy","pharmacies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pharmacist","pos":"n.","meaning":"藥師","phrase":"ask a pharmacist","category":"健康與日常服務","id":"w0917","number":917,"examples":[{"en":"The pharmacist can answer your questions.","zh":"藥師可以回答你的問題。"},{"en":"The company is seeking a qualified pharmacist to manage the in-house pharmacy.","zh":"公司正在尋找一位合格的藥師來管理公司內的藥房。"}],"tips":["常見搭配詞：常用於 'consult a pharmacist' (諮詢藥劑師) 或 'licensed pharmacist' (執業藥劑師)；動詞常搭配 'fill a prescription' (按處方配藥)，這是多益醫療情境的高頻考點。"],"forms":["pharmacist","pharmacists"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"symptom","pos":"n.","meaning":"症狀","phrase":"common symptoms","category":"健康與日常服務","id":"w0918","number":918,"examples":[{"en":"This symptom should be reported to the doctor.","zh":"這個症狀應該告知醫師。"},{"en":"Early symptoms of burnout often include increased irritability and difficulty concentrating.","zh":"倦怠的早期症狀通常包括易怒和注意力不集中。"}],"tips":["常見搭配詞：symptom 常與動詞 display, exhibit, relieve, treat 連用，形容詞常搭配 mild (輕微的) 或 severe (嚴重的)。在閱讀測驗中，'relieve symptoms' (緩解症狀) 常出現在藥品廣告或醫療福利手冊中。"],"forms":["symptom","symptoms"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"illness","pos":"n.","meaning":"疾病；生病","phrase":"recover from an illness","category":"健康與日常服務","id":"w0919","number":919,"examples":[{"en":"The illness has kept him at home.","zh":"他因為生病而待在家裡。"},{"en":"The company offers sick leave to employees experiencing an illness.","zh":"公司為因病請假員工提供病假。"}],"tips":["常見搭配詞：常與形容詞連用，如 'sudden illness' (突發疾病)、'chronic illness' (慢性病) 或 'mental illness' (心理疾病)，動詞則常搭配 'suffer from illness' (受疾病之苦)。"],"forms":["illness","illnesses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"injury","pos":"n.","meaning":"受傷；傷勢","phrase":"workplace injury","category":"健康與日常服務","id":"w0920","number":920,"examples":[{"en":"The injury will be checked today.","zh":"今天會檢查傷勢。"},{"en":"The company is providing compensation for the employee's work-related injury.","zh":"公司正在為員工因工作受到的傷害提供賠償。"}],"tips":["常見搭配詞：常與 sustain 或 suffer 連用，形成 sustain an injury (受傷)；形容詞常搭配 minor (輕微) 或 severe (嚴重) 來描述程度。"],"forms":["injury","injuries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"emergency","pos":"n./adj.","meaning":"緊急狀況；緊急的","phrase":"emergency services","category":"健康與日常服務","id":"w0921","number":921,"examples":[{"en":"The emergency exit is at the back.","zh":"緊急出口在後方。"},{"en":"In case of an emergency, please contact security immediately.","zh":"若發生緊急狀況，請立即聯繫保全人員。"}],"tips":["常見搭配詞：'emergency exit' (緊急出口)、'emergency procedures' (緊急程序)、'emergency contact' (緊急聯絡人)，在閱讀測驗 Part 7 的辦公室安全規範中極常出現。"],"forms":["emergency","emergencies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"coverage","pos":"n.","meaning":"保障範圍；保險範圍","phrase":"insurance coverage","category":"健康與日常服務","id":"w0922","number":922,"examples":[{"en":"Your insurance coverage includes this service.","zh":"你的保險保障範圍包含這項服務。"},{"en":"The marketing campaign's coverage extended to several major news outlets.","zh":"這次行銷活動的報導範圍涵蓋了多家主要新聞媒體。"}],"tips":["保險情境中的核心詞彙：在 TOEIC 閱讀的保險或合約中，coverage 常指『保險範圍』或『承保項目』，常見搭配詞如 comprehensive coverage (全險) 或 liability coverage (責任險)，考生需識別其在保單中的具體含義。"],"forms":["coverage","coverages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"wellness","pos":"n.","meaning":"健康；身心保健","phrase":"wellness program","category":"健康與日常服務","id":"w0923","number":923,"examples":[{"en":"The wellness program is open to all staff.","zh":"所有員工都可以參加健康促進計畫。"},{"en":"Achieving a good work-life balance is crucial for overall wellness.","zh":"實現良好的工作與生活平衡對全面的身心健康至關重要。"}],"tips":["常見搭配詞組：最常出現於 corporate wellness program (企業健康計畫)、wellness center (健身/健康中心) 以及 health and wellness (身心健康) 等組合中。"],"forms":["wellness"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"exercise","pos":"n./v.","meaning":"運動；鍛鍊","phrase":"regular exercise","category":"健康與日常服務","id":"w0924","number":924,"examples":[{"en":"The exercise class will begin at six.","zh":"運動課程將在六點開始。"},{"en":"The manager asked the team to exercise caution when handling sensitive data.","zh":"經理要求團隊在處理敏感數據時要謹慎行事。"}],"tips":["多義性辨析：在多益考試中，除了基礎的「運動」含義外，常考查其作為動詞表示「行使」或「運用」的用法，例如 exercise authority (行使職權) 或 exercise caution (保持謹慎)。"],"forms":["exercise","exercises","exercising","exercised"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"membership","pos":"n.","meaning":"會員資格","phrase":"gym membership","category":"健康與日常服務","id":"w0925","number":925,"examples":[{"en":"Your membership will expire next month.","zh":"你的會員資格將於下個月到期。"},{"en":"Employees are eligible for gym memberships as part of their benefits package.","zh":"員工可以享有健身會員資格，作為其福利方案的一部分。"}],"tips":["常見搭配詞：包括 membership fee (會費)、membership card (會員卡) 以及 membership renewal (會籍續約)。在 Part 5 或 Part 6 的填空題中，若看到 fee 或 renewal，前方常選 membership。"],"forms":["membership","memberships"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"member","pos":"n.","meaning":"會員；成員","phrase":"club member","category":"健康與日常服務","id":"w0926","number":926,"examples":[{"en":"Each member can bring one guest.","zh":"每位會員可以帶一位客人。"},{"en":"All members are required to attend the annual general meeting.","zh":"所有會員都必須參加年度會員大會。"}],"tips":["常見搭配詞：常出現在複合名詞中，例如 board member（董事會成員）、staff member（員工）或 faculty member（教職員）。在行政手續中，常考 membership application（入會申請）與 membership renewal（會員續約）。"],"forms":["member","members"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"salon","pos":"n.","meaning":"美容院；美髮店","phrase":"hair salon","category":"健康與日常服務","id":"w0927","number":927,"examples":[{"en":"The salon is open on Sundays.","zh":"美髮店星期日有營業。"},{"en":"She booked an appointment at the salon for a haircut and facial.","zh":"她預約了在美髮沙龍剪頭髮和做臉。"}],"tips":["常見搭配詞：'hair salon' (美髮院)、'beauty salon' (美容院)、'nail salon' (美甲店)、'book a salon appointment' (預約沙龍)，此單字頻繁出現在服務業的對話與廣告中。"],"forms":["salon","salons"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"haircut","pos":"n.","meaning":"理髮；髮型修剪","phrase":"get a haircut","category":"健康與日常服務","id":"w0928","number":928,"examples":[{"en":"I need a haircut before the interview.","zh":"面試前我需要理髮。"},{"en":"How much does a haircut cost?","zh":"理髮要多少錢？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"cleaning","pos":"n.","meaning":"清潔；清洗服務","phrase":"cleaning service","category":"健康與日常服務","id":"w0929","number":929,"examples":[{"en":"The cleaning service will arrive at nine.","zh":"清潔服務人員將於九點到達。"},{"en":"Before the meeting, please ensure the conference room is thoroughly cleaned.","zh":"在會議前，請確保會議室已徹底清潔。"}],"tips":["常見搭配詞組：'cleaning service' (清潔服務)、'dry cleaning' (乾洗)、'cleaning supplies' (清潔用品)、'deep cleaning' (徹底清潔)。這些詞組在對話與書信中出現頻率極高。"],"forms":["cleaning","cleanings","cleans","cleaned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cleaner","pos":"n.","meaning":"清潔人員；清潔用品","phrase":"professional cleaner","category":"健康與日常服務","id":"w0930","number":930,"examples":[{"en":"The cleaner is on the second floor.","zh":"清潔人員在二樓。"},{"en":"The office manager hired two cleaners to ensure the workspace is spotless.","zh":"辦公室經理僱用了兩名清潔人員，以確保工作場所一塵不染。"}],"tips":["多義性辨析：在 TOEIC 考試中 cleaner 同時具備「清潔工」與「清潔劑/工具」兩種含意。在第一部分聽力圖片題中，常指正在執行清潔任務的人員；在第七部分閱讀中，則可能指辦公室採購的清潔產品。"],"forms":["cleaner","cleaners"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dry-cleaning","pos":"n.","meaning":"乾洗","phrase":"dry-cleaning service","category":"健康與日常服務","id":"w0931","number":931,"examples":[{"en":"The hotel offers a dry-cleaning service.","zh":"飯店提供乾洗服務。"},{"en":"Your dry-cleaning will be ready tomorrow.","zh":"你的乾洗衣物明天就會洗好。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"mechanic","pos":"n.","meaning":"技師；汽車維修人員","phrase":"auto mechanic","category":"健康與日常服務","id":"w0932","number":932,"examples":[{"en":"The mechanic will inspect your car.","zh":"汽車維修技師會檢查你的車。"},{"en":"Department heads discussed the mechanic strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了mechanic策略。"}],"tips":["常見搭配詞：auto mechanic (汽車技工)、skilled mechanic (技術熟練的技工)、aircraft mechanic (飛機維修員)。"],"forms":["mechanic"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"service center","pos":"n.","meaning":"服務中心；維修中心","phrase":"authorized service center","category":"健康與日常服務","id":"w0933","number":933,"examples":[{"en":"Please take your laptop to the service center.","zh":"請把你的筆記型電腦送到維修中心。"},{"en":"The service center closes at six.","zh":"服務中心六點關門。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"servicing","pos":"n.","meaning":"保養；維修服務","phrase":"vehicle servicing","category":"健康與日常服務","id":"w0934","number":934,"examples":[{"en":"The car needs regular servicing.","zh":"這輛車需要定期保養。"},{"en":"Servicing is included in the contract.","zh":"合約包含保養服務。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"pickup","pos":"n.","meaning":"取件；接送","phrase":"pickup service","category":"健康與日常服務","id":"w0935","number":935,"examples":[{"en":"Your order is ready for pickup.","zh":"你的訂單已準備好，可以取貨。"},{"en":"Can I arrange an airport pickup?","zh":"我可以安排機場接送嗎？"}],"tips":["多重語義辨析：在 TOEIC 考試中，'pick up' 最常以動詞短語出現，包含『接送某人』、 『領取物品/包裹』或『業務好轉』(e.g., Sales are starting to pick up)，考生需透過上下文判斷其特定含意。"],"forms":["pickup","pickups","picks up","picking up","picked up"],"exampleSource":"Wordstep original examples"},{"word":"convenience","pos":"n.","meaning":"便利；方便","phrase":"for your convenience","category":"健康與日常服務","id":"w0936","number":936,"examples":[{"en":"Online booking is offered for your convenience.","zh":"提供線上預約是為了方便你使用。"},{"en":"Online banking provides the convenience of managing your finances from anywhere.","zh":"網路銀行提供了隨時隨地管理財務的便利性。"}],"tips":["商業書信高頻短語：最常出現在 Part 6 與 Part 7 的固定用法為 'at your earliest convenience'，意指 '在您方便時儘早'，是要求對方回信或行動時的禮貌用語。"],"forms":["convenience","conveniences"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"convenient","pos":"adj.","meaning":"方便的；便利的","phrase":"convenient location","category":"健康與日常服務","id":"w0937","number":937,"examples":[{"en":"Is Friday convenient for you?","zh":"星期五對你方便嗎？"},{"en":"This hotel is in a convenient location.","zh":"這家飯店的位置很便利。"}],"tips":["常見搭配詞：常用於 'convenient location' (便利的地點) 或 'convenient time' (方便的時間)，在多益閱讀測驗的商務書信中極為常見。"],"forms":["convenient","more convenient","most convenient"],"exampleSource":"Wordstep original examples"},{"word":"neighborhood","pos":"n.","meaning":"社區；鄰近地區","phrase":"local neighborhood","category":"健康與日常服務","id":"w0938","number":938,"examples":[{"en":"The neighborhood is quiet.","zh":"這個社區很安靜。"},{"en":"The company is planning to expand its operations into a new neighborhood.","zh":"公司計畫將其業務擴展到一個新的社區。"}],"tips":["詞彙辨析：須明確區分 neighbor (名詞，指人，鄰居) 與 neighborhood (名詞，指地區，鄰近地區/社區)。多益聽力測驗常利用兩者音近的特性設置陷阱。"],"forms":["neighborhood","neighborhoods"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"community","pos":"n.","meaning":"社區；地方居民","phrase":"community center","category":"健康與日常服務","id":"w0939","number":939,"examples":[{"en":"The community center is open today.","zh":"社區中心今天有開放。"},{"en":"Our company is committed to supporting the local community through various charitable initiatives.","zh":"我們公司致力於透過各種慈善活動來支持當地社群。"}],"tips":["常見搭配詞：'local community' (當地社區)、'business community' (商業界)、'community center' (社區中心)、'community outreach' (社區推廣/外展服務)。"],"forms":["community","communities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"resident","pos":"n.","meaning":"居民；住戶","phrase":"local resident","category":"健康與日常服務","id":"w0940","number":940,"examples":[{"en":"Each resident will receive a notice.","zh":"每位住戶都會收到通知。"},{"en":"The apartment complex has over 200 residents.","zh":"這棟公寓大樓有超過 200 位住戶。"}],"tips":["常見搭配詞組：'local resident' (當地居民)、'permanent resident' (永久居民) 及 'resident physician' (住院醫師)。在多益中常出現在公告 (Notice) 標題，如 'Information for Residents'。"],"forms":["resident","residents"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"household","pos":"n./adj.","meaning":"家庭；家用的","phrase":"household services","category":"健康與日常服務","id":"w0941","number":941,"examples":[{"en":"Each household will receive one form.","zh":"每個家庭都會收到一份表格。"},{"en":"Our marketing campaign targets households with young children.","zh":"我們的行銷活動針對有年幼子女的家庭。"}],"tips":["常見搭配詞組：常用於形容詞或名詞。常見搭配包括 household appliance (家電用品)、household income (家庭總收入) 以及 household name (家喻戶曉的品牌或人物)。"],"forms":["household","households"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"respond","pos":"v.","meaning":"回應；處理","phrase":"respond to a request","category":"健康與日常服務","id":"w0942","number":942,"examples":[{"en":"We will respond within one day.","zh":"我們會在一天內回覆。"},{"en":"The company will respond to your application within two weeks.","zh":"公司會在兩週內回覆您的申請。"}],"tips":["固定搭配：respond 為不及物動詞，在接賓語時必須加上介系詞 to (例如 respond to the email)，這是 Part 5 詞彙與語法題的經典考點。"],"forms":["respond","responds","responding","responded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"plumber","pos":"n.","meaning":"水管工","phrase":"call a plumber","category":"健康與日常服務","id":"w0943","number":943,"examples":[{"en":"The plumber will arrive this afternoon.","zh":"水管工將於今天下午到達。"},{"en":"The building manager hired a plumber to fix the leaking pipe in the office kitchen.","zh":"大樓經理僱請了一位水管工，負責修理辦公室廚房漏水的管子。"}],"tips":["發音與聽力要點：字母 b 不發音（/ˈplʌm.ər/），聽力測驗中常出現在 Part 1 圖片題或 Part 3 辦公室維修對話。"],"forms":["plumber","plumbers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"electrician","pos":"n.","meaning":"電工","phrase":"hire an electrician","category":"健康與日常服務","id":"w0944","number":944,"examples":[{"en":"The electrician is checking the lights.","zh":"電工正在檢查燈具。"},{"en":"The electrician installed the new lighting fixtures quickly and efficiently.","zh":"那位電力技師快速有效地安裝了新的照明設備。"}],"tips":["常見搭配詞：'certified/licensed electrician' (持照電工)、'hire an electrician' (僱用電工)、'call an electrician' (聯繫電工)。"],"forms":["electricians"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"specialist","pos":"n.","meaning":"專業人員；專家","phrase":"service specialist","category":"健康與日常服務","id":"w0945","number":945,"examples":[{"en":"The specialist is available on Thursday.","zh":"專家星期四有空。"},{"en":"The company hired a marketing specialist to develop a new advertising campaign.","zh":"公司聘請了一位行銷專家來開發新的廣告活動。"}],"tips":["常見搭配詞與職稱：在多益中常以職稱形式出現，如 IT specialist (資訊專家) 或 Marketing specialist (行銷專員)，並常搭配介系詞 in，例如 a specialist in renewable energy。"],"forms":["specialist","specialists"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consultation","pos":"n.","meaning":"諮詢；會診","phrase":"schedule a consultation","category":"健康與日常服務","id":"w0946","number":946,"examples":[{"en":"The consultation will last thirty minutes.","zh":"諮詢將持續三十分鐘。"},{"en":"Before making a significant investment, it's advisable to seek professional financial consultation.","zh":"在做出重大投資之前，建議尋求專業的財務諮詢。"}],"tips":["常見搭配詞組：常用於 'in consultation with'（與...協商/商議）、'provide/offer a consultation'（提供諮詢服務）或 'consultation fee'（諮詢費）。"],"forms":["consultation","consultations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consult","pos":"v.","meaning":"諮詢；請教","phrase":"consult a specialist","category":"健康與日常服務","id":"w0947","number":947,"examples":[{"en":"You can consult a specialist about this problem.","zh":"你可以就這個問題諮詢專家。"},{"en":"Before making a final decision, we should consult with our legal counsel.","zh":"在做出最終決定之前，我們應該諮詢我們的法律顧問。"}],"tips":["常見搭配詞：consult a specialist/expert (諮詢專家)、consult a manual/handbook (查閱手冊)、consult with a colleague (與同事商議)。"],"forms":["consult","consults","consulting","consulted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"support","pos":"n./v.","meaning":"支援；協助","phrase":"customer support","category":"健康與日常服務","id":"w0948","number":948,"examples":[{"en":"Our support team can help you.","zh":"我們的支援團隊可以幫助你。"},{"en":"The company provides technical support to its clients 24/7.","zh":"該公司為客戶提供全天候的技術支援。"}],"tips":["常見搭配詞：多益考試中常出現 customer support (客戶支援)、technical support (技術支援) 與 provide/offer financial support (提供財務支持)。"],"forms":["support","supports","supporting","supported"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"provider","pos":"n.","meaning":"服務供應商","phrase":"service provider","category":"健康與日常服務","id":"w0949","number":949,"examples":[{"en":"The service provider will contact you.","zh":"服務供應商會聯絡你。"},{"en":"Our company is seeking a reliable internet provider with competitive pricing.","zh":"我們公司正在尋找一家具有競爭力價格的可靠網路供應商。"}],"tips":["常見搭配詞：在多益考試中常出現 service provider (服務供應商)、healthcare provider (醫療服務提供者) 及 Internet Service Provider (網路服務供應商/ISP)。"],"forms":["provider","providers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"routine","pos":"adj./n.","meaning":"例行的；例行程序","phrase":"routine checkup","category":"健康與日常服務","id":"w0950","number":950,"examples":[{"en":"This is a routine check.","zh":"這是一項例行檢查。"},{"en":"The morning routine includes checking emails and prioritizing tasks.","zh":"早晨的例行程序包括檢查電子郵件和優先處理任務。"}],"tips":["常見搭配詞與用法：'daily routine' (日常例行公事)、'routine maintenance' (定期維修) 以及 'establish a routine' (建立例行程序)，在多益中常出現在描述辦公室流程或維修公告。"],"forms":["routine","routines"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"require","pos":"v.","meaning":"需要；要求","phrase":"require approval","category":"跨情境高頻字彙","id":"w0951","number":951,"examples":[{"en":"The repairs will require more time.","zh":"維修將需要更多時間。"},{"en":"The company requires all employees to attend the mandatory safety training.","zh":"公司要求所有員工參加強制性的安全培訓。"}],"tips":["常見句型與搭配詞：在多益中常以被動語態出現，如 be required to + 原型動詞（被要求做某事）。此外，也常見 require + 受詞 + to + 原型動詞 的用法。"],"forms":["require","requires","requiring","required"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"provide","pos":"v.","meaning":"提供","phrase":"provide information","category":"跨情境高頻字彙","id":"w0952","number":952,"examples":[{"en":"We can provide more information.","zh":"我們可以提供更多資訊。"},{"en":"Please provide all necessary documents for the visa application.","zh":"請提供所有簽證申請所需的必要文件。"}],"tips":["掌握句型結構：最常考的句型為「provide someone with something」或「provide something for/to someone」，介系詞 with 和 for/to 是文法測驗中的高頻考點。"],"forms":["provide","provides","providing","provided"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"remain","pos":"v.","meaning":"保持；仍然是","phrase":"remain available","category":"跨情境高頻字彙","id":"w0953","number":953,"examples":[{"en":"The store will remain open until ten.","zh":"商店將持續營業到十點。"},{"en":"The inventory levels remain sufficient to meet the forecasted demand.","zh":"庫存量仍足以滿足預測需求。"}],"tips":["連綴動詞特性：remain 在多益中最常作為連綴動詞（Linking Verb）出現，後方必須接「形容詞」而非副詞。常見考點如 remain competitive（保持競爭力）或 remain silent（保持沈默），在 Part 5 填空題中常誤選副詞。"],"forms":["remain","remains","remaining","remained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"expect","pos":"v.","meaning":"預期；期待","phrase":"expect an increase","category":"跨情境高頻字彙","id":"w0954","number":954,"examples":[{"en":"You can expect a reply tomorrow.","zh":"你可以預期明天收到回覆。"},{"en":"We expect a significant increase in sales during the holiday season.","zh":"我們預期在假期期間會有顯著的銷量增長。"}],"tips":["掌握核心語法結構：expect 常見用法為「expect someone to do something」或被動語態「be expected to + 原形動詞」，在 Part 5 詞彙或語法題中，常考受詞後接不定詞的用法。"],"forms":["expect","expects","expecting","expected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"allow","pos":"v.","meaning":"允許；讓","phrase":"allow access","category":"跨情境高頻字彙","id":"w0955","number":955,"examples":[{"en":"The manager may allow you to leave early.","zh":"經理可能會允許你提早離開。"},{"en":"Our system does not allow unauthorized access to confidential files.","zh":"我們的系統不允許未授權人士存取機密檔案。"}],"tips":["核心文法結構：'allow + 受詞 + to + 原形動詞' 是多益文法題（Part 5 & 6）極高頻的考點，務必記住其後接 to-V 而非 V-ing。"],"forms":["allow","allows","allowing","allowed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"enable","pos":"v.","meaning":"使能夠；讓…可以","phrase":"enable users to access","category":"跨情境高頻字彙","id":"w0956","number":956,"examples":[{"en":"This feature will enable you to save time.","zh":"這個功能會讓你節省時間。"},{"en":"This feature enables users to customize their dashboard for improved productivity.","zh":"此功能使使用者能夠自訂儀錶板以提高生產力。"}],"tips":["核心句型與語法結構：在 TOEIC 考試中，「enable + 受詞 + to + 原形動詞」是最常見的考點。考生須注意其後接的是 to-infinitive 而非動名詞 (V-ing)，這在閱讀測驗的文法題中極為常見。"],"forms":["enable","enables","enabling","enabled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ensure","pos":"v.","meaning":"確保","phrase":"ensure quality","category":"跨情境高頻字彙","id":"w0957","number":957,"examples":[{"en":"The team will ensure that everything is ready.","zh":"團隊會確保一切準備就緒。"},{"en":"To ensure timely delivery, please provide your complete shipping address.","zh":"為了確保準時送達，請提供您的完整收貨地址。"}],"tips":["常見搭配詞與句型：'ensure' 後常接 'that' 子句（如 ensure that all items are in stock）或直接接受詞（如 ensure safety）。多益常考其後接子句以表達『確保某事發生』。"],"forms":["ensure","ensures","ensuring","ensured"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"include","pos":"v.","meaning":"包括；包含","phrase":"include a fee","category":"跨情境高頻字彙","id":"w0958","number":958,"examples":[{"en":"The price will include breakfast.","zh":"價格將包含早餐。"},{"en":"The project budget includes travel expenses and accommodation costs.","zh":"專案預算包含差旅費用和住宿費用。"}],"tips":["常見搭配詞與結構：常用搭配為 'include A in B' (將 A 包含在 B 中) 以及被動態 'be included in'。在商業文件中，常看到 'tax included' (含稅) 或 'inclusive of' (包含...)。"],"forms":["include","includes","including","included"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"contain","pos":"v.","meaning":"包含；容納","phrase":"contain information","category":"跨情境高頻字彙","id":"w0959","number":959,"examples":[{"en":"The box may contain glass items.","zh":"箱子裡可能裝有玻璃物品。"},{"en":"The contract contains several clauses regarding intellectual property rights.","zh":"這份合約包含幾個關於智慧財產權的條款。"}],"tips":["常見搭配詞與情境：在 TOEIC 閱讀中常出現在手冊或報告，如 'contain instructions' (包含說明) 或 'contain confidential information' (包含機密資訊)。"],"forms":["contain","contains","containing","contained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"involve","pos":"v.","meaning":"涉及；包含","phrase":"involve several departments","category":"跨情境高頻字彙","id":"w0960","number":960,"examples":[{"en":"The job will involve some travel.","zh":"這份工作將需要一些出差。"},{"en":"The new policy involves stricter guidelines for employee expenses.","zh":"新的政策涉及更嚴格的員工費用規範。"}],"tips":["常見搭配詞組：最常考的用法為「be involved in」，表示「參與」或「涉及」某事，在閱讀 Part 5 中常考介係詞 in 的搭配；若 involve 後方直接接動詞，則必須使用動名詞（V-ing），例如「The role involves traveling.」。"],"forms":["involve","involves","involving","involved"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"occur","pos":"v.","meaning":"發生；出現","phrase":"occur frequently","category":"跨情境高頻字彙","id":"w0961","number":961,"examples":[{"en":"Delays may occur during busy periods.","zh":"忙碌時段可能發生延誤。"},{"en":"Unexpected delays often occur during peak shipping seasons.","zh":"在高峰運輸季節，經常會發生意料之外的延遲。"}],"tips":["不及物動詞特性：'occur' 是不及物動詞，這意味著它在 TOEIC 語法題中絕對不能以被動態呈現（例如 is occurred 是錯誤的），這是 Part 5 常見的陷阱題。"],"forms":["occur","occurs","occurring","occurred"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"indicate","pos":"v.","meaning":"指出；顯示","phrase":"indicate a preference","category":"跨情境高頻字彙","id":"w0962","number":962,"examples":[{"en":"The sign will indicate the correct entrance.","zh":"標誌會指出正確的入口。"},{"en":"The report indicates a significant increase in sales this quarter.","zh":"這份報告顯示本季銷售額大幅增加。"}],"tips":["常見搭配詞組：常用於 \"indicate that\" 引導子句，或搭配 \"indicate a preference\" (表示偏好)、\"indicate interest\" (表示感興趣) 及 \"indicate a trend\" (顯示趨勢)。"],"forms":["indicate","indicates","indicating","indicated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"determine","pos":"v.","meaning":"決定；確定","phrase":"determine the cause","category":"跨情境高頻字彙","id":"w0963","number":963,"examples":[{"en":"The manager will determine the final price.","zh":"經理會決定最終價格。"},{"en":"The company will determine the final budget for the project by next week.","zh":"公司將在下週確定專案的最終預算。"}],"tips":["常見搭配詞：常用於 determine the cause (確定原因)、determine the feasibility (判定可行性) 或 determine whether/if (確定是否...)。"],"forms":["determine","determines","determining","determined"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consider","pos":"v.","meaning":"考慮","phrase":"consider an option","category":"跨情境高頻字彙","id":"w0964","number":964,"examples":[{"en":"We will consider your suggestion.","zh":"我們會考慮你的建議。"},{"en":"The company is considering expanding its operations into the Asian market.","zh":"公司正在考慮將業務擴展到亞洲市場。"}],"tips":["動名詞搭配法：consider 後方習慣接動名詞 (V-ing) 而非不定詞 (to V)，例如 'considering purchasing new equipment'，這是多益 Part 5 的常規考點。"],"forms":["consider","considers","considering","considered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"prefer","pos":"v.","meaning":"較喜歡；偏好","phrase":"prefer an alternative","category":"跨情境高頻字彙","id":"w0965","number":965,"examples":[{"en":"Our guests usually prefer a quiet room.","zh":"我們的客人通常比較喜歡安靜的房間。"},{"en":"Our clients prefer receiving invoices electronically rather than by mail.","zh":"我們的客戶較喜歡以電子方式收取發票，而不是郵寄。"}],"tips":["常見句型與搭配詞：TOEIC 最常考的結構是「prefer A to B」(比起 B 更喜歡 A)，注意這裡的 to 是介係詞，後方必須接名詞或動名詞，不可接原形動詞。例如：prefer taking the train to driving。"],"forms":["prefer","prefers","preferring","preferred"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"choose","pos":"v.","meaning":"選擇","phrase":"choose a suitable option","category":"跨情境高頻字彙","id":"w0966","number":966,"examples":[{"en":"You can choose a different date.","zh":"你可以選擇不同的日期。"},{"en":"Please choose your preferred delivery date during checkout.","zh":"請在結帳時選擇您偏好的送貨日期。"}],"tips":["動詞三態與時態辨析：考生需熟記 choose (現在式)、chose (過去式) 與 chosen (過去分詞) 的拼法差異，此考點常出現在第五部分的文法題中，特別是完成式或被動語態。"],"forms":["choose","chooses","choosing","chose","chosen"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"depend","pos":"v.","meaning":"取決於；依賴","phrase":"depend on availability","category":"跨情境高頻字彙","id":"w0967","number":967,"examples":[{"en":"The cost will depend on the size.","zh":"費用將取決於尺寸。"},{"en":"Our sales figures depend on the effectiveness of the marketing campaign.","zh":"我們的銷售數字取決於行銷活動的有效性。"}],"tips":["介係詞固定搭配：depend 最常見的用法是與介係詞 on 或 upon 連用，在 TOEIC 閱讀 Part 5 中若看到空格前有 depend，應優先尋找 on；反之，若空格後有 on，則應考慮 depend 或其衍生詞。"],"forms":["depend","depends","depending","depended"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"affect","pos":"v.","meaning":"影響","phrase":"affect performance","category":"跨情境高頻字彙","id":"w0968","number":968,"examples":[{"en":"The weather may affect our plans.","zh":"天氣可能影響我們的計畫。"},{"en":"Poor communication can negatively affect team morale and productivity.","zh":"不良的溝通會對團隊士氣和生產力產生負面影響。"}],"tips":["詞性辨析：最常與 effect 混淆。在 TOEIC Part 5/6 中，affect 通常作為動詞（影響），而 effect 通常作為名詞（影響、結果）。口訣：Affect is an Action (動詞), Effect is an End (結果)。"],"forms":["affect","affects","affecting","affected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"likely","pos":"adj./adv.","meaning":"可能的；很可能","phrase":"likely to increase","category":"跨情境高頻字彙","id":"w0969","number":969,"examples":[{"en":"The train is likely to be late.","zh":"火車很可能會誤點。"},{"en":"The project is likely to be delayed due to unforeseen circumstances.","zh":"由於突發狀況，這個專案很有可能會延遲。"}],"tips":["常見句型：'be likely to + 原形動詞'，表示『很可能做某事』，在 Part 5 詞彙與文法題中極為常見，注意 to 後方必須接原形動詞而非動名詞。"],"forms":["likely"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"recent","pos":"adj.","meaning":"最近的","phrase":"recent changes","category":"跨情境高頻字彙","id":"w0970","number":970,"examples":[{"en":"The recent changes are listed below.","zh":"最近的變更列在下方。"},{"en":"Please review the recent updates to the project timeline.","zh":"請檢閱專案時程的最新更新。"}],"tips":["常見搭配詞：常與名詞連用形成固定短語，如 'recent developments' (最近的發展)、'recent years' (近年來) 或 'recent trends' (最近的趨勢)，在 Part 5 詞性填空題中極為常見。"],"forms":["recent","more recent","most recent"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"current","pos":"adj.","meaning":"目前的；現行的","phrase":"current price","category":"跨情境高頻字彙","id":"w0971","number":971,"examples":[{"en":"The current price is on the website.","zh":"目前的價格在網站上。"},{"en":"Please submit your expense report by the end of the current month.","zh":"請在當月結束前提交您的費用報表。"}],"tips":["詞彙搭配與搭配詞：在 TOEIC 閱讀與聽力中，常出現在 current situation (現狀)、current market trends (目前市場趨勢) 及 current position (目前職位) 等詞組中。"],"forms":["current","more current","most current","currents","currenting","currented"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"previous","pos":"adj.","meaning":"先前的；前一個的","phrase":"previous experience","category":"跨情境高頻字彙","id":"w0972","number":972,"examples":[{"en":"Please read the previous email.","zh":"請閱讀前一封電子郵件。"},{"en":"Do you have any previous work experience?","zh":"你之前有工作經驗嗎？"}],"tips":["常見搭配詞：常與經驗或職位連用，如 'previous experience' (過往經驗) 或 'previous position' (前任職位)，這在 Part 7 的求職廣告或履歷中頻率極高。"],"forms":["previous"],"exampleSource":"Wordstep original examples"},{"word":"additional","pos":"adj.","meaning":"額外的；附加的","phrase":"additional information","category":"跨情境高頻字彙","id":"w0973","number":973,"examples":[{"en":"Additional information is available online.","zh":"線上有更多資訊可以查閱。"},{"en":"We need to prepare additional documents for the presentation.","zh":"我們需要為簡報準備額外的文件。"}],"tips":["常見搭配詞：在 TOEIC 閱讀測驗中，常出現 'additional information' (額外資訊)、'additional costs/charges' (額外費用) 以及 'additional staff' (額外人力)。熟記這些固定組合能快速在 Part 5 & 6 填空題做出選擇。"],"forms":["additional","more additional","most additional"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"necessary","pos":"adj.","meaning":"必要的","phrase":"necessary documents","category":"跨情境高頻字彙","id":"w0974","number":974,"examples":[{"en":"A reservation is necessary.","zh":"預約是必要的。"},{"en":"A valid passport is necessary for international travel.","zh":"國際旅行需要有效的護照。"}],"tips":["常見搭配詞與句型：在 TOEIC 語法考題中，常用句型為 'It is necessary (for someone) to do something' 或虛擬語氣句型 'It is necessary that + S + (should) + V'，後者常考動詞原形。"],"forms":["necessary","more necessary","most necessary"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"required","pos":"adj.","meaning":"必須的；要求的","phrase":"required information","category":"跨情境高頻字彙","id":"w0975","number":975,"examples":[{"en":"The required documents are ready.","zh":"必備文件已經準備好了。"},{"en":"A valid passport is required for international travel.","zh":"國際旅行需要有效的護照。"}],"tips":["常見搭配詞組：最常見的用法是「be required to + 動詞原型」，表示「被要求去做某事」。在名詞修飾上，常出現「required documents」（必備文件）、「required skills」（必備技能）或「minimum requirements」（最低要求）。"],"forms":["required","more required","most required"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"suitable","pos":"adj.","meaning":"適合的","phrase":"suitable candidate","category":"跨情境高頻字彙","id":"w0976","number":976,"examples":[{"en":"This room is suitable for meetings.","zh":"這個房間適合開會。"},{"en":"The candidate's skills and experience are highly suitable for this position.","zh":"這位候選人的技能和經驗非常適合這個職位。"}],"tips":["常見搭配詞：最常與介系詞 'for' 連用，形成 'be suitable for + 名詞'，例如 'suitable for all candidates'；亦可接動詞不定式 'suitable to do something'。"],"forms":["suitable","more suitable","most suitable"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"appropriate","pos":"adj.","meaning":"適當的；合適的","phrase":"appropriate action","category":"跨情境高頻字彙","id":"w0977","number":977,"examples":[{"en":"This date is appropriate for the event.","zh":"這個日期適合舉辦活動。"},{"en":"Please submit an appropriate proposal outlining your company's services and pricing.","zh":"請提交一份合適的提案，概述貴公司的服務和定價。"}],"tips":["常見搭配詞與語法：常接介係詞組成 'appropriate for/to' (適合於...)，在 TOEIC 中頻繁出現 'take appropriate action/measures' (採取適當措施) 或 'at the appropriate time' (在適當時間) 等固定表達。"],"forms":["appropriate","more appropriate","most appropriate"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"effective","pos":"adj.","meaning":"有效的","phrase":"effective method","category":"跨情境高頻字彙","id":"w0978","number":978,"examples":[{"en":"The new system is effective.","zh":"新系統很有效。"},{"en":"The new marketing strategy proved to be highly effective in increasing sales.","zh":"新的行銷策略在提高銷售額方面被證明非常有效。"}],"tips":["常見搭配詞：'effective immediately' (立即生效) 常見於公司公告、'cost-effective' (具成本效益的) 常見於預算審核。"],"forms":["effective","more effective","most effective"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"successful","pos":"adj.","meaning":"成功的","phrase":"successful project","category":"跨情境高頻字彙","id":"w0979","number":979,"examples":[{"en":"The event was successful.","zh":"活動很成功。"},{"en":"The company's new marketing strategy proved successful in increasing sales.","zh":"該公司的全新行銷策略在增加銷售額方面取得了成功。"}],"tips":["常見搭配詞：常用於 successful candidate (成功的應徵者)、successful negotiation (成功的談判) 以及 highly successful (非常成功的)。"],"forms":["successful","more successful","most successful"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"significant","pos":"adj.","meaning":"重大的；顯著的","phrase":"significant increase","category":"跨情境高頻字彙","id":"w0980","number":980,"examples":[{"en":"There was a significant increase in sales.","zh":"銷售量顯著增加了。"},{"en":"This change will make a significant difference.","zh":"這項改變將造成重大的差異。"}],"tips":["常見搭配詞：在 TOEIC 中常與數據變化連用，例如 significant increase/decrease/growth/reduction (顯著的增加/減少/成長/降低)，或搭配影響力如 significant impact/influence on sth。"],"forms":["significant","more significant","most significant"],"exampleSource":"Wordstep original examples"},{"word":"approximately","pos":"adv.","meaning":"大約；約","phrase":"approximately 50 people","category":"跨情境高頻字彙","id":"w0981","number":981,"examples":[{"en":"The trip will take approximately two hours.","zh":"這趟行程將需要大約兩小時。"},{"en":"The shipment will arrive approximately 5 PM, depending on traffic conditions.","zh":"貨物預計將在下午 5 點左右送達，具體時間取決於交通狀況。"}],"tips":["常見搭配詞：approximately 通常接數字、時間、百分比或金額，如 approximately 20 percent、approximately two weeks，用以表達估計值。"],"forms":["approximately"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"currently","pos":"adv.","meaning":"目前；現在","phrase":"currently available","category":"跨情境高頻字彙","id":"w0982","number":982,"examples":[{"en":"The manager is currently in a meeting.","zh":"經理目前正在開會。"},{"en":"The company is currently reviewing its marketing strategy to adapt to changing market trends.","zh":"公司目前正在審查其營銷策略，以適應不斷變化的市場趨勢。"}],"tips":["時態判定關鍵：Currently 常與現在進行式（be + V-ing）或現在式連用，在 Part 5 詞彙或語法題中，看到此字應優先考慮現在時間點的選項。"],"forms":["currently"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"recently","pos":"adv.","meaning":"最近","phrase":"recently announced","category":"跨情境高頻字彙","id":"w0983","number":983,"examples":[{"en":"The building was recently renovated.","zh":"這棟建築最近整修過。"},{"en":"The company has recently expanded its operations into Southeast Asia.","zh":"公司最近將業務擴展到東南亞。"}],"tips":["時態辨析關鍵：recently 是 TOEIC 文法題中非常重要的時態指標。它主要與「現在完成式」(have/has + p.p.) 或「過去簡單式」連用。在 Part 5 的動詞時態題中，若句中出現 recently，應優先尋找這兩種時態選項。"],"forms":["recently"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"immediately","pos":"adv.","meaning":"立即；馬上","phrase":"respond immediately","category":"跨情境高頻字彙","id":"w0984","number":984,"examples":[{"en":"We can send the document immediately.","zh":"我們可以立刻寄出文件。"},{"en":"Please submit your expense report immediately after completing the business trip.","zh":"請在完成出差後立即提交您的費用報表。"}],"tips":["常見搭配詞與介系詞：在 TOEIC 中，最常以 immediately following 或 immediately after 的形式出現，用來修飾時間點，強調緊接在某事之後。"],"forms":["immediately"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"eventually","pos":"adv.","meaning":"最後；最終","phrase":"eventually complete","category":"跨情境高頻字彙","id":"w0985","number":985,"examples":[{"en":"The problem will eventually be solved.","zh":"這個問題最終會獲得解決。"},{"en":"The project faced several delays, but we eventually completed it on time.","zh":"這個專案面臨了幾次延遲，但我們最終還是按時完成了它。"}],"tips":["常見搭配與詞組：此單字常與動詞連用，表示經過一段時間後的結果，常見如 'eventually lead to'（最終導致）、'eventually decide to'（最後決定）或 'eventually resolve'（最終解決問題）。"],"forms":["eventually"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"temporarily","pos":"adv.","meaning":"暫時地","phrase":"temporarily unavailable","category":"跨情境高頻字彙","id":"w0986","number":986,"examples":[{"en":"The entrance is temporarily closed.","zh":"入口暫時關閉。"},{"en":"The office will be closed temporarily for renovations.","zh":"辦公室將暫時關閉以進行裝修。"}],"tips":["常見搭配詞與情境：在 TOEIC 中常與暫時性變動相關的詞連用，例如 temporarily closed（暫時關閉）、temporarily suspended（暫時中止服務）、temporarily unavailable（暫時無法使用/缺貨）。"],"forms":["temporarily"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"regularly","pos":"adv.","meaning":"定期地；經常地","phrase":"regularly inspect","category":"跨情境高頻字彙","id":"w0987","number":987,"examples":[{"en":"The equipment is checked regularly.","zh":"設備會定期檢查。"},{"en":"The finance department reviews the budget reports regularly to ensure accuracy.","zh":"財務部門定期審查預算報告，以確保其準確性。"}],"tips":["常見搭配詞組：常用於動詞之後，如 meet regularly (定期會面)、check regularly (定期檢查)、updated regularly (定期更新)。在商業書信中，'regularly scheduled maintenance' (定期安排的維修) 是極高頻的出現短語。"],"forms":[],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"frequently","pos":"adv.","meaning":"經常地；頻繁地","phrase":"frequently used","category":"跨情境高頻字彙","id":"w0988","number":988,"examples":[{"en":"The schedule is frequently updated.","zh":"行程表經常更新。"},{"en":"Our team communicates with clients frequently via email to ensure timely updates.","zh":"我們的團隊透過電子郵件頻繁地與客戶溝通，以確保及時更新。"}],"tips":["常見搭配詞組：最常見的用法為「frequently asked questions (FAQ)」，亦常與動詞連用如「frequently updated」(頻繁更新) 或「frequently visited」(經常造訪)。"],"forms":["frequently"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"generally","pos":"adv.","meaning":"通常；一般而言","phrase":"generally available","category":"跨情境高頻字彙","id":"w0989","number":989,"examples":[{"en":"The store is generally quiet in the morning.","zh":"商店早上通常很安靜。"},{"en":"Generally, the project is on schedule and within budget.","zh":"通常情況下，專案進度良好且在預算內。"}],"tips":["常見搭配詞：常與形容詞連用，如 'generally accepted'（普遍接受的）、'generally available'（通常可取得的），或是慣用語 'generally speaking'（一般而言）。"],"forms":["generally"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"particularly","pos":"adv.","meaning":"尤其；特別","phrase":"particularly useful","category":"跨情境高頻字彙","id":"w0990","number":990,"examples":[{"en":"This dish is particularly popular.","zh":"這道菜特別受歡迎。"},{"en":"The report highlights the company's performance, particularly in the Asian market.","zh":"這份報告重點強調了公司的業績，尤其是在亞洲市場。"}],"tips":["常見搭配詞與結構：常用於修飾形容詞，如 particularly helpful 或 particularly impressive，也常置於 when 或 if 子句前來強調特定條件。"],"forms":["particularly"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"probably","pos":"adv.","meaning":"大概；很可能","phrase":"probably increase","category":"跨情境高頻字彙","id":"w0991","number":991,"examples":[{"en":"The package will probably arrive today.","zh":"包裹今天很可能會送達。"},{"en":"The shipment will probably arrive on Friday.","zh":"貨物很可能在星期五抵達。"}],"tips":["語法位置與出題重點：在多益閱讀測驗中，常用於副詞位置考題。probably 常置於助動詞（如 will, can）與主動詞之間，或置於 be 動詞之後，例如：'The shipment will probably arrive tomorrow'。"],"forms":["probably"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"already","pos":"adv.","meaning":"已經","phrase":"already completed","category":"跨情境高頻字彙","id":"w0992","number":992,"examples":[{"en":"Your order is already on its way.","zh":"你的訂單已經在運送途中。"},{"en":"We have already confirmed the meeting with the vendor.","zh":"我們已經確認了與供應商的會議。"}],"tips":["詞彙辨析：在 TOEIC 文法題（Part 5 & 6）中，常與 yet 和 still 進行對比。already 通常用於肯定句，表示事情比預期更早完成；yet 常用於疑問或否定句；still 則強調動作持續中。"],"forms":["already"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"still","pos":"adv.","meaning":"仍然；還是","phrase":"still available","category":"跨情境高頻字彙","id":"w0993","number":993,"examples":[{"en":"The offer is still available.","zh":"這項優惠仍然有效。"},{"en":"The meeting room is still available, so you can use it for your presentation.","zh":"會議室仍然可用，你可以用它來做簡報。"}],"tips":["在多益 Part 1 圖片描述中，still 常作為形容詞表示「靜止的」或「不動的」，例如 \"The water is still\" 或 \"Standing still\"，考生需注意其與動態動作的區別。"],"forms":["still","more still","most still"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"instead","pos":"adv.","meaning":"反而；改為","phrase":"choose this instead","category":"跨情境高頻字彙","id":"w0994","number":994,"examples":[{"en":"You can pay online instead.","zh":"你可以改在線上付款。"},{"en":"Due to unforeseen circumstances, we will use a different vendor instead.","zh":"由於突發狀況，我們將改用不同的供應商。"}],"tips":["詞性辨析與用法區分：instead 是副詞，常用於句尾或子句開頭表示『取而代之』，而 instead of 是介係詞短語，後方必須接名詞、代名詞或動名詞（V-ing）。在 Part 5 填空題中，若空格後有受詞，應選 instead of。"],"forms":["instead"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"otherwise","pos":"adv.","meaning":"否則；除此之外","phrase":"unless otherwise stated","category":"跨情境高頻字彙","id":"w0995","number":995,"examples":[{"en":"The manager is busy but otherwise well.","zh":"經理很忙，不過除此之外一切都好。"},{"en":"Please double-check all figures; otherwise, the financial report will be inaccurate.","zh":"請仔細核對所有數字；否則，財務報告將不準確。"}],"tips":["常見固定搭配：TOEIC 閱讀中最常考的固定用法是「unless otherwise + 過去分詞」，例如「unless otherwise stated/noted/specified」（除非另有說明/標註/規定），常出現在合約、政策或說明書中。"],"forms":["otherwise"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"therefore","pos":"adv.","meaning":"因此","phrase":"therefore necessary","category":"跨情境高頻字彙","id":"w0996","number":996,"examples":[{"en":"We will therefore leave tomorrow.","zh":"因此，我們將於明天離開。"},{"en":"The project budget was exceeded; therefore, we need to find ways to reduce costs.","zh":"專案預算超支了；因此，我們需要找到降低成本的方法。"}],"tips":["邏輯因果連結：therefore 作為副詞連接詞，專門用於表達「因果關係」，在多益閱讀 Part 5 和 Part 6 中極為常見。它用來引導出前述事實所導致的結果，考生需透過前後文邏輯判斷是否為「因」與「果」的順接關係。"],"forms":["therefore"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"however","pos":"adv.","meaning":"然而；不過","phrase":"however, the schedule changed","category":"跨情境高頻字彙","id":"w0997","number":997,"examples":[{"en":"The hotel is, however, too expensive.","zh":"不過，這間飯店太貴了。"},{"en":"The company's profits increased significantly. However, operating costs also rose.","zh":"公司利潤顯著增加；然而，營運成本也上升。"}],"tips":["句型位置與標點符號：however 作為轉折副詞，常見用法是放在句首並加上逗號（However, ...），或是用於連接兩個獨立子句時，前面使用分號、後面接逗號（...; however, ...），這在 Part 5 文法題中是區分它與連詞 but 的重要依據。"],"forms":["however"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"although","pos":"conj.","meaning":"雖然；儘管","phrase":"although prices increased","category":"跨情境高頻字彙","id":"w0998","number":998,"examples":[{"en":"I will attend although I am busy.","zh":"雖然我很忙，我還是會參加。"},{"en":"Although the project faced some delays, the team managed to deliver it on time.","zh":"雖然專案遇到了一些延遲，但團隊還是成功地按時交付了它。"}],"tips":["文法結構辨析：although 是連接詞，後面必須接完整的句子（主詞+動詞），常與介係詞 despite 或 in spite of（後接名詞或動名詞）在多益閱讀 Part 5 進行對比考法，這是最常見的考點。"],"forms":[],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"unless","pos":"conj.","meaning":"除非","phrase":"unless otherwise noted","category":"跨情境高頻字彙","id":"w0999","number":999,"examples":[{"en":"The event will take place unless it rains.","zh":"除非下雨，否則活動將照常舉行。"},{"en":"You won't understand it unless you read the instructions carefully.","zh":"除非你仔細閱讀說明，否則你不會理解它。"}],"tips":["語法核心邏輯：'unless' 本質上等於 'if...not'，在解讀長難句時，將其代換為 '如果沒有...' 能快速釐清邏輯關係。"],"forms":["unless"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"according to","pos":"prep.","meaning":"根據；依照","phrase":"according to the report","category":"跨情境高頻字彙","id":"w1000","number":1000,"examples":[{"en":"The train is on time according to the schedule.","zh":"根據時刻表，火車是準時的。"},{"en":"According to the report, sales increased by 15% this quarter.","zh":"根據報告，本季銷售額增加了 15%。"}],"tips":["常見搭配詞組：常用於引用正式文件或權威來源，例如 according to the report (根據報告)、according to the schedule (根據日程表)、according to the survey (根據調查)。"],"forms":["according to"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"}]</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const words = JSON.parse($('#word-data').textContent);
if (words.length !== 1000 || words.some(w => w.examples.length !== 2)) throw Error('字庫不完整');
const PREFS='wordstep.preferences.v1', PROGRESS='wordstep.progress.v1';
function load(key){try{const v=JSON.parse(localStorage.getItem(key)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{};}catch{return {};}}
function store(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{$('#save-message').hidden=false;}}
let prefs=load(PREFS),known=load(PROGRESS),selected=prefs.selected,active=null,matches=[],voices=[];
const oldSelected=words.find(w=>w.word===selected);if(oldSelected)selected=oldSelected.id;
for(const w of words){if(known[w.word]===true)known[w.id]=true;}
known=Object.fromEntries(words.filter(w=>known[w.id]===true).map(w=>[w.id,true]));
let hidden=prefs.hidden===true;
let rate=['0.7','0.9','1','1.15'].includes(String(prefs.rate))?Number(prefs.rate):(prefs.slow===false?1:0.7);
$('#rate').value=String(rate);$('#slow').checked=rate<1;
const synth=window.speechSynthesis||null;
const icon='<svg class="speaker-icon" viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><svg class="stop-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>';
document.querySelectorAll('.sound').forEach(el=>el.innerHTML=icon);
const current=()=>words.find(w=>w.id===selected);
function save(){store(PREFS,{...prefs,selected,hidden,rate,slow:rate<1,voice:$('#voice').value});store(PROGRESS,known);}
function loadVoices(){
 voices=synth?synth.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang)):[];
 const previous=$('#voice').value||prefs.voice||'';
 $('#voice').replaceChildren(new Option('自動選擇英文語音',''),...voices.map(v=>new Option(v.name+' · '+v.lang,v.voiceURI)));
 if(voices.some(v=>v.voiceURI===previous))$('#voice').value=previous;
}
function settings(){return{rate,voice:voices.find(v=>v.voiceURI===$('#voice').value)||voices.find(v=>/^en[-_]US$/i.test(v.lang))||voices[0]||null};}
function playback(state,id){
 active=['waiting','playing'].includes(state)?id:null;
 document.querySelectorAll('[data-play]').forEach(b=>{const on=b.dataset.play===active;b.classList.toggle('playing',on);b.setAttribute('aria-pressed',String(on));});
 $('#play-all').textContent=active?'停止播放':'整組播放';$('#play-all').setAttribute('aria-pressed',String(!!active));
 const message=$('#audio-message');message.hidden=!['unsupported','error'].includes(state);
 message.textContent=state==='unsupported'?'目前瀏覽器不支援朗讀，請改用Safari或Chrome。':'未能播放，請確認媒體音量與裝置的英文語音，再點一次。';
}
const player=createPlayer(synth,window.SpeechSynthesisUtterance,settings,playback);
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase();
function highlight(el,text,w){
 const forms=[w.word,...(w.forms||[])].filter(v=>typeof v==='string'&&v.length<50);
 const pattern=forms.sort((a,b)=>b.length-a.length).map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
 const re=new RegExp('(?<![A-Za-z])('+pattern+')(?![A-Za-z])','gi');
 const nodes=[];let last=0;
 for(const match of text.matchAll(re)){nodes.push(document.createTextNode(text.slice(last,match.index)));const mark=document.createElement('mark');mark.textContent=match[0];nodes.push(mark);last=match.index+match[0].length;}
 nodes.push(document.createTextNode(text.slice(last)));el.replaceChildren(...nodes);
}
function showChinese(){
 $('#lesson').classList.toggle('hide-chinese',hidden);$('#hide-chinese').textContent=hidden?'顯示中文':'遮住中文';$('#hide-chinese').setAttribute('aria-pressed',String(hidden));
 $('#lesson').querySelectorAll('.zh').forEach(e=>e.setAttribute('aria-hidden',String(hidden)));
}
function render(){
 player.stop();
 const q=normalize($('#search').value.trim()),cat=$('#category').value,status=$('#filter').value;
 matches=words.filter(w=>(cat==='all'||w.category===cat)&&(status==='all'||(status==='known'?known[w.id]===true:known[w.id]!==true))&&(!q||normalize(w.word+' '+w.meaning).includes(q)));
 if(!matches.some(w=>w.id===selected))selected=matches[0]?.id||null;
 const w=current(),index=matches.findIndex(w=>w.id===selected),count=words.filter(w=>known[w.id]===true).length;
 $('#total').textContent='1,000 字詞';$('#progress').textContent=`已熟悉 ${count} / 1000`;
 $('#position').textContent=matches.length?`${index+1} / ${matches.length} · 已熟 ${count}`:'0 / 0';
 $('#category-label').textContent=w?w.category:'';
 $('#word-jump').replaceChildren(...matches.map(w=>new Option(`${w.number}. ${w.word} — ${hidden?'':w.meaning}${known[w.id]?' ✓':''}`,w.id)));
 $('#word-jump').value=selected||'';$('#word-jump').disabled=!w;
 $('#lesson').hidden=!w;$('#practice-controls').hidden=!w;$('#empty').hidden=!!w;
 if(!w){save();return;}
 $('#word').textContent=w.word;$('#pos').textContent=w.pos;$('#meaning').textContent=w.meaning;
 $('[data-play="word"]').setAttribute('aria-label',`朗讀單字 ${w.word}`);
 document.querySelectorAll('.example').forEach((el,i)=>{highlight(el.querySelector('.en'),w.examples[i].en,w);el.querySelector('.zh').textContent=w.examples[i].zh;el.querySelector('button').setAttribute('aria-label',`朗讀例句${i+1}`);});
 $('#phrase').textContent=w.phrase||'';$('#tips').replaceChildren(...(w.tips||[]).map(text=>{const p=document.createElement('p');p.textContent=text;return p;}));
 $('#previous').disabled=index===0;$('#next').textContent=index===matches.length-1?'從頭複習':'下一個';
 $('#known').textContent=known[w.id]?'已熟 · 撤銷':'標記已熟';$('#known').setAttribute('aria-pressed',String(!!known[w.id]));
 showChinese();save();
}
function move(delta){if(!matches.length)return;let i=matches.findIndex(w=>w.id===selected);i=delta>0?(i+1)%matches.length:Math.max(0,i-1);selected=matches[i].id;render();}
function clearFilters(){$('#search').value='';$('#category').value='all';$('#filter').value='all';render();}
$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);$('#filter').addEventListener('change',render);
$('#word-jump').addEventListener('change',()=>{selected=$('#word-jump').value;render();$('#tools').open=false;});
$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#known').onclick=()=>{if(!current())return;if(known[selected])delete known[selected];else known[selected]=true;render();};
$('#clear-filters').onclick=clearFilters;$('#empty-clear').onclick=clearFilters;
$('#reset-progress').onclick=()=>{if(confirm('清除所有熟悉標記？單字與例句不會被刪除。')){known={};render();}};
$('#hide-chinese').onclick=()=>{hidden=!hidden;render();};
$('#slow').onchange=()=>{player.stop();rate=$('#slow').checked?0.7:1;$('#rate').value=String(rate);save();};
$('#rate').onchange=()=>{player.stop();rate=Number($('#rate').value);$('#slow').checked=rate<1;save();};
$('#voice').onchange=()=>{player.stop();prefs.voice=$('#voice').value;save();};
$('#lesson').addEventListener('click',event=>{
 const b=event.target.closest('[data-play]');if(!b||!current())return;const id=b.dataset.play;if(id===active){player.stop();return;}
 const w=current();player.play([{id,text:id==='word'?w.word:w.examples[Number(id.slice(-1))].en}]);
});
$('#play-all').onclick=()=>{if(active){player.stop();return;}const w=current();if(!w)return;player.play([{id:'word',text:w.word},...w.examples.map((e,i)=>({id:'example'+i,text:e.en}))]);};
window.addEventListener('keydown',event=>{if(event.key==='Escape')player.stop();if(event.altKey||event.ctrlKey||event.metaKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable)return;if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();move(event.key==='ArrowLeft'?-1:1);}});
window.addEventListener('pagehide',player.stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)player.stop();});
if(synth)synth.addEventListener('voiceschanged',loadVoices);loadVoices();
for(const c of [...new Set(words.map(w=>w.category))])$('#category').append(new Option(c,c));
render();
function createPlayer(synth, Utterance, settings, notify) {
 let token=0,timer=null,retained=[];
 const clear=()=>{clearTimeout(timer);timer=null;};
 function stop(){token++;clear();retained=[];if(synth)synth.cancel();notify('idle',null);}
 function play(items){
  stop();if(!synth||!Utterance){notify('unsupported',null);return;}if(!items.length)return;
  const run=token,config=settings();notify('waiting',items[0].id);
  function fail(reason){if(run!==token)return;token++;clear();retained=[];synth.cancel();notify('error',null,reason);}
  timer=setTimeout(()=>fail('not-started'),8000);
  retained=items.map((item,index)=>{
   const u=new Utterance(item.text);u.lang=config.voice?.lang||'en-US';u.rate=config.rate||.9;u.pitch=1;if(config.voice)u.voice=config.voice;
   u.onstart=()=>{if(run!==token)return;clear();notify('playing',item.id);timer=setTimeout(()=>fail('timed-out'),Math.max(20000,item.text.length*300/u.rate));};
   u.onend=()=>{if(run!==token)return;clear();if(index===items.length-1){retained=[];notify('done',null);}else timer=setTimeout(()=>fail('not-started'),8000);};
   u.onerror=e=>{if(run===token)fail(e.error||'unknown');};return u;
  });
  try{retained.forEach(u=>synth.speak(u));}catch(e){fail(e.message);}
 }
 return{play,stop,destroy:stop};
}
})();

ategory":"房地產與設施","id":"w0574","number":574,"examples":[{"en":"Our team will occupy the third floor.","zh":"我們的團隊將使用三樓。"},{"en":"We need to occupy this carefully.","zh":"我們需要仔細佔據。"}],"tips":["常見搭配詞與用法：'be occupied with' 表示忙於某項活動或工作，等同於 'be busy with'；'occupy a position/role' 則用於描述擔任特定的職位。"],"forms":["occupy","occupies","occupying","occupied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"vacant","pos":"adj.","meaning":"空置的；未使用的","phrase":"vacant office","category":"房地產與設施","id":"w0575","number":575,"examples":[{"en":"This office is currently vacant.","zh":"這間辦公室目前空置。"},{"en":"The hotel has a few vacant rooms available for tonight.","zh":"這家飯店今晚還有幾間空房。"}],"tips":["常見搭配詞組：多益中最常出現 'vacant position' (職位空缺)、'vacant seat' (空位) 以及 'vacant lot' (空地)，掌握這些固定搭配可快速作答。"],"forms":["vacant","vacancy","vacantly"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"construction","pos":"n.","meaning":"建造；施工","phrase":"under construction","category":"房地產與設施","id":"w0576","number":576,"examples":[{"en":"The road is under construction.","zh":"這條路正在施工。"},{"en":"Our company specializes in the construction and maintenance of industrial facilities.","zh":"我們公司專注於工業設施的建設和維護。"}],"tips":["常見搭配詞與短語：'under construction' (施工中)、'construction site' (建築工地)、'construction permit' (建築許可) 以及 'construction delay' (施工延誤)，這些短語頻繁出現在辦公室設施更新或交通公告中。"],"forms":["construction","constructions","constructs","constructing","constructed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"construct","pos":"v.","meaning":"建造；興建","phrase":"construct a building","category":"房地產與設施","id":"w0577","number":577,"examples":[{"en":"The company will construct a new warehouse.","zh":"公司將興建一座新倉庫。"},{"en":"The construction company is responsible for constructing the new office building.","zh":"該建築公司負責建造新的辦公大樓。"}],"tips":["常見搭配詞與片語：'under construction' (施工中) 是 TOEIC 聽力 Part 1 最常出現的黃金片語；此外，'construct a facility/bridge' 或抽象的 'construct a proposal' 也是常見搭配。"],"forms":["construct","constructs","constructing","constructed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"renovate","pos":"v.","meaning":"翻修；整修","phrase":"renovate an office","category":"房地產與設施","id":"w0578","number":578,"examples":[{"en":"We will renovate the lobby in May.","zh":"我們將於五月翻修大廳。"},{"en":"We need to renovate the hotel lobby to attract more guests.","zh":"我們需要翻新飯店大廳，以吸引更多客人。"}],"tips":["常見搭配詞與同義詞：常與 building, facility, office 連用，常見片語如 'undergo renovation' (進行裝修) 或 'be closed for renovation' (因裝修而關閉)。在閱讀測驗中，常與 remodel, refurbish 或 upgrade 作為同義詞互換。"],"forms":["renovate","renovates","renovating","renovated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"renovation","pos":"n.","meaning":"翻修；整修工程","phrase":"office renovation","category":"房地產與設施","id":"w0579","number":579,"examples":[{"en":"The renovation will take two weeks.","zh":"整修工程需要兩星期。"},{"en":"The company is planning a major renovation of its headquarters to improve employee productivity.","zh":"公司計劃對總部進行大規模裝修，以提高員工生產力。"}],"tips":["常見搭配詞與介係詞：'under renovation' (進行裝修中) 是多益最常見的固定用法，動詞常搭配 'undergo' 或 'complete'。"],"forms":["renovation","renovations","renovates","renovating","renovated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"remodel","pos":"v.","meaning":"改建；重新裝修","phrase":"remodel a building","category":"房地產與設施","id":"w0580","number":580,"examples":[{"en":"They will remodel the kitchen.","zh":"他們將重新裝修廚房。"},{"en":"We need to remodel the store layout to attract more customers.","zh":"我們需要重新設計商店格局以吸引更多顧客。"}],"tips":["常見搭配詞組：'remodel the office' (重新裝修辦公室)、'extensive remodeling' (大規模翻修) 以及 'remodel a facility' (翻修設施)。"],"forms":["remodel","remodels","remodelling","remodelled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"broker","pos":"n.","meaning":"仲介；經紀人","phrase":"real estate broker","category":"房地產與設施","id":"w0581","number":581,"examples":[{"en":"The broker can show you the property.","zh":"仲介可以帶你看這間房子。"},{"en":"Our company uses a reputable broker to manage its investment portfolio.","zh":"我們公司使用一位信譽良好的經紀人來管理其投資組合。"}],"tips":["常見搭配詞組：包含 'stockbroker' (證券經紀人)、'insurance broker' (保險經紀人)、'real estate broker' (不動產經紀人) 以及 'brokerage firm' (經紀商/手續費)。"],"forms":["broker","brokers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"leaseholder","pos":"n.","meaning":"租賃權人；承租人","phrase":"commercial leaseholder","category":"房地產與設施","id":"w0582","number":582,"examples":[{"en":"The leaseholder must pay the rent on time.","zh":"承租人必須準時支付租金。"},{"en":"Please contact the leaseholder about the repair.","zh":"請就維修事宜聯絡承租人。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"blueprint","pos":"n.","meaning":"藍圖；設計圖","phrase":"building blueprint","category":"房地產與設施","id":"w0583","number":583,"examples":[{"en":"The blueprint is on the architect's desk.","zh":"藍圖在建築師的桌上。"},{"en":"The engineering team is working on the blueprint for the new factory.","zh":"工程團隊正在為新工廠制定藍圖。"}],"tips":["語義轉義與情境應用：在多益考試中，blueprint 除了解釋為實體的「藍圖」或「建築設計圖」外，更常延伸為「詳細計畫」或「發展架構」。在商業閱讀（Part 7）中，常用於描述公司的擴張計畫、重組方案或新產品開發的具體流程。"],"forms":["blueprint","blueprints"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"permit","pos":"n./v.","meaning":"許可證；允許","phrase":"building permit","category":"房地產與設施","id":"w0584","number":584,"examples":[{"en":"A permit is required for the construction.","zh":"這項工程需要施工許可證。"},{"en":"The manager needs to permit the employee's request for a vacation.","zh":"經理需要批准員工休假的請求。"}],"tips":["區分詞性與讀音：作為動詞時重音在第二音節（per-MIT），意為「准許」；作為名詞時重音在第一音節（PER-mit），指具體的「許可證」。"],"forms":["permit","permits","permitting","permitted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"utility","pos":"n.","meaning":"公用事業；水電等費用","phrase":"utility costs","category":"房地產與設施","id":"w0585","number":585,"examples":[{"en":"Utility costs are included in the rent.","zh":"水電等公用事業費用包含在租金中。"},{"en":"The company is responsible for maintaining essential utilities such as water, electricity, and gas.","zh":"公司負責維護水、電、瓦斯等基本公用設施。"}],"tips":["常見搭配詞：多以複數形式 utilities 出現，指『水、電、瓦斯等公共設施』。常見詞組包括 utility bill (水電費帳單)、utility company (公共事業公司) 及 public utility (公共事業)。"],"forms":["utility","utilities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"electricity","pos":"n.","meaning":"電力；電","phrase":"electricity bill","category":"房地產與設施","id":"w0586","number":586,"examples":[{"en":"The electricity will be turned off briefly.","zh":"電力將短暫關閉。"},{"en":"The company is investing in renewable electricity sources to reduce its carbon footprint.","zh":"該公司正在投資可再生電力來源以減少其碳足跡。"}],"tips":["常見搭配詞組：'generate electricity' (發電)、'electricity bill' (電費單)、'electricity supply' (電力供應)。這些搭配詞常出現在閱讀測驗中的廣告或帳單通知中。"],"forms":["electricity","electricities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"heating","pos":"n.","meaning":"暖氣；供暖","phrase":"heating system","category":"房地產與設施","id":"w0587","number":587,"examples":[{"en":"The heating is not working.","zh":"暖氣壞了。"},{"en":"Please turn down the heating before you leave.","zh":"離開前請把暖氣調低。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"ventilation","pos":"n.","meaning":"通風；通風設備","phrase":"ventilation system","category":"房地產與設施","id":"w0588","number":588,"examples":[{"en":"The ventilation system is being cleaned.","zh":"通風系統正在清潔中。"},{"en":"The office building has a state-of-the-art ventilation system to ensure a healthy working environment.","zh":"這棟辦公大樓擁有先進的通風系統，以確保健康的工作環境。"}],"tips":["常見搭配詞：'ventilation system' (通風系統)、'improve ventilation' (改善通風)、'poor ventilation' (通風不良)。在 TOEIC 中常出現在設施管理或辦公室維護的情境。"],"forms":["ventilation","ventilations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"plumbing","pos":"n.","meaning":"水管系統；管線工程","phrase":"plumbing repairs","category":"房地產與設施","id":"w0589","number":589,"examples":[{"en":"The plumbing needs repairs.","zh":"水管系統需要修理。"},{"en":"We're experiencing delays due to unforeseen plumbing repairs in the warehouse.","zh":"由於倉庫裡突發的水管維修，我們正在經歷延遲。"}],"tips":["常見搭配詞：'plumbing system' (排水系統)、'plumbing fixture' (衛浴設備) 或 'plumbing maintenance' (管線維護)。"],"forms":["plumbing","plumbings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lighting","pos":"n.","meaning":"照明；照明設備","phrase":"office lighting","category":"房地產與設施","id":"w0590","number":590,"examples":[{"en":"The room needs better lighting.","zh":"這個房間需要更好的照明。"},{"en":"We replaced the lighting in the hallway.","zh":"我們更換了走廊的照明設備。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"security","pos":"n.","meaning":"安全；保全","phrase":"security system","category":"房地產與設施","id":"w0591","number":591,"examples":[{"en":"The security team is at the entrance.","zh":"保全團隊在入口處。"},{"en":"The company invested heavily in security systems to protect sensitive data.","zh":"公司投入大量資金於安全系統，以保護敏感資料。"}],"tips":["常見搭配詞組：security guard (警衛)、security deposit (租金押金/保證金)、security measures (安全措施)、security clearance (安全許可/權限)。"],"forms":["security","securities","more secure","most secure"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"access","pos":"n./v.","meaning":"進入權；使用權","phrase":"building access","category":"房地產與設施","id":"w0592","number":592,"examples":[{"en":"You can access the building with this card.","zh":"你可以用這張卡進入大樓。"},{"en":"Employees need to access the company's database to retrieve sales figures.","zh":"員工需要存取公司資料庫以取得銷售數據。"}],"tips":["詞性與介係詞用法辨析：access 作為名詞時是不可數名詞，通常後接介係詞 to（例如 have access to the file）；但作為動詞時是及物動詞，直接接受詞（例如 access the file），這是在 Part 5 詞法題中極常見的考點。"],"forms":["access","accesses","accessing","accessed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"key","pos":"n.","meaning":"鑰匙","phrase":"office key","category":"房地產與設施","id":"w0593","number":593,"examples":[{"en":"Your key is at the front desk.","zh":"你的鑰匙在櫃檯。"},{"en":"Could you please provide the key to the storage room?","zh":"您能請提供儲藏室的鑰匙嗎？"}],"tips":["多重詞性轉換：在 TOEIC 中，key 除名詞外，常作為形容詞表示「關鍵的」或「最重要的」。常見組合如 key factor (關鍵因素)、key player (核心人物/重要廠商)、key component (關鍵零件)。"],"forms":["key","keys","keying","keyed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lock","pos":"n./v.","meaning":"鎖；上鎖","phrase":"lock the door","category":"房地產與設施","id":"w0594","number":594,"examples":[{"en":"You should lock the door when you leave.","zh":"離開時你應該鎖門。"},{"en":"The IT department locked the server to prevent unauthorized access.","zh":"IT部門鎖定了伺服器以防止未經授權的訪問。"}],"tips":["常見搭配詞與短語：在TOEIC中常出現 'security lock' (安全鎖)、'combination lock' (號碼鎖) 及動詞短語 'lock up' (結束營業前鎖好門窗)。"],"forms":["lock","locks","locking","locked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"assess","pos":"v.","meaning":"評估","phrase":"assess the property","category":"房地產與設施","id":"w0595","number":595,"examples":[{"en":"The inspector will assess the damage.","zh":"檢查員將評估損壞情況。"},{"en":"The manager will assess each employee's performance during the annual review.","zh":"經理將在年度審查期間評估每位員工的績效。"}],"tips":["常見搭配詞與情境：assess 常與 risk, performance, damage 或 impact 連用。在保險或理賠情境中，常出現 assess the damage (評估損害)；在人力資源管理中，則常用 assess employee performance (評估員工績效)。"],"forms":["assess","assesses","assessing","assessed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"assessment","pos":"n.","meaning":"評估；估價","phrase":"property assessment","category":"房地產與設施","id":"w0596","number":596,"examples":[{"en":"The assessment will be ready tomorrow.","zh":"評估結果明天會準備好。"},{"en":"The annual performance assessment will help identify areas for employee development.","zh":"年度績效評估將有助於識別員工發展的領域。"}],"tips":["常見搭配詞組：'performance assessment'（績效評估）、'risk assessment'（風險評估）及 'comprehensive assessment'（全面性評估），在商務合約或報告中極為常見。"],"forms":["assessment","assessments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"restore","pos":"v.","meaning":"修復；恢復","phrase":"restore a building","category":"房地產與設施","id":"w0597","number":597,"examples":[{"en":"We can restore the old building.","zh":"我們可以修復這棟老建築。"},{"en":"The IT department is working to restore the company's database after the system failure.","zh":"IT 部門正在努力在系統故障後恢復公司的資料庫。"}],"tips":["常見搭配詞：在多益中常與 power (電力)、service (服務) 或 confidence (信心) 搭配，例如 restore power (恢復供電) 或 restore service (恢復服務)。"],"forms":["restore","restores","restoring","restored"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"relocate","pos":"v.","meaning":"搬遷；遷移","phrase":"relocate an office","category":"房地產與設施","id":"w0598","number":598,"examples":[{"en":"The company will relocate next year.","zh":"公司明年將搬遷。"},{"en":"Are you willing to relocate for this job?","zh":"你願意為這份工作搬家嗎？"}],"tips":["常見搭配詞：relocate the headquarters (遷移總部)、relocate to [location] (搬遷至某地)、relocation package/expenses (搬遷津貼/費用)。"],"forms":["relocate","relocates","relocating","relocated"],"exampleSource":"Wordstep original examples"},{"word":"relocation","pos":"n.","meaning":"搬遷；遷址","phrase":"office relocation","category":"房地產與設施","id":"w0599","number":599,"examples":[{"en":"The relocation will take place next week.","zh":"搬遷將在下星期進行。"},{"en":"The company announced a relocation of its headquarters to a larger facility.","zh":"公司宣布將總部搬遷至更大的辦公室。"}],"tips":["常見搭配詞：relocation package（搬遷福利包）、relocation expenses（搬遷費用）、corporate relocation（公司搬遷）、relocation assistance（搬遷協助）。"],"forms":["relocation","relocations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accessible","pos":"adj.","meaning":"容易到達的；可使用的","phrase":"easily accessible","category":"房地產與設施","id":"w0600","number":600,"examples":[{"en":"The building is accessible by bus.","zh":"搭公車可以到達這棟大樓。"},{"en":"The report provides accessible data for quick decision-making.","zh":"這份報告提供了易於理解的數據，方便快速決策。"}],"tips":["常見搭配詞與介係詞：最常與介係詞 to 連用，表示「對某人是可使用的或可進入的」（例如：The information is accessible to all employees）；也常接 by 以說明交通方式（例如：The building is easily accessible by train）。"],"forms":["accessible","more accessible","most accessible"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"technology","pos":"n.","meaning":"科技；技術","phrase":"new technology","category":"科技與設備","id":"w0601","number":601,"examples":[{"en":"New technology can help us save time.","zh":"新科技可以幫助我們節省時間。"},{"en":"Our company is investing heavily in new technology to improve efficiency.","zh":"我們公司正在大量投資新技術以提高效率。"}],"tips":["常見搭配詞：'cutting-edge technology' (尖端科技) 或 'state-of-the-art technology' (最先進的技術) 常在產品發表或辦公設備升級的閱讀篇章中出現。"],"forms":["technology","technologies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"computer","pos":"n.","meaning":"電腦","phrase":"computer system","category":"科技與設備","id":"w0602","number":602,"examples":[{"en":"My computer is on the desk.","zh":"我的電腦在桌上。"},{"en":"The IT department is responsible for maintaining all company computers and ensuring their security.","zh":"資訊科技部門負責維護所有公司電腦並確保其安全。"}],"tips":["常見搭配詞組：computer peripherals (電腦週邊設備)、computer glitch (電腦小故障)、computer literacy (電腦素養)，常出現在徵才廣告或IT支援情境。"],"forms":["computer","computers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"software","pos":"n.","meaning":"軟體","phrase":"install software","category":"科技與設備","id":"w0603","number":603,"examples":[{"en":"The software is easy to use.","zh":"這套軟體很容易使用。"},{"en":"Our company is investing heavily in new software to improve operational efficiency.","zh":"我們公司正在大量投資新軟體以提高營運效率。"}],"tips":["不可數名詞特性：software 為不可數名詞，在多益文法題中絕對不能加 s (softwares) 或使用 a software，若要表示「一套」或「一件」軟體，應使用 a piece of software 或 a software program。"],"forms":["software","softwares"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hardware","pos":"n.","meaning":"硬體","phrase":"computer hardware","category":"科技與設備","id":"w0604","number":604,"examples":[{"en":"The hardware will need an upgrade.","zh":"硬體將需要升級。"},{"en":"The IT department is responsible for maintaining all company hardware.","zh":"資訊部門負責維護公司所有的硬體設備。"}],"tips":["不可數名詞特性：Hardware 在英文中為不可數名詞，不可加 s 也不可與 a/an 連用，若要表示數量，通常使用 pieces of hardware。考試時若看到硬體項目複數列舉，應注意 hardware 形式不變。"],"forms":["hardware","hardwares"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"system","pos":"n.","meaning":"系統","phrase":"operating system","category":"科技與設備","id":"w0605","number":605,"examples":[{"en":"The system is working well.","zh":"系統運作正常。"},{"en":"The IT department is responsible for maintaining the company's computer system.","zh":"資訊部門負責維護公司的電腦系統。"}],"tips":["常見搭配詞組：在 TOEIC 中常與 IT 或行政管理相關，如 'operating system' (作業系統)、'filing system' (檔案管理系統) 及 'security system' (保全系統)。"],"forms":["system","systems"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"network","pos":"n.","meaning":"網路","phrase":"computer network","category":"科技與設備","id":"w0606","number":606,"examples":[{"en":"Our network is not available today.","zh":"我們的網路今天無法使用。"},{"en":"The IT department is responsible for maintaining the company's computer network.","zh":"資訊科技部門負責維護公司的電腦網路。"}],"tips":["常見搭配詞與情境：作名詞時常指「電腦網路」(computer network) 或「人脈網絡」(professional network)。在多益閱讀中常出現於 IT 技術支援或人脈拓展活動的通知。"],"forms":["network","networks","networking","networked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"server","pos":"n.","meaning":"伺服器","phrase":"server maintenance","category":"科技與設備","id":"w0607","number":607,"examples":[{"en":"The server will restart tonight.","zh":"伺服器今晚會重新啟動。"},{"en":"Due to a server outage, the website is temporarily unavailable.","zh":"由於伺服器故障，網站暫時無法使用。"}],"tips":["多義詞辨析：在多益考試中，server 常有兩種關鍵含義。第一種是餐飲情境中（Part 1 & 3）指「服務生」，與 waiter/waitress 同義且更具性別中立性；第二種是辦公室 IT 情境中（Part 5 & 7）指「伺服器」。"],"forms":["server","servers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"database","pos":"n.","meaning":"資料庫","phrase":"customer database","category":"科技與設備","id":"w0608","number":608,"examples":[{"en":"The database contains customer records.","zh":"資料庫包含客戶紀錄。"},{"en":"Our IT department is currently upgrading the company's database to improve data security.","zh":"我們的資訊部門目前正在升級公司的資料庫，以提升資料安全。"}],"tips":["常見搭配詞：常與動詞連用如 'access a database' (存取資料庫)、'update a database' (更新資料庫)、'maintain a database' (維護資料庫)；形容詞搭配如 'searchable database' (可搜尋的資料庫) 或 'comprehensive database' (詳盡的資料庫)。"],"forms":["database","databases"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"website","pos":"n.","meaning":"網站","phrase":"company website","category":"科技與設備","id":"w0609","number":609,"examples":[{"en":"The website is available in English.","zh":"這個網站有英文版本。"},{"en":"Our company's website provides comprehensive information about our products and services.","zh":"我們公司的網站提供了關於我們產品和服務的全面資訊。"}],"tips":["常見搭配詞組：在 TOEIC 考試中常與動詞連用，如 launch a website (推出網站)、update a website (更新網站)、browse a website (瀏覽網站) 或 navigate a website (在網站中導覽)；常見形容詞則有 official website (官方網站) 或 user-friendly website (介面友善的網站)。"],"forms":["website","websites"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"webpage","pos":"n.","meaning":"網頁","phrase":"visit a webpage","category":"科技與設備","id":"w0610","number":610,"examples":[{"en":"This webpage is loading slowly.","zh":"這個網頁載入得很慢。"},{"en":"I encountered an error when trying to load that webpage.","zh":"我嘗試載入那個網頁時遇到了一個錯誤。"}],"tips":["常見搭配詞：'design a webpage' (設計網頁)、'update a webpage' (更新網頁)、'launch a webpage' (發布網頁)。"],"forms":["webpages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"internet","pos":"n.","meaning":"網際網路","phrase":"internet access","category":"科技與設備","id":"w0611","number":611,"examples":[{"en":"The internet connection is free.","zh":"網路連線是免費的。"},{"en":"Our company is investing heavily in improving its online presence on the internet.","zh":"我們公司正在大力投資於提升其在互聯網上的線上形象。"}],"tips":["常見搭配詞：包含 'access the internet' (連結網路)、'high-speed internet connection' (高速網路連線) 以及 'internet service provider' (ISP，網路服務供應商)。這些詞彙常出現在辦公室設備升級或搬遷的情境中。"],"forms":["internet","internets"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"online","pos":"adj./adv.","meaning":"線上的；在線上","phrase":"online service","category":"科技與設備","id":"w0612","number":612,"examples":[{"en":"You can order the tickets online.","zh":"你可以在線上訂票。"},{"en":"Customers can now access our services online 24/7.","zh":"客戶現在可以 24/7 在線上存取我們的服務。"}],"tips":["常見搭配詞：'online registration'（線上註冊）、'online payment'（線上付款）、'online catalog'（線上目錄），常出現在閱讀測驗的指示或商務通告中。"],"forms":["online","more online","most online"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"digital","pos":"adj.","meaning":"數位的","phrase":"digital technology","category":"科技與設備","id":"w0613","number":613,"examples":[{"en":"A digital copy is available.","zh":"有電子版本可以取得。"},{"en":"The IT department is responsible for maintaining our digital infrastructure.","zh":"資訊科技部門負責維護我們的數位基礎設施。"}],"tips":["常見搭配詞：digital transformation (數位轉型)、digital marketing (數位行銷) 以及 digital devices (數位裝置)，這些詞彙常出現在辦公室科技升級或市場策略的公告中。"],"forms":["digital","more digital","most digital","digitals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"electronic","pos":"adj.","meaning":"電子的","phrase":"electronic device","category":"科技與設備","id":"w0614","number":614,"examples":[{"en":"The electronic ticket is on my phone.","zh":"電子票在我的手機上。"},{"en":"The company is transitioning to electronic billing to reduce paper waste.","zh":"公司正在轉向電子帳單，以減少紙張浪費。"}],"tips":["常見搭配詞：electronic device (電子設備)、electronic signature (電子簽名)、electronic components (電子零件)。"],"forms":["electronic","more electronic","most electronic"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"program","pos":"n.","meaning":"程式；軟體","phrase":"computer program","category":"科技與設備","id":"w0615","number":615,"examples":[{"en":"This program can open the file.","zh":"這個程式可以開啟檔案。"},{"en":"Please program the new employee's access card to the building.","zh":"請為新進員工編寫門禁卡。"}],"tips":["多重詞性與含義：在多益中 program 最常作為名詞使用，包含『計畫/方案』(如 training program)、『程式』(如 software program) 及『活動日程』。亦可作動詞表示『編寫程式』或『預先設定』。"],"forms":["program","programs","programming","programmed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"platform","pos":"n.","meaning":"平台","phrase":"online platform","category":"科技與設備","id":"w0616","number":616,"examples":[{"en":"The platform is easy to access.","zh":"這個平台很容易使用。"},{"en":"Our company is launching a new e-commerce platform to expand its market reach.","zh":"我們公司正在推出一個新的電子商務平台以擴大市場覆蓋率。"}],"tips":["【交通情境】：在聽力第一部分照片描述或第四部分簡短談話中，常指火車站的「月台」。常見搭配如 'standing on the platform' 或 'on Platform 9'，需與 track（軌道）區分，月台是人候車的區域。"],"forms":["platform","platforms"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"browser","pos":"n.","meaning":"瀏覽器","phrase":"web browser","category":"科技與設備","id":"w0617","number":617,"examples":[{"en":"You should update your browser.","zh":"你應該更新瀏覽器。"},{"en":"I use Google Chrome as my default web browser.","zh":"我使用 Google Chrome 作為我的預設網路瀏覽器。"}],"tips":["技術支援情境：常出現在辦公室 IT 支援對話中，例如更新版本 (update your browser) 或清理快取 (clear browser cache) 以解決系統異常。"],"forms":["browsers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"password","pos":"n.","meaning":"密碼","phrase":"reset a password","category":"科技與設備","id":"w0618","number":618,"examples":[{"en":"Your password must be kept secret.","zh":"你的密碼必須保密。"},{"en":"For security reasons, you must change your password every 90 days.","zh":"為了安全起見，您必須每 90 天更換密碼。"}],"tips":["常見搭配詞：'reset a password' (重設密碼)、'enter a password' (輸入密碼) 及 'case-sensitive' (區分大小寫)，在 IT 技術支援對話中極其常見。"],"forms":["password","passwords"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"username","pos":"n.","meaning":"使用者名稱","phrase":"enter a username","category":"科技與設備","id":"w0619","number":619,"examples":[{"en":"Please enter your username and password.","zh":"請輸入你的使用者名稱與密碼。"},{"en":"You can change your username in the settings.","zh":"你可以在設定中更改使用者名稱。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"login","pos":"n./adj.","meaning":"登入；登入用的","phrase":"login information","category":"科技與設備","id":"w0620","number":620,"examples":[{"en":"The login page is ready.","zh":"登入頁面已經準備好了。"},{"en":"Please login to the company portal using your employee ID and password.","zh":"請使用您的員工編號和密碼登入公司入口網站。"}],"tips":["區分詞性與拼寫：在 TOEIC 考試中需注意 'login' (名詞/形容詞) 與 'log in' (動詞片語) 的差別。例如：'Your login credentials' (名詞) 對比 'Please log in to the server' (動詞)。"],"forms":["login","logs in","logging in","logged in"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"user","pos":"n.","meaning":"使用者","phrase":"registered user","category":"科技與設備","id":"w0621","number":621,"examples":[{"en":"Each user will receive a password.","zh":"每位使用者都會收到一組密碼。"},{"en":"Our software is designed for ease of use by all users, regardless of their technical expertise.","zh":"我們的軟體設計易於所有使用者使用，無論他們具備多大的技術專業知識。"}],"tips":["常見搭配詞：多留意「user manual」（使用手冊）、「user-friendly」（易於使用的）以及「end user」（終端使用者），這些詞彙在 TOEIC 閱讀測驗的產品描述與技術支援情境中極為常見。"],"forms":["user","users"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"data","pos":"n.","meaning":"資料；數據","phrase":"store data","category":"科技與設備","id":"w0622","number":622,"examples":[{"en":"The data is stored on this computer.","zh":"資料儲存在這台電腦上。"},{"en":"The marketing team analyzed the sales data to identify trends.","zh":"行銷團隊分析了銷售數據以找出趨勢。"}],"tips":["常見搭配詞：'collect data' (收集數據)、'analyze data' (分析數據) 及 'data entry' (資料輸入)，常出現在職位描述或任務分配中。"],"forms":["data"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"information","pos":"n.","meaning":"資訊；資料","phrase":"contact information","category":"科技與設備","id":"w0623","number":623,"examples":[{"en":"More information is on our website.","zh":"更多資訊在我們的網站上。"},{"en":"Please send me all relevant information regarding the upcoming project.","zh":"請將所有關於即將開始的專案的相關資訊寄給我。"}],"tips":["不可數名詞特性：information 在多益測驗中極常考其『不可數』性質，考生必須記住它不能加 s，也不能與 an 連用。若要表示『一項資訊』，應使用 a piece of information 或 some information。"],"forms":["information","informations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"update","pos":"n./v.","meaning":"更新；更新資訊","phrase":"software update","category":"科技與設備","id":"w0624","number":624,"examples":[{"en":"You should update the software today.","zh":"你應該在今天更新軟體。"},{"en":"The IT department will update the software to fix the security vulnerabilities.","zh":"資訊部門將更新軟體以修復安全漏洞。"}],"tips":["常見搭配詞：'status update' (進度更新)、'provide an update on' (提供關於...的最新消息)、'keep someone updated' (讓某人隨時掌握最新情況)。"],"forms":["update","updates","updating","updated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"download","pos":"n./v.","meaning":"下載","phrase":"download a file","category":"科技與設備","id":"w0625","number":625,"examples":[{"en":"You can download the form here.","zh":"你可以在這裡下載表格。"},{"en":"Please download the presentation slides from the company website before the meeting.","zh":"請在會議前從公司網站下載簡報投影片。"}],"tips":["常見搭配詞：在多益中常與附件或軟體連結，如 'download an attachment' (下載附件)、'download a mobile app' (下載行動應用程式) 或 'download the latest update' (下載最新更新)。"],"forms":["download","downloads","downloading","downloaded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"upload","pos":"n./v.","meaning":"上傳","phrase":"upload a document","category":"科技與設備","id":"w0626","number":626,"examples":[{"en":"You can upload a photo later.","zh":"你可以稍後上傳照片。"},{"en":"Please upload your presentation slides to the shared drive by the end of the day.","zh":"請在今天結束前將您的簡報投影片上傳至共享雲端硬碟。"}],"tips":["常見搭配詞：常用於 'upload a file' (上傳檔案)、'upload to the server' (上傳至伺服器) 或 'upload documents' (上傳文件)。在 TOEIC 閱讀 Part 7 的公司內部公告或網路指南中極其常見。"],"forms":["upload","uploads","uploading","uploaded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"backup","pos":"n./v.","meaning":"備份","phrase":"back up data","category":"科技與設備","id":"w0627","number":627,"examples":[{"en":"Please make a backup of these files.","zh":"請為這些檔案製作備份。"},{"en":"We restored the data from a backup.","zh":"我們從備份還原了資料。"}],"tips":["詞性區分與拼寫技巧：在 TOEIC 考試中，作名詞或形容詞時常寫為單一單字 backup（如：backup copy 備份副本），而動詞片語則寫為兩個單字 back up（如：Remember to back up the data）。"],"forms":["backup","backups","backs up","backing up","backed up","more backup","most backup"],"exampleSource":"Wordstep original examples"},{"word":"connect","pos":"v.","meaning":"連接；連線","phrase":"connect to a network","category":"科技與設備","id":"w0628","number":628,"examples":[{"en":"You can connect the printer to this computer.","zh":"你可以把印表機連接到這台電腦。"},{"en":"Could you please connect me with the sales manager?","zh":"您能請幫我轉接給銷售經理嗎？"}],"tips":["常見搭配詞與交通情境：'connecting flight' (轉機航班) 是多益聽力與閱讀的高頻詞彙，常用於機場廣播或旅遊行程表。"],"forms":["connect","connects","connecting","connected","connections"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"connection","pos":"n.","meaning":"連線；連接","phrase":"internet connection","category":"科技與設備","id":"w0629","number":629,"examples":[{"en":"The connection is working again.","zh":"連線恢復正常了。"},{"en":"The IT department is working to restore the internet connection after the power outage.","zh":"停電後，資訊部門正在努力恢復網路連接。"}],"tips":["交通運輸情境：在 TOEIC 聽力與閱讀中，此字常指轉機或轉車，常見搭配如 'miss a connection' (錯過接駁班次) 或 'tight connection' (轉乘時間緊迫)。"],"forms":["connection","connections","connects","connecting","connected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"wireless","pos":"adj.","meaning":"無線的","phrase":"wireless network","category":"科技與設備","id":"w0630","number":630,"examples":[{"en":"The hotel offers wireless internet.","zh":"飯店提供無線網路。"},{"en":"The wireless headset allows for hands-free communication during conference calls.","zh":"無線耳機允許在電話會議期間進行免提通訊。"}],"tips":["常見搭配詞：常用於 wireless network (無線網路)、wireless connection (無線連接)、wireless router (無線路由器) 以及 wireless mouse/keyboard (無線滑鼠/鍵盤)。"],"forms":["wireless","more wireless","most wireless"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"screen","pos":"n.","meaning":"螢幕","phrase":"computer screen","category":"科技與設備","id":"w0631","number":631,"examples":[{"en":"The screen is too bright.","zh":"螢幕太亮了。"},{"en":"The new monitors have high‑resolution screens that improve presentation clarity.","zh":"新款顯示器配備高解析度螢幕，可提升簡報的清晰度。"}],"tips":["動詞用法於人力資源情境：在 TOEIC 閱讀與聽力中，screen 常指『篩選』應徵者，常見搭配為 screen applicants 或 screen resumes，意指在面試前初步過濾履歷。"],"forms":["screen","screens","screening","screened"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"monitor","pos":"n./v.","meaning":"顯示器；監控","phrase":"computer monitor","category":"科技與設備","id":"w0632","number":632,"examples":[{"en":"The monitor is connected to my laptop.","zh":"螢幕已連接到我的筆記型電腦。"},{"en":"We use software to monitor employee productivity and ensure efficient workflow.","zh":"我們使用軟體來監控員工生產力，確保工作流程的高效。"}],"tips":["詞性與多義性辨析：在多益考試中，monitor 同時作為名詞（顯示器、螢幕）與動詞（監控、監測）出現。聽力第一部分照片描述題常考名詞用法，如 'looking at the monitor'；而閱讀部分則多考動詞用法，意指持續觀察某個過程。"],"forms":["monitor","monitors","monitoring","monitored"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"keyboard","pos":"n.","meaning":"鍵盤","phrase":"wireless keyboard","category":"科技與設備","id":"w0633","number":633,"examples":[{"en":"The keyboard is on the desk.","zh":"鍵盤在桌上。"},{"en":"The IT department replaced my keyboard because several keys were malfunctioning.","zh":"由於幾個按鍵失靈，IT部門更換了我的鍵盤。"}],"tips":["常見搭配詞：'wireless keyboard' (無線鍵盤)、'ergonomic keyboard' (人體工學鍵盤) 與 'keyboard shortcuts' (鍵盤快捷鍵)。"],"forms":["keyboard","keyboards"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"battery","pos":"n.","meaning":"電池","phrase":"replace the battery","category":"科技與設備","id":"w0634","number":634,"examples":[{"en":"My phone battery is almost empty.","zh":"我的手機電池快沒電了。"},{"en":"Does this camera need a new battery?","zh":"這台相機需要新電池嗎？"}],"tips":["辦公室情境與設備維護：在 TOEIC 聽力與閱讀中，battery 常與行動裝置或辦公設備相關。常見搭配如 'battery life' (電池續航力)、'rechargeable battery' (充電電池) 與 'replace the battery' (更換電池)。"],"forms":["battery","batteries"],"exampleSource":"Wordstep original examples"},{"word":"charger","pos":"n.","meaning":"充電器","phrase":"battery charger","category":"科技與設備","id":"w0635","number":635,"examples":[{"en":"I forgot to bring my charger.","zh":"我忘了帶充電器。"},{"en":"Can I borrow your phone charger?","zh":"我可以借你的手機充電器嗎？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"cable","pos":"n.","meaning":"電纜；連接線","phrase":"power cable","category":"科技與設備","id":"w0636","number":636,"examples":[{"en":"The cable is long enough.","zh":"這條線夠長。"},{"en":"The IT department needs to replace the damaged network cable.","zh":"資訊部門需要更換損壞的網路纜線。"}],"tips":["常見搭配詞組：'power cable' (電源線)、'fiber optic cable' (光纖電纜) 與 'network cable' (網路線)，在設備安裝或故障排除情境中經常出現。"],"forms":["cable","cables"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"plug","pos":"n./v.","meaning":"插頭；插入","phrase":"plug in the device","category":"科技與設備","id":"w0637","number":637,"examples":[{"en":"The plug is loose.","zh":"插頭鬆了。"},{"en":"The IT department needs to plug the new printer into the network.","zh":"IT 部門需要將新印表機連接到網路。"}],"tips":["常見動詞短語為 'plug in' (接通電源) 與 'unplug' (拔掉電源)，這在聽力測驗 Part 3 與 Part 4 的辦公設備故障或報修情境中非常常見。"],"forms":["plug","plugs","plugging","plugged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"power","pos":"n.","meaning":"電力；電源","phrase":"power supply","category":"科技與設備","id":"w0638","number":638,"examples":[{"en":"The power will be off this afternoon.","zh":"今天下午會停電。"},{"en":"The company's power supply was disrupted due to the storm.","zh":"由於風暴，該公司的電力供應中斷了。"}],"tips":["常見搭配詞與短語：power outage 或 power failure (停電)、power plant (發電廠)、solar power (太陽能)、executive power (執行權)。"],"forms":["power","powers","powering","powered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"troubleshoot","pos":"v.","meaning":"排除故障","phrase":"troubleshoot a problem","category":"科技與設備","id":"w0639","number":639,"examples":[{"en":"Our team can troubleshoot the problem.","zh":"我們的團隊可以排除這個問題。"},{"en":"Department heads discussed the troubleshoot strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了troubleshoot策略。"}],"tips":["常見搭配詞：常用於 'troubleshoot technical issues' (排除技術問題)、'troubleshoot a system failure' (系統故障排除) 或 'troubleshoot software glitches' (排查軟體瑕疵)。"],"forms":["troubleshoot"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"error","pos":"n.","meaning":"錯誤；故障","phrase":"error message","category":"科技與設備","id":"w0640","number":640,"examples":[{"en":"An error is shown on the screen.","zh":"螢幕上顯示一個錯誤。"},{"en":"The report contained several errors that needed to be corrected before submission.","zh":"報告包含幾個需要在提交前更正的錯誤。"}],"tips":["常見搭配詞組：'human error' (人為錯誤)、'clerical error' (文書疏失)、'system error' (系統錯誤) 以及 'error message' (錯誤訊息)，這些組合頻繁出現在辦公室公告或技術支援的情境中。"],"forms":["error","errors","erroring","errored"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"failure","pos":"n.","meaning":"故障；失效","phrase":"system failure","category":"科技與設備","id":"w0641","number":641,"examples":[{"en":"The equipment failure will cause a delay.","zh":"設備故障將造成延誤。"},{"en":"A significant drop in sales figures led to a failure to meet quarterly revenue targets.","zh":"銷售數字的顯著下降導致未能達到季度營收目標。"}],"tips":["常見搭配詞：在 TOEIC 中常以 'power failure' (停電) 或 'equipment failure' (設備故障) 出現於維修公告，另有 'failure to + V' 表示『未能做某事』。"],"forms":["failure","failures"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"function","pos":"n./v.","meaning":"功能；運作","phrase":"function properly","category":"科技與設備","id":"w0642","number":642,"examples":[{"en":"This function can save you time.","zh":"這個功能可以節省你的時間。"},{"en":"The primary function of this department is to manage customer relationships.","zh":"這個部門的主要職能是管理客戶關係。"}],"tips":["掌握多重詞義與詞性：在多益考試中，function 既可當動詞表示『運作、起作用』，也可當名詞表示『功能』或『正式社交聚會、典禮』。在 Part 7 的閱讀測驗中，若出現在公司活動或邀請函情境，通常指正式活動。"],"forms":["function","functions","functioning","functioned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"compatible","pos":"adj.","meaning":"相容的","phrase":"compatible with software","category":"科技與設備","id":"w0643","number":643,"examples":[{"en":"The device is compatible with your computer.","zh":"這個裝置與你的電腦相容。"},{"en":"Before purchasing the software, ensure it's compatible with your existing operating system.","zh":"在購買軟體之前，請確保它與您現有的作業系統相容。"}],"tips":["固定搭配與文法：此單字最常見的用法是與介係詞 \"with\" 連用，形成 \"be compatible with\" (與...相容/相符)。在多益 Part 5 填空題中，若空格後出現 \"with\"，\"compatible\" 常為正確選項。"],"forms":["compatible","more compatible","most compatible"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"version","pos":"n.","meaning":"版本","phrase":"latest version","category":"科技與設備","id":"w0644","number":644,"examples":[{"en":"The new version is available now.","zh":"新版本現在可以使用了。"},{"en":"The software company released a new version of their product to address user feedback.","zh":"為了處理用戶的回饋，軟體公司發布了其產品的新版本。"}],"tips":["常見搭配詞：包含 'latest version' (最新版本)、'updated version' (更新版)、'trial version' (試用版) 以及 'final version' (最終版本)，這些詞組常出現在軟體採購或文件審閱情境。"],"forms":["version","versions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"configure","pos":"v.","meaning":"設定；配置","phrase":"configure a system","category":"科技與設備","id":"w0645","number":645,"examples":[{"en":"You can configure the printer yourself.","zh":"你可以自行設定印表機。"},{"en":"IT support will configure your new laptop with the necessary software.","zh":"IT 支援將為您的新筆記型電腦配置所需的軟體。"}],"tips":["常見搭配詞：'configure settings' (配置設定)、'configure a system' (配置系統) 或 'reconfigure hardware' (重新配置硬體)，常用於 IT 或辦公設備安裝情境。"],"forms":["configure","configures","configuring","configured"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"setting","pos":"n.","meaning":"設定；設定值","phrase":"change the settings","category":"科技與設備","id":"w0646","number":646,"examples":[{"en":"This setting will change the volume.","zh":"這個設定會改變音量。"},{"en":"The company is adjusting its marketing settings to target a younger demographic.","zh":"公司正在調整其行銷設定，以鎖定更年輕的客群。"}],"tips":["常見搭配詞：'industrial setting' (工業環境)、'professional setting' (專業場合)、'clinical setting' (臨床環境) 以及 'default setting' (預設設定)，在多益中多用來描述特定的工作或技術環境。"],"forms":["setting","settings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"scan","pos":"v.","meaning":"掃描","phrase":"scan a document","category":"科技與設備","id":"w0647","number":647,"examples":[{"en":"You can scan the document here.","zh":"你可以在這裡掃描文件。"},{"en":"The security system scans all incoming packages for prohibited items.","zh":"安全系統掃描所有進貨包裹，以尋找違禁物品。"}],"tips":["常見搭配詞與商務情境：在多益考試中，scan 常見於辦公室與物流情境。常見搭配包括 scan a document (掃描文件)、scan a barcode (掃描條碼) 或 scan an ID badge (感應識別證)。在商務自動化流程中，scan 亦常與 digitize (數位化) 或 upload (上傳) 聯用。"],"forms":["scan","scans","scanning","scanned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"portable","pos":"adj.","meaning":"可攜式的","phrase":"portable device","category":"科技與設備","id":"w0648","number":648,"examples":[{"en":"This portable speaker is light.","zh":"這個可攜式喇叭很輕。"},{"en":"The company is developing a portable projector for business presentations.","zh":"該公司正在開發一款便攜式投影機，用於商務簡報。"}],"tips":["常見搭配詞：常用於描述電子設備或辦公器材，例如 portable device (行動裝置)、portable heater (移動式暖氣)、portable computer (手提電腦) 以及 portable charger (行動電源)。"],"forms":["portable","more portable","most portable"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"privacy","pos":"n.","meaning":"隱私；隱私權","phrase":"privacy policy","category":"科技與設備","id":"w0649","number":649,"examples":[{"en":"Your privacy is important to us.","zh":"我們很重視你的隱私。"},{"en":"Employees are expected to respect the privacy of their colleagues.","zh":"員工預期會尊重同事的隱私。"}],"tips":["常見搭配詞與商業情境：在 TOEIC 中常以 'privacy policy' (隱私權政策) 或 'data privacy' (數據隱私) 的形式出現，特別常見於網站服務條款、會員申請表或員工手冊中。"],"forms":["privacy","privacies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"confidential","pos":"adj.","meaning":"機密的","phrase":"confidential information","category":"科技與設備","id":"w0650","number":650,"examples":[{"en":"The report is confidential.","zh":"這份報告是機密文件。"},{"en":"This document contains confidential information and should not be shared with unauthorized personnel.","zh":"這份文件包含機密資訊，不應與未經授權的人員分享。"}],"tips":["常見搭配詞與短語：'confidential information' (機密資訊)、'confidential documents' (機密文件)、'keep something confidential' (保持機密)、'strictly confidential' (絕密)。"],"forms":["confidential","more confidential","most confidential"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"travel","pos":"n./v.","meaning":"旅行；出差","phrase":"business travel","category":"商務旅行","id":"w0651","number":651,"examples":[{"en":"We will travel to Japan next week.","zh":"我們下星期會去日本旅行。"},{"en":"The company reimburses employees for all travel expenses incurred during business trips.","zh":"公司會退償員工在出差期間產生的所有差旅費用。"}],"tips":["常見搭配詞與情境：在多益考試中，此單字頻繁出現於商務出差情境，常見詞組如 'travel arrangements' (行程安排)、'travel expenses' (差旅費) 及 'business travel' (商務旅行)。"],"forms":["travel","travels","traveling","traveled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"trip","pos":"n.","meaning":"旅行；出差","phrase":"business trip","category":"商務旅行","id":"w0652","number":652,"examples":[{"en":"The trip will last three days.","zh":"這趟旅行會持續三天。"},{"en":"The company will cover all expenses for your business trip to Tokyo.","zh":"公司將會支付您前往東京的商務差旅的所有費用。"}],"tips":["常見搭配詞：'business trip' (出差) 是多益最常考的用法，常與 'go on', 'take', 'be away on' 連用；另外還有 'round trip' (來回票/旅程) 與 'one-way trip' (單程) 常出現在交通購票或預約情境中。"],"forms":["trip","trips","tripping","tripped"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"journey","pos":"n.","meaning":"旅程","phrase":"long journey","category":"商務旅行","id":"w0653","number":653,"examples":[{"en":"The journey will take two hours.","zh":"這段旅程將需要兩小時。"},{"en":"Her career journey has been marked by dedication and perseverance.","zh":"她的職業生涯充滿了奉獻和毅力。"}],"tips":["常見搭配詞：在多益中，journey 常與形容詞連用形成固定表達，如 \"safe journey\" (旅途平安) 或 \"pleasant journey\" (愉快的旅程)。"],"forms":["journey","journeys"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"traveler","pos":"n.","meaning":"旅客；旅行者","phrase":"business traveler","category":"商務旅行","id":"w0654","number":654,"examples":[{"en":"Every traveler should carry a passport.","zh":"每位旅客都應該攜帶護照。"},{"en":"The hotel offers special rates for business travelers.","zh":"這家飯店為商務旅客提供特別優惠。"}],"tips":["常見搭配詞組：'Frequent traveler' (常客) 常出現在航空公司或飯店的會員忠誠計畫情境中；'Business traveler' (商務旅客) 則是多益最核心的商業情境角色。"],"forms":["traveler","travelers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"itinerary","pos":"n.","meaning":"行程；行程表","phrase":"travel itinerary","category":"商務旅行","id":"w0655","number":655,"examples":[{"en":"Please email me the itinerary.","zh":"請用電子郵件把行程表寄給我。"},{"en":"Our travel itinerary has changed.","zh":"我們的旅行行程已經改變。"}],"tips":["itinerary 通常指旅行的詳細安排。例句2的 has changed 表示行程已經改變。"],"forms":["itinerary","itineraries"],"exampleSource":"Wordstep original examples"},{"word":"departure","pos":"n.","meaning":"出發；離境","phrase":"departure time","category":"商務旅行","id":"w0656","number":656,"examples":[{"en":"The departure time is nine o'clock.","zh":"出發時間是九點。"},{"en":"The departure gate for flight BA249 to London is now open.","zh":"飛往倫敦的 BA249 航班的登機口已開放。"}],"tips":["常見搭配詞組：在旅遊與交通情境中，常出現 departure gate (登機門)、departure lounge (候機室)、scheduled departure (預定出發時間) 及 departure date (出發日期)。"],"forms":["departure","departures","departs","departing","departed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"depart","pos":"v.","meaning":"出發；離開","phrase":"depart on time","category":"商務旅行","id":"w0657","number":657,"examples":[{"en":"The train will depart in ten minutes.","zh":"火車將在十分鐘後出發。"},{"en":"The flight departs from Gate 12 at 10:00 AM.","zh":"這趟航班將於上午 10:00 從 12 號登機口出發。"}],"tips":["常見搭配詞與介系詞：'depart from' 接起點，'depart for' 接目的地。在考試中常出現 'scheduled to depart'（預計出發）或 'depart promptly'（準時出發）。"],"forms":["depart","departs","departing","departed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"booking","pos":"n.","meaning":"預訂","phrase":"confirm a booking","category":"商務旅行","id":"w0658","number":658,"examples":[{"en":"I would like to change my booking.","zh":"我想更改我的預訂。"},{"en":"Your booking has been confirmed.","zh":"你的預訂已獲確認。"}],"tips":["常見搭配詞組：'make a booking' (進行預訂)、'cancel a booking' (取消預訂) 與 'booking confirmation' (預訂確認信)。這些用法頻繁出現在 TOEIC 閱讀的電子郵件及聽力的對話中。"],"forms":["booking","bookings","books","booked"],"exampleSource":"Wordstep original examples"},{"word":"book","pos":"v.","meaning":"預訂","phrase":"book a room","category":"商務旅行","id":"w0659","number":659,"examples":[{"en":"You can book a room online.","zh":"你可以在線上訂房。"},{"en":"Please refer to the company's policy book for detailed guidelines.","zh":"請參考公司政策手冊以獲得詳細的指導。"}],"tips":["詞性轉變考點：在 TOEIC 中，「book」除了當名詞「書」之外，極常作為動詞「預訂」使用。常見搭配詞如「book a flight」（訂機票）、「book a room」（訂房）或「book a venue」（預訂場地）。"],"forms":["book","books","booking","booked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"airfare","pos":"n.","meaning":"機票費；航空票價","phrase":"discount airfare","category":"商務旅行","id":"w0660","number":660,"examples":[{"en":"The airfare is included in the price.","zh":"價格已包含機票費用。"},{"en":"The company will reimburse employees for their airfare and accommodation expenses.","zh":"公司將會退償員工的機票費用和住宿費用。"}],"tips":["常見搭配詞：'round-trip airfare' (來回機票費)、'one-way airfare' (單程機票費) 及 'discount airfare' (折扣機票)。"],"forms":["airfare","airfares"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"passport","pos":"n.","meaning":"護照","phrase":"valid passport","category":"商務旅行","id":"w0661","number":661,"examples":[{"en":"Your passport must be valid.","zh":"你的護照必須在有效期限內。"},{"en":"Please ensure you have your passport and visa before departing for the business trip.","zh":"請在出發前往商務旅行之前，確保您已備妥護照和簽證。"}],"tips":["常見搭配詞：常用於 apply for a passport (申請護照)、renew a passport (更換護照)、或使用形容詞 valid (有效的) 與 expired (過期的) 來描述狀態。"],"forms":["passport","passports"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"visa","pos":"n.","meaning":"簽證","phrase":"apply for a visa","category":"商務旅行","id":"w0662","number":662,"examples":[{"en":"You may need a visa for this trip.","zh":"這趟旅行你可能需要簽證。"},{"en":"Please submit your visa application at least two weeks prior to your business trip.","zh":"請在商務旅行至少兩週前提交您的簽證申請。"}],"tips":["常見搭配詞：'apply for a visa'（申請簽證）、'visa application'（簽證申請）、'valid visa'（有效簽證）及 'visa renewal'（簽證續簽）。"],"forms":["visa","visas"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"luggage","pos":"n.","meaning":"行李","phrase":"carry luggage","category":"商務旅行","id":"w0663","number":663,"examples":[{"en":"Your luggage is in the lobby.","zh":"你的行李在大廳。"},{"en":"Please ensure your luggage is properly tagged before checking in.","zh":"請在辦理登機手續前，確保您的行李已正確標籤。"}],"tips":["文法核心：不可數名詞特性：luggage 在 TOEIC 考試中是經典的不可數名詞，絕對不能加 -s (luggages)，前面也不能用 a/an 或數詞 (one luggage)。這是 Part 5 改錯或填空題的高頻考點。"],"forms":["luggage","luggages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"baggage","pos":"n.","meaning":"行李","phrase":"baggage allowance","category":"商務旅行","id":"w0664","number":664,"examples":[{"en":"The baggage is ready for collection.","zh":"行李已經可以領取了。"},{"en":"Please ensure your baggage is tagged with the correct destination.","zh":"請確保您的行李已標示正確的抵達目的地。"}],"tips":["不可數名詞特性：baggage 為不可數名詞，在多益考試中絕不能加 s (如 baggages) 或是搭配不定冠詞 a。表示數量時須用 'a piece of baggage' 或 'items of baggage'。"],"forms":["baggage","baggages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"suitcase","pos":"n.","meaning":"行李箱","phrase":"pack a suitcase","category":"商務旅行","id":"w0665","number":665,"examples":[{"en":"My suitcase is too heavy.","zh":"我的行李箱太重了。"},{"en":"Please check your suitcase for any prohibited items before boarding.","zh":"請在登機前檢查您的行李箱，確認沒有任何禁止物品。"}],"tips":["在 Part 1 照片描述題中，suitcase 是高頻單字，常出現在機場、旅館或街道場景。注意描述動作的動詞，如 packing (打包)、carrying (提著)、rolling (滾動/拉著) 或 lifting (舉起) 行李箱。"],"forms":["suitcase","suitcases"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"briefcase","pos":"n.","meaning":"公事包","phrase":"carry a briefcase","category":"商務旅行","id":"w0666","number":666,"examples":[{"en":"His briefcase is under the seat.","zh":"他的公事包在座位下方。"},{"en":"The secretary reminded him to bring his briefcase for the presentation.","zh":"秘書提醒他帶公事包參加簡報。"}],"tips":["常見搭配詞組：'carry a briefcase' (提著公事包)、'open a briefcase' (打開公事包)、'set a briefcase on the floor' (將公事包放在地上)、'leave a briefcase unattended' (將公事包留在現場無人看管)。"],"forms":["briefcase","briefcases"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consulate","pos":"n.","meaning":"領事館","phrase":"contact the consulate","category":"商務旅行","id":"w0667","number":667,"examples":[{"en":"The consulate is open this morning.","zh":"領事館今天上午有開放。"},{"en":"For visa inquiries, please contact the nearest consulate of the country you wish to visit.","zh":"如有簽證相關問題，請聯繫您計劃訪問國家最近的領事館。"}],"tips":["常見搭配詞組：'the local consulate' (當地領事館)、'apply for a visa at the consulate' (在領事館申請簽證)、'contact the consulate for assistance' (聯繫領事館尋求協助)。"],"forms":["consulate","consulates"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consular","pos":"adj.","meaning":"領事的","phrase":"consular services","category":"商務旅行","id":"w0668","number":668,"examples":[{"en":"Please contact the consular office for help.","zh":"請聯絡領事辦事處尋求協助。"},{"en":"Consular services are available on weekdays.","zh":"平日提供領事服務。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"agency","pos":"n.","meaning":"代理機構；旅行社","phrase":"travel agency","category":"商務旅行","id":"w0669","number":669,"examples":[{"en":"The travel agency is near the station.","zh":"旅行社在車站附近。"},{"en":"The advertising agency developed a creative campaign to boost sales.","zh":"廣告公司開發了一項創意活動以提高銷售額。"}],"tips":["常見搭配詞：travel agency（旅行社）、employment agency（人力仲介）、advertising agency（廣告代理商）、government agency（政府機構）。"],"forms":["agency","agencies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"agent","pos":"n.","meaning":"代理人；旅行社人員","phrase":"travel agent","category":"商務旅行","id":"w0670","number":670,"examples":[{"en":"Our agent can help you book the flight.","zh":"我們的服務人員可以幫你訂機票。"},{"en":"Our travel agent booked our flights and hotel.","zh":"我們的旅行社代理人幫我們預訂了機票和酒店。"}],"tips":["常見搭配詞與職稱：在多益中 agent 常與特定行業結合，如 travel agent (旅遊代辦)、real estate agent (房產經紀人) 或 insurance agent (保險代理人)，在聽力測驗中若聽到 booking 或 property 應聯想此詞。"],"forms":["agent","agents"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accommodation","pos":"n.","meaning":"住宿；住宿設施","phrase":"book accommodation","category":"商務旅行","id":"w0671","number":671,"examples":[{"en":"The accommodation is included in the fee.","zh":"費用已包含住宿。"},{"en":"The company provides accommodation and meals for all overseas employees.","zh":"公司為所有海外員工提供住宿和膳食。"}],"tips":["詞性與可數性：在多益考試中，此單字常用於旅遊與住宿情境，注意在美式用法中常以複數形式 accommodations 出現，而在英式用法中則常為不可數名詞。"],"forms":["accommodation","accommodations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sightseeing","pos":"n.","meaning":"觀光；遊覽","phrase":"go sightseeing","category":"商務旅行","id":"w0672","number":672,"examples":[{"en":"A sightseeing tour is planned for Sunday.","zh":"觀光行程安排在星期日。"},{"en":"The company is offering a discounted package that includes sightseeing tours of the city's historical landmarks.","zh":"公司正在提供一項折扣套餐，其中包括參觀城市歷史地標的觀光旅遊。"}],"tips":["常見動詞搭配：此單字最常與動詞 'go' 連用，形成 'go sightseeing'（去觀光），在考試中不可誤用為 'do sightseeing' 或 'make sightseeing'。"],"forms":["sightseeing","sightseeings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"embassy","pos":"n.","meaning":"大使館","phrase":"contact the embassy","category":"商務旅行","id":"w0673","number":673,"examples":[{"en":"The embassy is closed today.","zh":"大使館今天沒有開放。"},{"en":"The embassy organized a cultural exchange event.","zh":"大使館舉辦了一場文化交流活動。"}],"tips":["常見搭配詞：常與「contact the embassy」(聯繫大使館)、「embassy official」(大使館官員)、「foreign embassy」(駐外大使館)及「visa application」(簽證申請)連用。"],"forms":["embassies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"immigration","pos":"n.","meaning":"入境管理；移民","phrase":"immigration procedures","category":"商務旅行","id":"w0674","number":674,"examples":[{"en":"The immigration officer will check your passport.","zh":"移民官會檢查你的護照。"},{"en":"The company is facing challenges related to immigration policies and visa applications for foreign employees.","zh":"公司正面臨與移民政策和外籍員工簽證申請相關的挑戰。"}],"tips":["常見搭配詞包括 immigration officer (移民官)、immigration clearance (入境檢查) 與 immigration laws (移民法)。在多益閱讀中常出現在關於簽證申請或企業海外派駐的正式通知。"],"forms":["immigration","immigrations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"international","pos":"adj.","meaning":"國際的","phrase":"international travel","category":"商務旅行","id":"w0675","number":675,"examples":[{"en":"International flights leave from this terminal.","zh":"國際航班從這個航廈出發。"},{"en":"Our company is expanding its operations to become an international business.","zh":"我們公司正在擴展業務，以成為一家國際企業。"}],"tips":["常見搭配詞：常出現在 international trade (國際貿易)、international conference (國際會議)、international airport (國際機場) 等詞組中，掌握這些固定搭配有助於在閱讀測驗中快速作答。"],"forms":["international","more international","most international"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"abroad","pos":"adv.","meaning":"在國外；到國外","phrase":"travel abroad","category":"商務旅行","id":"w0676","number":676,"examples":[{"en":"She will work abroad next year.","zh":"她明年會到國外工作。"},{"en":"The company is expanding its operations abroad.","zh":"該公司正在海外擴展業務。"}],"tips":["詞性與文法陷阱：abroad 是副詞，意為「在國外」或「往國外」。最常見的考點是與動詞搭配時不需要介系詞 to，例如 go abroad、travel abroad、study abroad。在 TOEIC Part 5 文法題中，應避免選取 go to abroad 這種錯誤選項。"],"forms":["abroad"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"appointment","pos":"n.","meaning":"約會；預約","phrase":"schedule an appointment","category":"商務旅行","id":"w0677","number":677,"examples":[{"en":"Your appointment is at ten.","zh":"你的預約時間是十點。"},{"en":"The receptionist will confirm your appointment time shortly.","zh":"接待員將很快確認您的預約時間。"}],"tips":["常見動詞搭配：多益考試中常出現 make an appointment (預約)、schedule an appointment (安排預約)、confirm an appointment (確認預約) 與 cancel an appointment (取消預約)，考生須熟悉這些動詞組合以應對聽力與填空題。"],"forms":["appointment","appointments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"convention","pos":"n.","meaning":"大型會議；大會","phrase":"annual convention","category":"商務旅行","id":"w0678","number":678,"examples":[{"en":"The convention will begin tomorrow.","zh":"大型會議將於明天開始。"},{"en":"The annual sales convention will be held in New York this year.","zh":"今年的年度銷售大會將在紐約舉行。"}],"tips":["多重字義辨析：在 TOEIC 考試中，此單字最常出現在兩大語境。第一是「大型會議/年會」，如產業商展；第二是「傳統/慣例」，如社會習俗。考生需根據上下文判斷。"],"forms":["convention","conventions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"seminar","pos":"n.","meaning":"研討會","phrase":"attend a seminar","category":"商務旅行","id":"w0679","number":679,"examples":[{"en":"The seminar is open to all employees.","zh":"所有員工都可以參加這場研討會。"},{"en":"The company will host a seminar on new marketing strategies next month.","zh":"公司下個月將舉辦一場關於新行銷策略的研討會。"}],"tips":["常見搭配詞：包含 attend a seminar (參加研討會)、conduct/hold a seminar (舉辦研討會)、及 training seminar (培訓研討會)。"],"forms":["seminar","seminars"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"workshop","pos":"n.","meaning":"工作坊；研習會","phrase":"training workshop","category":"商務旅行","id":"w0680","number":680,"examples":[{"en":"The workshop will last two hours.","zh":"工作坊將持續兩小時。"},{"en":"The company will hold a workshop on effective communication skills for all employees.","zh":"公司將為所有員工舉辦一場關於有效溝通技巧的工作坊。"}],"tips":["常見搭配詞：常與動詞連用如 'conduct a workshop' (舉辦工作坊)、'attend a workshop' (參加工作坊)，介系詞通常接 on 以帶出主題，例如 'a workshop on time management'。"],"forms":["workshop","workshops"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"registration","pos":"n.","meaning":"登記；報名","phrase":"registration fee","category":"商務旅行","id":"w0681","number":681,"examples":[{"en":"Registration is free for students.","zh":"學生可以免費報名。"},{"en":"The company is currently registering new employees for the benefits program.","zh":"公司目前正在為福利計劃註冊新員工。"}],"tips":["常見搭配詞組：多與名詞連用形成複合名詞，如 registration form (報名表)、registration fee (報名費)、registration desk (報到處) 以及 deadline for registration (報名截止日期)。"],"forms":["registration","registrations","registers","registering","registered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"register","pos":"v.","meaning":"登記；報名","phrase":"register for a conference","category":"商務旅行","id":"w0682","number":682,"examples":[{"en":"You can register on our website.","zh":"你可以在我們的網站上報名。"},{"en":"All attendees are required to register online before the conference.","zh":"所有與會者在會議前都必須在線報名。"}],"tips":["常見搭配詞組：最常以 \"register for\" 形式出現，表示報名參加會議、研討會或課程，同義詞為 \"enroll in\" 或 \"sign up for\"。"],"forms":["register","registers","registering","registered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"venue","pos":"n.","meaning":"活動場地","phrase":"conference venue","category":"商務旅行","id":"w0683","number":683,"examples":[{"en":"The venue is close to the hotel.","zh":"活動場地離飯店很近。"},{"en":"The conference venue is conveniently located near the city center.","zh":"這個會議會場位於市中心附近，交通便利。"}],"tips":["常見搭配詞：'event venue' (活動場地)、'wedding venue' (婚禮場地)、'ideal venue' (理想場所)、'change of venue' (更換地點)。"],"forms":["venue","venues"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"host","pos":"n./v.","meaning":"主辦者；主辦","phrase":"host a conference","category":"商務旅行","id":"w0684","number":684,"examples":[{"en":"Our company will host the event.","zh":"我們公司將主辦這場活動。"},{"en":"The hotel hosts a weekly networking event for local businesses.","zh":"這家酒店每週舉辦一個為當地企業提供的社交活動。"}],"tips":["動詞用法：在 TOEIC 閱讀與聽力中，常表示「主辦」或「舉行」商務會議、晚宴或工作坊，例如 host a seminar 或 host a reception。"],"forms":["host","hosts","hosting","hosted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"delegate","pos":"n.","meaning":"代表；與會代表","phrase":"conference delegate","category":"商務旅行","id":"w0685","number":685,"examples":[{"en":"Each delegate will receive a name tag.","zh":"每位代表都會收到一張名牌。"},{"en":"The department implemented innovative delegate procedures to improve operational efficiency.","zh":"部門實施創新的delegate程序以提高營運效率。"}],"tips":["詞性雙重身份：delegate 可作為動詞表示「委派、授權」，亦可作為名詞表示「代表」。在多益考試中，名詞型態常出現在會議、研討會情境（如 conference delegates），而動詞型態常出現在管理或人事行政情境。"],"forms":["delegate"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"invitation","pos":"n.","meaning":"邀請；邀請函","phrase":"send an invitation","category":"商務旅行","id":"w0686","number":686,"examples":[{"en":"The invitation is attached to this email.","zh":"邀請函附在這封電子郵件中。"},{"en":"We received an invitation to attend the industry conference next month.","zh":"我們收到下個月業界會議的邀請函。"}],"tips":["常見搭配詞：多益測驗中常考 'extend an invitation' (正式發出邀請)，其他如 'accept an invitation' (接受邀請) 或 'decline an invitation' (婉拒邀請) 常出現在 Part 7 的商務書信中。"],"forms":["invitation","invitations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"invite","pos":"v.","meaning":"邀請","phrase":"invite a client","category":"商務旅行","id":"w0687","number":687,"examples":[{"en":"We will invite all employees to the event.","zh":"我們將邀請所有員工參加這場活動。"},{"en":"The company will invite key clients to the product launch event.","zh":"公司將邀請重要客戶參加產品發布活動。"}],"tips":["常見句型與搭配詞：最常見的用法是「invite someone to + Noun/Verb」，例如 invite you to the seminar 或 invite you to attend the meeting。在多益閱讀中，常出現「be invited to」的被動語態。"],"forms":["invite","invites","inviting","invited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reception","pos":"n.","meaning":"接待；招待會","phrase":"opening reception","category":"商務旅行","id":"w0688","number":688,"examples":[{"en":"The reception will begin at six.","zh":"招待會將於六點開始。"},{"en":"The receptionist greeted us warmly at the reception.","zh":"接待人員在接待處熱情地迎接了我們。"}],"tips":["多重語義辨析：在多益考試中，此字最常出現的兩個含意是「接待處/櫃台」以及「正式招待會/宴會」。考生須根據上下文明確分辨是指實體空間還是社交活動。"],"forms":["reception","receptions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hospitality","pos":"n.","meaning":"接待；款待","phrase":"corporate hospitality","category":"商務旅行","id":"w0689","number":689,"examples":[{"en":"The staff are known for their hospitality.","zh":"工作人員以熱情好客聞名。"},{"en":"The department implemented innovative hospitality procedures to improve operational efficiency.","zh":"部門實施創新的hospitality程序以提高營運效率。"}],"tips":["常見搭配詞：'hospitality industry' (服務業/飯店業) 是多益最常考的詞組，涵蓋旅館、餐飲及旅遊業；'warm hospitality' (親切款待) 常見於感謝信。"],"forms":["hospitality"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accompany","pos":"v.","meaning":"陪同；陪伴","phrase":"accompany a client","category":"商務旅行","id":"w0690","number":690,"examples":[{"en":"A colleague will accompany you on the trip.","zh":"一位同事會陪你一起出差。"},{"en":"Please accompany me to the conference room to meet the potential client.","zh":"請您陪我到會議室與潛在客戶會面。"}],"tips":["常見搭配詞與被動語態：在多益考試中，accompany 常以被動語態出現，如 'be accompanied by'，表示『由...陪同』或『隨附有...』。在 Part 5 或 Part 6 語法題中，注意 by 的介系詞搭配。"],"forms":["accompany","accompanies","accompanying","accompanied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"guide","pos":"n./v.","meaning":"導遊；引導","phrase":"tour guide","category":"商務旅行","id":"w0691","number":691,"examples":[{"en":"The guide can speak English.","zh":"導遊會說英文。"},{"en":"Please follow the user guide to install the software correctly.","zh":"請依照使用者指南正確安裝軟體。"}],"tips":["詞性雙重角色：guide 在 TOEIC 中常以名詞與動詞出現。名詞可指「人」（導遊、指導者）或「物」（指南、手冊），如 user guide（使用說明書）或 study guide（學習指南）。動詞則表示「指引」或「引導」。"],"forms":["guide","guides","guiding","guided"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tour","pos":"n./v.","meaning":"參觀；遊覽","phrase":"guided tour","category":"商務旅行","id":"w0692","number":692,"examples":[{"en":"The tour will start at the front gate.","zh":"導覽將從大門開始。"},{"en":"The company is offering a guided tour of the new factory for potential investors.","zh":"公司正在為潛在投資者提供新工廠的導覽遊。"}],"tips":["常見搭配詞：'guided tour' (導覽)、'factory tour' (工廠參觀) 與 'take a tour' (進行導覽)。在多益中常出現在設施介紹或員工培訓情境。"],"forms":["tour","tours","touring","toured"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"extend","pos":"v.","meaning":"延長；延期","phrase":"extend a stay","category":"商務旅行","id":"w0693","number":693,"examples":[{"en":"You can extend your stay by one night.","zh":"你可以延長住宿一晚。"},{"en":"The company is extending its business operations into new markets.","zh":"公司正在將其業務擴展到新的市場。"}],"tips":["常見搭配詞組：'extend a deadline' (延長截止日期)、'extend an invitation' (發出邀請)、'extend a warranty' (延長保固期) 以及 'extend a warm welcome' (表示熱烈歡迎)。"],"forms":["extend","extends","extending","extended","more extended","most extended"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"extension","pos":"n.","meaning":"延長；延期","phrase":"request an extension","category":"商務旅行","id":"w0694","number":694,"examples":[{"en":"We requested an extension of the deadline.","zh":"我們申請延長截止期限。"},{"en":"Has your visa extension been approved?","zh":"你的簽證延期已獲核准了嗎？"}],"tips":["電話分機：在 TOEIC 聽力 Part 1 或 Part 2 中，常出現『at extension 105』的說法，表示分機號碼，這是商務通訊中的基本用法。"],"forms":["extension","extensions","extends","extending","extended"],"exampleSource":"Wordstep original examples"},{"word":"coordinate","pos":"v.","meaning":"協調；安排","phrase":"coordinate travel arrangements","category":"商務旅行","id":"w0695","number":695,"examples":[{"en":"Our team will coordinate the visit.","zh":"我們的團隊將協調這次拜訪。"},{"en":"Please coordinate with the logistics department to arrange the shipment of the goods.","zh":"請與物流部門協調安排貨物的運輸。"}],"tips":["常見搭配詞組：'coordinate a schedule' (協調日程)、'coordinate activities' (協調活動) 以及 'coordinate with someone' (與某人協調)。在 TOEIC 閱讀中，常出現於專案管理與行政作業情境。"],"forms":["coordinate","coordinates","coordinating","coordinated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"prepare","pos":"v.","meaning":"準備","phrase":"prepare for a trip","category":"商務旅行","id":"w0696","number":696,"examples":[{"en":"You should prepare the documents today.","zh":"你應該在今天準備文件。"},{"en":"Please prepare all necessary documents before the meeting.","zh":"請在會議前準備好所有必要的文件。"}],"tips":["常見搭配詞與用法：掌握 'prepare for + 賓語'（為某事做準備）及 'prepare to + 原形動詞'（準備做某事）的基本結構。此外，名詞形式 'preparation' 常用於 'in preparation for' 短語中。"],"forms":["prepare","prepares","preparing","prepared"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"unpack","pos":"v.","meaning":"打開行李；取出","phrase":"unpack luggage","category":"商務旅行","id":"w0697","number":697,"examples":[{"en":"You can unpack your bag in the room.","zh":"你可以在房間裡打開行李整理物品。"},{"en":"The shipping department will unpack the new inventory upon arrival.","zh":"新貨到貨後，運輸部門將會將其卸貨。"}],"tips":["實體與抽象雙重用法：在 TOEIC 旅遊情境中，常指『打開行李』（unpack a suitcase）；但在商業會議情境中，則常轉化為『詳細分析或拆解複雜概念』（unpack the data/findings）。"],"forms":["unpack","unpacks","unpacking","unpacked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"valid","pos":"adj.","meaning":"有效的","phrase":"valid passport","category":"商務旅行","id":"w0698","number":698,"examples":[{"en":"This ticket is valid for one day.","zh":"這張票的有效期限為一天。"},{"en":"Before submitting the report, ensure all data is valid and accurate.","zh":"提交報告前，請確保所有數據都是有效且準確的。"}],"tips":["常見搭配詞：'valid identification' (有效身分證明)、'valid for' (在特定期間內有效，如 valid for six months)、'remain valid' (保持效力)。"],"forms":["valid","more valid","most valid"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"expire","pos":"v.","meaning":"到期；失效","phrase":"passport expires","category":"商務旅行","id":"w0699","number":699,"examples":[{"en":"My passport will expire next month.","zh":"我的護照下個月將到期。"},{"en":"When does your travel insurance expire?","zh":"你的旅遊保險什麼時候到期？"}],"tips":["常見搭配詞與結構：expire 常作為不及物動詞使用，表示『到期、終止』，常見用法為『Subject (合約/期限) + expires on + 特定日期』。其名詞形式為 expiration (美式) 或 expiry (英式)，考試中常見 expiration date (有效期限)。"],"forms":["expire","expires","expiring","expired"],"exampleSource":"Wordstep original examples"},{"word":"renewal","pos":"n.","meaning":"續期；更新","phrase":"passport renewal","category":"商務旅行","id":"w0700","number":700,"examples":[{"en":"The visa renewal takes two weeks.","zh":"簽證續期需要兩週。"},{"en":"Please submit your renewal application early.","zh":"請提早提交你的續期申請。"}],"tips":["常見搭配詞組：常用於描述法律或行政上的續約與更新，例如 contract renewal (合約續約)、membership renewal (會員資格更新)、license renewal (執照換發) 以及 renewal fee (續費)。"],"forms":["renewal","renewals","renews","renewing","renewed"],"exampleSource":"Wordstep original examples"},{"word":"airport","pos":"n.","meaning":"機場","phrase":"international airport","category":"交通","id":"w0701","number":701,"examples":[{"en":"The airport is far from the city.","zh":"機場離市區很遠。"},{"en":"The flight is scheduled to depart from Narita Airport at 10:00 AM.","zh":"這趟航班預計在上午 10:00 從成田機場起飛。"}],"tips":["常見搭配詞：包含 'airport terminal' (機場航廈)、'airport shuttle' (機場接駁車) 與 'airport security' (機場安檢)，常出現在 Part 7 的行程表或 Part 3 的商務旅行對話中。"],"forms":["airport","airports"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"airline","pos":"n.","meaning":"航空公司","phrase":"major airline","category":"交通","id":"w0702","number":702,"examples":[{"en":"The airline will contact you soon.","zh":"航空公司很快就會聯絡你。"},{"en":"The airline announced a delay due to inclement weather conditions.","zh":"由於惡劣天氣狀況，航空公司宣布航班延誤。"}],"tips":["常見搭配詞與同義詞：airline industry (航空業)、major airline (大型航空公司)、airline carrier (航空承運商)。在考試中 'carrier' 常作為 airline 的替代詞出現。"],"forms":["airline","airlines"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"aircraft","pos":"n.","meaning":"飛機；航空器","phrase":"board an aircraft","category":"交通","id":"w0703","number":703,"examples":[{"en":"The aircraft is ready for departure.","zh":"飛機已準備好出發。"},{"en":"The company is investing in new aircraft to expand its international routes.","zh":"公司正在投資新飛機以擴展其國際航線。"}],"tips":["單複數同形陷阱：'aircraft' 的單數與複數形式相同，絕對不可加上 's'。多益常在文法題考查主謂一致，若看到 'Many aircraft were delayed' 是正確的。"],"forms":["aircraft"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"flight","pos":"n.","meaning":"航班；飛行","phrase":"book a flight","category":"交通","id":"w0704","number":704,"examples":[{"en":"Your flight is on time.","zh":"你的航班準時起飛。"},{"en":"Please confirm your flight details before checking in.","zh":"請在辦理登機手續前確認您的航班資訊。"}],"tips":["常見搭配詞組：包含 'direct flight' (直飛航班)、'connecting flight' (轉機航班)、'flight attendant' (空服員) 以及 'flight delay' (航班延誤)。"],"forms":["flight","flights","flies","flying","flew","flown"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"passenger","pos":"n.","meaning":"乘客；旅客","phrase":"airline passenger","category":"交通","id":"w0705","number":705,"examples":[{"en":"Each passenger can bring one bag.","zh":"每位乘客可以帶一件行李。"},{"en":"All passengers are required to present their boarding passes and identification at security.","zh":"所有旅客在安檢時都必須出示登機證和身份證明。"}],"tips":["常見搭配詞：'passenger seat'（乘客座）、'airline passenger'（航空乘客）、'transit passenger'（轉機乘客）以及 'passenger manifest'（乘客名單）。"],"forms":["passenger","passengers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"terminal","pos":"n.","meaning":"航廈；終點站","phrase":"airport terminal","category":"交通","id":"w0706","number":706,"examples":[{"en":"The terminal is very busy today.","zh":"航廈今天很忙碌。"},{"en":"Passengers should proceed to Terminal 2 for their departure.","zh":"旅客應前往 2 號航廈辦理出發手續。"}],"tips":["名詞用法與常見搭配：在多益交通運輸情境中，terminal 常指『航廈』或『轉運站』，常見搭配如 airport terminal (機場航廈)、bus terminal (巴士總站)、container terminal (貨櫃碼頭)。"],"forms":["terminal","terminals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"gate","pos":"n.","meaning":"登機門；入口","phrase":"departure gate","category":"交通","id":"w0707","number":707,"examples":[{"en":"The gate number is on your ticket.","zh":"登機門號碼在你的票上。"},{"en":"The security personnel gated the entrance to prevent unauthorized access.","zh":"安全人員封鎖入口，以防止未經授權的進入。"}],"tips":["常見搭配詞：在交通運輸情境中，常出現 boarding gate (登機門)、gate agent (登機口地勤人員) 及 gate number (登機口號碼)；在工業情境中則有 security gate (安全閘門) 或 entrance gate。"],"forms":["gate","gates","gating","gated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"boarding","pos":"n.","meaning":"登機；上車","phrase":"boarding time","category":"交通","id":"w0708","number":708,"examples":[{"en":"Boarding will begin in twenty minutes.","zh":"二十分鐘後將開始登機。"},{"en":"Passengers are requested to begin boarding the aircraft 30 minutes prior to departure.","zh":"乘客們請於起飛前 30 分鐘開始登機。"}],"tips":["常見搭配詞：'boarding pass' (登機證)、'boarding gate' (登機門) 以及 'boarding time' (登機時間) 是多益聽力與閱讀的高頻核心詞彙，務必熟記。"],"forms":["boarding","boards","boarded","boardings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"boarding pass","pos":"n.","meaning":"登機證","phrase":"show a boarding pass","category":"交通","id":"w0709","number":709,"examples":[{"en":"Your boarding pass is on your phone.","zh":"你的登機證在手機上。"},{"en":"Please have your boarding pass and passport ready for security check.","zh":"請在安檢時準備好您的登機證和護照。"}],"tips":["常見搭配詞組：'present your boarding pass' (出示登機證)、'issue a boarding pass' (核發登機證)、'digital/mobile boarding pass' (電子登機證)。"],"forms":["boarding pass","boarding passes"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"runway","pos":"n.","meaning":"跑道","phrase":"airport runway","category":"交通","id":"w0710","number":710,"examples":[{"en":"The runway is closed for repairs.","zh":"跑道因維修而關閉。"},{"en":"The flight was delayed due to runway maintenance.","zh":"由於跑道維護，航班延誤了。"}],"tips":["常見考點於 Part 1 圖片題：重點觀察飛機是否停在跑道上 (stationed on the runway) 或正在起飛 (taking off from the runway)，需區分飛機與跑道的相對位置。"],"forms":["runway","runways"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pilot","pos":"n.","meaning":"飛行員","phrase":"airline pilot","category":"交通","id":"w0711","number":711,"examples":[{"en":"The pilot will make an announcement.","zh":"機師將進行廣播。"},{"en":"The airline requires all pilots to undergo regular safety training.","zh":"航空公司要求所有飛行員定期接受安全培訓。"}],"tips":["常見搭配詞：多益考試中最常出現 'pilot project' (試驗性計畫)、'pilot program' (試行方案) 或 'pilot study' (初步研究)，表示在大規模實施前的測試。"],"forms":["pilot","pilots","piloting","piloted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"crew","pos":"n.","meaning":"機組人員；工作人員","phrase":"flight crew","category":"交通","id":"w0712","number":712,"examples":[{"en":"The crew are ready to help.","zh":"機組人員已準備好提供協助。"},{"en":"The ship's crew worked tirelessly to repair the engine damage.","zh":"船員們不知疲倦地努力修復引擎的損壞。"}],"tips":["常見搭配詞與情境：'flight crew'（機組人員）、'cleaning crew'（清潔團隊）、'maintenance crew'（維修小組）。此單字在多益考試中常出現在交通工具、攝影場景或設施維護的公告中。"],"forms":["crew","crews"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"aisle","pos":"n.","meaning":"走道","phrase":"aisle seat","category":"交通","id":"w0713","number":713,"examples":[{"en":"The aisle must remain clear.","zh":"走道必須保持暢通。"},{"en":"Could you please direct me to the dairy aisle? I'm looking for milk.","zh":"您能請您指引我到乳製品區嗎？我在找牛奶。"}],"tips":["發音重點與 Part 1 照片題：字母 's' 不發音，音標為 /aɪl/。常出現於聽力第一部分描述超市或機艙內的情境，如 'The man is pushing a cart down the aisle'。"],"forms":["aisle","aisles"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"seat","pos":"n.","meaning":"座位","phrase":"reserve a seat","category":"交通","id":"w0714","number":714,"examples":[{"en":"Your seat is by the window.","zh":"你的座位靠窗。"},{"en":"The conference room has seating for 100 attendees.","zh":"會議室可容納 100 名與會者。"}],"tips":["區分動詞與名詞用法：在 TOEIC 聽力第一部分（照片描述）中，常出現「be seated」表示「坐著」的狀態，例如「They are seated at a table.」，這是考題中極高頻出現的被動用法。"],"forms":["seat","seats","seating","seated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"transit","pos":"n.","meaning":"轉運；大眾運輸","phrase":"public transit","category":"交通","id":"w0715","number":715,"examples":[{"en":"The transit system is easy to use.","zh":"大眾運輸系統很容易使用。"},{"en":"The company provides transit benefits to encourage employees to use public transportation.","zh":"公司提供交通補助，以鼓勵員工使用公共交通。"}],"tips":["常見搭配詞與短語：'public transit'（大眾運輸）與 'mass transit'（大眾運輸系統）是聽力 Part 4 常見詞彙；物流場景中 'in transit'（在運送途中）是極高頻短語，常用於解釋貨物狀態。"],"forms":["transit","transits","transiting","transited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"layover","pos":"n.","meaning":"轉機停留","phrase":"two-hour layover","category":"交通","id":"w0716","number":716,"examples":[{"en":"The layover will last two hours.","zh":"轉機停留時間將為兩小時。"},{"en":"The airline offers lounge access for passengers with long layovers.","zh":"航空公司為中轉停留時間較長的旅客提供貴賓室服務。"}],"tips":["常見搭配詞與句型：常見動詞為 have 或 make，如 have a layover in [city]；形容詞常搭配 long, short 或 overnight。在多益中常出現於機票確認函或商務出差行程中。"],"forms":["layover","layovers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"railway","pos":"n.","meaning":"鐵路","phrase":"railway station","category":"交通","id":"w0717","number":717,"examples":[{"en":"The railway connects the two cities.","zh":"鐵路連接這兩座城市。"},{"en":"The company is investing heavily in upgrading the railway network to improve efficiency.","zh":"公司正在大力投資鐵路網絡的升級，以提高效率。"}],"tips":["常見搭配詞與情境：'railway station' (火車站)、'railway network' (鐵路網)、'railway tracks' (鐵軌)。此單字經常出現在多益測驗的第一部分圖片題，用來描述火車進入月台或鐵路設施的場景。"],"forms":["railway","railways"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"train","pos":"n.","meaning":"火車","phrase":"catch a train","category":"交通","id":"w0718","number":718,"examples":[{"en":"The train is arriving now.","zh":"火車現在進站了。"},{"en":"The company will train new employees on the updated software.","zh":"公司將會培訓新員工使用更新後的軟體。"}],"tips":["詞性多義性辨析：在 TOEIC 考試中，'train' 常見於名詞（交通工具：火車）與動詞（商業行為：培訓）。在 Part 1 照片描述中多指交通，而在 Part 5-7 則多指員工技能培訓。"],"forms":["trains","trained","training"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"station","pos":"n.","meaning":"車站","phrase":"train station","category":"交通","id":"w0719","number":719,"examples":[{"en":"The station is across the street.","zh":"車站在街道對面。"},{"en":"The train will depart from Platform 12 at the central station.","zh":"火車將從中央車站 12 號月台出發。"}],"tips":["多義詞辨析：在 TOEIC 考試中，station 不僅指常見的火車站，更常以 'workstation' (辦公工位) 出現於第一部分圖片題或第三部分辦公情境對話中。"],"forms":["station","stations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"track","pos":"n.","meaning":"鐵軌；月台軌道","phrase":"railway track","category":"交通","id":"w0720","number":720,"examples":[{"en":"The train will arrive on track three.","zh":"火車將停靠第三股道。"},{"en":"The logistics team needs to track all shipme

 (用 A 代替 B)，要注意這與 'replace B with A' 的邏輯順序相同但介系詞不同，考生常在此混淆。"],"forms":["substitute","substitutes","substituting","substituted","more substitute","most substitute"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"alternative","pos":"n./adj.","meaning":"替代方案；替代的","phrase":"alternative supplier","category":"採購與訂單","id":"w0431","number":431,"examples":[{"en":"This is a cheaper alternative.","zh":"這是一個較便宜的替代方案。"},{"en":"We need to explore alternative solutions to reduce costs.","zh":"我們需要探索降低成本的其他方案。"}],"tips":["常見搭配詞與介係詞：'alternative' 作為名詞時，後方固定接介係詞 'to'，例如 'an alternative to the current proposal' (目前提案的替代方案)；常見形容詞修飾語包括 'viable', 'feasible' 或 'cost-effective'。"],"forms":["alternative","alternatives","more alternative","most alternative"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"shortage","pos":"n.","meaning":"短缺；不足","phrase":"supply shortage","category":"採購與訂單","id":"w0432","number":432,"examples":[{"en":"The shortage will cause a delay.","zh":"這次短缺會造成延誤。"},{"en":"The company is facing a shortage of raw materials, which may delay production.","zh":"公司面臨原材料短缺的問題，這可能會延遲生產。"}],"tips":["常見搭配詞：最常以 \"a shortage of + 名詞\" 的固定結構出現，常見組合包括 \"labor shortage\"（勞動力短缺）、\"food shortage\"（食物短缺）或 \"budget shortage\"（預算短缺）。考生在多益閱讀中若看到空格後接 \"of\"，應優先考慮此單字。"],"forms":["shortage","shortages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"source","pos":"n./v.","meaning":"來源；採購","phrase":"source materials","category":"採購與訂單","id":"w0433","number":433,"examples":[{"en":"We can source the materials locally.","zh":"我們可以在當地採購材料。"},{"en":"The report cited several sources to support its findings.","zh":"該報告引用了多個來源來支持其發現。"}],"tips":["常見搭配詞組：'reliable source' (可靠的來源)、'primary source' (主要來源) 及 'source of income' (收入來源)。在 TOEIC 閱讀測驗中，這些組合常用於描述資訊出處或財務狀況。"],"forms":["source","sources"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"material","pos":"n.","meaning":"材料；原料","phrase":"raw materials","category":"採購與訂單","id":"w0434","number":434,"examples":[{"en":"This material is strong and light.","zh":"這種材料堅固又輕巧。"},{"en":"The supplier assured us that the raw materials used in our products meet international quality standards.","zh":"供應商向我們保證，我們產品中使用的原材料符合國際品質標準。"}],"tips":["常見搭配詞：在 TOEIC 考試中頻率極高的是 'raw material' (原物料)、'promotional material' (宣傳資料)、'training material' (培訓教材) 以及 'reference material' (參考資料)，熟悉這些組合能迅速判斷語境。"],"forms":["material","materials"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"equipment","pos":"n.","meaning":"設備","phrase":"purchase equipment","category":"採購與訂單","id":"w0435","number":435,"examples":[{"en":"The equipment will arrive on Monday.","zh":"設備將於星期一送達。"},{"en":"The company invested heavily in new equipment to improve production efficiency.","zh":"公司大量投資新設備以提高生產效率。"}],"tips":["不可數名詞陷阱：equipment 是不可數名詞，在 TOEIC 考試中絕對不會以複數型態 equipments 出現，也不可接不定冠詞 an。在 Part 5 語法題中，若選項出現 equipments 必為錯誤，且後方動詞須使用單數型態。"],"forms":["equipment","equipments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"machinery","pos":"n.","meaning":"機械；機器設備","phrase":"industrial machinery","category":"採購與訂單","id":"w0436","number":436,"examples":[{"en":"The machinery is ready for use.","zh":"機器設備可以使用了。"},{"en":"The factory's machinery requires regular maintenance to ensure optimal performance.","zh":"為了確保最佳性能，工廠的機器設備需要定期維護。"}],"tips":["不可數名詞特性：machinery 為不可數名詞，意指機器的總體或系統。在多益文法題中，應注意其不可加 s，且隨後的動詞必須使用單數形式，常與可數名詞 machine 做對比。"],"forms":["machinery","machineries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"component","pos":"n.","meaning":"零組件","phrase":"electronic component","category":"採購與訂單","id":"w0437","number":437,"examples":[{"en":"This component is easy to replace.","zh":"這個零組件很容易更換。"},{"en":"The defective component caused the machine to malfunction.","zh":"這個有缺陷的元件導致機器故障。"}],"tips":["常見搭配詞與組詞：在 TOEIC 閱讀中常出現 'essential component' (必要組件)、'key component' (關鍵要素) 或 'electronic components' (電子零件)。掌握這些搭配能幫助在 Part 5 填空題中快速選出正確選項。"],"forms":["component","components"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"part","pos":"n.","meaning":"零件；部件","phrase":"replacement part","category":"採購與訂單","id":"w0438","number":438,"examples":[{"en":"The replacement part is in stock.","zh":"替換零件有庫存。"},{"en":"The broken part needs to be replaced immediately.","zh":"這個損壞的零件需要立即更換。"}],"tips":["常見搭配詞與同義替換：'take part in' 是 TOEIC 考試中極高頻的片語，意為『參加』，常在閱讀或聽力測驗中與 'participate in'、'attend' 或 'join' 進行同義詞替換考驗。"],"forms":["part","parts","parted","parting"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"model","pos":"n.","meaning":"型號；款式","phrase":"latest model","category":"採購與訂單","id":"w0439","number":439,"examples":[{"en":"This model is available in three colors.","zh":"這款型號有三種顏色。"},{"en":"The marketing team used a model presentation to showcase the new product.","zh":"行銷團隊使用了一個範本簡報來展示新產品。"}],"tips":["多重詞性掌握：在多益中 model 常見為名詞，指『產品型號』或『樣品』，如 'latest model' (最新型號)；也可作形容詞指『模範的』，如 'model employee' (模範員工)。"],"forms":["model","models","modeling","modeled","more model","most model"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"manufacturer","pos":"n.","meaning":"製造商","phrase":"leading manufacturer","category":"採購與訂單","id":"w0440","number":440,"examples":[{"en":"The manufacturer will replace the damaged item.","zh":"製造商會更換損壞的商品。"},{"en":"The company is seeking a reliable manufacturer to produce its new line of electronics.","zh":"該公司正在尋找一家可靠的製造商來生產其新的電子產品線。"}],"tips":["詞性辨析：TOEIC Part 5 常考詞性轉換，需區分 manufacturer (製造商 - 人/公司)、manufacturing (製造業/生產過程) 與 manufacture (動詞：製造)。看清句中主詞位置，若指代公司實體則選 manufacturer。"],"forms":["manufacturer","manufacturers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"distributor","pos":"n.","meaning":"經銷商；代理商","phrase":"authorized distributor","category":"採購與訂單","id":"w0441","number":441,"examples":[{"en":"The distributor is based in Taipei.","zh":"經銷商位於台北。"},{"en":"Our company is seeking a reliable distributor for our new line of eco-friendly products.","zh":"我們公司正在尋找一位可靠的經銷商來分銷我們新的環保產品線。"}],"tips":["常見搭配詞組：'sole distributor' (獨家分銷商)、'authorized distributor' (授權經銷商) 及 'regional distributor' (區域分銷商)，在閱讀測驗中常出現在合約或代理協議的情境。"],"forms":["distributor","distributors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dealer","pos":"n.","meaning":"經銷商","phrase":"local dealer","category":"採購與訂單","id":"w0442","number":442,"examples":[{"en":"Your local dealer can order the part.","zh":"你當地的經銷商可以訂購這個零件。"},{"en":"The car dealer offered a significant discount on the new model.","zh":"這家汽車經銷商為新型號提供了大幅折扣。"}],"tips":["常見搭配詞與固定用法：'authorized dealer'（授權經銷商）是多益最常出現的組合，常出現在產品廣告或售後服務政策中。此外，'car dealer'（汽車經銷商）與 'wholesale dealer'（批發商）也十分常見。"],"forms":["dealers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"contractor","pos":"n.","meaning":"承包商","phrase":"general contractor","category":"採購與訂單","id":"w0443","number":443,"examples":[{"en":"The contractor will visit the site tomorrow.","zh":"承包商明天將到現場查看。"},{"en":"The company hired a contractor to renovate the office building.","zh":"公司聘請了一家承包商來翻新辦公大樓。"}],"tips":["常見搭配詞：'independent contractor'（獨立承包商）、'general contractor'（總承包商）與 'subcontractor'（分包商）。"],"forms":["contractor","contractors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subcontractor","pos":"n.","meaning":"分包商；次承包商","phrase":"hire a subcontractor","category":"採購與訂單","id":"w0444","number":444,"examples":[{"en":"The subcontractor is installing the windows.","zh":"分包商正在安裝窗戶。"},{"en":"We need to review the subcontractor's proposal before approving the budget.","zh":"我們需要在批准預算之前，審閱分包商的提案。"}],"tips":["常見搭配詞：'hire a subcontractor' (雇用分包商)、'local subcontractor' (當地分包商)、'subcontracting agreement' (分包協議)。此字常出現在營造業、製造業或大型 IT 專案情境。"],"forms":["subcontractor","subcontractors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"obtain","pos":"v.","meaning":"取得；獲得","phrase":"obtain a quotation","category":"採購與訂單","id":"w0445","number":445,"examples":[{"en":"You can obtain a copy at the front desk.","zh":"你可以在櫃檯取得一份副本。"},{"en":"The company needs to obtain necessary permits before starting construction.","zh":"公司需要在開始施工前取得必要的許可證。"}],"tips":["常見搭配詞：在多益考試中常見的組合包括 obtain permission (獲得許可)、obtain information (獲得資訊)、obtain a signature (取得簽名) 或 obtain a visa (取得簽證)。"],"forms":["obtain","obtains","obtaining","obtained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"procure","pos":"v.","meaning":"採購；取得","phrase":"procure materials","category":"採購與訂單","id":"w0446","number":446,"examples":[{"en":"We will procure the materials next week.","zh":"我們下星期將採購材料。"},{"en":"The purchasing department needs to procure office supplies before the end of the month.","zh":"採購部門需要在月底前採購辦公用品。"}],"tips":["常見搭配詞：'procure equipment' (採購設備)、'procure supplies' (採購物資)、'procure funding' (籌集資金)，強調透過正式程序或努力獲得。"],"forms":["procure","procures","procuring","procured"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"select","pos":"v.","meaning":"選擇；挑選","phrase":"select a supplier","category":"採購與訂單","id":"w0447","number":447,"examples":[{"en":"You can select a delivery date.","zh":"你可以選擇配送日期。"},{"en":"Please select the appropriate vendor based on the project requirements.","zh":"請根據專案需求選定合適的供應商。"}],"tips":["常見搭配詞與片語：'a wide selection of'（多樣化的選擇）是閱讀測驗中最常出現的固定搭配，用來描述商店貨源充足；'select a candidate' 則常出現在人事招聘情境。"],"forms":["select","selects","selecting","selected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"compare","pos":"v.","meaning":"比較","phrase":"compare prices","category":"採購與訂單","id":"w0448","number":448,"examples":[{"en":"We can compare the two offers.","zh":"我們可以比較這兩個報價。"},{"en":"Could you compare the two proposals and highlight the key differences?","zh":"您能比較這兩個提案並重點說明主要差異嗎？"}],"tips":["常用搭配詞與介系詞：最常見的結構為 'compare A with B' 或 'compare A to B'。在 TOEIC 閱讀中，'compared to' 或 'compared with' 常作為分詞句型置於句首，例如 'Compared to last quarter, profits have risen.'。"],"forms":["compare","compares","comparing","compared"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"inspect","pos":"v.","meaning":"檢查；檢驗","phrase":"inspect the goods","category":"採購與訂單","id":"w0449","number":449,"examples":[{"en":"The team will inspect the goods today.","zh":"團隊今天會檢查貨物。"},{"en":"The quality control department will inspect all incoming shipments before they are stored.","zh":"品質管制部門會在將貨物存儲之前，仔細檢查所有進貨貨物。"}],"tips":["常見搭配詞與結構：常用於 'inspect something for defects/damage' (檢查某物是否有瑕疵或損壞) 以及 'inspect the facility' (視察設施)。"],"forms":["inspect","inspects","inspecting","inspected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fulfill","pos":"v.","meaning":"履行；完成","phrase":"fulfill an order","category":"採購與訂單","id":"w0450","number":450,"examples":[{"en":"We can fulfill the order by Friday.","zh":"我們可以在星期五前完成這筆訂單。"},{"en":"Our company is committed to fulfilling all customer orders within the promised timeframe.","zh":"我們公司承諾在約定的時間範圍內完成所有客戶訂單。"}],"tips":["常見搭配詞與商業情境：在多益考試中，fulfill 經常與 order (訂單)、requirement (要求)、obligation (義務) 或 expectation (期望) 搭配使用。在物流情境中，『fulfill an order』指處理並發送訂單；在人力資源情境中，『fulfill the requirements』則指符合職位需求。"],"forms":["fulfill","fulfills","fulfilling","fulfilled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"shipment","pos":"n.","meaning":"貨運；出貨","phrase":"track a shipment","category":"物流與配送","id":"w0451","number":451,"examples":[{"en":"The shipment is on its way.","zh":"這批貨物正在運送中。"},{"en":"Please track your shipment using the provided tracking number.","zh":"請使用提供的追蹤號碼追蹤您的貨物裝運。"}],"tips":["常見搭配詞：包括 track a shipment (追蹤貨物)、delayed shipment (延遲發貨) 及 incoming shipment (到貨)。"],"forms":["shipment","shipments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"shipping","pos":"n.","meaning":"運送；運費","phrase":"shipping cost","category":"物流與配送","id":"w0452","number":452,"examples":[{"en":"Shipping is free on this order.","zh":"這筆訂單免運費。"},{"en":"The shipping cost for this order is $25.","zh":"這筆訂單的運費是 25 美元。"}],"tips":["常見搭配詞：包括 shipping cost (運費)、shipping address (收貨地址)、free shipping (免運費) 以及 shipping department (運輸部門)。"],"forms":["shipping","shippings","ships","shipped"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"delivery","pos":"n.","meaning":"配送；交貨","phrase":"delivery date","category":"物流與配送","id":"w0453","number":453,"examples":[{"en":"The delivery will arrive tomorrow.","zh":"這批貨明天會送達。"},{"en":"Is delivery included in the price?","zh":"價格包含運費嗎？"}],"tips":["常見搭配詞：express delivery（快遞）、free delivery（免運費）、delivery status（運送狀態）、delivery address（收件地址）。"],"forms":["delivery","deliveries","delivers","delivering","delivered"],"exampleSource":"Wordstep original examples"},{"word":"deliver","pos":"v.","meaning":"運送；交付","phrase":"deliver a package","category":"物流與配送","id":"w0454","number":454,"examples":[{"en":"We can deliver the package today.","zh":"我們今天可以配送包裹。"},{"en":"The courier will deliver the package to your office by tomorrow morning.","zh":"快遞員將於明天早上將包裹送到您的辦公室。"}],"tips":["多重語義與搭配詞：在 TOEIC 中，deliver 最常見的意思是「遞送」（如 deliver a package/shipment），但在商務會議中常指「發表」（如 deliver a speech/presentation/keynote address）。此外，它也可指「達成」（如 deliver results 或 deliver on a promise）。"],"forms":["deliver","delivers","delivering","delivered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"carrier","pos":"n.","meaning":"承運商；運輸公司","phrase":"shipping carrier","category":"物流與配送","id":"w0455","number":455,"examples":[{"en":"The carrier will collect the boxes at noon.","zh":"承運商將於中午收取箱子。"},{"en":"As a major telecommunications carrier, the company invests heavily in network infrastructure.","zh":"作為一家主要的電信承運商，公司在網路基礎設施上投入巨資。"}],"tips":["物流與運輸情境：在 TOEIC 的物流、收發及運輸章節中，carrier 常指「運輸公司」或「承運商」，常見搭配如 common carrier (公共運輸業者) 或 shipping carrier。"],"forms":["carrier","carriers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"courier","pos":"n.","meaning":"快遞員；快遞公司","phrase":"courier service","category":"物流與配送","id":"w0456","number":456,"examples":[{"en":"The courier is waiting at the entrance.","zh":"快遞員正在入口等候。"},{"en":"Please confirm the courier tracking number so we can monitor the shipment’s progress.","zh":"請確認快遞追蹤號碼，以便我們能追蹤貨物的進度。"}],"tips":["常見搭配詞：常與 \"via courier\" (透過快遞)、\"courier service\" (快遞服務) 或 \"international courier\" 連用。在 TOEIC 中，常用於描述比普通郵件 (regular mail) 更快速的配送方式。"],"forms":["courier","couriers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"freight","pos":"n.","meaning":"貨運；貨物","phrase":"freight charges","category":"物流與配送","id":"w0457","number":457,"examples":[{"en":"The freight charges are included.","zh":"貨運費用已包含在內。"},{"en":"Department heads discussed the freight strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了freight策略。"}],"tips":["常見搭配詞：'freight charges'（運費）、'freight elevator'（貨梯）、'air/sea freight'（空運/海運）、'freight forwarder'（貨運代理商）。"],"forms":["freight"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cargo","pos":"n.","meaning":"貨物","phrase":"air cargo","category":"物流與配送","id":"w0458","number":458,"examples":[{"en":"The cargo is ready to load.","zh":"貨物已準備好可以裝載。"},{"en":"Department heads discussed the cargo strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了cargo策略。"}],"tips":["常見搭配詞與複合名詞：'air cargo' (航空貨運)、'cargo ship' (貨輪)、'cargo hold' (貨艙) 及 'handle cargo' (處理貨物)。此單字經常出現在物流、進出口貿易及運輸的情境中。"],"forms":["cargo"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"parcel","pos":"n.","meaning":"包裹","phrase":"send a parcel","category":"物流與配送","id":"w0459","number":459,"examples":[{"en":"Your parcel is at the post office.","zh":"你的包裹在郵局。"},{"en":"Please ensure the parcel is properly labeled with the recipient's address.","zh":"請確保包裹已正確標示收件人的地址。"}],"tips":["常見搭配詞組：'deliver a parcel' (遞送包裹)、'parcel delivery service' (包裹快遞服務)、'pick up a parcel' (領取包裹)。這些詞組常出現在物流追蹤或通知信件的情境中。"],"forms":["parcel","parcels"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"container","pos":"n.","meaning":"貨櫃；容器","phrase":"shipping container","category":"物流與配送","id":"w0460","number":460,"examples":[{"en":"The container is full of furniture.","zh":"貨櫃裡裝滿了家具。"},{"en":"The shipment arrived in several containers, ready for distribution to retailers.","zh":"貨物以多個集裝箱的形式到達，準備分發給零售商。"}],"tips":["常見搭配詞與情境：在物流與貿易情境中，常出現 shipping container (貨櫃) 或 storage container (儲存容器)；在餐飲情境中則指一般的「容器」。"],"forms":["container","containers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dock","pos":"n.","meaning":"碼頭；裝卸區","phrase":"loading dock","category":"物流與配送","id":"w0461","number":461,"examples":[{"en":"The truck is at the loading dock.","zh":"卡車在裝卸區。"},{"en":"The cargo ship is scheduled to dock at Pier 12 tomorrow morning.","zh":"貨船預計明天早上在 12 號碼頭靠岸。"}],"tips":["聽力第一部分（Part 1）常客：'dock' 常出現在照片描述題中，用來描述船隻停靠在碼頭的狀態，常見句型如 'Some boats are docked at the pier'，需特別注意與 'moored'（停泊）作為近義詞替換。"],"forms":["dock","docks","docking","docked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"warehouse","pos":"n.","meaning":"倉庫","phrase":"warehouse facility","category":"物流與配送","id":"w0462","number":462,"examples":[{"en":"The warehouse is near the airport.","zh":"倉庫在機場附近。"},{"en":"Our company is expanding its warehouse capacity to meet the increasing demand.","zh":"我們公司正在擴展倉庫容量以滿足不斷增長的需求。"}],"tips":["常見搭配詞與情境：在多益中常以 warehouse supervisor (倉庫主管)、storage warehouse (儲貨倉庫) 或 inventory management (庫存管理) 出現，主要涉及物流與供應鏈情境。"],"forms":["warehouse","warehouses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"storage","pos":"n.","meaning":"儲存；倉儲","phrase":"storage space","category":"物流與配送","id":"w0463","number":463,"examples":[{"en":"More storage space is needed.","zh":"需要更多儲存空間。"},{"en":"The warehouse has ample storage for the incoming shipment.","zh":"倉庫有足夠的儲存空間來存放即將到貨的貨物。"}],"tips":["常見搭配詞組：此單字常以複合名詞形式出現，如 'storage facility' (儲藏設施)、'storage space' (儲存空間)、'data storage' (數據儲存) 以及 'storage room' (儲藏室)。在物流或辦公室管理情境中頻率極高。"],"forms":["storage","storages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"logistics","pos":"n.","meaning":"物流","phrase":"logistics company","category":"物流與配送","id":"w0464","number":464,"examples":[{"en":"The logistics team will arrange delivery.","zh":"物流團隊將安排配送。"},{"en":"Effective logistics management can reduce transportation costs and improve delivery reliability.","zh":"有效的物流管理能降低運輸成本並提升交貨可靠性。"}],"tips":["常見搭配詞組：此單字常以複數形式出現但視為單數概念，常見用法包括 'logistics manager' (物流經理)、'logistics department' (物流部) 以及 'third-party logistics' (第三方物流，縮寫為 3PL)。"],"forms":["logistics"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"distribution","pos":"n.","meaning":"配送；分銷","phrase":"distribution center","category":"物流與配送","id":"w0465","number":465,"examples":[{"en":"The distribution center is open all night.","zh":"配送中心整晚營業。"},{"en":"The efficient distribution of inventory is crucial for minimizing storage costs.","zh":"庫存的高效分配對於降低儲存成本至關重要。"}],"tips":["常見搭配詞組：'distribution center' (配送中心)、'distribution network' (分銷/物流網絡) 及 'exclusive distribution rights' (獨家經銷權)，這些詞組頻繁出現在 Part 7 的商業合約或物流公告中。"],"forms":["distribution","distributions","distributes","distributing","distributed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"destination","pos":"n.","meaning":"目的地","phrase":"final destination","category":"物流與配送","id":"w0466","number":466,"examples":[{"en":"Our final destination is Taipei.","zh":"我們的最終目的地是台北。"},{"en":"Our company is expanding its operations and exploring new international destinations.","zh":"我們公司正在擴展業務，並探索新的國際目的地。"}],"tips":["常見搭配詞：'final destination' (最終目的地)、'tourist destination' (觀光勝地)、'popular destination' (熱門去處)、'shipping destination' (運送目的地)。"],"forms":["destination","destinations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"origin","pos":"n.","meaning":"起點；原產地","phrase":"country of origin","category":"物流與配送","id":"w0467","number":467,"examples":[{"en":"The country of origin is printed on the box.","zh":"原產國印在盒子上。"},{"en":"The company is tracing the origin of the defective parts to prevent future issues.","zh":"公司正在追蹤有缺陷零件的來源，以避免未來出現問題。"}],"tips":["常見搭配詞與國際貿易應用：在多益考試中，origin 頻繁出現在物流與進出口貿易情境，特別是 'country of origin' (原產國) 以及 'certificate of origin' (原產地證明)，這在 Part 7 的閱讀理解（如運送標籤或合約文件）中是核心考點。"],"forms":["origin","origins"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"route","pos":"n.","meaning":"路線","phrase":"delivery route","category":"物流與配送","id":"w0468","number":468,"examples":[{"en":"The route will change next week.","zh":"路線將於下星期更改。"},{"en":"Please route the email to the appropriate department for review.","zh":"請將郵件轉寄至相關部門進行審查。"}],"tips":["常見搭配詞與情境：在物流與交通情境中極為常見，如 'delivery route' (送貨路線)、'bus route' (公車路線) 或 'alternative route' (替代路線)。多益閱讀 Part 7 的行程表或地圖題中，常出現 'scenic route' (景觀路線) 來描述旅遊行程。"],"forms":["route","routes","routing","routed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tracking","pos":"n.","meaning":"追蹤；物流查詢","phrase":"tracking number","category":"物流與配送","id":"w0469","number":469,"examples":[{"en":"Your tracking number is in the email.","zh":"你的物流追蹤號碼在電子郵件裡。"},{"en":"Department heads discussed the tracking strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了tracking策略。"}],"tips":["常見搭配詞：最常出現在物流與電商情境，如 \"tracking number\" (追蹤編號) 或 \"tracking system\" (追蹤系統)，考生需識別這類訊息通常出現在 Part 7 的出貨確認信件或訂單狀態頁面中。"],"forms":["tracking"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dispatch","pos":"n./v.","meaning":"派送；發送","phrase":"dispatch an order","category":"物流與配送","id":"w0470","number":470,"examples":[{"en":"We will dispatch your order tomorrow.","zh":"我們明天將寄出你的訂單。"},{"en":"Please dispatch a team to investigate the reported equipment malfunction.","zh":"請調派一個團隊去調查報告的設備故障。"}],"tips":["物流與運輸情境：在 TOEIC 閱讀 Part 7 中，dispatch 常與 shipment、package 或 order 連用，表示『發貨』或『運送』，常作為 ship 或 send 的高級替代詞。"],"forms":["dispatch","dispatches","dispatching","dispatched"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"transport","pos":"n./v.","meaning":"運輸；運送","phrase":"transport goods","category":"物流與配送","id":"w0471","number":471,"examples":[{"en":"This truck can transport heavy goods.","zh":"這輛卡車可以運送重型貨物。"},{"en":"The logistics department is responsible for the safe transport of goods to our overseas branches.","zh":"物流部門負責將貨物安全地運送到我們的海外分行。"}],"tips":["常見搭配詞：'public transport' (大眾運輸)、'transport costs' (運輸成本)、'modes of transport' (運輸方式)，這些組合常在閱讀 Part 7 的物流或廣告中出現。"],"forms":["transport","transports","transporting","transported"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"transportation","pos":"n.","meaning":"運輸；交通","phrase":"transportation costs","category":"物流與配送","id":"w0472","number":472,"examples":[{"en":"Transportation costs are included in the budget.","zh":"運輸費用已包含在預算中。"},{"en":"Employee transportation costs are a significant factor in the annual budget.","zh":"員工交通費用是年度預算中的重要因素。"}],"tips":["常見搭配詞：包含 'public transportation' (大眾運輸)、'means of transportation' (交通工具)、'transportation costs' (交通費用) 以及 'ground transportation' (機場常見的地面接駁服務)。"],"forms":["transportation","transportations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"load","pos":"n./v.","meaning":"裝載；貨物","phrase":"load a truck","category":"物流與配送","id":"w0473","number":473,"examples":[{"en":"We can load the truck now.","zh":"我們現在可以把貨物裝上卡車。"},{"en":"We need to load this carefully.","zh":"我們需要仔細負載。"}],"tips":["聽力照片題焦點：在 TOEIC 聽力第一部分（Photographs）中，load 常見於物流或運輸情境，例如 'Loading items onto a van' (正在將物品裝上貨車) 或 'Boxes are being loaded' (箱子正被裝載)，需特別注意現在進行式被動語態。"],"forms":["load","loads","loading","loaded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"unload","pos":"v.","meaning":"卸貨","phrase":"unload a shipment","category":"物流與配送","id":"w0474","number":474,"examples":[{"en":"The driver will unload the boxes.","zh":"司機會卸下箱子。"},{"en":"Please ensure all containers are unloaded carefully to avoid damage.","zh":"請確保所有貨櫃小心卸載，以避免損壞。"}],"tips":["常見搭配詞：unload cargo/goods/merchandise（卸載貨物）、unload a truck/ship（從貨車或船隻卸貨）。"],"forms":["unload","unloads","unloading","unloaded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pack","pos":"v.","meaning":"包裝；打包","phrase":"pack the goods","category":"物流與配送","id":"w0475","number":475,"examples":[{"en":"You can pack the items in this box.","zh":"你可以把物品裝進這個箱子。"},{"en":"Before the business trip, please pack your presentation materials and a change of clothes.","zh":"在出差前，請打包您的簡報資料和一套換洗衣物。"}],"tips":["常見片語與搭配詞：在多益中常出現 pack up (整理、打包) 或 pack items into boxes (將物品裝箱)。"],"forms":["pack","packs","packing","packed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"packaging","pos":"n.","meaning":"包裝；包裝材料","phrase":"product packaging","category":"物流與配送","id":"w0476","number":476,"examples":[{"en":"Please remove all the packaging.","zh":"請移除所有包裝。"},{"en":"The company uses paper packaging to reduce waste.","zh":"公司使用紙包裝以減少廢棄物。"}],"tips":["常見搭配詞組：常用於 'packaging materials' (包裝材料)、'sustainable packaging' (永續包裝) 及 'packaging design' (包裝設計)，這些詞組常出現在產品開發與物流相關題目中。"],"forms":["packaging","packagings"],"exampleSource":"Wordstep original examples"},{"word":"wrap","pos":"v.","meaning":"包裝；包裹","phrase":"wrap a package","category":"物流與配送","id":"w0477","number":477,"examples":[{"en":"We can wrap the gift for you.","zh":"我們可以為你包裝禮物。"},{"en":"The shipping department needs to wrap each fragile item securely to prevent damage during transit.","zh":"運輸部門需要將每個易碎物品安全地包覆，以防止運輸過程中損壞。"}],"tips":["最常見的商業用法是動詞短語「wrap up」，意指「結束」或「圓滿完成」，常在會議或專案結尾出現，如「wrap up a meeting」。"],"forms":["wrap","wraps","wrapping","wrapped"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"seal","pos":"n./v.","meaning":"封條；密封","phrase":"seal a container","category":"物流與配送","id":"w0478","number":478,"examples":[{"en":"You should seal the box with tape.","zh":"你應該用膠帶封好箱子。"},{"en":"The shipping department needs to seal the boxes securely before they are loaded onto the truck.","zh":"貨運部門需要在將箱子裝上卡車之前，將其安全地密封。"}],"tips":["商業談判情境：常用於「seal the deal」，表示正式達成協議、完成交易或簽署合約，在閱讀測驗中常用於描述談判的最終成功階段。"],"forms":["seal","seals","sealing","sealed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"weigh","pos":"v.","meaning":"稱重；重量為","phrase":"weigh a package","category":"物流與配送","id":"w0479","number":479,"examples":[{"en":"We can weigh the parcel here.","zh":"我們可以在這裡替包裹秤重。"},{"en":"The shipping department needs to weigh all packages before labeling them.","zh":"運輸部門需要為所有包裹貼標籤前，先衡量它們的重量。"}],"tips":["商業決策應用：在多益閱讀中，weigh 常指「衡量」或「評估」，常見搭配詞為 'weigh the options' 或 'weigh the pros and cons'，表示在做決定前仔細考慮優缺點。"],"forms":["weigh","weighs","weighing","weighed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"weight","pos":"n.","meaning":"重量","phrase":"package weight","category":"物流與配送","id":"w0480","number":480,"examples":[{"en":"The weight is written on the label.","zh":"重量寫在標籤上。"},{"en":"The shipping department needs to verify the weight of each package before dispatch.","zh":"運輸部門需要驗證每個包裹的重量，然後再發貨。"}],"tips":["常見搭配詞與商業情境：在物流與航運（Shipping & Logistics）情境中，常出現 gross weight（總重）、net weight（淨重）及 weight limit（重量限制）。考生需注意運費（freight）通常會根據重量或體積進行計算。"],"forms":["weight","weights","weighing","weighed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dimension","pos":"n.","meaning":"尺寸；規格","phrase":"package dimensions","category":"物流與配送","id":"w0481","number":481,"examples":[{"en":"Each dimension is listed in centimeters.","zh":"每個尺寸都以公分列出。"},{"en":"The new warehouse needs to be designed with optimal storage dimensions to maximize space utilization.","zh":"新倉庫需要設計最佳的儲存尺寸，以最大化空間利用率。"}],"tips":["常見搭配詞與片語：'add a new dimension to' 常用於表示為事物增添新境界或新元素；'measure the dimensions' 則用於描述測量物理上的長、寬、高尺寸。"],"forms":["dimension","dimensions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fragile","pos":"adj.","meaning":"易碎的","phrase":"fragile items","category":"物流與配送","id":"w0482","number":482,"examples":[{"en":"These items are fragile.","zh":"這些物品容易破碎。"},{"en":"Handle the prototype with care; it's quite fragile and can break easily.","zh":"小心處理原型機，它非常脆弱，很容易損壞。"}],"tips":["物流與運輸情境：此字最常出現在包裹標示或倉儲管理的對話中，常見搭配詞為「fragile items」(易碎品) 或「handle fragile goods with care」。"],"forms":["fragile","more fragile","most fragile"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"damaged","pos":"adj.","meaning":"損壞的","phrase":"damaged goods","category":"物流與配送","id":"w0483","number":483,"examples":[{"en":"The box was damaged during delivery.","zh":"這個箱子在配送途中損壞了。"},{"en":"The damaged goods were segregated and marked for disposal.","zh":"受損的商品被單獨隔離並標記以供丟棄。"}],"tips":["常見搭配詞：'heavily damaged' (嚴重受損) 或 'slightly damaged' (輕微受損)，常用於描述貨物、設備或建築物的狀態。"],"forms":["damaged","more damaged","most damaged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"defect","pos":"n.","meaning":"瑕疵；缺陷","phrase":"product defect","category":"物流與配送","id":"w0484","number":484,"examples":[{"en":"A small defect was found in the product.","zh":"產品中發現了一個小瑕疵。"},{"en":"Despite the minor defect, the product still meets the required specifications.","zh":"儘管存在小瑕疵，該產品仍然符合要求的規格。"}],"tips":["常見搭配詞組：manufacturing defect (製造缺陷)、zero defects (零缺點)、detect a defect (發現缺陷)、structural defect (結構性缺陷)。"],"forms":["defect","defects"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"defective","pos":"adj.","meaning":"有瑕疵的；故障的","phrase":"defective product","category":"物流與配送","id":"w0485","number":485,"examples":[{"en":"The defective part will be replaced.","zh":"有瑕疵的零件將被更換。"},{"en":"The quality control department discovered several defective products during the inspection.","zh":"品質管制部門在檢查中發現了幾個有缺陷的產品。"}],"tips":["常見搭配詞組：常用於形容產品瑕疵，如 'defective product' (有缺陷的產品)、'defective items' (瑕疵品) 或 'defective components' (有缺陷的零件)。"],"forms":["defective","more defective","most defective"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"delay","pos":"n./v.","meaning":"延誤；延遲","phrase":"delivery delay","category":"物流與配送","id":"w0486","number":486,"examples":[{"en":"There is a delay in delivery.","zh":"配送有所延誤。"},{"en":"We apologize for the delay in processing your order.","zh":"對於處理您的訂單延遲，我們深感抱歉。"}],"tips":["語法結構：當delay作為動詞且後接另一個動作時，必須接動名詞(V-ing)，例如'delay processing the payment'，這是Part 5常見的文法考點。"],"forms":["delay","delays","delaying","delayed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"delayed","pos":"adj.","meaning":"延誤的","phrase":"delayed shipment","category":"物流與配送","id":"w0487","number":487,"examples":[{"en":"Your shipment is delayed.","zh":"你的貨物運送延誤了。"},{"en":"The flight was delayed due to bad weather, causing inconvenience to passengers.","zh":"由於天氣惡劣，航班延誤，造成旅客不便。"}],"tips":["常見搭配：常用於被動語態 'be delayed'，或搭配副詞如 'unavoidably delayed' (不可避免地延誤) 或 'severely delayed' (嚴重延誤)。"],"forms":["delayed","more delayed","most delayed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"arrive","pos":"v.","meaning":"抵達","phrase":"arrive on time","category":"物流與配送","id":"w0488","number":488,"examples":[{"en":"The truck will arrive before noon.","zh":"卡車將在中午以前抵達。"},{"en":"The flight is scheduled to arrive at 10:00 AM.","zh":"航班預計於上午 10:00 抵達。"}],"tips":["介係詞的精確使用：arrive 是不及物動詞，後方必須搭配介係詞，習慣用法為 arrive at (小地點，如機場、車站、辦公室) 或 arrive in (大範圍，如城市、國家)，切記不可使用 arrive to。"],"forms":["arrive","arrives","arriving","arrived"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"arrival","pos":"n.","meaning":"抵達；到貨","phrase":"expected arrival","category":"物流與配送","id":"w0489","number":489,"examples":[{"en":"The arrival time is on the screen.","zh":"抵達時間顯示在螢幕上。"},{"en":"The scheduled arrival of the shipment is next Monday.","zh":"貨物預計下週一抵達。"}],"tips":["常見搭配詞：'estimated time of arrival (ETA)'（預計到達時間）常用於物流運輸與行程確認，'upon arrival'（抵達時）則常用於飯店入住、報到或領取包裹的情境。"],"forms":["arrival","arrivals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"receive","pos":"v.","meaning":"收到；接收","phrase":"receive a shipment","category":"物流與配送","id":"w0490","number":490,"examples":[{"en":"You will receive a reply today.","zh":"你今天會收到回覆。"},{"en":"Did you receive my email?","zh":"你有收到我的電子郵件嗎？"}],"tips":["例句1的 will receive 表示「將收到」。例句2用了 Did，後面的 receive 要維持原形。"],"forms":["receive","receives","receiving","received"],"exampleSource":"Wordstep original examples"},{"word":"recipient","pos":"n.","meaning":"收件人","phrase":"recipient's address","category":"物流與配送","id":"w0491","number":491,"examples":[{"en":"The recipient must sign for the parcel.","zh":"收件人必須簽收包裹。"},{"en":"Please ensure all invoices are sent to the correct recipient.","zh":"請確保所有發票都寄送至正確的收件人。"}],"tips":["常見搭配詞：在多益中常以 'award recipient' (獲獎者)、'grant recipient' (撥款/補助受領者) 或 'intended recipient' (預定收件人) 的形式出現。"],"forms":["recipient","recipients"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sender","pos":"n.","meaning":"寄件人","phrase":"sender's information","category":"物流與配送","id":"w0492","number":492,"examples":[{"en":"The sender's address is on the envelope.","zh":"寄件人的地址在信封上。"},{"en":"The sender's name and address are clearly displayed on the package.","zh":"包裹上清楚地顯示了寄件者的姓名和地址。"}],"tips":["常見搭配詞與商務情境：在 TOEIC 閱讀的書信與電子郵件中，sender 常與 original sender (原寄件者) 或 sender's address (寄件人地址) 連用；而在物流情境中，return to sender (退回原寄件人) 是常見的包裹標註。"],"forms":["sender","senders"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"customs","pos":"n.","meaning":"海關","phrase":"customs declaration","category":"物流與配送","id":"w0493","number":493,"examples":[{"en":"The goods are being checked by customs.","zh":"貨物正在接受海關檢查。"},{"en":"Please declare all imported goods to customs upon arrival.","zh":"請在抵達時向海關申報所有進口商品。"}],"tips":["區分單複數意義：單數 custom 指的是「習俗、習慣」，而在 TOEIC 中恆用複數形式的 customs 專指「海關」或「關稅」，通常出現在機場、國際貿易或物流情境。"],"forms":["customs"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"clearance","pos":"n.","meaning":"通關；清關","phrase":"customs clearance","category":"物流與配送","id":"w0494","number":494,"examples":[{"en":"Customs clearance will take another day.","zh":"清關還需要一天。"},{"en":"The shipment was delayed due to customs clearance issues.","zh":"由於海關通關問題，貨物延遲了。"}],"tips":["常見搭配詞為「clearance sale」（清倉大拍賣），在聽力或閱讀的零售廣告情境中極高機率出現，通常伴隨 discount 或 inventory 等詞。"],"forms":["clearance","clearances","clears","clearing","cleared"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"import","pos":"n./v.","meaning":"進口；進口商品","phrase":"import goods","category":"物流與配送","id":"w0495","number":495,"examples":[{"en":"We can import the parts from Japan.","zh":"我們可以從日本進口零件。"},{"en":"Due to increased demand, we need to import more electronic components.","zh":"由於需求增加，我們需要進口更多的電子元件。"}],"tips":["常見搭配詞：在 TOEIC 閱讀中常出現 import duties (進口稅)、import license (進口許可證) 以及 import restrictions (進口限制) 等固定用法。"],"forms":["import","imports","importing","imported"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"export","pos":"n./v.","meaning":"出口；出口商品","phrase":"export products","category":"物流與配送","id":"w0496","number":496,"examples":[{"en":"The company will export its products overseas.","zh":"公司將把產品出口到海外。"},{"en":"The government is offering incentives to encourage businesses to export more goods.","zh":"政府正在提供誘因，鼓勵企業出口更多商品。"}],"tips":["詞性與發音辨析：在 TOEIC 聽力中，export 作為動詞時重音通常在第二音節 (ex-PORT)，而作為名詞時重音在第一音節 (EX-port)，掌握此規律有助於在聽力測驗中快速判斷句型結構。"],"forms":["export","exports","exporting","exported"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"domestic","pos":"adj.","meaning":"國內的","phrase":"domestic shipping","category":"物流與配送","id":"w0497","number":497,"examples":[{"en":"Domestic shipping is free.","zh":"國內運送免運費。"},{"en":"The airline offers discounted fares for domestic flights during the holiday season.","zh":"航空公司在節假日期間為國內航班提供折扣優惠。"}],"tips":["常見搭配詞與情境：在多益考試中，domestic 最常出現在交通與商務情境。常見詞組包括 domestic flight（國內航班）、domestic market（國內市場）及 domestic demand（國內需求）。"],"forms":["domestic","more domestic","most domestic"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"overseas","pos":"adj./adv.","meaning":"海外的；在海外","phrase":"overseas delivery","category":"物流與配送","id":"w0498","number":498,"examples":[{"en":"Our overseas office is in London.","zh":"我們的海外辦公室在倫敦。"},{"en":"Our company is expanding its operations overseas.","zh":"我們公司正在擴展其海外業務。"}],"tips":["詞性雙重身份：overseas 可同時作形容詞與副詞。作形容詞時置於名詞前，如 'overseas investment' (海外投資)；作副詞時置於動詞後，如 'travel overseas' (出國)，注意不需加介系詞 to。"],"forms":["overseas","more overseas","most overseas"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"promptly","pos":"adv.","meaning":"迅速地；及時地","phrase":"deliver promptly","category":"物流與配送","id":"w0499","number":499,"examples":[{"en":"We will respond promptly to your request.","zh":"我們會迅速回覆你的請求。"},{"en":"The delivery service promised to ship the order promptly.","zh":"貨運服務承諾會立即發貨。"}],"tips":["常見搭配詞：最常與 'respond', 'reply', 'action' 搭配使用，如 'respond promptly to inquiries' (迅速回覆詢問)。在 Part 5 閱讀中，若空格位於動詞之後或句尾，且句意強調效率，'promptly' 是首選。"],"forms":["promptly"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"securely","pos":"adv.","meaning":"安全地；牢固地","phrase":"pack securely","category":"物流與配送","id":"w0500","number":500,"examples":[{"en":"The items are packed securely.","zh":"物品已牢固地包裝好。"},{"en":"The company's data is stored securely on a cloud server.","zh":"公司的資料安全地儲存在雲端伺服器上。"}],"tips":["常見搭配詞組：此副詞在 TOEIC 中最常與包裝、物流或設施安全相關的動詞連用，例如 'fasten securely' (牢固地繫緊)、'store securely' (安全地儲存) 或 'attach securely' (牢固地附上)。"],"forms":["securely"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"manufacture","pos":"v./n.","meaning":"製造；生產","phrase":"manufacture products","category":"製造與生產","id":"w0501","number":501,"examples":[{"en":"We manufacture office furniture.","zh":"我們製造辦公家具。"},{"en":"The company plans to manufacture phones overseas.","zh":"公司計畫在海外生產手機。"}],"tips":["常見搭配詞：常用於 'manufacturing process' (製造過程)、'manufacturing plant' (製造廠) 或 'manufactured goods' (製成品)。"],"forms":["manufacture","manufactures","manufacturing","manufactured"],"exampleSource":"Wordstep original examples"},{"word":"manufacturing","pos":"n./adj.","meaning":"製造業；製造的","phrase":"manufacturing process","category":"製造與生產","id":"w0502","number":502,"examples":[{"en":"The manufacturing process is shown in the video.","zh":"製造流程顯示在影片中。"},{"en":"The company is investing heavily in automation to improve its manufacturing efficiency.","zh":"該公司正在大力投資自動化，以提高其生產效率。"}],"tips":["常見搭配詞：'manufacturing plant' (製造工廠)、'manufacturing cost' (製造成本) 及 'manufacturing process' (製造流程)，在多益考試中常出現在工廠運作或產業報告情境。"],"forms":["manufacturing","manufacturings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"production","pos":"n.","meaning":"生產；產量","phrase":"production schedule","category":"製造與生產","id":"w0503","number":503,"examples":[{"en":"Production will begin next month.","zh":"生產將於下個月開始。"},{"en":"Our production costs have decreased significantly this quarter.","zh":"我們本季的生產成本顯著降低。"}],"tips":["常見搭配詞：常與 mass (大規模)、line (生產線)、schedule (生產進度) 或 cost (生產成本) 連用。"],"forms":["production","productions","produces","producing","produced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"produce","pos":"v.","meaning":"生產；製造","phrase":"produce goods","category":"製造與生產","id":"w0504","number":504,"examples":[{"en":"The factory can produce five hundred units a day.","zh":"這間工廠每天可以生產五百件產品。"},{"en":"Our company produces high-quality office supplies for businesses worldwide.","zh":"我們公司為全球企業生產高品質的辦公用品。"}],"tips":["詞性與發音的關鍵差異：當動詞時重音在第二音節 /prəˈdjuːs/，意為生產、製造或出示（文件）；當名詞時重音在第一音節 /ˈprɒdjuːs/，特指「農產品」，多益常在超市或餐飲供應鏈情境考出名詞用法。"],"forms":["produce","produces","producing","produced","products"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"factory","pos":"n.","meaning":"工廠","phrase":"factory workers","category":"製造與生產","id":"w0505","number":505,"examples":[{"en":"The factory is closed on Sunday.","zh":"這間工廠星期日不開工。"},{"en":"The company is investing in new equipment for its factory to increase production efficiency.","zh":"該公司正在工廠投資新設備，以提高生產效率。"}],"tips":["常見搭配詞組：'factory worker' (工廠員工)、'factory outlet' (工廠直營店/出清店)、'factory tour' (參觀工廠) 及 'manufacturing factory' (製造工廠)。"],"forms":["factory","factories"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"plant","pos":"n.","meaning":"工廠；廠房","phrase":"manufacturing plant","category":"製造與生產","id":"w0506","number":506,"examples":[{"en":"The new plant will open in July.","zh":"新廠房將於七月啟用。"},{"en":"The company is investing in a new plant to increase production capacity.","zh":"該公司正在投資一座新工廠以提高生產能力。"}],"tips":["多義詞辨析：在多益考試中，plant 除了解釋為「植物」，更常出現在商業或工業情境中表示「工廠、廠房、發電廠」。例如：manufacturing plant（製造廠）、power plant（發電廠）。考生在聽力與閱讀測驗中應優先判斷上下文是否涉及生產或設施。"],"forms":["plant","plants","planting","planted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"assembly","pos":"n.","meaning":"組裝；裝配","phrase":"assembly line","category":"製造與生產","id":"w0507","number":507,"examples":[{"en":"Assembly takes about twenty minutes.","zh":"組裝大約需要二十分鐘。"},{"en":"Please read the instructions before assembly.","zh":"組裝前請先閱讀說明。"}],"tips":["常見搭配詞與製造業情境：在 TOEIC 中，assembly 最常出現在製造業背景，特別是 'assembly line' (組裝線) 或 'assembly plant' (組裝工廠)。在 Part 1 照片題中，若看到工人在生產線上作業，常會出現相關敘述。"],"forms":["assembly","assemblies","assembles","assembling","assembled"],"exampleSource":"Wordstep original examples"},{"word":"assemble","pos":"v.","meaning":"組裝；裝配","phrase":"assemble components","category":"製造與生產","id":"w0508","number":508,"examples":[{"en":"You can assemble the desk with these tools.","zh":"你可以用這些工具組裝桌子。"},{"en":"Please assemble the components according to the instruction manual.","zh":"請根據使用手冊組裝組件。"}],"tips":["多義性解析：在多益中「assemble」有兩個主要核心意義。第一是「組裝」零件或產品（如：assemble a bicycle），常見於製造業情境；第二是「集合、聚集」人員（如：assemble the staff），常見於辦公室或緊急演習情境。"],"forms":["assemble","assembles","assembling","assembled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"line","pos":"n.","meaning":"生產線；作業線","phrase":"production line","category":"製造與生產","id":"w0509","number":509,"examples":[{"en":"The production line is running smoothly.","zh":"生產線正在順利運作。"},{"en":"There's a long line at the reception desk; please wait your turn.","zh":"接待處排隊的人很多，請耐心等待。"}],"tips":["常見商務搭配：'product line' 指產品系列，'assembly line' 指生產線，而 'bottom line' 則是指公司帳本的最底線，即淨利或最終結果。"],"forms":["line","lines","lining","lined"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"output","pos":"n.","meaning":"產量；產出","phrase":"increase output","category":"製造與生產","id":"w0510","number":510,"examples":[{"en":"Our output is higher this month.","zh":"我們這個月的產量較高。"},{"en":"The software's output needs to be checked for accuracy before distribution.","zh":"在發布前，需要檢查軟體的輸出結果是否準確。"}],"tips":["常見搭配詞：'Industrial output' (工業產量)、'annual output' (年產量) 或 'increase/boost output' (增加產量)，此類詞組經常出現在公司的生產進度報告或產能評估中。"],"forms":["output","outputs","outputting","outputted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"capacity","pos":"n.","meaning":"產能；容量","phrase":"production capacity","category":"製造與生產","id":"w0511","number":511,"examples":[{"en":"The plant is operating at full capacity.","zh":"這座工廠正在以最大產能運作。"},{"en":"The warehouse has a storage capacity of 5,000 units.","zh":"該倉庫的儲存容量為 5,000 件。"}],"tips":["常見搭配詞組：常用於 'seating capacity' (座席數)、'production capacity' (生產能力) 或 'at full capacity' (以滿負荷運轉)，這類搭配常出現在商業物流與工廠生產的閱讀題中。"],"forms":["capacity","capacities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"productivity","pos":"n.","meaning":"生產力","phrase":"increase productivity","category":"製造與生產","id":"w0512","number":512,"examples":[{"en":"Better tools can increase productivity.","zh":"更好的工具可以提高生產力。"},{"en":"The company is investing in new software to boost employee productivity.","zh":"公司正在投資新軟體以提高員工生產力。"}],"tips":["常見搭配詞組：常用動詞包括 boost, enhance, improve, increase 或 maintain productivity，形容詞則常搭配 overall, high/low, 或 employee productivity。"],"forms":["productivity","productivities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"efficiency","pos":"n.","meaning":"效率","phrase":"improve efficiency","category":"製造與生產","id":"w0513","number":513,"examples":[{"en":"The new machine improves efficiency.","zh":"新機器提高了效率。"},{"en":"How can we increase energy efficiency?","zh":"我們如何提高能源使用效率？"}],"tips":["常見搭配詞：常與動詞 improve, enhance, boost 或 increase 搭配組成「提高效率」。在特定領域中，energy efficiency (能源效率) 與 fuel efficiency (燃油效率) 是 Part 7 產品說明或廣告中的高頻詞組。"],"forms":["efficiency","efficiencies","more efficient","most efficient"],"exampleSource":"Wordstep original examples"},{"word":"quality","pos":"n.","meaning":"品質","phrase":"product quality","category":"製造與生產","id":"w0514","number":514,"examples":[{"en":"Product quality is checked every day.","zh":"產品品質每天都會檢查。"},{"en":"The company is committed to maintaining the highest quality standards for its products.","zh":"公司致力於維持其產品的最高品質標準。"}],"tips":["常見搭配詞：TOEIC 測驗中極常出現 quality control (品質控管) 與 quality assurance (品質保證)，通常與製造業或生產管理情境相關。"],"forms":["quality","qualities","better","best"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"control","pos":"n./v.","meaning":"控制；管理","phrase":"quality control","category":"製造與生產","id":"w0515","number":515,"examples":[{"en":"You can control the speed with this switch.","zh":"你可以用這個開關控制速度。"},{"en":"The manager needs to control the budget and prevent unnecessary expenses.","zh":"經理需要控制預算並避免不必要的開支。"}],"tips":["常見搭配詞組：多益中常考 \"quality control\" (品質管制)、\"inventory control\" (庫存控制) 以及介係詞短語 \"under control\" (在控制中) 或 \"beyond one's control\" (非某人所能控制)。"],"forms":["control","controls","controlling","controlled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"inspection","pos":"n.","meaning":"檢查；檢驗","phrase":"quality inspection","category":"製造與生產","id":"w0516","number":516,"examples":[{"en":"The building passed the safety inspection.","zh":"這棟建築通過了安全檢查。"},{"en":"An inspection is required before delivery.","zh":"交貨前必須進行檢驗。"}],"tips":["常見搭配詞組：常用 'conduct an inspection' (進行檢查)、'routine inspection' (例行檢查) 以及 'safety inspection' (安全檢查)，應對時需注意其動詞搭配如 perform 或 undergo。"],"forms":["inspection","inspections","inspects","inspecting","inspected"],"exampleSource":"Wordstep original examples"},{"word":"inspector","pos":"n.","meaning":"檢查員；檢驗員","phrase":"quality inspector","category":"製造與生產","id":"w0517","number":517,"examples":[{"en":"The inspector is checking the equipment.","zh":"檢查員正在檢查設備。"},{"en":"The quality control inspector thoroughly examined the shipment before it was released to the customer.","zh":"品質控制檢查員在將貨物交付客戶之前，仔細檢查了這批貨。"}],"tips":["常見搭配詞：包括 safety inspector (安全檢查員)、health inspector (衛生稽查員) 與 building inspector (建築檢查員)，常出現在工廠管理、施工規範或餐飲服務的相關情境。"],"forms":["inspector","inspectors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"test","pos":"n./v.","meaning":"測試；檢測","phrase":"test a product","category":"製造與生產","id":"w0518","number":518,"examples":[{"en":"We can test the device here.","zh":"我們可以在這裡測試裝置。"},{"en":"The HR department will conduct a skills test to assess candidates' qualifications.","zh":"人資部門將進行技能測試以評估候選人的資歷。"}],"tips":["常見搭配詞組：'market test' (市場測試)、'product testing' (產品測試)、'conduct a test' (進行測試)、'undergo a test' (接受測試)。"],"forms":["test","tests","testing","tested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"testing","pos":"n.","meaning":"測試；檢測","phrase":"product testing","category":"製造與生產","id":"w0519","number":519,"examples":[{"en":"Product testing will begin tomorrow.","zh":"產品測試明天將開始。"},{"en":"The software company is conducting extensive testing to ensure the new version is bug-free.","zh":"該軟體公司正在進行廣泛的測試，以確保新版本沒有錯誤。"}],"tips":["常見搭配詞：常與名詞組合形成複合名詞，如 'product testing' (產品測試)、'software testing' (軟體測試) 或 'quality testing' (品質檢測)。"],"forms":["testing","tests","tested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"workflow","pos":"n.","meaning":"工作流程","phrase":"improve workflow","category":"製造與生產","id":"w0520","number":520,"examples":[{"en":"This change will improve our workflow.","zh":"這項變更將改善我們的工作流程。"},{"en":"Please explain the workflow to the new employee.","zh":"請向新員工說明工作流程。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"technique","pos":"n.","meaning":"技術；方法","phrase":"production technique","category":"製造與生產","id":"w0521","number":521,"examples":[{"en":"This technique can save time.","zh":"這項技術可以節省時間。"},{"en":"The sales team implemented a new sales technique to increase conversion rates.","zh":"銷售團隊實施了一種新的銷售技巧以提高轉換率。"}],"tips":["常見搭配詞與結構：常用搭配包括 'improve a technique' (改進技巧)、'modern techniques' (現代技術) 以及 'analytical techniques' (分析技巧)。"],"forms":["technique","techniques"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"method","pos":"n.","meaning":"方法","phrase":"manufacturing method","category":"製造與生產","id":"w0522","number":522,"examples":[{"en":"The new method is easy to learn.","zh":"新方法很容易學會。"},{"en":"Our company is constantly seeking innovative methods to improve efficiency.","zh":"我們公司不斷尋找創新的方法來提高效率。"}],"tips":["常見搭配詞：'payment method' (付款方式) 頻繁出現於多益閱讀 Part 7 的訂購單或收據中，'alternative method' (替代方案) 則常用於討論專案瓶頸或資源短缺的情境。"],"forms":["method","methods","methoding","methoded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"raw","pos":"adj.","meaning":"未加工的；原始的","phrase":"raw material","category":"製造與生產","id":"w0523","number":523,"examples":[{"en":"The raw materials will arrive tomorrow.","zh":"原料將於明天送達。"},{"en":"The chef prefers to use fresh, raw ingredients in his dishes.","zh":"這位廚師喜歡在他的菜餚中使用新鮮的生食材。"}],"tips":["常見搭配詞：在多益測驗中，raw 最常與 materials 結合形成 'raw materials'（原材料），廣泛出現於製造業、物流與供應鏈情境。另外，'raw data'（原始數據）則常出現在研究報告或資訊科技的閱讀篇章中。"],"forms":["raw","rawer","rawest"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"resource","pos":"n.","meaning":"資源","phrase":"production resources","category":"製造與生產","id":"w0524","number":524,"examples":[{"en":"Water is an important resource.","zh":"水是一項重要資源。"},{"en":"Our company needs to allocate more resources to the marketing department to increase brand awareness.","zh":"為了提高品牌知名度，我們需要將更多資源分配給行銷部門。"}],"tips":["常見搭配詞與情境：最常出現在 Human Resources (人力資源部，常縮寫為 HR)，涉及招聘、培訓或員工福利。此外，Resource allocation (資源分配) 與 Financial resources (財務資源) 常見於預算編列或專案規劃的情境中。"],"forms":["resource","resources"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"labor","pos":"n.","meaning":"勞動力；人工","phrase":"labor costs","category":"製造與生產","id":"w0525","number":525,"examples":[{"en":"Labor costs are included in the estimate.","zh":"人工成本已包含在估價中。"},{"en":"Employees are expected to labor efficiently during peak production periods.","zh":"員工在生產高峰期需有效率地勞動。"}],"tips":["常見搭配詞：'labor costs' (勞動成本)、'labor shortage' (勞動力短缺)、'manual labor' (體力勞動) 與 'labor union' (工會)，這些詞組常出現在 Part 7 的商業新聞或公司內部公告。"],"forms":["labor","labors","laboring","labored"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"workforce","pos":"n.","meaning":"勞動力；員工總數","phrase":"skilled workforce","category":"製造與生產","id":"w0526","number":526,"examples":[{"en":"Our workforce is growing.","zh":"我們的員工總數正在增加。"},{"en":"Due to automation, the workforce in the manufacturing sector is gradually shrinking.","zh":"由於自動化，製造業的勞動力正逐漸萎縮。"}],"tips":["常見搭配詞：'skilled workforce' (技術熟練的勞動力)、'diverse workforce' (多元化的員工隊伍) 與 'mobile workforce' (流動勞動力)，常用於描述企業競爭力。"],"forms":["workforce","workforces"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"machine","pos":"n.","meaning":"機器","phrase":"operate a machine","category":"製造與生產","id":"w0527","number":527,"examples":[{"en":"The machine is ready to use.","zh":"這台機器可以使用了。"},{"en":"The factory invested in new machines to increase production efficiency.","zh":"該工廠投資了新機器以提高生產效率。"}],"tips":["常見搭配詞：vending machine (自動販賣機)、answering machine (答錄機)、copy machine (影印機)。"],"forms":["machine","machines"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tool","pos":"n.","meaning":"工具","phrase":"use a tool","category":"製造與生產","id":"w0528","number":528,"examples":[{"en":"This tool is useful for small repairs.","zh":"這個工具適合用來進行小型修理。"},{"en":"The company invested in new software tools to improve employee productivity.","zh":"公司投資了新的軟體工具以提高員工生產力。"}],"tips":["常見搭配詞與組合：在多益中常出現 'marketing tool' (行銷工具)、'diagnostic tool' (診斷工具) 或 'analytical tool' (分析工具)。"],"forms":["tool","tools"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"device","pos":"n.","meaning":"裝置；設備","phrase":"safety device","category":"製造與生產","id":"w0529","number":529,"examples":[{"en":"The device is connected to the computer.","zh":"裝置已連接到電腦。"},{"en":"The IT department is responsible for maintaining all company devices, including computers and smartphones.","zh":"資訊部門負責維護公司所有設備，包括電腦和智慧型手機。"}],"tips":["詞性辨析重點：常與動詞 'devise' (設計/發明) 混淆。'device' 是名詞，指實體的設備或裝置，而 'devise' 是動詞，指構思或制訂計畫。"],"forms":["device","devices"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"instrument","pos":"n.","meaning":"儀器；工具","phrase":"measuring instrument","category":"製造與生產","id":"w0530","number":530,"examples":[{"en":"This instrument can measure temperature.","zh":"這個儀器可以測量溫度。"},{"en":"The company invested in new musical instruments to enhance employee morale during breaks.","zh":"公司購買了新的樂器，以提升員工在休息時間的士氣。"}],"tips":["多義性辨析：在多益考試中，instrument 最常以『樂器』(musical instrument) 或『精密儀器/工具』(precision/scientific instrument) 兩種含義出現。聽力第一部分的照片描述題常出現樂器，而閱讀部分則常出現在實驗室或醫療情境中。"],"forms":["instrument","instruments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"maintenance","pos":"n.","meaning":"維護；保養","phrase":"routine maintenance","category":"製造與生產","id":"w0531","number":531,"examples":[{"en":"Routine maintenance is scheduled for Friday.","zh":"例行保養安排在星期五。"},{"en":"Regular maintenance of the equipment is crucial for preventing breakdowns and ensuring optimal performance.","zh":"定期維護設備對於防止故障並確保最佳性能至關重要。"}],"tips":["常見搭配詞與短語：常與 routine, preventative, regular 等形容詞連用，例如 'routine maintenance'（例行保養）或 'maintenance fee'（維修/管理費），在 Part 5 詞彙題中常考此類固定搭配。"],"forms":["maintenance","maintenances","maintains","maintaining","maintained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"maintain","pos":"v.","meaning":"維護；保養","phrase":"maintain equipment","category":"製造與生產","id":"w0532","number":532,"examples":[{"en":"We maintain the equipment every month.","zh":"我們每個月保養設備。"},{"en":"Please maintain a safe distance from the machine.","zh":"請與機器保持安全距離。"}],"tips":["常見搭配詞與商業情境：'maintain equipment' (維修設備) 與 'maintain a database' (維護資料庫) 是常考組合，常出現在辦公室設施管理或IT支援的對話中。"],"forms":["maintain","maintains","maintaining","maintained"],"exampleSource":"Wordstep original examples"},{"word":"repair","pos":"n./v.","meaning":"維修；修理","phrase":"repair a machine","category":"製造與生產","id":"w0533","number":533,"examples":[{"en":"The technician can repair the printer.","zh":"技術人員可以修理印表機。"},{"en":"The maintenance team will repair the printer by tomorrow afternoon.","zh":"維修團隊將於明天下午前修理好印表機。"}],"tips":["常見搭配詞組：'under repair' (維修中) 常出現在公共設施或辦公設備的告示；'beyond repair' (無法修復) 指損害程度過重；'minor/major repairs' (小修/大修) 用於描述工程規模。"],"forms":["repair","repairs","repairing","repaired"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"technician","pos":"n.","meaning":"技術人員","phrase":"service technician","category":"製造與生產","id":"w0534","number":534,"examples":[{"en":"The technician will arrive at ten.","zh":"技術人員將於十點抵達。"},{"en":"Department heads discussed the technician strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了technician策略。"}],"tips":["常見搭配詞：'qualified technician' (合格的技術人員)、'IT technician' (IT技術人員)、'laboratory technician' (實驗室技術人員)。"],"forms":["technician"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"engineer","pos":"n.","meaning":"工程師","phrase":"production engineer","category":"製造與生產","id":"w0535","number":535,"examples":[{"en":"The engineer is checking the design.","zh":"工程師正在檢查設計。"},{"en":"The company hired several engineers to design and implement the new network infrastructure.","zh":"公司聘請了幾位工程師來設計和實施新的網路基礎架構。"}],"tips":["常見搭配詞與職業類型：在多益中常出現特定領域的工程師，如 software engineer (軟體工程師)、civil engineer (土木工程師) 或 maintenance engineer (維修工程師)。考生需識別這些前綴詞以判斷對話或文章的專業背景。"],"forms":["engineer","engineers","engineering","engineered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"technical","pos":"adj.","meaning":"技術的","phrase":"technical support","category":"製造與生產","id":"w0536","number":536,"examples":[{"en":"Technical support is available by phone.","zh":"可以透過電話取得技術支援。"},{"en":"The software requires a technical expert to troubleshoot the error.","zh":"軟體需要一位技術專家來排除這個錯誤。"}],"tips":["常見搭配詞與情境：在 TOEIC 中常出現在 IT 或工程情境，如 'technical support'（技術支援）、'technical specifications'（技術規格）及 'technical issues/difficulties'（技術問題）。"],"forms":["technical","more technical","most technical"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"malfunction","pos":"n./v.","meaning":"故障；發生故障","phrase":"equipment malfunction","category":"製造與生產","id":"w0537","number":537,"examples":[{"en":"A malfunction can stop the machine.","zh":"故障可能使機器停止運作。"},{"en":"The printer malfunctioned during the important presentation, causing a significant delay.","zh":"在重要的簡報過程中，印表機發生故障，導致了嚴重的延遲。"}],"tips":["詞性與常見搭配：malfunction 可兼作名詞與動詞，在 TOEIC 中常以名詞形式出現，常見搭配詞如 technical malfunction (技術故障)、equipment malfunction (設備故障) 或 software malfunction (軟體失靈)。"],"forms":["malfunction","malfunctions","malfunctioning","malfunctioned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"breakdown","pos":"n.","meaning":"故障；損壞","phrase":"machine breakdown","category":"製造與生產","id":"w0538","number":538,"examples":[{"en":"The breakdown caused a delay.","zh":"這次故障造成了延誤。"},{"en":"Negotiations between the two companies broke down due to disagreements over pricing.","zh":"由於價格方面的分歧，這兩家公司之間的談判破裂。"}],"tips":["商業報表核心詞：常用於表示『細目』或『明細分析』，如 cost breakdown (成本明細) 或 budget breakdown (預算分析)，這在多益閱讀 Part 7 的圖表或發票題中非常常見。"],"forms":["breakdown","breakdowns","breaks down","breaking down","broke down","broken down"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"replacement","pos":"n.","meaning":"更換；替換品","phrase":"replacement equipment","category":"製造與生產","id":"w0539","number":539,"examples":[{"en":"We will send you a replacement tomorrow.","zh":"我們明天會寄給你替換品。"},{"en":"The damaged part needs replacement.","zh":"損壞的零件需要更換。"}],"tips":["常見搭配詞與詞組：'find a replacement for' (尋找...的接替人選/替代品)、'replacement parts' (更換零件)、'permanent/temporary replacement' (永久/臨時替代人選)。"],"forms":["replacement","replacements"],"exampleSource":"Wordstep original examples"},{"word":"upgrade","pos":"n./v.","meaning":"升級；改善","phrase":"upgrade equipment","category":"製造與生產","id":"w0540","number":540,"examples":[{"en":"We can upgrade the equipment next year.","zh":"我們明年可以升級設備。"},{"en":"The IT department will upgrade the company's server software next weekend.","zh":"資訊部門將於下週末升級公司的伺服器軟體。"}],"tips":["常見搭配詞：'software/hardware upgrade' (硬體/軟體升級)、'upgrade to premium membership' (升級為高級會員)。"],"forms":["upgrade","upgrades","upgrading","upgraded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"install","pos":"v.","meaning":"安裝","phrase":"install machinery","category":"製造與生產","id":"w0541","number":541,"examples":[{"en":"The team will install the machine tomorrow.","zh":"團隊明天將安裝機器。"},{"en":"Before using the printer, please install the necessary drivers from the CD-ROM.","zh":"在使用印表機之前，請從 CD-ROM 上安裝必要的驅動程式。"}],"tips":["常見搭配詞與情境：在 TOEIC 考試中，install 常與軟體 (software)、硬體 (hardware)、設備 (equipment) 或系統 (system) 連用。例如：'install a security system' 或 'install the latest updates'。"],"forms":["install","installs","installing","installed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"installation","pos":"n.","meaning":"安裝；裝設","phrase":"equipment installation","category":"製造與生產","id":"w0542","number":542,"examples":[{"en":"Installation is included in the price.","zh":"價格包含安裝費用。"},{"en":"Please ensure the installation process is completed before the system goes live.","zh":"請確保系統正式上線前已完成安裝流程。"}],"tips":["常見搭配詞：包含 'installation fee' (安裝費)、'installation manual' (安裝手冊) 以及 'request an installation' (要求安裝)。"],"forms":["installation","installations","installs","installing","installed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"safety","pos":"n.","meaning":"安全","phrase":"safety standards","category":"製造與生產","id":"w0543","number":543,"examples":[{"en":"Safety is our first priority.","zh":"安全是我們的首要考量。"},{"en":"The company prioritizes employee safety and provides regular training on hazard prevention.","zh":"公司將員工安全放在首位，並提供定期的危害預防培訓。"}],"tips":["常見搭配詞與複合名詞：TOEIC 考試中常出現 safety 組成的固定短語，如 safety regulations (安全規定)、safety inspection (安全檢查)、safety equipment (安全設備) 及 safety procedures (安全程序)，建議整組背誦。"],"forms":["safety","safeties"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hazard","pos":"n.","meaning":"危險；危害","phrase":"safety hazard","category":"製造與生產","id":"w0544","number":544,"examples":[{"en":"The broken cable is a safety hazard.","zh":"損壞的電纜是一項安全隱患。"},{"en":"The department implemented innovative hazard procedures to improve operational efficiency.","zh":"部門實施創新的hazard程序以提高營運效率。"}],"tips":["常見搭配詞：'fire hazard' (火災隱患)、'safety hazard' (安全疑慮) 與 'health hazard' (健康危害) 常出現在工廠規範或辦公室公告。"],"forms":["hazard"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"accident","pos":"n.","meaning":"事故；意外","phrase":"workplace accident","category":"製造與生產","id":"w0545","number":545,"examples":[{"en":"The accident was reported this morning.","zh":"這起事故在今天早上通報了。"},{"en":"Due to a sudden accident on the highway, deliveries will be delayed.","zh":"由於高速公路發生意外事故，貨物交付將會延遲。"}],"tips":["常見搭配詞：最常考的片語是 'by accident'（偶然地），在聽力測驗中常與 'accidentally' 或 'by chance' 互為同義改寫；職場安全情境中常出現 'industrial accident'（工安意外）或 'workplace accident'（職場事故）。"],"forms":["accident","accidents"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"protective","pos":"adj.","meaning":"防護的；保護的","phrase":"protective equipment","category":"製造與生產","id":"w0546","number":546,"examples":[{"en":"Protective clothing is required in this area.","zh":"這個區域要求穿著防護衣物。"},{"en":"Parents are often very protective of their children.","zh":"父母通常對他們的孩子很有保護心。"}],"tips":["常見搭配詞：在 TOEIC 考試中常出現在工廠安全與工地維修情境，固定搭配如 'protective gear' (防護裝備)、'protective clothing' (防護衣物) 與 'protective measures' (保護措施)。"],"forms":["protective","protectively","protection","protector","protect"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"comply","pos":"v.","meaning":"遵守","phrase":"comply with regulations","category":"製造與生產","id":"w0547","number":547,"examples":[{"en":"All workers must comply with the safety rules.","zh":"所有員工都必須遵守安全規則。"},{"en":"All employees are required to comply with the company's safety regulations.","zh":"所有員工都必須遵守公司的安全規定。"}],"tips":["必考搭配介系詞：comply 最常與 with 連用（comply with regulations/rules），這是 Part 5 介系詞填空的高頻考點，請務必記住 comply 之後必接 with。"],"forms":["comply","complies","complying","complied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"compliance","pos":"n.","meaning":"遵守；合規","phrase":"safety compliance","category":"製造與生產","id":"w0548","number":548,"examples":[{"en":"Compliance is checked during the inspection.","zh":"檢查時會確認是否合規。"},{"en":"Department heads discussed the compliance strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了compliance策略。"}],"tips":["常見搭配詞：最常與介系詞 with 連用，形成 \"in compliance with\"（遵守.../符合...）。常見組合還有 \"ensure compliance\"（確保合規）、\"regulatory compliance\"（法律合規）、\"compliance officer\"（合規主管）。"],"forms":["compliance"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"automate","pos":"v.","meaning":"自動化","phrase":"automate production","category":"製造與生產","id":"w0549","number":549,"examples":[{"en":"We can automate this part of the process.","zh":"我們可以將流程中的這個部分自動化。"},{"en":"The company is planning to automate several key processes to improve efficiency.","zh":"公司計劃自動化幾個關鍵流程以提高效率。"}],"tips":["常見搭配詞：'fully automate' (全自動化)、'automate the process' (將流程自動化)、'automated system' (自動化系統)。"],"forms":["automate","automates","automating","automated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"automation","pos":"n.","meaning":"自動化","phrase":"factory automation","category":"製造與生產","id":"w0550","number":550,"examples":[{"en":"Automation can reduce repetitive work.","zh":"自動化可以減少重複性的工作。"},{"en":"The department implemented innovative automation procedures to improve operational efficiency.","zh":"部門實施創新的automation程序以提高營運效率。"}],"tips":["常見搭配詞與組：'factory automation' (工廠自動化)、'process automation' (流程自動化) 及 'office automation' (辦公室自動化)，常用於探討提昇生產力與效率。"],"forms":["automation"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"property","pos":"n.","meaning":"房產；財產","phrase":"commercial property","category":"房地產與設施","id":"w0551","number":551,"examples":[{"en":"The property is available for rent.","zh":"這間房產可以出租。"},{"en":"The company's property portfolio includes several commercial buildings and residential units.","zh":"該公司的資產組合包括多棟商業大樓和住宅單位。"}],"tips":["掌握一詞多義：在 TOEIC 考試中，property 最常見的意思為「房地產」或「資產」(不可數或可數)，但在說明物品特徵的閱讀文章中，則指「特性」或「性質」(可數)。"],"forms":["property","properties"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"real estate","pos":"n.","meaning":"房地產","phrase":"real estate market","category":"房地產與設施","id":"w0552","number":552,"examples":[{"en":"She works for a real estate company.","zh":"她在一家房地產公司工作。"},{"en":"He plans to invest in real estate.","zh":"他計畫投資房地產。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"building","pos":"n.","meaning":"建築物；大樓","phrase":"office building","category":"房地產與設施","id":"w0553","number":553,"examples":[{"en":"The building is across from the station.","zh":"大樓在車站對面。"},{"en":"The company is relocating its headquarters to a new building downtown.","zh":"公司將總部搬遷到市中心的新大樓。"}],"tips":["常見搭配詞：常出現在辦公環境與不動產相關情境中，如 'office building' (辦公大樓)、'building maintenance' (大樓維修) 以及 'building permit' (建築許可證)。"],"forms":["building","buildings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"facility","pos":"n.","meaning":"設施；場所","phrase":"office facility","category":"房地產與設施","id":"w0554","number":554,"examples":[{"en":"The new facility will open next month.","zh":"新設施將於下個月開放。"},{"en":"The company is investing in new facilities to improve production efficiency.","zh":"公司正在投資新的設施以提高生產效率。"}],"tips":["常見搭配詞組：此字常以複合名詞形式出現，如 'manufacturing facility' (生產設施)、'research facility' (研究中心) 或 'sports facilities' (運動設施)。"],"forms":["facility","facilities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"premises","pos":"n.","meaning":"營業場所；建築物範圍","phrase":"business premises","category":"房地產與設施","id":"w0555","number":555,"examples":[{"en":"The premises are closed for renovation.","zh":"營業場所因整修而暫停開放。"},{"en":"Security guards patrol the premises twice daily to ensure employee safety.","zh":"保安人員每天巡邏premises兩次以確保員工安全。"}],"tips":["【型態辨析】在多益考試中，此單字作為「營業場所、廠區、辦公建築及其附屬土地」之意時，幾乎恆用複數形 premises。須注意單數形 premise 意指邏輯上的「前提」，兩者意思完全不同，在 Part 5 詞彙題中需特別留意。"],"forms":["premises"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"site","pos":"n.","meaning":"地點；場址","phrase":"construction site","category":"房地產與設施","id":"w0556","number":556,"examples":[{"en":"Visitors must wear helmets on this site.","zh":"訪客在這個工地必須戴安全帽。"},{"en":"The construction site is currently closed due to safety concerns.","zh":"由於安全顧慮，施工現場目前已關閉。"}],"tips":["常見搭配詞與慣用語：'construction site' (建築工地) 與 'on-site' (現場的/在場的) 是考試高頻詞。例如 'on-site parking' 常出現在公司設施介紹或招募公告中。"],"forms":["site","sites"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"location","pos":"n.","meaning":"地點；位置","phrase":"convenient location","category":"房地產與設施","id":"w0557","number":557,"examples":[{"en":"The location is convenient for commuters.","zh":"這個地點對通勤者很方便。"},{"en":"The warehouse location is crucial for efficient logistics and distribution.","zh":"倉庫的位置對於高效的物流和配送至關重要。"}],"tips":["常見搭配詞：在 TOEIC 閱讀中常出現形容詞修飾語，如 \"prime location\" (黃金地段)、\"convenient location\" (交通便利的地點) 以及 \"central location\" (市中心位置)，多用於商務辦公室或零售店面的描述。"],"forms":["location","locations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"space","pos":"n.","meaning":"空間","phrase":"office space","category":"房地產與設施","id":"w0558","number":558,"examples":[{"en":"There is enough space for two desks.","zh":"這裡有足夠的空間放兩張桌子。"},{"en":"We need more storage space.","zh":"我們需要更多儲物空間。"}],"tips":["常見搭配詞：多益中常以 'office space' (辦公空間)、'parking space' (停車位) 或 'storage space' (儲藏空間) 出現，形容詞常搭配 'adequate' (充足的) 或 'limited' (有限的)。"],"forms":["space","spaces"],"exampleSource":"Wordstep original examples"},{"word":"floor","pos":"n.","meaning":"樓層；地板","phrase":"second floor","category":"房地產與設施","id":"w0559","number":559,"examples":[{"en":"Our office is on the top floor.","zh":"我們的辦公室在頂樓。"},{"en":"The meeting will be held on the fifth floor of the building.","zh":"會議將在建築物的五樓舉行。"}],"tips":["常見搭配詞與商務情境：在 TOEIC 中，floor 常用於建築與零售情境，例如 'floor plan' (樓層平面圖)、'factory floor' (工廠生產區) 或 'sales floor' (賣場)。在會議中，'have the floor' 表示擁有發言權，而 'yield the floor' 則是讓出發言權。"],"forms":["floor","floors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lobby","pos":"n.","meaning":"大廳","phrase":"main lobby","category":"房地產與設施","id":"w0560","number":560,"examples":[{"en":"The lobby is open all day.","zh":"大廳全天開放。"},{"en":"The receptionist will direct visitors to the appropriate department in the lobby.","zh":"接待員會在大廳將訪客引導至相關部門。"}],"tips":["名詞用法與地點辨識：在 TOEIC 聽力第一部分（照片描述）中，'lobby' 常與飯店、辦公大樓入口處的沙發、接待櫃台同時出現。常見搭配為 'meet in the lobby' 或 'wait in the lobby'。"],"forms":["lobby","lobbies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"entrance","pos":"n.","meaning":"入口","phrase":"main entrance","category":"房地產與設施","id":"w0561","number":561,"examples":[{"en":"The main entrance is on the left.","zh":"主要入口在左側。"},{"en":"Security personnel are stationed at each entrance to ensure safety.","zh":"安全人員在每個入口駐守，以確保安全。"}],"tips":["常見搭配詞：常用於 main entrance (正門)、entrance fee (入場費)、entrance exam (入學考試) 等，尤其在 Part 7 關於活動或展覽的閱讀題中，entrance fee 是常見的資訊點。"],"forms":["entrance","entrances"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"exit","pos":"n.","meaning":"出口","phrase":"emergency exit","category":"房地產與設施","id":"w0562","number":562,"examples":[{"en":"The emergency exit is at the end of the hall.","zh":"緊急出口在走廊盡頭。"},{"en":"The company decided to exit the European market due to declining sales.","zh":"由於銷售額下降，公司決定退出歐洲市場。"}],"tips":["常見商務搭配詞：在人力資源情境中，\"exit interview\"（離職面談）是極高頻的詞組，指員工離職前與公司進行的意見回饋面談。"],"forms":["exit","exits","exiting","exited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"elevator","pos":"n.","meaning":"電梯","phrase":"take the elevator","category":"房地產與設施","id":"w0563","number":563,"examples":[{"en":"The elevator is out of service.","zh":"電梯暫停使用。"},{"en":"The elevator is out of service for maintenance; please use the stairs.","zh":"電梯正在維修，請使用樓梯。"}],"tips":["常見搭配詞與短語：'take the elevator'（搭乘電梯）、'out of order'（故障中）、'elevator maintenance'（電梯維修）、'elevator pitch'（簡短的推銷演說）。"],"forms":["elevator","elevators"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"escalator","pos":"n.","meaning":"手扶梯","phrase":"use the escalator","category":"房地產與設施","id":"w0564","number":564,"examples":[{"en":"You can take the escalator to the second floor.","zh":"你可以搭手扶梯到二樓。"},{"en":"Please use the escalator to go to the second floor.","zh":"請搭乘手扶梯前往二樓。"}],"tips":["常見搭配詞：常用 take the escalator (搭乘手扶梯)、on the escalator (在手扶梯上) 或 escalator maintenance (手扶梯維修)。"],"forms":["escalators"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"staircase","pos":"n.","meaning":"樓梯","phrase":"main staircase","category":"房地產與設施","id":"w0565","number":565,"examples":[{"en":"The staircase is beside the elevator.","zh":"樓梯在電梯旁邊。"},{"en":"The building's fire safety regulations require a clearly marked emergency staircase.","zh":"建築物的消防安全規定要求明確標示緊急樓梯。"}],"tips":["在多益聽力測驗第 1 部分（圖片描述）中極常出現，描述詞彙常為 'walking up the staircase' 或 'descending the staircase'，考生需特別留意其與 'ladder'（可移動的梯子）之區別。"],"forms":["staircase","staircases"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"parking","pos":"n.","meaning":"停車；停車位","phrase":"parking space","category":"房地產與設施","id":"w0566","number":566,"examples":[{"en":"Free parking is available behind the hotel.","zh":"飯店後方提供免費停車位。"},{"en":"Where is the nearest parking garage?","zh":"最近的停車場在哪裡？"}],"tips":["常見搭配詞：在多益中常以複合名詞出現，如 parking lot (停車場)、parking garage (室內停車場)、parking permit (停車證) 及 parking fine/ticket (停車罰單)。"],"forms":["parking","parkings","parks","parked"],"exampleSource":"Wordstep original examples"},{"word":"garage","pos":"n.","meaning":"車庫；停車場","phrase":"parking garage","category":"房地產與設施","id":"w0567","number":567,"examples":[{"en":"The garage is open until midnight.","zh":"停車場開放到午夜。"},{"en":"Please park your vehicle in the designated garage area.","zh":"請將您的車輛停放在指定的停車庫區域。"}],"tips":["常見搭配與情境：在多益中常用於 'parking garage' (室內停車場) 或 'auto repair garage' (汽車修理廠)。在 Part 1 照片描述題中，常出現車輛停放在車庫內或技工在車庫工作的場景。"],"forms":["garage","garages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tenant","pos":"n.","meaning":"房客；承租人","phrase":"commercial tenant","category":"房地產與設施","id":"w0568","number":568,"examples":[{"en":"The tenant is moving in next week.","zh":"房客下星期會搬進來。"},{"en":"The landlord is responsible for maintaining the property for his tenants.","zh":"房東有責任維護物業，以保障租戶的權益。"}],"tips":["常見搭配詞：常用於 'prospective tenant' (潛在承租人)、'commercial tenant' (商業租戶) 及 'tenant agreement' (租戶協議)。"],"forms":["tenant","tenants"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"landlord","pos":"n.","meaning":"房東；出租人","phrase":"contact the landlord","category":"房地產與設施","id":"w0569","number":569,"examples":[{"en":"The landlord will arrange the repairs.","zh":"房東將安排修繕。"},{"en":"The landlord is responsible for maintaining the building's structural integrity.","zh":"房東負責維護建築物的結構完整性。"}],"tips":["常見搭配詞：常見搭配包括 contact the landlord (聯絡房東)、landlord-tenant agreement (房東房客協議) 以及 notify the landlord (通知房東)。"],"forms":["landlord","landlords"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"owner","pos":"n.","meaning":"所有人；業主","phrase":"property owner","category":"房地產與設施","id":"w0570","number":570,"examples":[{"en":"The owner is available this afternoon.","zh":"業主今天下午有空。"},{"en":"The owner of the company is responsible for its overall performance.","zh":"公司的老闆對其整體績效負責任。"}],"tips":["常見搭配詞：常用於 'small business owner' (小企業主)、'property owner' (房產所有者) 或 'sole owner' (唯一所有者)，在商務或房地產合約中出現頻率極高。"],"forms":["owner","owners"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lease","pos":"n./v.","meaning":"租約；租用","phrase":"sign a lease","category":"房地產與設施","id":"w0571","number":571,"examples":[{"en":"The lease will end next month.","zh":"租約將於下個月到期。"},{"en":"Before signing the lease, carefully review all the terms and conditions.","zh":"在簽訂租賃合約之前，請仔細審閱所有條款和條件。"}],"tips":["常見搭配詞：'sign a lease' (簽訂租約)、'lease agreement' (租賃協議)、'lease expires' (租約到期) 以及 'renew a lease' (續約)，在閱讀測驗中常出現在契約或辦公室搬遷的情境中。"],"forms":["lease","leases"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"rental","pos":"n./adj.","meaning":"租金；出租的","phrase":"rental property","category":"房地產與設施","id":"w0572","number":572,"examples":[{"en":"The rental fee includes internet access.","zh":"租金包含網路使用費。"},{"en":"The rental agreement specifies that the equipment must be returned within 30 days.","zh":"租賃合約規定設備必須在 30 天內歸還。"}],"tips":["常見搭配詞：'rental agreement' (租賃協議)、'car rental' (租車服務)、'rental property' (租賃房產) 及 'monthly rental' (月租費)。"],"forms":["rental","rentals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"occupancy","pos":"n.","meaning":"入住；使用率","phrase":"occupancy rate","category":"房地產與設施","id":"w0573","number":573,"examples":[{"en":"The occupancy rate is higher this summer.","zh":"今年夏天的入住率比較高。"},{"en":"We need to monitor occupancy levels to optimize pricing strategies.","zh":"我們需要監控入住率以優化定價策略。"}],"tips":["常見搭配詞組：此單字最常出現在飯店業或房地產情境，核心搭配包含 'occupancy rate' (住房率/使用率)、'maximum occupancy' (最大容納人數) 以及 'single occupancy' (單人入住)。"],"forms":["occupancy","occupancies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"occupy","pos":"v.","meaning":"占用；使用","phrase":"occupy office space","c

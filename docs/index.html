<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="一次學一個英文單字。點擊單字與兩句例句聽發音，搭配中文翻譯。">
<title>英文單字練習</title>
<link rel="icon" href="data:,">
<style>
:root { color-scheme: light; font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; color: #222b27; background: #fff; }
* { box-sizing: border-box; }
body { margin: 0; font-size: 16px; line-height: 1.65; }
button, input { font: inherit; }
button { cursor: pointer; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #76a18c; outline-offset: 4px; }
button:disabled { opacity: .35; cursor: default; }
[hidden] { display: none !important; }
.reader { max-width: 620px; margin: 0 auto; padding: 32px 28px 24px; }
.top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid #e8ece9; }
.top h1 { margin: 0; font-size: 17px; font-weight: 500; }
#position { color: #707973; font-size: 14px; font-variant-numeric: tabular-nums; }
.word-section { margin: 34px 0 30px; }
.word-section h2 { margin: 0; }
.read-aloud { display: flex; align-items: center; justify-content: space-between; gap: 18px; width: 100%; min-height: 44px; padding: 4px 0; border: 0; background: none; text-align: left; }
#word { font-size: 46px; font-weight: 650; line-height: 1.25; letter-spacing: -.5px; overflow-wrap: anywhere; }
.sound { display: grid; place-items: center; flex: 0 0 38px; height: 38px; border-radius: 50%; color: #235c48; }
.sound svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.stop-icon { display: none; }
.read-aloud:hover .sound { background: #eef4f0; }
.read-aloud.playing .sound { background: #235c48; color: #fff; }
.read-aloud.playing .speaker-icon { display: none; }
.read-aloud.playing .stop-icon { display: block; }
.meaning-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin: 10px 0 0; }
#pos { color: #707973; font-size: 14px; }
#meaning { font-size: 21px; }
.example { margin: 0 0 25px; }
.example .en { font-size: 21px; line-height: 1.7; }
.example p { margin: 4px 50px 0 0; font-size: 16px; color: #68716c; }
.hide-chinese .zh { visibility: hidden; }
.options { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 28px; color: #68716c; font-size: 14px; }
.options label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
#slow { width: 17px; height: 17px; margin: 0; accent-color: #235c48; }
#hide-chinese { min-height: 44px; padding: 6px 0 6px 12px; border: 0; background: none; color: #68716c; font-size: 14px; }
.navigation { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.navigation button { min-height: 48px; border: 1px solid #dbe2dd; border-radius: 6px; background: #fff; font-size: 16px; }
#next { background: #235c48; color: #fff; border-color: #235c48; }
#next:hover { background: #194a39; }
.message { margin: 14px 0 0; font-size: 14px; color: #91422f; }
footer { margin-top: 32px; font-size: 12px; color: #7a817c; }
footer a { color: inherit; text-underline-offset: 3px; }
@media (max-width: 500px) {
  .reader { padding: 22px 22px 24px; }
  .word-section { margin: 28px 0; }
  #word { font-size: 40px; }
  #meaning { font-size: 20px; }
  .example .en { font-size: 20px; }
  .example { margin-bottom: 24px; }
  .options { margin-top: 22px; }
}
</style>
</head>
<body>
<main class="reader">
  <header class="top"><h1>英文單字</h1><span id="position" aria-live="polite"></span></header>
  <section id="lesson" aria-label="目前單字">
    <div class="word-section">
      <h2><button class="read-aloud" type="button" data-play="word" aria-pressed="false"><span id="word" lang="en"></span><span class="sound" aria-hidden="true"></span></button></h2>
      <p class="meaning-line"><span id="pos"></span><span id="meaning" class="zh"></span></p>
    </div>
    <section class="example" aria-label="例句一">
      <button class="read-aloud" type="button" data-play="example0" aria-pressed="false"><span class="en" lang="en"></span><span class="sound" aria-hidden="true"></span></button>
      <p class="zh"></p>
    </section>
    <section class="example" aria-label="例句二">
      <button class="read-aloud" type="button" data-play="example1" aria-pressed="false"><span class="en" lang="en"></span><span class="sound" aria-hidden="true"></span></button>
      <p class="zh"></p>
    </section>
  </section>
  <div class="options">
    <label><input type="checkbox" id="slow" checked>慢速朗讀</label>
    <button id="hide-chinese" type="button" aria-pressed="false">遮住中文</button>
  </div>
  <nav class="navigation" aria-label="切換單字">
    <button id="previous" type="button">上一個</button>
    <button id="next" type="button">下一個</button>
  </nav>
  <p id="audio-message" class="message" role="status" hidden></p>
  <p id="save-message" class="message" role="status" hidden>目前無法儲存進度，但仍可繼續練習。</p>
  <footer><a href="https://www.david.com.tw/toeic/vocabulary/must-know-words/1000-words/" target="_blank" rel="noopener noreferrer">單字來源</a> · 例句另行編寫</footer>
  <noscript><p>請啟用 JavaScript，才能顯示單字與使用朗讀。</p></noscript>
</main>
<script id="word-data" type="application/json">[
{"id":"meeting","word":"meeting","pos":"n. 名詞","meaning":"會議","examples":[{"en":"The meeting starts at nine.","zh":"會議九點開始。"},{"en":"The meeting was moved to Friday.","zh":"會議被改到星期五。"}]},
{"id":"schedule","word":"schedule","pos":"n. 名詞 / v. 動詞","meaning":"行程表；安排時間","examples":[{"en":"Please check the schedule.","zh":"請查看行程表。"},{"en":"We need to schedule a meeting.","zh":"我們需要安排一場會議。"}]},
{"id":"confirm","word":"confirm","pos":"v. 動詞","meaning":"確認","examples":[{"en":"Can you confirm the time?","zh":"你可以確認時間嗎？"},{"en":"Your booking has been confirmed.","zh":"你的預訂已獲確認。"}]},
{"id":"employee","word":"employee","pos":"n. 名詞","meaning":"員工","examples":[{"en":"The new employee starts on Monday.","zh":"新員工星期一到職。"},{"en":"Every employee will receive an email.","zh":"每位員工都會收到一封電子郵件。"}]},
{"id":"department","word":"department","pos":"n. 名詞","meaning":"部門","examples":[{"en":"She works in the sales department.","zh":"她在業務部工作。"},{"en":"Which department should I contact?","zh":"我應該聯絡哪個部門？"}]},
{"id":"manager","word":"manager","pos":"n. 名詞","meaning":"經理；管理者","examples":[{"en":"The manager is in her office.","zh":"經理在她的辦公室裡。"},{"en":"I would like to speak to the manager.","zh":"我想和經理談一談。"}]},
{"id":"invoice","word":"invoice","pos":"n. 名詞","meaning":"發票；請款單","examples":[{"en":"Please send me the invoice.","zh":"請把請款單寄給我。"},{"en":"The invoice was sent yesterday.","zh":"請款單昨天已寄出。"}]},
{"id":"payment","word":"payment","pos":"n. 名詞","meaning":"付款；款項","examples":[{"en":"We received your payment today.","zh":"我們今天收到你的款項。"},{"en":"Payment is due by Friday.","zh":"最遲必須在星期五付款。"}]},
{"id":"contract","word":"contract","pos":"n. 名詞","meaning":"合約","examples":[{"en":"Please read the contract before signing.","zh":"簽署前請先閱讀合約。"},{"en":"The contract will end next month.","zh":"合約將於下個月到期。"}]},
{"id":"reservation","word":"reservation","pos":"n. 名詞","meaning":"預約；預訂","examples":[{"en":"I have a reservation for two.","zh":"我有一個兩人的訂位。"},{"en":"Can I cancel my reservation?","zh":"我可以取消預訂嗎？"}]},
{"id":"check-in","word":"check-in","pos":"n. 名詞","meaning":"報到；辦理入住","examples":[{"en":"Hotel check-in begins at three.","zh":"飯店下午三點開始辦理入住。"},{"en":"Please go to the check-in desk.","zh":"請前往報到櫃檯。"}]},
{"id":"itinerary","word":"itinerary","pos":"n. 名詞","meaning":"行程表；旅遊行程","examples":[{"en":"Please email me the itinerary.","zh":"請用電子郵件把行程表寄給我。"},{"en":"Our travel itinerary has changed.","zh":"我們的旅行行程已經改變。"}]},
{"id":"submit","word":"submit","pos":"v. 動詞","meaning":"提交；繳交","examples":[{"en":"Please submit your report today.","zh":"請在今天繳交你的報告。"},{"en":"The form was submitted online.","zh":"表格已在線上提交。"}]},
{"id":"receive","word":"receive","pos":"v. 動詞","meaning":"收到；接到","examples":[{"en":"You will receive a reply today.","zh":"你今天會收到回覆。"},{"en":"Did you receive my email?","zh":"你有收到我的電子郵件嗎？"}]},
{"id":"request","word":"request","pos":"n. 名詞 / v. 動詞","meaning":"請求；提出要求","examples":[{"en":"Your request is being reviewed.","zh":"你的請求正在審核中。"},{"en":"You can request a refund online.","zh":"你可以在線上要求退款。"}]},
{"id":"approve","word":"approve","pos":"v. 動詞","meaning":"核准；批准","examples":[{"en":"The manager will approve the request.","zh":"經理將會核准這項請求。"},{"en":"Your request has been approved.","zh":"你的請求已獲核准。"}]}
]</script>
<script>
(() => {
  'use strict';
  const $ = selector => document.querySelector(selector);
  const words = JSON.parse($('#word-data').textContent);
  const key = 'wordstep.preferences.v1';
  let prefs = {};
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '{}');
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) prefs = saved;
  } catch { /* A blocked or damaged store must not prevent learning. */ }
  let index = Math.max(0, words.findIndex(word => word.id === prefs.selected));
  let hidden = prefs.hidden === true;
  let activeId = null;
  $('#slow').checked = typeof prefs.slow === 'boolean' ? prefs.slow : Number(prefs.rate || .75) < 1;
  const synth = window.speechSynthesis || null;
  const icon = '<svg class="speaker-icon" viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><svg class="stop-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>';
  document.querySelectorAll('.sound').forEach(element => { element.innerHTML = icon; });

  function save() {
    Object.assign(prefs, { selected: words[index].id, hidden, slow: $('#slow').checked });
    try { localStorage.setItem(key, JSON.stringify(prefs)); }
    catch { $('#save-message').hidden = false; }
  }
  function settings() {
    const voices = synth ? synth.getVoices() : [];
    const voice = voices.find(v => /^en[-_]us$/i.test(v.lang))
      || voices.find(v => /^en[-_]/i.test(v.lang)) || null;
    return { voice, rate: $('#slow').checked ? .75 : 1 };
  }
  function playback(state, id) {
    activeId = ['waiting', 'playing'].includes(state) ? id : null;
    document.querySelectorAll('[data-play]').forEach(button => {
      const active = button.dataset.play === activeId;
      button.classList.toggle('playing', active);
      button.setAttribute('aria-pressed', String(active));
    });
    const message = $('#audio-message');
    message.hidden = !['unsupported', 'error'].includes(state);
    message.textContent = state === 'unsupported'
      ? '這個瀏覽器不支援朗讀，請改用 Chrome 或 Safari 開啟。'
      : '未能播放，請確認媒體音量與裝置的英文語音，再點一次。';
  }
  const player = createPlayer(synth, window.SpeechSynthesisUtterance, settings, playback);

  function showChinese() {
    $('#lesson').classList.toggle('hide-chinese', hidden);
    $('#hide-chinese').textContent = hidden ? '顯示中文' : '遮住中文';
    $('#hide-chinese').setAttribute('aria-pressed', String(hidden));
    document.querySelectorAll('.zh').forEach(element => element.setAttribute('aria-hidden', String(hidden)));
  }
  function render() {
    player.stop();
    const word = words[index];
    $('#word').textContent = word.word;
    $('#pos').textContent = word.pos;
    $('#meaning').textContent = word.meaning;
    $('[data-play="word"]').setAttribute('aria-label', `朗讀單字 ${word.word}，再點一次停止`);
    document.querySelectorAll('.example').forEach((element, i) => {
      element.querySelector('.en').textContent = word.examples[i].en;
      element.querySelector('.zh').textContent = word.examples[i].zh;
      element.querySelector('button').setAttribute('aria-label', `朗讀例句 ${i + 1}，再點一次停止`);
    });
    $('#position').textContent = `${index + 1} / ${words.length}`;
    $('#previous').disabled = index === 0;
    $('#next').textContent = index === words.length - 1 ? '從頭複習' : '下一個';
    showChinese();
    save();
  }
  function move(delta) {
    index = delta > 0 ? (index + 1) % words.length : Math.max(0, index - 1);
    render();
  }
  $('#previous').addEventListener('click', () => move(-1));
  $('#next').addEventListener('click', () => move(1));
  $('#slow').addEventListener('change', () => { player.stop(); save(); });
  $('#hide-chinese').addEventListener('click', () => { hidden = !hidden; showChinese(); save(); });
  $('#lesson').addEventListener('click', event => {
    const button = event.target.closest('[data-play]');
    if (!button) return;
    const id = button.dataset.play;
    if (id === activeId) { player.stop(); return; }
    const word = words[index];
    const text = id === 'word' ? word.word : word.examples[Number(id.slice(-1))].en;
    player.play([{ id, text }]);
  });
  window.addEventListener('keydown', event => {
    if (event.key === 'Escape') player.stop();
    if (event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      move(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });
  window.addEventListener('pagehide', player.stop);
  document.addEventListener('visibilitychange', () => { if (document.hidden) player.stop(); });
  render();

  // Retain the existing speech player: cancel old playback and ignore late callbacks.
/** Owns the device speech queue. Tokens prevent canceled callbacks changing new playback. */
function createPlayer(synth, Utterance, settings, notify) {
  let token = 0, timer = null, retained = [];
  const clear = () => { clearTimeout(timer); timer = null; };
  function stop() {
    token++; clear(); retained = [];
    if (synth) synth.cancel();
    notify('idle', null);
  }
  function play(items) {
    stop();
    if (!synth || !Utterance) { notify('unsupported', null); return; }
    if (!items.length) return;
    const run = token, config = settings();
    notify('waiting', items[0].id);
    function fail(reason) {
      if (run !== token) return;
      token++; clear(); retained = []; synth.cancel();
      notify('error', null, reason);
    }
    // Some devices expose the API but have no working voice installed.
    timer = setTimeout(() => fail('not-started'), 8000);
    retained = items.map((item, index) => {
      const utterance = new Utterance(item.text);
      utterance.lang = config.voice?.lang || 'en-US';
      utterance.rate = config.rate || .9;
      utterance.pitch = 1;
      if (config.voice) utterance.voice = config.voice;
      utterance.onstart = () => {
        if (run !== token) return;
        clear(); notify('playing', item.id);
        timer = setTimeout(() => fail('timed-out'), Math.max(20000, item.text.length * 300 / utterance.rate));
      };
      utterance.onend = () => {
        if (run !== token) return;
        clear();
        if (index === items.length - 1) { retained = []; notify('done', null); }
        else timer = setTimeout(() => fail('not-started'), 8000);
      };
      utterance.onerror = event => {
        if (run !== token) return;
        fail(event.error || 'unknown');
      };
      return utterance;
    });
    try { retained.forEach(utterance => synth.speak(utterance)); }
    catch (error) { fail(error.message); }
  }
  return {play, stop, destroy: stop};
}
})();
</script>
</body>
</html>

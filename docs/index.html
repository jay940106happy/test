nts to ensure timely delivery.","zh":"物流團隊需要追蹤所有貨物，以確保及時送達。"}],"tips":["常見搭配詞：最常考的是『keep track of』（持續追蹤、掌握...的動態）與『lose track of』（失去聯繫、忘記時間）。在物流情境中，『tracking number』（包裹追蹤號碼）是聽力與閱讀的高頻詞彙。"],"forms":["track","tracks","tracking","tracked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subway","pos":"n.","meaning":"地鐵","phrase":"subway station","category":"交通","id":"w0721","number":721,"examples":[{"en":"The subway is the fastest way to get there.","zh":"搭地鐵是到那裡最快的方式。"},{"en":"The company will reimburse employees for subway fares incurred during business trips within the city.","zh":"公司將報銷員工在城市內出差時產生的地鐵車資。"}],"tips":["常見搭配詞與情境：在 TOEIC 聽力中常出現 'take the subway'（搭地鐵）、'subway station'（地鐵站）或 'subway line'（地鐵線路）。多出現在 Part 1 的交通場景或 Part 3 的通勤討論中。"],"forms":["subway","subways"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bus","pos":"n.","meaning":"公車；巴士","phrase":"take a bus","category":"交通","id":"w0722","number":722,"examples":[{"en":"The bus will arrive in five minutes.","zh":"公車將在五分鐘後到達。"},{"en":"I usually take the bus to work.","zh":"我通常搭公車上班。"}],"tips":["常見搭配詞與複合名詞：多益測驗中頻繁出現 shuttle bus (接駁車)、bus terminal (巴士總站)、bus stop (公車站) 以及 bus fare (車資)。"],"forms":["bus","buses","bussing","bussed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"taxi","pos":"n.","meaning":"計程車","phrase":"take a taxi","category":"交通","id":"w0723","number":723,"examples":[{"en":"A taxi is waiting outside.","zh":"一輛計程車正在外面等候。"},{"en":"The company will reimburse employees for taxi fares incurred during business trips.","zh":"公司將會退償員工在商務旅行中產生的計程車費用。"}],"tips":["常見搭配與片語：熟悉 'hail a taxi' (招計程車)、'take a taxi' (搭計程車) 以及 'taxi stand' 或 'taxi rank' (計程車招呼站) 等用法。"],"forms":["taxi","taxis"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"shuttle","pos":"n.","meaning":"接駁車","phrase":"airport shuttle","category":"交通","id":"w0724","number":724,"examples":[{"en":"The shuttle is free for hotel guests.","zh":"飯店住客可以免費搭乘接駁車。"},{"en":"The hotel offers a complimentary shuttle service to and from the airport.","zh":"飯店提供免費的接駁車服務，往返機場。"}],"tips":["常見搭配詞：'shuttle bus' (接駁巴士)、'airport shuttle' (機場接送服務)、'shuttle service' (接駁服務)。在 Part 7 閱讀中，經常出現在飯店設施介紹或商務會議交通安排。"],"forms":["shuttle","shuttles","shuttling","shuttled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"vehicle","pos":"n.","meaning":"車輛","phrase":"company vehicle","category":"交通","id":"w0725","number":725,"examples":[{"en":"The vehicle is ready for use.","zh":"車輛已準備好可以使用。"},{"en":"Please ensure all vehicles are properly maintained and inspected regularly.","zh":"請確保所有車輛得到妥善維護並定期檢查。"}],"tips":["在多益第一大題（圖片描述）中，'vehicle' 是極高頻的概括詞。當圖片中出現轎車、卡車、小貨車或巴士時，正確選項往往不會指明具體車型，而是以 'vehicle' 統稱，考生需具備由具體轉化為抽象名詞的反應能力。"],"forms":["vehicle","vehicles"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"automobile","pos":"n.","meaning":"汽車","phrase":"automobile industry","category":"交通","id":"w0726","number":726,"examples":[{"en":"The automobile industry is growing.","zh":"汽車產業正在成長。"},{"en":"The company provides employees with a vehicle allowance to cover the cost of their automobiles.","zh":"公司為員工提供車輛津貼，以支付他們汽車的費用。"}],"tips":["同義詞替換技巧：在 TOEIC 考試中，automobile 是 car 的正式代名詞，且常與 vehicle 或 motor vehicle 進行同義替換。若題目提及汽車維修，選項可能會從 car 轉變為 automobile 增加難度。"],"forms":["automobile","automobiles"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"driver","pos":"n.","meaning":"駕駛；司機","phrase":"taxi driver","category":"交通","id":"w0727","number":727,"examples":[{"en":"The driver will meet you at the entrance.","zh":"司機會在入口與你碰面。"},{"en":"The company is looking for experienced truck drivers to handle long-distance deliveries.","zh":"公司正在尋找有經驗的卡車司機來處理長途運輸。"}],"tips":["商業含義擴展：在多益閱讀中除了表示「司機」，常指「驅動力」或「關鍵因素」，如「economic drivers」（經濟驅動力）或「key driver of growth」（增長的主要動力）。"],"forms":["driver","drivers","drives","driving","drove","driven"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"traffic","pos":"n.","meaning":"交通；車流","phrase":"heavy traffic","category":"交通","id":"w0728","number":728,"examples":[{"en":"Traffic is heavy this morning.","zh":"今天早上交通繁忙。"},{"en":"To avoid traffic congestion, we suggest using public transportation during rush hour.","zh":"為了避免交通擁堵，我們建議在尖峰時段使用公共交通工具。"}],"tips":["詞彙搭配與不可數用法：traffic 為不可數名詞，常見搭配為 'heavy traffic' 或 'stuck in traffic'，測驗中常考其不可數特性，不可接複數動詞。"],"forms":["traffic","traffics"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"congestion","pos":"n.","meaning":"壅塞；擁堵","phrase":"traffic congestion","category":"交通","id":"w0729","number":729,"examples":[{"en":"The congestion is causing delays.","zh":"交通壅塞正在造成延誤。"},{"en":"Due to heavy congestion on the highway, the delivery is expected to be delayed.","zh":"由於高速公路交通擁塞，預計貨物交付將會延遲。"}],"tips":["常見搭配詞：'traffic congestion' (交通擁塞) 是最常見的考點，另有 'relieve congestion' (緩解擁擠) 常出現在政府公告或設施改善計畫中。"],"forms":["congestion","congestions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"commute","pos":"n./v.","meaning":"通勤；上下班往返","phrase":"commute to work","category":"交通","id":"w0730","number":730,"examples":[{"en":"My commute is about thirty minutes.","zh":"我的通勤時間大約是三十分鐘。"},{"en":"My daily commute to the office takes about an hour by train.","zh":"我每天早上搭火車通勤到辦公室大約需要一個小時。"}],"tips":["常見搭配詞：'commute to work'（通勤上班）、'daily commute'（每日通勤路程）、'long/short commute'（長/短途通勤）。"],"forms":["commute","commutes","commuting","commuted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"commuter","pos":"n.","meaning":"通勤者","phrase":"daily commuter","category":"交通","id":"w0731","number":731,"examples":[{"en":"Each commuter can use this monthly pass.","zh":"每位通勤者都可以使用這張月票。"},{"en":"The company offers a commuter benefit to help employees with transportation costs.","zh":"公司提供通勤福利，以幫助員工支付交通費用。"}],"tips":["常見搭配詞組：此單字常出現在「commuter train」(通勤列車)、「commuter pass」(定期票/月票) 及「daily commuter」(每日通勤者) 等片語中。"],"forms":["commuter","commuters"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"highway","pos":"n.","meaning":"公路；高速公路","phrase":"major highway","category":"交通","id":"w0732","number":732,"examples":[{"en":"The highway is closed tonight.","zh":"高速公路今晚封閉。"},{"en":"Due to the highway construction, there will be significant delays in deliveries this week.","zh":"由於高速公路施工，本週的貨物交付將會延遲。"}],"tips":["常見搭配詞與情境：'highway exit' (出口)、'highway toll' (過路費) 及 'take the highway'。在 TOEIC 聽力中，常出現在交通報導或物流討論，提到路徑選擇以避開塞車。"],"forms":["highway","highways"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"intersection","pos":"n.","meaning":"十字路口；交叉路口","phrase":"busy intersection","category":"交通","id":"w0733","number":733,"examples":[{"en":"The intersection is just ahead.","zh":"交叉路口就在前方。"},{"en":"Due to road construction, the intersection will be closed to traffic for two days.","zh":"由於道路施工，該路口將在兩天內對交通關閉。"}],"tips":["常見搭配詞：'at the intersection' (在十字路口)、'busy intersection' (繁忙的路口)、'intersection of [Road A] and [Road B]' (A路與B路的交叉口)。"],"forms":["intersection","intersections"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lane","pos":"n.","meaning":"車道","phrase":"traffic lane","category":"交通","id":"w0734","number":734,"examples":[{"en":"This lane is for buses only.","zh":"這條車道僅供公車使用。"},{"en":"The truck driver was fined for changing lanes without signaling.","zh":"卡車司機因未打方向燈變換車道而被罰款。"}],"tips":["常見搭配詞與情境：在 TOEIC 聽力與閱讀中常見 'carpool lane' (共乘車道)、'express lane' (快速車道) 及 'shipping lane' (航線)。在交通報導中，'lane closure' (車道封閉) 是預測交通延遲的重要關鍵字。"],"forms":["lane","lanes"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bridge","pos":"n.","meaning":"橋梁","phrase":"cross a bridge","category":"交通","id":"w0735","number":735,"examples":[{"en":"The bridge is open again.","zh":"橋梁重新開放了。"},{"en":"Good leadership can bridge the differences between team members and foster collaboration.","zh":"良好的領導能力可以彌合團隊成員之間的分歧並促進合作。"}],"tips":["實體與比喻用法辨析：在多益第一部分圖片描述題中，bridge 常指實體的橋樑建築；但在閱讀與商務對話中，多用作動詞意為『彌補』或『連結』。"],"forms":["bridges","bridged","bridging"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tunnel","pos":"n.","meaning":"隧道","phrase":"drive through a tunnel","category":"交通","id":"w0736","number":736,"examples":[{"en":"The tunnel will close at midnight.","zh":"隧道將在午夜關閉。"},{"en":"The train goes through a long tunnel under the mountain.","zh":"火車經過一條穿過山脈的長隧道。"}],"tips":["常見搭配詞與多益第一部分：在聽力測驗的照片描述題中，常出現「A vehicle is driving through a tunnel」或「Pedestrians are entering an underground tunnel」，需熟悉其與交通場景的連結。"],"forms":["tunnels","tunneled","tunneling"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"road","pos":"n.","meaning":"道路","phrase":"road construction","category":"交通","id":"w0737","number":737,"examples":[{"en":"The road is closed for repairs.","zh":"這條道路因維修而封閉。"},{"en":"Take the road on your left.","zh":"走你左邊的那條路。"}],"tips":["常見搭配詞與短語：TOEIC 中常出現 road construction (道路施工)、road closure (道路封閉) 以及 on the road (在旅途中或出差中)。例如業務代表常被描述為 'constantly on the road'。"],"forms":["road","roads"],"exampleSource":"Wordstep original examples"},{"word":"detour","pos":"n.","meaning":"繞道；改道路線","phrase":"take a detour","category":"交通","id":"w0738","number":738,"examples":[{"en":"The detour will add ten minutes to the trip.","zh":"繞道將使行程增加十分鐘。"},{"en":"The GPS system automatically rerouted us to avoid the detour caused by the accident.","zh":"GPS 系統自動將我們導向另一條路線，以避開因事故造成的繞道。"}],"tips":["常見搭配詞：常用動詞為 'take a detour' 或 'make a detour'，表示『繞道』或『繞路』。"],"forms":["detour","detours"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"direction","pos":"n.","meaning":"方向；路線指示","phrase":"ask for directions","category":"交通","id":"w0739","number":739,"examples":[{"en":"Which direction is the station?","zh":"車站在哪個方向？"},{"en":"Please follow the directions on the map.","zh":"請依照地圖上的路線指示行走。"}],"tips":["常見搭配詞：'under the direction of' 指在某人的指導或領導下，常用於描述專案管理或部門運作；'ask for directions' 與 'give directions' 則常用於多益聽力中的問路情境。"],"forms":["direction","directions","directs","directing","directed"],"exampleSource":"Wordstep original examples"},{"word":"map","pos":"n.","meaning":"地圖","phrase":"road map","category":"交通","id":"w0740","number":740,"examples":[{"en":"The map is on the wall.","zh":"地圖在牆上。"},{"en":"The delivery driver used a GPS map to navigate through the city.","zh":"這位送貨員使用 GPS 地圖在城市中導航。"}],"tips":["動詞用法辨析：在多益商業情境中，map 常以動詞片語 map out 出現，意指「詳細規劃」或「擬定計畫」，例如 map out a career path 或 map out a marketing strategy。"],"forms":["map","maps","mapping","mapped"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ticket","pos":"n.","meaning":"票；車票","phrase":"purchase a ticket","category":"交通","id":"w0741","number":741,"examples":[{"en":"Your ticket is valid today.","zh":"你的票今天有效。"},{"en":"Please remember to bring your train ticket when boarding the train.","zh":"請記得在登上火車時攜帶您的火車票。"}],"tips":["常見搭配詞組：包含 'one-way ticket' (單程票)、'round-trip ticket' (來回票)、'parking ticket' (違規停車罰單) 與 'ticket counter/booth' (售票櫃檯/亭)。"],"forms":["ticket","tickets"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"one-way","pos":"adj.","meaning":"單程的","phrase":"one-way ticket","category":"交通","id":"w0742","number":742,"examples":[{"en":"I need a one-way ticket to London.","zh":"我需要一張到倫敦的單程票。"},{"en":"How much is the one-way fare?","zh":"單程票價是多少？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"round-trip","pos":"adj./n.","meaning":"來回的；來回行程","phrase":"round-trip ticket","category":"交通","id":"w0743","number":743,"examples":[{"en":"The round-trip fare is fifty dollars.","zh":"來回票價是五十元。"},{"en":"The company offers a discounted round trip airfare for employees attending the conference.","zh":"公司為參加會議的員工提供環島機票折扣。"}],"tips":["常見搭配詞與形式：最常以 'round-trip ticket' (來回票) 或 'round-trip fare' (來回票價) 出現。當作為形容詞修飾名詞時，通常會加上連字號寫作 'round-trip'。"],"forms":["round trip","round trips"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"toll","pos":"n.","meaning":"通行費","phrase":"pay a toll","category":"交通","id":"w0744","number":744,"examples":[{"en":"The toll is five dollars.","zh":"通行費是五元。"},{"en":"The long-distance call incurred a hefty toll.","zh":"這通長途電話的費用相當高昂。"}],"tips":["常見搭配詞組：'toll booth' (收費站)、'toll road' (收費公路)、'death toll' (傷亡人數)、'take a toll on' (對...造成負面影響)。"],"forms":["toll","tolls","tolling","tolled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fuel","pos":"n.","meaning":"燃料；汽油","phrase":"fuel costs","category":"交通","id":"w0745","number":745,"examples":[{"en":"The vehicle needs more fuel.","zh":"車輛需要更多燃料。"},{"en":"The company is seeking a reliable supplier of low-cost fuel.","zh":"該公司正在尋找一家廉價燃料的可靠供應商。"}],"tips":["詞性多樣性：fuel 可作為名詞指『燃料』，也可作為動詞指『供給燃料』或『刺激/加劇』。在 TOEIC 中，動詞用法常出現在經濟報導，如『fuel economic growth』（刺激經濟成長）。"],"forms":["fuel","fuels","fueling","fueled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"gasoline","pos":"n.","meaning":"汽油","phrase":"gasoline prices","category":"交通","id":"w0746","number":746,"examples":[{"en":"The price of gasoline is rising.","zh":"汽油價格正在上漲。"},{"en":"Due to rising gasoline prices, the logistics department is exploring alternative fuel options.","zh":"由於汽油價格上漲，物流部門正在探索替代燃料選項。"}],"tips":["常見搭配詞與同義詞：在 TOEIC 中，gasoline (美式) 常與 petrol (英式) 互換使用。常見詞組包含 gasoline station (加油站)、gasoline prices (油價) 及 fill up with gasoline (加滿油)。"],"forms":["gasoline","gasolines"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"mileage","pos":"n.","meaning":"里程；行駛里程","phrase":"vehicle mileage","category":"交通","id":"w0747","number":747,"examples":[{"en":"Your mileage is recorded automatically.","zh":"你的行駛里程會自動記錄。"},{"en":"The company offers a reimbursement policy for business mileage.","zh":"公司提供商務里程費用的報銷政策。"}],"tips":["常見於出差報帳情境，常用搭配詞為 'mileage reimbursement' (里程補貼)，這在 Part 6 短文填空或 Part 7 商業書信中經常出現，指員工駕駛私家車執行公務後的費用報支。"],"forms":["mileage","mileages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"navigate","pos":"v.","meaning":"導航；找到路線","phrase":"navigate the route","category":"交通","id":"w0748","number":748,"examples":[{"en":"This app can help you navigate the city.","zh":"這個應用程式可以幫你在市區導航。"},{"en":"The GPS system helps drivers navigate the city streets efficiently.","zh":"GPS 系統能幫助駕駛者有效地導航城市街道。"}],"tips":["商業與數位情境應用：此單字在多益中主要有三種用法：實體導航（交通）、網頁操作（例如：navigate a website）以及處理複雜的流程（例如：navigate a complex regulatory landscape）。"],"forms":["navigate","navigates","navigating","navigated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reroute","pos":"v.","meaning":"改道；重新安排路線","phrase":"reroute traffic","category":"交通","id":"w0749","number":749,"examples":[{"en":"We need to reroute the bus.","zh":"我們需要讓公車改道。"},{"en":"The airline will reroute passengers through Tokyo.","zh":"航空公司將安排乘客改經東京轉機。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"pedestrian","pos":"n.","meaning":"行人","phrase":"pedestrian crossing","category":"交通","id":"w0750","number":750,"examples":[{"en":"A pedestrian is crossing the road.","zh":"一位行人正在過馬路。"},{"en":"The crosswalk is for pedestrians only; vehicles are not allowed.","zh":"人行道僅供行人通行，車輛禁止進入。"}],"tips":["常見搭配詞與場景：在多益中最常作為名詞表示「行人」。常見搭配包括 pedestrian crossing（斑馬線）、pedestrian zone/mall（行人徒步區）以及 pedestrian bridge（天橋）。這些詞彙常出現在 Part 7 的市政公告或交通通知中。"],"forms":["pedestrian","pedestrians"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hotel","pos":"n.","meaning":"飯店；旅館","phrase":"hotel reservation","category":"飯店與住宿","id":"w0751","number":751,"examples":[{"en":"The hotel is near the beach.","zh":"飯店在海灘附近。"},{"en":"Please confirm your hotel reservation and provide your arrival time.","zh":"請確認您的飯店預訂，並提供您的抵達時間。"}],"tips":["常見搭配詞：'hotel reservation' (訂房)、'book a hotel' (預訂飯店)、'hotel amenities' (飯店設施)。"],"forms":["hotel","hotels"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"motel","pos":"n.","meaning":"汽車旅館","phrase":"stay at a motel","category":"飯店與住宿","id":"w0752","number":752,"examples":[{"en":"The motel has free parking.","zh":"這間汽車旅館提供免費停車。"},{"en":"Due to the conference location, many attendees booked rooms at the local motel.","zh":"由於會議地點，許多與會者預訂了當地汽車旅館的房間。"}],"tips":["常見搭配詞：'stay at a motel' (住在汽車旅館)、'book a motel room' (預訂汽車旅館房間)、'motel reservation' (預訂汽車旅館)。"],"forms":["motel","motels"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"resort","pos":"n.","meaning":"度假村","phrase":"beach resort","category":"飯店與住宿","id":"w0753","number":753,"examples":[{"en":"The resort is open all year.","zh":"這間度假村全年營業。"},{"en":"The travel agency offers package deals to popular resorts during the holiday season.","zh":"旅行社在節假日期間提供前往熱門度假勝地的套餐優惠。"}],"tips":["多重詞義與情境辨析：在多益測驗中，resort 常用作名詞指「渡假勝地」(如 beach resort, luxury resort)，頻繁出現在 Part 7 的旅遊廣告或 Part 3 的休閒對話中。"],"forms":["resort","resorts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"guest","pos":"n.","meaning":"房客；賓客","phrase":"hotel guest","category":"飯店與住宿","id":"w0754","number":754,"examples":[{"en":"Every guest can use the pool.","zh":"每位住客都可以使用游泳池。"},{"en":"We expect around fifty guests at the upcoming industry conference.","zh":"我們預計在即將舉行的行業會議上會有大約五十位與會者。"}],"tips":["常見搭配詞：'guest speaker' (客座講員) 常出現在 Part 4 的講座或研討會介紹中；'hotel guest' (飯店住客) 則是 Part 3 與 Part 7 旅遊住宿情境的核心詞彙。"],"forms":["guest","guests"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"room","pos":"n.","meaning":"房間；客房","phrase":"reserve a room","category":"飯店與住宿","id":"w0755","number":755,"examples":[{"en":"Your room is ready.","zh":"你的房間已經準備好了。"},{"en":"There's always room for improvement in customer service.","zh":"客戶服務總是有進步的空間。"}],"tips":["多重字義辨析：在 TOEIC 中，room 不僅指實體的「房間」（可數），也常指「空間」或「餘地」（不可數）。例如 'room for improvement'（改進的空間）或 'standing room only'（僅剩站位）。"],"forms":["rooms","rooming","roomed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"suite","pos":"n.","meaning":"套房","phrase":"hotel suite","category":"飯店與住宿","id":"w0756","number":756,"examples":[{"en":"The suite has a small kitchen.","zh":"套房有一個小廚房。"},{"en":"Our hotel offers luxurious suites with stunning city views.","zh":"我們飯店提供豪華套房，享有迷人的城市景觀。"}],"tips":["語音與拼字辨析：suite 的發音與 sweet 相同 (/swiːt/)，在聽力測驗中極易與 suit (/suːt/，西裝/適合) 混淆。若對話情境涉及飯店設施、辦公室佈置或軟體安裝，通常指 suite。"],"forms":["suite","suites"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"concierge","pos":"n.","meaning":"飯店禮賓人員","phrase":"ask the concierge","category":"飯店與住宿","id":"w0757","number":757,"examples":[{"en":"The concierge can arrange a taxi.","zh":"禮賓人員可以幫忙叫計程車。"},{"en":"Please ask the concierge for recommendations on nearby restaurants.","zh":"請向禮賓員詢問附近餐廳的推薦。"}],"tips":["常見搭配詞：'concierge desk' (禮賓服務台) 與 'concierge services' (禮賓服務)。此單字多出現在多益的住宿、旅遊或商務旅行相關章節中。"],"forms":["concierge","concierges"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"receptionist","pos":"n.","meaning":"櫃檯接待人員","phrase":"hotel receptionist","category":"飯店與住宿","id":"w0758","number":758,"examples":[{"en":"The receptionist is answering the phone.","zh":"櫃檯接待員正在接電話。"},{"en":"The receptionist scheduled the conference room for the meeting at 10 a.m.","zh":"前台接待員已安排會議室於上午 10 點舉行會議。"}],"tips":["常見搭配詞組：'front desk receptionist' (櫃檯接待員)、'medical receptionist' (醫療院所接待員)、'greet visitors' (迎接訪客)。"],"forms":["receptionist","receptionists"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"front desk","pos":"n.","meaning":"飯店櫃檯","phrase":"contact the front desk","category":"飯店與住宿","id":"w0759","number":759,"examples":[{"en":"Please leave your key at the front desk.","zh":"請把鑰匙留在飯店櫃檯。"},{"en":"The front desk is open all night.","zh":"飯店櫃檯整晚都有服務。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"lodging","pos":"n.","meaning":"住宿；住宿處","phrase":"lodging expenses","category":"飯店與住宿","id":"w0760","number":760,"examples":[{"en":"Lodging is included in the travel budget.","zh":"住宿已納入旅行預算。"},{"en":"The company will cover the employee's lodging expenses during the business trip.","zh":"公司將支付員工在商務旅行期間的住宿費用。"}],"tips":["常見搭配詞：'Board and lodging' 指食宿，'lodging expenses' 指住宿費，常出現在差旅報帳或補助申請的情境中。"],"forms":["lodging","lodgings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"check-in","pos":"n.","meaning":"入住登記","phrase":"check-in time","category":"飯店與住宿","id":"w0761","number":761,"examples":[{"en":"Hotel check-in begins at three.","zh":"飯店下午三點開始辦理入住。"},{"en":"Please go to the check-in desk.","zh":"請前往報到櫃檯。"}],"tips":["check-in 有連字號時可當名詞或修飾名詞；動詞片語寫作 check in，例如 check in at the hotel。"],"forms":["check in","checks in","checking in","checked in"],"exampleSource":"Wordstep original examples"},{"word":"check-out","pos":"n.","meaning":"退房","phrase":"check-out time","category":"飯店與住宿","id":"w0762","number":762,"examples":[{"en":"Check-out is at eleven.","zh":"退房時間是十一點。"},{"en":"Please check out these invoices to ensure accuracy before payment.","zh":"請核對這些發票，以確保付款前準確無誤。"}],"tips":["飯店住宿情境：最常用於表示「辦理退房手續」，常伴隨 checkout time (退房時間) 或詢問額外費用。"],"forms":["check out","checks out","checking out","checked out"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"overnight","pos":"adj./adv.","meaning":"過夜的；整夜","phrase":"overnight stay","category":"飯店與住宿","id":"w0763","number":763,"examples":[{"en":"You can leave your car here overnight.","zh":"你可以把車停在這裡過夜。"},{"en":"The project team worked overnight to meet the deadline.","zh":"專案團隊徹夜工作以趕上截止日期。"}],"tips":["常見搭配詞：在物流與辦公室情境中，常出現 overnight shipping 或 overnight delivery（隔夜快遞），旅遊情境中則常用 stay overnight（過夜）。"],"forms":["overnight","more overnight","most overnight"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"stay","pos":"n./v.","meaning":"住宿；停留","phrase":"extend a stay","category":"飯店與住宿","id":"w0764","number":764,"examples":[{"en":"Your stay will include breakfast.","zh":"你的住宿將包含早餐。"},{"en":"We need to stay on schedule to ensure the project is completed by the deadline.","zh":"我們需要按時程進度進行，以確保專案能在期限內完成。"}],"tips":["連結動詞與形容詞搭配：在多益考題中，stay 經常作為連結動詞（linking verb），後方需接形容詞而非副詞，例如 'stay competitive' (保持競爭力) 或 'stay informed' (保持知情)，這是文法題 Part 5 的常見考點。"],"forms":["stay","stays","staying","stayed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"nightly","pos":"adj./adv.","meaning":"每晚的；每晚","phrase":"nightly rate","category":"飯店與住宿","id":"w0765","number":765,"examples":[{"en":"The nightly rate includes breakfast.","zh":"每晚的房價包含早餐。"},{"en":"The hotel provides a shuttle service nightly.","zh":"飯店每晚提供接駁服務。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"single","pos":"adj.","meaning":"單人的","phrase":"single room","category":"飯店與住宿","id":"w0766","number":766,"examples":[{"en":"A single room is available.","zh":"有一間單人房可以預訂。"},{"en":"Please submit a single proposal outlining your company's services.","zh":"請提交一份說明貴公司服務的單一提案。"}],"tips":["旅遊與住宿情境：在多益聽力與閱讀的旅遊主題中，'single room' 指單人房，需注意與 double room (雙人房) 的區別。"],"forms":["single","singler","singles","singling","singled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"double","pos":"adj.","meaning":"雙人的","phrase":"double room","category":"飯店與住宿","id":"w0767","number":767,"examples":[{"en":"The double room has one large bed.","zh":"雙人房有一張大床。"},{"en":"Please double-check the figures before submitting the report.","zh":"請在提交報告前仔細核對數字。"}],"tips":["常見搭配詞與短語：'double' 作為動詞時，常搭配產量、利潤或業績，例如 'double the profits' (利潤翻倍)；作為形容詞時，'double room' (雙人房) 經常出現在旅遊與飯店預約的聽力或閱讀情境中。此外，'double-check' (再三確認) 是多益聽力測驗中極高頻出現的片語。"],"forms":["double","most double"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"adjoining","pos":"adj.","meaning":"相鄰的；相連的","phrase":"adjoining rooms","category":"飯店與住宿","id":"w0768","number":768,"examples":[{"en":"We booked two adjoining rooms.","zh":"我們預訂了兩間相鄰的房間。"},{"en":"Is there a door between the adjoining rooms?","zh":"這兩間相鄰的房間之間有門嗎？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"complimentary","pos":"adj.","meaning":"免費提供的","phrase":"complimentary breakfast","category":"飯店與住宿","id":"w0769","number":769,"examples":[{"en":"Complimentary tea is available in the lobby.","zh":"大廳提供免費的茶。"},{"en":"The hotel offers a complimentary shuttle service to the airport for all guests.","zh":"飯店為所有住客提供免費的機場接駁服務。"}],"tips":["核心含義與替換詞：在多益考試中，此字最常作為『免費贈送的』(free of charge) 使用，而非『讚美的』。在閱讀測驗中，正確選項常會以 'at no cost' 或 'free' 作為同義替換。"],"forms":["complimentary","more complimentary","most complimentary"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"amenity","pos":"n.","meaning":"便利設施；飯店設施","phrase":"hotel amenities","category":"飯店與住宿","id":"w0770","number":770,"examples":[{"en":"The pool is a popular amenity.","zh":"游泳池是很受歡迎的設施。"},{"en":"The hotel boasts a wide range of amenities, including a swimming pool, fitness center, and spa.","zh":"這家飯店提供豐富的便利設施，包括游泳池、健身中心和水療中心。"}],"tips":["常見搭配詞：常以複數形式 'amenities' 出現，例如 'modern amenities' (現代化設施)、'basic amenities' (基本設施)、'hotel amenities' (飯店備品/設施) 與 'recreational amenities' (休閒設施)。"],"forms":["amenity","amenities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"housekeeping","pos":"n.","meaning":"客房清潔服務","phrase":"housekeeping service","category":"飯店與住宿","id":"w0771","number":771,"examples":[{"en":"Housekeeping will clean your room later.","zh":"房務人員稍後會打掃你的房間。"},{"en":"The hotel offers daily housekeeping services to ensure guest satisfaction.","zh":"飯店提供每日客房清潔服務，以確保住客滿意。"}],"tips":["飯店服務場景關鍵字：在多益聽力與閱讀的飯店場景中，housekeeping 專指「房務部」或「客房清潔服務」，常出現於請求毛巾、更換床單或詢問清潔時間的對話中。"],"forms":["housekeeping","housekeepings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"housekeeper","pos":"n.","meaning":"客房清潔人員","phrase":"hotel housekeeper","category":"飯店與住宿","id":"w0772","number":772,"examples":[{"en":"The housekeeper is on the third floor.","zh":"房務人員在三樓。"},{"en":"The hotel housekeeper ensured our room was spotless every day.","zh":"旅館服務員每天都確保我們的房間一塵不染。"}],"tips":["常見搭配詞與部門：在多益考試中，housekeeper 通常指出現在飯店或服務業中的「客房清潔人員」。常見搭配詞包含 housekeeping department (房務部) 或 housekeeping service (房務服務)。"],"forms":["housekeepers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"linen","pos":"n.","meaning":"床單；布巾","phrase":"clean linens","category":"飯店與住宿","id":"w0773","number":773,"examples":[{"en":"Fresh linen is provided every day.","zh":"每天提供乾淨的床單與布巾。"},{"en":"Please put the used linen in this basket.","zh":"請把用過的床單與布巾放進這個籃子。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"towel","pos":"n.","meaning":"毛巾","phrase":"fresh towels","category":"飯店與住宿","id":"w0774","number":774,"examples":[{"en":"An extra towel is in the closet.","zh":"衣櫃裡有一條備用毛巾。"},{"en":"Please hang your wet towel to dry after showering.","zh":"淋浴後請將濕毛巾掛起來晾乾。"}],"tips":["常見搭配詞與情境：在 TOEIC 考試中常出現於飯店、健身房或辦公室設施情境。常見搭配詞包含 'fresh towels' (乾淨的毛巾)、'bath towel' (浴巾) 以及 'paper towel dispenser' (擦手紙分配器)。"],"forms":["towels","toweling","towelling","toweled","towelled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"laundry","pos":"n.","meaning":"洗衣；送洗服務","phrase":"laundry service","category":"飯店與住宿","id":"w0775","number":775,"examples":[{"en":"Laundry service is available today.","zh":"今天有提供洗衣服務。"},{"en":"The hotel offers a convenient laundry service for guests.","zh":"飯店為住客提供便利的洗衣服務。"}],"tips":["常見搭配詞：常用於 'do the laundry' (洗衣服)、'laundry service' (洗衣服務) 與 'laundry detergent' (洗衣精)。在多益考試中，'laundry service' 經常出現在飯店服務 (Hotel Services) 的情境。"],"forms":["laundry","laundries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"minibar","pos":"n.","meaning":"客房迷你吧","phrase":"minibar charges","category":"飯店與住宿","id":"w0776","number":776,"examples":[{"en":"The minibar is inside the cabinet.","zh":"迷你吧在櫃子裡。"},{"en":"The hotel charges a premium for items from the minibar.","zh":"飯店對迷你吧內的商品收取溢價。"}],"tips":["常見搭配詞與費用說明：常見 'complimentary minibar' (免費迷你吧) 或 'minibar charges' (迷你吧消費額)。在多益考試的飯店結帳情境中，常出現關於 minibar 費用的爭議或確認。"],"forms":["minibar","minibars"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"balcony","pos":"n.","meaning":"陽台","phrase":"private balcony","category":"飯店與住宿","id":"w0777","number":777,"examples":[{"en":"Your room has a balcony.","zh":"你的房間有陽台。"},{"en":"The hotel room boasts a spacious balcony with a stunning ocean view.","zh":"這間飯店房間設有寬敞的陽台，享有迷人的海景。"}],"tips":["常見於聽力第一部分（照片描述），常出現的動詞搭配為 overlook（俯瞰），例如：'A balcony overlooks the ocean'。"],"forms":["balcony","balconies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"view","pos":"n.","meaning":"景觀；視野","phrase":"ocean view","category":"飯店與住宿","id":"w0778","number":778,"examples":[{"en":"Our room has a sea view.","zh":"我們的房間可以看到海景。"},{"en":"Can we book a room with a better view?","zh":"我們可以預訂一間景觀更好的房間嗎？"}],"tips":["多義性辨析：在 TOEIC 中 view 可作名詞指『風景』或『觀點』，也可作動詞指『觀看』或『考慮』。Part 1 常出現『viewing the exhibits』（觀看展品）的描述。"],"forms":["view","views","viewing","viewed"],"exampleSource":"Wordstep original examples"},{"word":"pool","pos":"n.","meaning":"游泳池","phrase":"swimming pool","category":"飯店與住宿","id":"w0779","number":779,"examples":[{"en":"The pool closes at nine.","zh":"游泳池九點關閉。"},{"en":"The hotel has a large outdoor pool for guests to enjoy.","zh":"這家酒店設有大型室外游泳池供客人使用。"}],"tips":["多重含義辨析：在多益聽力第一部分照片描述中，'pool' 通常指「游泳池」；但在閱讀測驗（Part 5-7）中，常指「資源、人才的彙集」。"],"forms":["pool","pools","pooling","pooled"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fitness","pos":"n.","meaning":"健身；體能","phrase":"fitness center","category":"飯店與住宿","id":"w0780","number":780,"examples":[{"en":"The fitness center is on the second floor.","zh":"健身中心在二樓。"},{"en":"The company offers wellness programs to improve employee fitness and productivity.","zh":"公司提供健康促進計畫，以提升員工的體能和生產力。"}],"tips":["常見搭配詞組：常用於 'fitness center' (健身中心)、'fitness program' (健身計畫) 或 'physical fitness' (身體健康/體能)。在多益中常出現在描述員工福利或辦公大樓設施的文本中。"],"forms":["fitness","fitnesses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"gym","pos":"n.","meaning":"健身房","phrase":"hotel gym","category":"飯店與住宿","id":"w0781","number":781,"examples":[{"en":"The gym is open early in the morning.","zh":"健身房清晨就開放了。"},{"en":"The company offers employees a subsidized gym membership as part of its wellness program.","zh":"公司將健身房會員資格納入健康計畫，並為員工提供補貼。"}],"tips":["常見搭配詞組：'gym membership' (健身房會員)、'gym facilities' (健身設施)、'sign up for a gym' (報名健身房)。在多益測驗中，常出現在員工福利或設施介紹的情境中。"],"forms":["gym","gyms"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"spa","pos":"n.","meaning":"SPA；水療中心","phrase":"spa facilities","category":"飯店與住宿","id":"w0782","number":782,"examples":[{"en":"The spa is open until ten.","zh":"水療中心營業到十點。"},{"en":"Our hotel features a luxurious spa with a sauna, steam room, and massage services.","zh":"我們的酒店設有豪華水療中心，提供桑拿、蒸汽浴室和按摩服務。"}],"tips":["常見搭配詞：spa resort (水療度假村)、spa treatment (SPA 療程)、spa facilities (SPA 設施)、spa package (SPA 套裝行程)。"],"forms":["spa","spas"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"banquet","pos":"n.","meaning":"宴會","phrase":"banquet room","category":"飯店與住宿","id":"w0783","number":783,"examples":[{"en":"The banquet will begin at seven.","zh":"宴會將於七點開始。"},{"en":"The company organized a banquet to thank its top-performing sales team.","zh":"公司舉辦了一場宴會，以感謝表現最優秀的銷售團隊。"}],"tips":["常見搭配詞：常用於 'host a banquet' (舉辦宴會)、'award banquet' (頒獎晚宴) 及 'charity banquet' (慈善晚宴)。此單字經常與儀式或正式慶祝活動掛鉤。"],"forms":["banquet","banquets","banquetting","banqueted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ballroom","pos":"n.","meaning":"宴會廳；舞廳","phrase":"hotel ballroom","category":"飯店與住宿","id":"w0784","number":784,"examples":[{"en":"The ballroom can hold two hundred people.","zh":"宴會廳可容納兩百人。"},{"en":"They transformed the ballroom into a dazzling conference venue for the annual summit.","zh":"他們將宴會廳改造成一個令人目眩的會議場所，用於年度峰會。"}],"tips":["常見搭配詞：'grand ballroom' (大宴會廳)、'reserve a ballroom' (預訂宴會廳)、'ballroom seating capacity' (宴會廳容納人數)。"],"forms":["ballrooms"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hall","pos":"n.","meaning":"大廳；會場","phrase":"conference hall","category":"飯店與住宿","id":"w0785","number":785,"examples":[{"en":"The hall is at the end of the corridor.","zh":"大廳在走廊盡頭。"},{"en":"Please proceed to the reception hall for registration upon arrival.","zh":"請在抵達時前往接待大廳辦理報到。"}],"tips":["常見搭配詞與情境：在多益中常以 'city hall' (市政府)、'lecture hall' (演講廳) 或 'banquet hall' (宴會廳) 出現，多用於描述會議地點、頒獎典禮或行政中心。"],"forms":["hall","halls"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bellhop","pos":"n.","meaning":"飯店行李員","phrase":"ask a bellhop","category":"飯店與住宿","id":"w0786","number":786,"examples":[{"en":"The bellhop will carry your bags.","zh":"飯店行李員會幫你搬行李。"},{"en":"Please ask the bellhop to call a taxi.","zh":"請飯店行李員幫忙叫計程車。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"keycard","pos":"n.","meaning":"房卡；感應卡","phrase":"room keycard","category":"飯店與住宿","id":"w0787","number":787,"examples":[{"en":"Your keycard opens the room door.","zh":"你的房卡可以打開房門。"},{"en":"My keycard is not working.","zh":"我的房卡無法使用。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"incidental","pos":"n./adj.","meaning":"雜費；附帶的","phrase":"incidental charges","category":"飯店與住宿","id":"w0788","number":788,"examples":[{"en":"Please keep receipts for incidental expenses.","zh":"請保留雜費的收據。"},{"en":"The hotel charges a deposit for incidental costs.","zh":"飯店會收取一筆用於支付雜費的押金。"}],"tips":["最常見的商業搭配詞為『incidental expenses』，意指差旅過程中的雜費或附帶開銷，在 Part 7 的公司核銷政策（Reimbursement Policy）中出現率極高。"],"forms":["incidental","more incidental","most incidental"],"exampleSource":"Wordstep original examples"},{"word":"no-show","pos":"n.","meaning":"未到場；未入住者","phrase":"no-show fee","category":"飯店與住宿","id":"w0789","number":789,"examples":[{"en":"The hotel charges a no-show fee.","zh":"飯店會向預訂卻未入住的人收取費用。"},{"en":"There was one no-show in our group.","zh":"我們這一組有一個人沒有到場。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"preference","pos":"n.","meaning":"偏好","phrase":"room preference","category":"飯店與住宿","id":"w0790","number":790,"examples":[{"en":"Your room preference is noted.","zh":"你的房型偏好已記錄下來。"},{"en":"Our company values employee preferences when designing the office layout.","zh":"我們公司在設計辦公室佈局時重視員工的偏好。"}],"tips":["常見搭配詞：'have a preference for'（偏好...）及 'give preference to'（優先考慮...），在閱讀測驗 Part 5 中常考介係詞 for 的搭配使用。"],"forms":["preference","preferences"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"smoking","pos":"adj./n.","meaning":"吸菸的；吸菸","phrase":"smoking room","category":"飯店與住宿","id":"w0791","number":791,"examples":[{"en":"Smoking is not allowed in the lobby.","zh":"大廳內禁止吸菸。"},{"en":"Is there a smoking area outside?","zh":"外面有吸菸區嗎？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"non-smoking","pos":"adj.","meaning":"禁菸的","phrase":"non-smoking room","category":"飯店與住宿","id":"w0792","number":792,"examples":[{"en":"I would like a non-smoking room.","zh":"我想要一間禁菸房。"},{"en":"All rooms on this floor are non-smoking.","zh":"這一層的所有房間都是禁菸房。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"unavailable","pos":"adj.","meaning":"無法提供的；無空房的","phrase":"rooms are unavailable","category":"飯店與住宿","id":"w0793","number":793,"examples":[{"en":"The suite is unavailable tonight.","zh":"今晚沒有套房可供預訂。"},{"en":"I'm sorry, the conference room is unavailable for booking until next week.","zh":"抱歉，會議室在下週之前無法預訂。"}],"tips":["常見搭配詞組：'currently unavailable' (目前無法提供) 或 'temporarily unavailable' (暫時無法提供) 是考試中最常見的副詞搭配，用於說明服務中斷或產品缺貨。"],"forms":["unavailable","more unavailable","most unavailable"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"occupant","pos":"n.","meaning":"住客；使用者","phrase":"room occupant","category":"飯店與住宿","id":"w0794","number":794,"examples":[{"en":"Each occupant will receive a keycard.","zh":"每位入住者都會收到一張房卡。"},{"en":"The previous occupant left some furniture behind.","zh":"前一位居住者留下了一些家具。"}],"tips":["常見搭配詞與情境：此單字在多益考試中頻繁出現在房地產、保險及交通安全情境，常見用法包括 'vehicle occupant' (車內乘客)、'building occupant' (建築物使用者/住戶) 及 'current occupant' (現任住戶/承租人)。"],"forms":["occupant","occupants"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"guestroom","pos":"n.","meaning":"客房","phrase":"hotel guestroom","category":"飯店與住宿","id":"w0795","number":795,"examples":[{"en":"Each guestroom has a small refrigerator.","zh":"每間客房都有一台小冰箱。"},{"en":"Your guestroom is on the fifth floor.","zh":"你的客房在五樓。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"vacate","pos":"v.","meaning":"騰出；退房離開","phrase":"vacate the room","category":"飯店與住宿","id":"w0796","number":796,"examples":[{"en":"You must vacate the room by noon.","zh":"你必須在中午以前騰空房間。"},{"en":"The company decided to vacate the office space due to downsizing.","zh":"由於裁員，公司決定騰空辦公室空間。"}],"tips":["常見搭配詞：常與 'premises' 連用，如 'vacate the premises' (遷出該場所)，或與職位連用如 'vacate a position/post' (離職)。"],"forms":["vacate","vacates","vacating","vacated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"renew","pos":"v.","meaning":"續訂；更新","phrase":"renew a reservation","category":"飯店與住宿","id":"w0797","number":797,"examples":[{"en":"You can renew your membership online.","zh":"你可以在線上續訂會員資格。"},{"en":"Please renew your membership to continue enjoying exclusive benefits.","zh":"請續訂您的會員資格，以繼續享受獨家優惠。"}],"tips":["常見搭配詞：在 TOEIC 中常與合約、服務或證照連用，如 renew a subscription (續訂)、renew a contract (續約)、renew a membership (續會籍)、renew a driver's license (換發駕照)。"],"forms":["renew","renews","renewing","renewed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"managerial","pos":"adj.","meaning":"管理的；經理職的","phrase":"managerial position","category":"飯店與住宿","id":"w0798","number":798,"examples":[{"en":"The job requires managerial experience.","zh":"這份工作需要管理經驗。"},{"en":"Our managerial staff will review the quarterly performance reports next Monday.","zh":"我們的管理人員將於下週一審查季度績效報告。"}],"tips":["常見搭配詞組：此單字常與職位或能力相關的詞彙結合，如 managerial position (管理職位)、managerial skills (管理技巧)、managerial experience (管理經驗) 及 managerial responsibilities (管理職責)。在閱讀測驗中，若空格後接名詞，應優先考慮填入此形容詞。"],"forms":["managerial","more managerial","most managerial"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"furnish","pos":"v.","meaning":"配置家具；提供設備","phrase":"furnish a room","category":"飯店與住宿","id":"w0799","number":799,"examples":[{"en":"We will furnish the room next week.","zh":"我們下星期會為房間添置家具。"},{"en":"The hotel will furnish each room with a mini-bar and a flat-screen TV.","zh":"飯店將為每間客房配備迷你吧和液晶電視。"}],"tips":["常見搭配詞與句型：最常以 'fully furnished'（配備全套傢俱）的形式出現在租屋或辦公室租賃廣告中。此外，在正式商業書信中，'furnish A with B' 或 'furnish B to A' 表示 '提供/供給某人某物'（如：furnish the committee with the necessary documents）。"],"forms":["furnish","furnishes","furnishing","furnished"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"furnished","pos":"adj.","meaning":"附家具的","phrase":"fully furnished room","category":"飯店與住宿","id":"w0800","number":800,"examples":[{"en":"The apartment is fully furnished.","zh":"這間公寓附有完整家具。"},{"en":"The apartment is fully furnished, so you don't need to buy any furniture.","zh":"這間公寓已完全配備傢俱，所以您不需要再購買任何家具。"}],"tips":["常見搭配詞：'fully furnished'（裝潢與家具齊全）及 'partially furnished'（部分家具），常出現在租屋或辦公室租賃廣告中。"],"forms":["furnished","more furnished","most furnished"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"restaurant","pos":"n.","meaning":"餐廳","phrase":"restaurant reservation","category":"餐飲與服務","id":"w0801","number":801,"examples":[{"en":"The restaurant is open for lunch.","zh":"餐廳午餐時段有營業。"},{"en":"The company is hosting a client dinner at a popular restaurant downtown.","zh":"公司將在市中心一家熱門餐廳為客戶舉辦晚宴。"}],"tips":["常見搭配詞：需掌握 'make a reservation' (訂位)、'fine dining restaurant' (高級餐廳) 與 'casual dining' (平價餐飲)，這些詞彙常出現在 Part 3 的對話中。"],"forms":["restaurant","restaurants"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"café","pos":"n.","meaning":"咖啡館","phrase":"local café","category":"餐飲與服務","id":"w0802","number":802,"examples":[{"en":"The café opens at seven.","zh":"咖啡館七點開門。"},{"en":"Let's meet at the café near the station.","zh":"我們在車站附近的咖啡館見面吧。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"cafeteria","pos":"n.","meaning":"自助餐廳；員工餐廳","phrase":"company cafeteria","category":"餐飲與服務","id":"w0803","number":803,"examples":[{"en":"The cafeteria is on the ground floor.","zh":"自助餐廳在一樓。"},{"en":"Employees are encouraged to bring their own lunch or utilize the company cafeteria.","zh":"員工鼓勵自備午餐或使用公司食堂。"}],"tips":["常見搭配詞與情境：在 TOEIC 考試中，此單字常與公司設施相關聯，常見用法如 company cafeteria（公司食堂）、on-site cafeteria（廠內食堂）或 cafeteria menu（食堂菜單）。"],"forms":["cafeteria","cafeterias"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"patron","pos":"n.","meaning":"顧客；常客","phrase":"restaurant patrons","category":"餐飲與服務","id":"w0804","number":804,"examples":[{"en":"Each patron will receive a free drink.","zh":"每位顧客都會獲得一杯免費飲料。"},{"en":"We appreciate our patrons' continued support and feedback.","zh":"我們感謝顧客持續的支持與回饋。"}],"tips":["常見搭配與情境：在 TOEIC 中，patron 通常指『老顧客』、『贊助人』或『使用者』，常見搭配如 'valued patron' (尊貴的顧客) 或 'library patron' (圖書館使用者)。它常用於正式的商業信函、藝術展覽或飯店公告中。"],"forms":["patron","patrons"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"chef","pos":"n.","meaning":"主廚；廚師","phrase":"head chef","category":"餐飲與服務","id":"w0805","number":805,"examples":[{"en":"The chef is preparing dinner.","zh":"主廚正在準備晚餐。"},{"en":"Our restaurant's chef specializes in authentic Italian cuisine.","zh":"我們餐廳的主廚擅長製作道地的義大利料理。"}],"tips":["常見搭配詞與專業職稱：在 TOEIC 中常出現 'executive chef' (行政主廚)、'sous chef' (副主廚) 或 'pastry chef' (點心主廚)。看到這些搭配詞時，通常與餐飲管理或飯店營運情境相關。"],"forms":["chef","chefs"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cook","pos":"n./v.","meaning":"廚師；烹調","phrase":"cook a meal","category":"餐飲與服務","id":"w0806","number":806,"examples":[{"en":"We can cook dinner together.","zh":"我們可以一起煮晚餐。"},{"en":"The hotel kitchen staff are responsible for cooking meals for all guests.","zh":"飯店廚房人員負責為所有住客烹飪餐點。"}],"tips":["詞性辨析陷阱：需特別注意 cook 作為名詞時是指「廚師」，而 cooker 是指「烹飪器具或爐灶」。TOEIC 聽力測驗中常利用這點設計誘答選項，考生若聽到 cooker 應聯想到電鍋或瓦斯爐而非人物。"],"forms":["cook","cooks","cooking","cooked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"waiter","pos":"n.","meaning":"男服務生","phrase":"ask the waiter","category":"餐飲與服務","id":"w0807","number":807,"examples":[{"en":"The waiter will bring the menu.","zh":"服務生會拿菜單過來。"},{"en":"The waiter promptly brought us water and menus.","zh":"服務生很快就為我們送上了水和菜單。"}],"tips":["常見搭配與同義詞：在多益考試中，waiter (男服務生) 經常與 waitress (女服務生) 共同出現，但近年更傾向使用中性詞彙 server 或 wait staff。常見搭配詞包括 take an order (點餐)、serve the meal (上菜) 及 bring the bill/check (買單)。"],"forms":["waiter","waiters"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reservationist","pos":"n.","meaning":"訂位人員","phrase":"contact a reservationist","category":"餐飲與服務","id":"w0808","number":808,"examples":[{"en":"The reservationist confirmed our table for six.","zh":"訂位人員確認了我們的六人座位。"},{"en":"Please ask the reservationist about available times.","zh":"請向訂位人員詢問可預約的時段。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"takeout","pos":"n./adj.","meaning":"外帶；外帶的","phrase":"takeout order","category":"餐飲與服務","id":"w0809","number":809,"examples":[{"en":"We ordered takeout for lunch.","zh":"我們午餐叫了外帶。"},{"en":"Does this restaurant offer takeout?","zh":"這家餐廳提供外帶嗎？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"menu","pos":"n.","meaning":"菜單","phrase":"view the menu","category":"餐飲與服務","id":"w0810","number":810,"examples":[{"en":"The menu is available in English.","zh":"菜單有英文版本。"},{"en":"Could you please bring me a menu so I can decide what to order?","zh":"您能給我一份菜單，讓我決定要點什麼嗎？"}],"tips":["常見搭配詞與多義性：在餐飲情境中常出現 'tasting menu' (品嚐菜單) 或 'set menu' (套餐)；在科技情境中則指軟體介面的 'drop-down menu' (下拉式選單)。"],"forms":["menu","menus"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dish","pos":"n.","meaning":"菜餚；餐點","phrase":"popular dish","category":"餐飲與服務","id":"w0811","number":811,"examples":[{"en":"This dish is popular with our customers.","zh":"這道菜很受我們顧客歡迎。"},{"en":"Please clear the dishes from the table after the meal.","zh":"用餐完畢後，請將餐盤從桌子上移開。"}],"tips":["多重詞義辨析：在 TOEIC 考試中，dish 同時具備『餐具（盤子）』與『菜餚』兩種含義。在第一部分（照片描述）中，常指實體的盤子或碗（如：Dishes are stacked in the sink）；而在第三、四部分（聽力對話/短文）或第七部分（閱讀），則多指特定的一道菜。"],"forms":["dish","dishes"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"meal","pos":"n.","meaning":"一餐；餐點","phrase":"order a meal","category":"餐飲與服務","id":"w0812","number":812,"examples":[{"en":"Your meal is ready.","zh":"你的餐點已經準備好了。"},{"en":"The company provides employees with a complimentary lunch meal.","zh":"公司為員工提供免費午餐。"}],"tips":["常見搭配詞：'complimentary meal' (贈送的餐點) 常見於航空或飯店情境，'meal voucher' (餐券) 則常出現在旅遊不便賠償或員工福利中。"],"forms":["meal","meals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"breakfast","pos":"n.","meaning":"早餐","phrase":"serve breakfast","category":"餐飲與服務","id":"w0813","number":813,"examples":[{"en":"Breakfast is served at seven.","zh":"早餐七點開始供應。"},{"en":"The hotel offers a complimentary breakfast buffet for all guests.","zh":"飯店為所有住客提供免費的早餐自助餐。"}],"tips":["常見搭配詞：多益中常出現 complementary breakfast (免費早餐) 或 continental breakfast (歐式早餐)，多見於飯店服務設施與預訂確認的閱讀篇章中。"],"forms":["breakfast","breakfasts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lunch","pos":"n.","meaning":"午餐","phrase":"business lunch","category":"餐飲與服務","id":"w0814","number":814,"examples":[{"en":"Lunch is included in the price.","zh":"價格已包含午餐。"},{"en":"The meeting will be adjourned for lunch at 12:30 PM.","zh":"會議將於下午 12:30 暫停午餐。"}],"tips":["常見搭配詞：'Working lunch' 指邊吃邊開會，'Lunch break' 指午休，'Catered lunch' 指由外燴提供的午餐，常出現在公司活動通知。"],"forms":["lunch","lunches"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dinner","pos":"n.","meaning":"晚餐","phrase":"dinner reservation","category":"餐飲與服務","id":"w0815","number":815,"examples":[{"en":"Dinner will be served in the main hall.","zh":"晚餐將在大廳供應。"},{"en":"The company will host a celebratory dinner for the successful project completion.","zh":"公司將為專案成功完成舉辦一場慶祝晚宴。"}],"tips":["常見搭配詞組：'business dinner' (商務晚餐) 是最常見的考點，常與 'host' (舉辦) 或 'attend' (參加) 連用；此外 'dinner reservation' (晚餐預約) 常出現在 Part 3 的對話中。"],"forms":["dinner","dinners"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"beverage","pos":"n.","meaning":"飲料","phrase":"hot beverage","category":"餐飲與服務","id":"w0816","number":816,"examples":[{"en":"A beverage is included with your meal.","zh":"你的餐點附有一杯飲料。"},{"en":"The conference attendees can enjoy complimentary beverages during the networking session.","zh":"會議參與者可以在社交環節享用免費飲品。"}],"tips":["常見搭配詞：包含「complimentary beverage」（免費招待飲料）、「alcoholic/non-alcoholic beverage」（酒精/非酒精飲料）以及「beverage selection」（飲料種類選擇）。"],"forms":["beverage","beverages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"drink","pos":"n./v.","meaning":"飲料；飲用","phrase":"order a drink","category":"餐飲與服務","id":"w0817","number":817,"examples":[{"en":"Your drink is on the counter.","zh":"你的飲料在櫃檯上。"},{"en":"Please drink responsibly and avoid excessive alcohol consumption during the company event.","zh":"請在公司活動中適量飲酒，避免過量飲用。"}],"tips":["常見搭配詞：在多益考試中常以「soft drink」(汽水/無酒精飲料)、「complimentary drink」(贈送的飲料) 或「drink service」(飲料服務) 的形式出現在航空或飯店情境中。"],"forms":["drink","drinks","drinking","drank","drunk"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ingredient","pos":"n.","meaning":"食材；原料","phrase":"fresh ingredients","category":"餐飲與服務","id":"w0818","number":818,"examples":[{"en":"Milk is an ingredient in this dish.","zh":"牛奶是這道菜的食材之一。"},{"en":"The chef carefully selected high-quality ingredients for the new menu.","zh":"主廚小心挑選了高品質的食材，用於新菜單。"}],"tips":["常見搭配詞與多益情境：'natural ingredients' (天然成分)、'key ingredient' (關鍵成分/要素)、'active ingredient' (活性成分)。此單字經常出現在 Part 7 的食品標籤、菜單說明或美容產品廣告中。"],"forms":["ingredient","ingredients"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cuisine","pos":"n.","meaning":"料理；菜系","phrase":"local cuisine","category":"餐飲與服務","id":"w0819","number":819,"examples":[{"en":"The restaurant serves Italian cuisine.","zh":"這間餐廳供應義大利料理。"},{"en":"The restaurant offers a diverse range of international cuisines, including Italian, French, and Japanese.","zh":"這家餐廳提供多種國際料理，包括義大利、法國和日本料理。"}],"tips":["常見搭配詞：常與描述特色的形容詞連用，如 local cuisine (當地料理)、international cuisine (國際美食)、authentic cuisine (道地料理) 或 fine cuisine (精緻餐飲)。"],"forms":["cuisine","cuisines"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"appetizer","pos":"n.","meaning":"開胃菜；前菜","phrase":"order an appetizer","category":"餐飲與服務","id":"w0820","number":820,"examples":[{"en":"The appetizer is a small salad.","zh":"前菜是一小份沙拉。"},{"en":"The restaurant offers a selection of complimentary appetizers to start the meal.","zh":"這家餐廳提供一系列免費開胃菜，以開啟用餐體驗。"}],"tips":["常見搭配詞：包含 'order an appetizer' (點開胃菜) 或 'on the appetizer menu' (在開胃菜菜單上)。"],"forms":["appetizer","appetizers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"entrée","pos":"n.","meaning":"主菜","phrase":"choose an entrée","category":"餐飲與服務","id":"w0821","number":821,"examples":[{"en":"The entrée comes with a salad.","zh":"這道主菜附有沙拉。"},{"en":"Which entrée would you recommend?","zh":"你會推薦哪一道主菜？"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"dessert","pos":"n.","meaning":"甜點","phrase":"dessert menu","category":"餐飲與服務","id":"w0822","number":822,"examples":[{"en":"Dessert is included in the set menu.","zh":"套餐包含甜點。"},{"en":"The hotel offers a wide selection of desserts, including cakes, pastries, and ice cream.","zh":"這家飯店提供多種甜點選擇，包括蛋糕、糕點和冰淇淋。"}],"tips":["拼字與詞義辨析：最常與 'desert' (沙漠/拋棄) 混淆。口訣：'Dessert' 有兩個 's'，因為 'Sweet' 的東西你通常想多要一份 (Double S)；而 'Desert' (沙漠) 只有一個 's'。"],"forms":["dessert","desserts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"portion","pos":"n.","meaning":"份量；一份","phrase":"large portion","category":"餐飲與服務","id":"w0823","number":823,"examples":[{"en":"The portion is large enough to share.","zh":"這份餐點的份量大到可以分食。"},{"en":"The restaurant offers generous portions at reasonable prices.","zh":"這家餐廳提供份量足夠且價格合理的餐點。"}],"tips":["常見搭配詞組：常用於 'a significant portion of' (很大一部分) 或 'be divided into portions' (分成數份)，在商業預算或報告中頻率極高。"],"forms":["portion","portions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"buffet","pos":"n.","meaning":"自助餐","phrase":"breakfast buffet","category":"餐飲與服務","id":"w0824","number":824,"examples":[{"en":"The buffet is open until ten.","zh":"自助餐供應到十點。"},{"en":"The conference fee includes access to a daily buffet breakfast.","zh":"會議費用包含每日自助早餐的供應。"}],"tips":["常見搭配詞與情境：在 TOEIC 考試中，「buffet」常出現在飯店、會議或旅遊情境中，常見詞組如「buffet breakfast」（自助早餐）、「all-you-can-eat buffet」（吃到飽自助餐）及「buffet lunch」（自助午餐）。"],"forms":["buffet","buffets"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"catering","pos":"n.","meaning":"外燴；餐飲服務","phrase":"catering service","category":"餐飲與服務","id":"w0825","number":825,"examples":[{"en":"We need catering for fifty people.","zh":"我們需要五十人份的外燴餐飲。"},{"en":"The catering service will arrive at noon.","zh":"外燴服務人員將在中午到達。"}],"tips":[],"forms":[],"exampleSource":"Wordstep original examples"},{"word":"cater","pos":"v.","meaning":"承辦餐飲；供應餐點","phrase":"cater an event","category":"餐飲與服務","id":"w0826","number":826,"examples":[{"en":"Our restaurant can cater for large groups.","zh":"我們的餐廳可以為大型團體供餐。"},{"en":"The catering company caters for large events, providing food and beverage services.","zh":"這家餐飲公司為大型活動提供服務，提供食物和飲料。"}],"tips":["常見搭配詞組：最常以動詞片語 'cater to' 的形式出現，意指「滿足...的需求」或「迎合...」，例如 cater to the needs of customers (滿足客戶需求) 或 cater to a specific market (迎合特定市場)。"],"forms":["cater","caters","catering","catered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"seating","pos":"n.","meaning":"座位；座位安排","phrase":"seating arrangement","category":"餐飲與服務","id":"w0827","number":827,"examples":[{"en":"Outdoor seating is available.","zh":"有戶外座位可以使用。"},{"en":"The conference venue offers flexible seating arrangements to accommodate different group sizes.","zh":"會議場地提供彈性的座位安排，以容納不同大小的團體。"}],"tips":["常見搭配詞：'seating capacity'（座位數/容納人數）、'seating arrangement'（座位安排）、'ample seating'（充足的座位）。"],"forms":["seating","seatings"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"table","pos":"n.","meaning":"餐桌；桌位","phrase":"reserve a table","category":"餐飲與服務","id":"w0828","number":828,"examples":[{"en":"Your table is ready.","zh":"你的桌位已經準備好了。"},{"en":"Please place the report on the conference table.","zh":"請把報告放在會議桌上。"}],"tips":["動詞用法的多義性：在多益考試中，table 除名詞「桌子」外，常作動詞。英式用法通常指「提出（提案、討論）」，美式用法則常指「擱置、延期」。在商業會議情境中需根據語境判斷提案是正在討論還是被延後。"],"forms":["tables","tabled","tabling"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"counter","pos":"n.","meaning":"櫃檯；吧台","phrase":"service counter","category":"餐飲與服務","id":"w0829","number":829,"examples":[{"en":"You can pay at the counter.","zh":"你可以在櫃檯付款。"},{"en":"The receptionist is stationed at the front counter to greet visitors.","zh":"接待員位於前台接待訪客。"}],"tips":["在Part 1照片描述題中，常指出現在商店、機場或廚房的「櫃檯」或「長檯面」，例如：'A customer is leaning on the counter' 或 'The counter is being wiped'。"],"forms":["counter","counters","countering","countered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dine","pos":"v.","meaning":"用餐","phrase":"dine at a restaurant","category":"餐飲與服務","id":"w0830","number":830,"examples":[{"en":"You can dine on the terrace.","zh":"你可以在露臺用餐。"},{"en":"Clients are invited to dine with us to discuss potential business collaborations.","zh":"客戶受邀與我們共進晚餐，以討論潛在的商業合作。"}],"tips":["常見搭配詞與慣用語：'fine dining' (高級餐飲) 常出現在商務接待或旅遊行程描述中，'dining area' (用餐區) 則常見於公司設施說明。"],"forms":["dine","dines","dining","dined"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"specialize","pos":"v.","meaning":"專門提供；專精於","phrase":"specialize in seafood","category":"餐飲與服務","id":"w0831","number":831,"examples":[{"en":"Our chefs specialize in seafood.","zh":"我們的廚師專精於海鮮料理。"},{"en":"Our company specializes in providing IT solutions for small businesses.","zh":"我們公司專注於為小型企業提供 IT 解決方案。"}],"tips":["固定搭配介係詞 'in'：在 TOEIC Part 5 詞彙或語法題中，specialize 後接介係詞 in 是極高頻的考點，例如 'specialize in marketing'。"],"forms":["specialize","specializes","specializing","specialized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"selection","pos":"n.","meaning":"選擇；精選品項","phrase":"wide selection","category":"餐飲與服務","id":"w0832","number":832,"examples":[{"en":"The selection of desserts is excellent.","zh":"甜點的選擇很豐富而且品質很好。"},{"en":"After careful consideration, the committee made its selection for the project leader.","zh":"經過仔細考慮，委員會選出了專案負責人。"}],"tips":["常見搭配詞：'a wide selection of' (多樣化的選擇)、'an extensive selection of' (種類繁多的選擇)，常用於零售、餐廳或產品目錄廣告。"],"forms":["selection","selections","selects","selecting","selected"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"seasonal","pos":"adj.","meaning":"季節性的；當季的","phrase":"seasonal menu","category":"餐飲與服務","id":"w0833","number":833,"examples":[{"en":"Seasonal vegetables are on the menu.","zh":"菜單上有當季蔬菜。"},{"en":"The company offers seasonal promotions to attract customers during holidays.","zh":"公司在節假日期間提供季節性促銷活動以吸引顧客。"}],"tips":["常見搭配詞：在 TOEIC 閱讀中常與職場或零售相關詞彙連用，例如 'seasonal workers' (季節性員工)、'seasonal variations' (季節性變動)、'seasonal menu' (時令菜單)。"],"forms":["seasonal","more seasonal","most seasonal"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fresh","pos":"adj.","meaning":"新鮮的","phrase":"fresh produce","category":"餐飲與服務","id":"w0834","number":834,"examples":[{"en":"The bread is fresh.","zh":"麵包很新鮮。"},{"en":"The company is looking for fresh ideas to revitalize its marketing strategy.","zh":"公司正在尋找新的點子來重振其行銷策略。"}],"tips":["常見搭配詞與情境：在 TOEIC 中 'fresh perspective' (新觀點) 或 'fresh approach' (新方法) 常出現在會議或人資討論中。"],"forms":["fresh","fresher","freshest"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"delicious","pos":"adj.","meaning":"美味的","phrase":"delicious meal","category":"餐飲與服務","id":"w0835","number":835,"examples":[{"en":"The soup is delicious.","zh":"湯很好喝。"},{"en":"The new menu items received many compliments for being delicious, which helped increase the restaurant's sales.","zh":"新菜單項目因美味而受到許多讚賞，進而提升了餐廳的銷售額。"}],"tips":["常見搭配詞與情境：在多益考試中，delicious 常與 meal, food, recipe 或 aroma 搭配。常用於聽力測驗的餐廳預約、外燴服務 (catering services) 或旅遊評論的情境中。"],"forms":["delicious","more delicious","most delicious"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"specialty","pos":"n.","meaning":"特色菜；專長","phrase":"house specialty","category":"餐飲與服務","id":"w0836","number":836,"examples":[{"en":"This fish dish is our specialty.","zh":"這道魚料理是我們的特色菜。"},{"en":"Our company's specialty is providing customized software solutions for small businesses.","zh":"我們公司的專長是為小型企業提供客製化的軟體解決方案。"}],"tips":["常見搭配詞與情境：在 TOEIC 閱讀 Part 7 中常出現 'specialty shop' (專賣店) 或 'specialty items' (特色商品)；在餐飲情境則指 'house specialty' (招牌菜)。"],"forms":["specialty","specialties"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tip","pos":"n./v.","meaning":"小費；給小費","phrase":"leave a tip","category":"餐飲與服務","id":"w0837","number":837,"examples":[{"en":"The tip is included in the bill.","zh":"帳單已包含小費。"},{"en":"She gave me a useful tip for the interview, which really helped me prepare.","zh":"她給了我一個面試的實用建議，這真的幫助我做了準備。"}],"tips":["多義性辨析：在多益考試中 'tip' 主要有兩大含義。第一是『小費』(gratuity)，常用於餐飲、飯店服務或出差報銷的情境（Part 7 閱讀常見）；第二是『實用建議或祕訣』(piece of advice/hint)，常出現在專家講座、職場指南或廣播中（Part 3/4 聽力常見）。"],"forms":["tips","tipping","tipped"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"tab","pos":"n.","meaning":"帳單；未結帳款","phrase":"pay the tab","category":"餐飲與服務","id":"w0838","number":838,"examples":[{"en":"Your drinks are on the tab.","zh":"你的飲料已記在帳上。"},{"en":"Click on the 'Pricing' tab to view our different service packages.","zh":"點擊「價格」標籤，即可查看我們的不同服務方案。"}],"tips":["常見搭配詞與商業用法：『pick up the tab』在多益聽力與閱讀中經常出現，意指『買單』或『支付帳款』，常出現在商務晚餐或差旅報銷的情境；『keep tabs on』則表示『密切監控』或『追蹤進度』，常用於管理層監督專案。"],"forms":["tab","tabs"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"courtesy","pos":"n.","meaning":"禮貌；禮遇","phrase":"professional courtesy","category":"餐飲與服務","id":"w0839","number":839,"examples":[{"en":"Guests are treated with courtesy.","zh":"工作人員對待客人很有禮貌。"},{"en":"Showing courtesy to clients is essential for maintaining a positive business relationship.","zh":"對客戶展現禮貌對於維持良好的商業關係至關重要。"}],"tips":["常見搭配詞與固定用法：'courtesy of' 表示『由...提供』或『承蒙...的授權』，常用於標明圖片或贊助來源；'courtesy shuttle/bus' 指的是飯店或機場提供的『免費接駁車』。"],"forms":["courtesy","courtesies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"courteous","pos":"adj.","meaning":"有禮貌的","phrase":"courteous service","category":"餐飲與服務","id":"w0840","number":840,"examples":[{"en":"The staff are courteous.","zh":"工作人員很有禮貌。"},{"en":"The receptionist was very courteous and helpful to the visiting clients.","zh":"接待員對拜訪的客戶非常彬彬有禮且樂於助人。"}],"tips":["常見搭配詞組：'courteous service' (有禮貌的服務)、'courteous staff' (彬彬有禮的員工) 與 'in a courteous manner' (以有禮貌的方式)，這些詞組頻繁出現在顧客評價或員工考核中。"],"forms":["courteous","more courteous","most courteous"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"prompt","pos":"adj.","meaning":"迅速的；即時的","phrase":"prompt service","category":"餐飲與服務","id":"w0841","number":841,"examples":[{"en":"A prompt reply is important.","zh":"迅速回覆很重要。"},{"en":"The software prompts the user to enter their password.","zh":"軟體會提示使用者輸入密碼。"}],"tips":["詞性與詞義多樣性：在多益中，prompt 常作為形容詞，表示「迅速的」或「即時的」，例如 'prompt reply' (即時回覆) 或 'prompt payment' (即時付款)，在商業書信中極為常見。"],"forms":["prompt","prompts","prompting","prompted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"solution","pos":"n.","meaning":"解決方案","phrase":"offer a solution","category":"餐飲與服務","id":"w0842","number":842,"examples":[{"en":"We can find a solution together.","zh":"我們可以一起找到解決方案。"},{"en":"Our team is working on a cost-effective solution to reduce operational expenses.","zh":"我們的團隊正在努力尋找一種具成本效益的解決方案來降低營運費用。"}],"tips":["常見搭配詞與介系詞：考生需特別注意 solution 固定搭配介系詞 to，例如 'a solution to the problem'（問題的解決方法），考試中常會用 of 作為誘答選項。常見動詞搭配包括 provide, find, implement 或 propose a solution。"],"forms":["solution","solutions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cleanliness","pos":"n.","meaning":"清潔；整潔","phrase":"maintain cleanliness","category":"餐飲與服務","id":"w0843","number":843,"examples":[{"en":"Cleanliness is important in a restaurant.","zh":"清潔對餐廳很重要。"},{"en":"Maintaining a high level of cleanliness is crucial for the hotel's reputation.","zh":"維持高標準的整潔度對飯店的聲譽至關重要。"}],"tips":["常見搭配詞：'Maintain cleanliness' (維持整潔)、'Standards of cleanliness' (清潔標準)、'Hygiene and cleanliness' (衛生與清潔)。"],"forms":["cleanliness","cleanlinesses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"sanitary","pos":"adj.","meaning":"衛生的","phrase":"sanitary conditions","category":"餐飲與服務","id":"w0844","number":844,"examples":[{"en":"The kitchen must be kept sanitary.","zh":"廚房必須維持衛生。"},{"en":"The factory must adhere to sanitary regulations to prevent contamination of the product.","zh":"工廠必須遵守衛生法規，以防止產品受到污染。"}],"tips":["常見搭配詞與詞組：此單字經常修飾設施、狀況或檢查員，常見搭配如 sanitary facilities (衛生設施)、sanitary conditions (衛生狀況)、sanitary standards (衛生標準) 及 sanitary inspector (衛生檢查員)。"],"forms":["sanitary","sanitarier","sanitariest"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hygiene","pos":"n.","meaning":"衛生","phrase":"food hygiene","category":"餐飲與服務","id":"w0845","number":845,"examples":[{"en":"Good hygiene is important when preparing food.","zh":"準備食物時，良好的衛生習慣很重要。"},{"en":"The company implemented strict hygiene protocols in the office to ensure employee safety.","zh":"公司在辦公室實施了嚴格的衛生協議，以確保員工的安全。"}],"tips":["常見搭配詞與短語：'personal hygiene' (個人衛生)、'food hygiene' (食品衛生)、'maintain strict hygiene standards' (維持嚴格的衛生標準) 以及 'hygiene practices' (衛生習慣)，在職安與餐飲情境中極為常見。"],"forms":["hygiene"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dietary","pos":"adj.","meaning":"飲食的","phrase":"dietary requirements","category":"餐飲與服務","id":"w0846","number":846,"examples":[{"en":"Your dietary needs are noted.","zh":"你的飲食需求已經記錄下來。"},{"en":"The company is conducting research on the impact of dietary changes on employee productivity.","zh":"公司正在研究飲食改變對員工生產力的影響。"}],"tips":["常見搭配詞組：'dietary restrictions' (飲食限制) 與 'dietary requirements' (飲食需求) 是最常出現的組合，通常出現在活動報名表或 RSVP 中。"],"forms":["dietary","more dietary","most dietary"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"vegetarian","pos":"n./adj.","meaning":"素食者；素食的","phrase":"vegetarian option","category":"餐飲與服務","id":"w0847","number":847,"examples":[{"en":"A vegetarian option is available.","zh":"有素食餐點可以選擇。"},{"en":"During the conference, please note that many attendees are vegetarians and require plant-based meals.","zh":"請注意，在會議期間，許多與會者都是素食者，需要植物性餐點。"}],"tips":["常見搭配詞與情境：此單字頻繁出現在 TOEIC 的『餐飲服務』與『商務會議』情境中。常見詞組如 'vegetarian option' (素食選項)、'vegetarian meal' (素食餐點) 或 'vegetarian diet' (素食飲食)。在商務旅遊中，訂購機票時常會涉及 'special meal request'。"],"forms":["vegetarian","vegetarians"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"allergy","pos":"n.","meaning":"過敏；過敏症","phrase":"food allergy","category":"餐飲與服務","id":"w0848","number":848,"examples":[{"en":"Your food allergy is listed on the form.","zh":"表格上已列出你的食物過敏資訊。"},{"en":"Please inform the catering service of any food allergies among the attendees before the conference.","zh":"請在會議前告知餐飲服務供應商與會者中是否有任何食物過敏。"}],"tips":["常見搭配詞與句型：'have an allergy to' (對...過敏)、'food allergy' (食物過敏)、'allergic reaction' (過敏反應)。"],"forms":["allergy","allergies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"customize","pos":"v.","meaning":"客製化；依需求調整","phrase":"customize an order","category":"餐飲與服務","id":"w0849","number":849,"examples":[{"en":"We can customize the menu for your group.","zh":"我們可以為你的團體調整菜單。"},{"en":"We offer a range of options to customize the product to meet individual customer preferences.","zh":"我們提供一系列選項，以客製化產品以滿足個別客戶的偏好。"}],"tips":["常見搭配詞與用法：'customized service' (客製化服務)、'fully customized' (完全客製化的) 以及 'customizable features' (可自訂的功能)。"],"forms":["customize","customizes","customizing","customized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"consume","pos":"v.","meaning":"食用；消費","phrase":"consume food","category":"餐飲與服務","id":"w0850","number":850,"examples":[{"en":"Please consume this meal within two hours.","zh":"請在兩小時內食用這份餐點。"},{"en":"These machines consume less electricity.","zh":"這些機器消耗的電力較少。"}],"tips":["常見搭配詞組：'time-consuming' (耗時的) 是 Part 5 與 Part 6 的高頻形容詞，常形容繁瑣的工作流程；'consume energy/fuel' 常見於關於環境保護或製造業成本的閱讀文章。"],"forms":["consume","consumes","consuming","consumed"],"exampleSource":"Wordstep original examples"},{"word":"event","pos":"n.","meaning":"活動；事件","phrase":"special event","category":"活動與娛樂","id":"w0851","number":851,"examples":[{"en":"The event will begin at six.","zh":"活動將在六點開始。"},{"en":"Due to unforeseen circumstances, the annual sales event has been postponed until further notice.","zh":"由於突發狀況，年度銷售活動已延遲至另行通知。"}],"tips":["常見搭配詞：包括 'upcoming event' (即將舉行的活動)、'corporate event' (公司活動)、'promotional event' (促銷活動)；動詞常搭配 'host', 'organize' 或 'attend'。"],"forms":["event","events"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"entertainment","pos":"n.","meaning":"娛樂；表演活動","phrase":"entertainment program","category":"活動與娛樂","id":"w0852","number":852,"examples":[{"en":"Live entertainment is included in the price.","zh":"價格已包含現場表演。"},{"en":"The company allocated a budget for client entertainment during the annual conference.","zh":"公司在年度會議期間為客戶娛樂預算撥款。"}],"tips":["常見搭配詞與專業術語：'entertainment industry'（娛樂產業）、'corporate entertainment'（商務招待/酬應）、'live entertainment'（現場表演）。特別注意 'entertainment expenses' 在企業會計情境中指『交際費』或『招待費』。"],"forms":["entertainment","entertainments","entertains","entertaining","entertained","more entertaining","most entertaining"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ceremony","pos":"n.","meaning":"典禮；儀式","phrase":"opening ceremony","category":"活動與娛樂","id":"w0853","number":853,"examples":[{"en":"The ceremony will take place outside.","zh":"典禮將在戶外舉行。"},{"en":"The award ceremony recognized the team's outstanding performance.","zh":"頒獎典禮表彰了團隊的傑出表現。"}],"tips":["常見搭配詞組：'awards ceremony' (頒獎典禮)、'opening ceremony' (開幕典禮)、'signing ceremony' (簽約儀式) 及 'ribbon-cutting ceremony' (剪綵儀式)。"],"forms":["ceremony","ceremonies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"celebration","pos":"n.","meaning":"慶祝活動","phrase":"anniversary celebration","category":"活動與娛樂","id":"w0854","number":854,"examples":[{"en":"The celebration is planned for Friday.","zh":"慶祝活動安排在星期五。"},{"en":"We're offering special discounts as part of our year-end celebration.","zh":"作為我們年末慶祝活動的一部分，我們提供特別折扣。"}],"tips":["常見搭配詞：常與動詞 hold, host, organize 連用，例如 'hold a celebration' (舉辦慶祝活動)，或組成複合名詞如 'anniversary celebration' (週年慶祝) 及 'retirement celebration' (退休慶祝)。"],"forms":["celebration","celebrations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"festival","pos":"n.","meaning":"節慶；節日活動","phrase":"annual festival","category":"活動與娛樂","id":"w0855","number":855,"examples":[{"en":"The festival will last three days.","zh":"節慶活動將持續三天。"},{"en":"Our company will set up a promotional booth at the upcoming music festival to increase brand awareness.","zh":"我們公司將在即將舉行的音樂節設置促銷攤位，以提升品牌知名度。"}],"tips":["常見搭配詞組：常用於 annual festival (年度節慶)、music/film festival (音樂/電影節) 以及 food festival (美食節)。在多益閱讀中，annual 常作為關鍵字暗示活動的循環性質。"],"forms":["festival","festivals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"exhibition","pos":"n.","meaning":"展覽；展覽會","phrase":"art exhibition","category":"活動與娛樂","id":"w0856","number":856,"examples":[{"en":"The exhibition is open to the public.","zh":"展覽對大眾開放。"},{"en":"The company will participate in an international exhibition to showcase its latest products.","zh":"該公司將參加國際展覽，展示其最新產品。"}],"tips":["常見搭配詞：'hold an exhibition' (舉辦展覽)、'art exhibition' (藝術展)、'exhibition hall' (展覽館)。"],"forms":["exhibition","exhibitions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"issue","pos":"n./v.","meaning":"問題；發布","phrase":"address an issue","category":"活動與娛樂","id":"w0857","number":857,"examples":[{"en":"We will discuss the issue tomorrow.","zh":"我們明天會討論這個問題。"},{"en":"The company issued a press release to clarify the recent controversy.","zh":"公司發布新聞稿以澄清最近的爭議。"}],"tips":["一字多義的掌握：issue 在多益中具備名詞與動詞雙重身分。名詞除了指「問題或爭議」(problem/matter) 外，最常考的是「期刊的期、號」(如 current issue 意指當期雜誌)；動詞則代表「核發、發布」(如 issue a refund 或 issue a badge)。"],"forms":["issue","issues","issuing","issued"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"fair","pos":"n.","meaning":"展覽會；博覽會","phrase":"trade fair","category":"活動與娛樂","id":"w0858","number":858,"examples":[{"en":"The book fair is held every year.","zh":"書展每年都會舉行。"},{"en":"The annual trade fair attracts numerous potential buyers and sellers.","zh":"年度貿易展覽吸引了眾多潛在的買家和賣家。"}],"tips":["多義詞辨析：在多益考試中 fair 常以名詞形式出現，指「博覽會」或「市集」，常見如 job fair (就業博覽會) 或 trade fair (貿易展)；亦可作為形容詞表示「公平的」或「合理的」。"],"forms":["fair","fairer","fairest","fairs"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"gathering","pos":"n.","meaning":"聚會；集會","phrase":"social gathering","category":"活動與娛樂","id":"w0859","number":859,"examples":[{"en":"The gathering will be held in the park.","zh":"聚會將在公園舉行。"},{"en":"Due to the pandemic, the annual shareholder gathering was held virtually this year.","zh":"由於疫情影響，今年的股東集會以線上方式舉行。"}],"tips":["常見搭配詞組：常用於社交或非正式場合，如 'social gathering' (社交聚會)、'informal gathering' (非正式集會)；在資料處理情境則常用 'gathering data/information' (收集資料)。"],"forms":["gathering","gatherings","gathers","gathered"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"lecture","pos":"n.","meaning":"講座；演講","phrase":"attend a lecture","category":"活動與娛樂","id":"w0860","number":860,"examples":[{"en":"The lecture is free for students.","zh":"學生可以免費參加講座。"},{"en":"Attendees are encouraged to take notes during the lecture.","zh":"與會者鼓勵在演講期間做筆記。"}],"tips":["常見搭配詞：動詞常搭配 'give'、'deliver' 或 'attend'，例如 'give a lecture on marketing' (發表一場關於行銷的講座)。"],"forms":["lecture","lectures"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"session","pos":"n.","meaning":"場次；會議時段","phrase":"training session","category":"活動與娛樂","id":"w0861","number":861,"examples":[{"en":"The afternoon session will start at two.","zh":"下午的場次將於兩點開始。"},{"en":"The training session will cover the new software features.","zh":"這次培訓課程將涵蓋新的軟體功能。"}],"tips":["常見搭配詞組：此單字經常以複合名詞形式出現，如 training session（培訓課程）、orientation session（新生/新進員工說明會）、information session（說明會）及 Q&A session（問答環節）。"],"forms":["session","sessions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"concert","pos":"n.","meaning":"音樂會","phrase":"attend a concert","category":"活動與娛樂","id":"w0862","number":862,"examples":[{"en":"The concert is sold out.","zh":"音樂會的票已經售完。"},{"en":"Ticket sales for the upcoming concert are exceeding expectations.","zh":"即將到來的音樂會的門票銷售額超出預期。"}],"tips":["常見搭配詞：在 TOEIC 中常出現 'concert venue'（音樂會場地）、'attend a concert'（參加音樂會）、'live concert'（現場音樂會）以及 'concert hall'（音樂廳）。"],"forms":["concert","concerts"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"theater","pos":"n.","meaning":"劇院；電影院","phrase":"local theater","category":"活動與娛樂","id":"w0863","number":863,"examples":[{"en":"The theater is near the museum.","zh":"劇院在博物館附近。"},{"en":"The company rented a theater for the product launch event.","zh":"公司租下了一間劇場，用於產品發布活動。"}],"tips":["常見搭配詞與情境：在多益考試中，theater 常見於娛樂、文化及休閒情境，如 'movie theater' (電影院)、'theater production' (劇場製作) 或 'theater district' (劇院區)。特別注意 'lecture theater' 常指大學或大型會議中的階梯教室。"],"forms":["theater","theaters"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"museum","pos":"n.","meaning":"博物館","phrase":"visit a museum","category":"活動與娛樂","id":"w0864","number":864,"examples":[{"en":"The museum is closed on Mondays.","zh":"博物館每週一休館。"},{"en":"Our company is planning a team-building event at the local science museum.","zh":"我們公司正在計劃在當地科學博物館舉辦團隊建設活動。"}],"tips":["常見搭配詞：'art museum' (美術館)、'museum curator' (博物館館長)、'admission fee' (門票費)、'guided tour' (導覽)。"],"forms":["museum","museums"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"gallery","pos":"n.","meaning":"藝廊；畫廊","phrase":"art gallery","category":"活動與娛樂","id":"w0865","number":865,"examples":[{"en":"The gallery will open next month.","zh":"藝廊將於下個月開幕。"},{"en":"We need to secure a prominent gallery space to showcase our new product line.","zh":"我們需要租用一個顯眼的位置的畫廊來展示我們的最新產品線。"}],"tips":["常見搭配詞：'art gallery' (藝術館/畫廊)、'photo gallery' (相片展示區)、'gallery opening' (畫廊開幕儀式)。"],"forms":["gallery","galleries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"auditorium","pos":"n.","meaning":"禮堂；演講廳","phrase":"main auditorium","category":"活動與娛樂","id":"w0866","number":866,"examples":[{"en":"The auditorium can hold five hundred people.","zh":"禮堂可容納五百人。"},{"en":"The annual company conference will be held in the auditorium.","zh":"年度公司會議將在演講廳舉行。"}],"tips":["常見搭配詞：'state-of-the-art auditorium' (設備先進的禮堂)、'main auditorium' (主禮堂)、'reserve the auditorium' (預約禮堂)。"],"forms":["auditorium","auditoria"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"stadium","pos":"n.","meaning":"體育場","phrase":"sports stadium","category":"活動與娛樂","id":"w0867","number":867,"examples":[{"en":"The stadium is full.","zh":"體育場已經坐滿了。"},{"en":"The company secured naming rights to the new stadium for a ten-year contract.","zh":"該公司以十年合約獲得了新體育場的冠名權。"}],"tips":["常見搭配詞：'stadium capacity'（體育場容量）、'stadium renovation'（體育場翻修）、'indoor/outdoor stadium'（室內/戶外體育場）。"],"forms":["stadium","stadiums"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"admission","pos":"n.","meaning":"入場；入場費","phrase":"admission fee","category":"活動與娛樂","id":"w0868","number":868,"examples":[{"en":"Admission is free today.","zh":"今天可以免費入場。"},{"en":"The company admitted a new employee to the marketing department.","zh":"公司將一位新員工錄用到行銷部門。"}],"tips":["常見搭配詞組：常用於 'admission fee'（入場費）、'free admission'（免費入場）或 'admission ticket'（入場券），在閱讀測驗 Part 7 的公告或廣告中極為常見。"],"forms":["admission","admissions","admits","admitting","admitted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pass","pos":"n.","meaning":"通行證；入場證","phrase":"visitor pass","category":"活動與娛樂","id":"w0869","number":869,"examples":[{"en":"Your pass is valid for two days.","zh":"你的入場證可使用兩天。"},{"en":"Did you pass the certification exam?","zh":"你通過了認證考試嗎？"}],"tips":["多義詞辨析：在多益考試中 pass 常見於兩種詞性。動詞用法包含『通過考試/檢查』或『傳遞物品』（如 pass the documents）；名詞用法則常見於『通行證』，如 boarding pass（登機證）或 security pass（安全識別證）。"],"forms":["pass","passes","passing","passed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"enrollment","pos":"n.","meaning":"報名；註冊人數","phrase":"course enrollment","category":"活動與娛樂","id":"w0870","number":870,"examples":[{"en":"Enrollment is open now.","zh":"現在已開放報名。"},{"en":"The university announced a significant increase in student enrollment this year.","zh":"該大學宣布今年學生入學人數顯著增加。"}],"tips":["常見搭配詞：'enrollment form' (報名表)、'open enrollment' (開放報名期，常用於保險或年度計畫)、'enrollment fee' (報名費)。"],"forms":["enrollment","enrollments","enroll","enrolls","enrolled","enrolling"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"spectator","pos":"n.","meaning":"觀眾；旁觀者","phrase":"event spectators","category":"活動與娛樂","id":"w0871","number":871,"examples":[{"en":"Each spectator must show a ticket.","zh":"每位觀眾都必須出示門票。"},{"en":"The stadium was packed with spectators eager to see the championship game.","zh":"這座體育場座無虛席，擠滿了熱切期盼冠軍賽的觀眾。"}],"tips":["常見搭配與情境：常用於描述運動賽事或大型戶外活動，如「spectator sports」(觀賞性運動) 或「crowd of spectators」(成群的觀眾)。在多益第1部分(圖片題)中，常出現人群聚集在體育館或看台的情景。"],"forms":["spectator","spectators"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"visitor","pos":"n.","meaning":"訪客；參觀者","phrase":"museum visitor","category":"活動與娛樂","id":"w0872","number":872,"examples":[{"en":"Every visitor will receive a map.","zh":"每位參觀者都會收到一份地圖。"},{"en":"Please issue a visitor badge to each visitor upon arrival.","zh":"請在訪客抵達時為每位訪客發放訪客證。"}],"tips":["常見搭配詞與短語：例如 visitor badge (訪客證)、visitor parking (訪客停車位) 及 visitor log (訪客登記簿)。在聽力測驗中，常與動詞 sign in (簽到) 或 issue (核發) 連用。"],"forms":["visitor","visitors"],"exampleSource":"Wordstep basic sentence; kknono6

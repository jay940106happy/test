<main class="reader">
<header class="top"><h1>多益單字練習</h1><span id="total" class="muted">正在載入字庫</span></header>
<label for="search" class="sr-only">搜尋英文單字或中文意思</label><input id="search" type="search" placeholder="搜尋單字或中文" autocomplete="off" spellcheck="false">
<details class="tools" id="tools"><summary>分類、單字表與設定</summary><div class="tool-grid">
<label>情境分類<select id="category"><option value="all">全部分類</option></select></label>
<label>學習狀態<select id="filter"><option value="all">全部單字</option><option value="new">未熟悉</option><option value="known">已熟悉</option></select></label>
<label class="wide">直接選字<select id="word-jump"></select></label>
<label>朗讀語音<select id="voice"><option value="">自動選擇英文語音</option></select></label>
<label>朗讀速度<select id="rate"><option value="0.7">0.7 倍</option><option value="0.9">0.9 倍</option><option value="1">1 倍</option><option value="1.15">1.15 倍</option></select></label>
<p class="wide muted"><span id="progress"></span>；進度儲存在目前瀏覽器。</p>
<button id="clear-filters" class="text-button" type="button">清除篩選</button><button id="reset-progress" class="text-button" type="button">重設熟悉標記</button>
</div></details>
<div class="context"><span id="category-label"></span><span id="position" aria-live="polite"></span></div>
<section id="lesson" aria-label="目前單字" hidden>
<div class="word-section"><h2><button type="button" class="read-aloud" data-play="word" aria-pressed="false"><span id="word" lang="en"></span><span class="sound" aria-hidden="true"></span></button></h2><p class="meaning-line"><span id="pos"></span><span id="meaning" class="zh"></span></p></div>
<section class="example" aria-label="例句一"><button type="button" class="read-aloud" data-play="example0" aria-pressed="false"><span class="en" lang="en"></span><span class="sound" aria-hidden="true"></span></button><p class="zh"></p></section>
<section class="example" aria-label="例句二"><button type="button" class="read-aloud" data-play="example1" aria-pressed="false"><span class="en" lang="en"></span><span class="sound" aria-hidden="true"></span></button><p class="zh"></p></section>
<details class="extra"><summary>搭配與用法</summary><p id="phrase" lang="en"></p><div id="tips" class="zh"></div></details>
</section>
<div id="empty" class="empty" hidden><p>沒有符合條件的單字。</p><button type="button" id="empty-clear">顯示全部單字</button></div>
<div id="practice-controls" hidden><div class="actions"><button type="button" id="play-all" aria-pressed="false">整組播放</button><label><input type="checkbox" id="slow">慢速朗讀</label><button id="hide-chinese" type="button" aria-pressed="false">遮住中文</button></div>
<nav class="navigation" aria-label="切換單字"><button id="previous" type="button">上一個</button><button id="known" type="button" aria-pressed="false">標記已熟</button><button id="next" type="button">下一個</button></nav></div>

<script id="word-data" type="application/json">[{"word":"office","pos":"n.","meaning":"辦公室","phrase":"office building","category":"辦公室與工作","id":"w0001","number":1,"examples":[{"en":"Our office opens at nine.","zh":"我們的辦公室九點開門。"},{"en":"The office will be closed tomorrow.","zh":"辦公室明天將不開放。"}],"tips":["常見搭配詞與短語：'office supplies' (辦公用品) 是 Part 1 與 Part 3 的高頻詞，另有 'head office' (總部) 與 'branch office' (分公司) 常見於商務通訊。"],"forms":["office","offices"],"exampleSource":"Wordstep original examples"},{"word":"workplace","pos":"n.","meaning":"工作場所","phrase":"workplace safety","category":"辦公室與工作","id":"w0002","number":2,"examples":[{"en":"Please keep the workplace clean.","zh":"請保持工作場所整潔。"},{"en":"Safety is important in every workplace.","zh":"每個工作場所的安全都很重要。"}],"tips":["常見搭配詞：常與 safety (安全)、diversity (多樣性)、environment (環境) 或 harassment (騷擾) 連用，例如 workplace safety regulations 是閱讀測驗中極常見的主題。"],"forms":["workplace","workplaces"],"exampleSource":"Wordstep original examples"},{"word":"employee","pos":"n.","meaning":"員工","phrase":"full-time employee","category":"辦公室與工作","id":"w0003","number":3,"examples":[{"en":"The new employee starts on Monday.","zh":"新員工星期一到職。"},{"en":"Every employee will receive an email.","zh":"每位員工都會收到一封電子郵件。"}],"tips":["employee 是受雇的「員工」，employer 才是「雇主」。Every employee 後面用單數形式。"],"forms":["employee","employees"],"exampleSource":"Wordstep original examples"},{"word":"employer","pos":"n.","meaning":"雇主","phrase":"potential employer","category":"辦公室與工作","id":"w0004","number":4,"examples":[{"en":"My employer pays me every month.","zh":"我的雇主每個月付薪水給我。"},{"en":"Ask your employer about the new policy.","zh":"向你的雇主詢問新政策。"}],"tips":["區分身分與常見搭配：最基本且重要的技巧是區分 employer (雇主/資方) 與 employee (員工/勞方)，字尾 -er 代表提供工作的人。常見搭配詞包含 prospective employer (潛在雇主)、current employer (現任雇主) 及 previous employer (前任雇主)。"],"forms":["employer","employers"],"exampleSource":"Wordstep original examples"},{"word":"colleague","pos":"n.","meaning":"同事","phrase":"work with colleagues","category":"辦公室與工作","id":"w0005","number":5,"examples":[{"en":"My colleague will help you.","zh":"我的同事會幫你。"},{"en":"I discussed the plan with a colleague.","zh":"我和一位同事討論了這個計畫。"}],"tips":["易混淆詞辨析：在聽力測驗（Part 1 & 2）中極易與「college」（學院/大學）產生混淆。注意「colleague」結尾發音為硬音 /ɡ/，而「college」結尾為 /dʒ/，考生須透過上下文判斷是職場還是學術情境。"],"forms":["colleague","colleagues"],"exampleSource":"Wordstep original examples"},{"word":"coworker","pos":"n.","meaning":"同事","phrase":"ask a coworker","category":"辦公室與工作","id":"w0006","number":6,"examples":[{"en":"My coworker sits next to me.","zh":"我的同事坐在我旁邊。"},{"en":"Can you ask a coworker for help?","zh":"你可以請一位同事幫忙嗎？"}],"tips":["常見同義詞辨析：coworker 與 colleague 為同義詞，兩者皆指同事。在多益聽力中，選項常以 colleague 替換題目中的 coworker 作為正確答案。"],"forms":["coworker","coworkers"],"exampleSource":"Wordstep original examples"},{"word":"staff","pos":"n.","meaning":"員工；職員","phrase":"staff member","category":"辦公室與工作","id":"w0007","number":7,"examples":[{"en":"The staff are very helpful.","zh":"這些員工很樂於幫忙。"},{"en":"All staff must attend the meeting.","zh":"所有員工都必須參加會議。"}],"tips":["集體名詞用法：staff 通常被視為集體名詞，代表全體員工。在多益考試中，若要指稱個別員工，應使用 'staff member' 或 'staff members'。"],"forms":["staff","staffs"],"exampleSource":"Wordstep original examples"},{"word":"department","pos":"n.","meaning":"部門","phrase":"sales department","category":"辦公室與工作","id":"w0008","number":8,"examples":[{"en":"She works in the sales department.","zh":"她在業務部工作。"},{"en":"Which department should I contact?","zh":"我應該聯絡哪個部門？"}],"tips":["work in + 部門，表示在某部門工作。例句2的 Which 用來詢問是哪一個。"],"forms":["department","departments"],"exampleSource":"Wordstep original examples"},{"word":"position","pos":"n.","meaning":"職位","phrase":"available position","category":"辦公室與工作","id":"w0009","number":9,"examples":[{"en":"She applied for a sales position.","zh":"她應徵了一個業務職位。"},{"en":"This position requires two years of experience.","zh":"這個職位要求兩年經驗。"}],"tips":["多義字辨析：在 TOEIC 中最常用來指「職缺」或「職位」，例如 apply for a position (申請職位) 或 fill a vacancy/position (填補職缺)。"],"forms":["position","positions","positioning","positioned"],"exampleSource":"Wordstep original examples"},{"word":"occupation","pos":"n.","meaning":"職業","phrase":"current occupation","category":"辦公室與工作","id":"w0010","number":10,"examples":[{"en":"Please write your occupation here.","zh":"請在這裡填寫你的職業。"},{"en":"What is your current occupation?","zh":"你目前的職業是什麼？"}],"tips":["常見搭配詞與填表應用：在 TOEIC 閱讀 Part 7 的申請表、保險單或個人資訊調查中，'occupation' 是標題欄位的常用字，代表『職業』，常見搭配如 'current occupation' (現職) 或 'previous occupation' (前職)。"],"forms":["occupation","occupations"],"exampleSource":"Wordstep original examples"},{"word":"deadline","pos":"n.","meaning":"截止期限","phrase":"meet a deadline","category":"辦公室與工作","id":"w0011","number":11,"examples":[{"en":"The deadline is next Friday.","zh":"截止期限是下星期五。"},{"en":"Can we extend the deadline?","zh":"我們可以延長截止期限嗎？"}],"tips":["常見動詞搭配：'meet the deadline'（趕上截止日）、'miss the deadline'（錯過截止日）、'extend the deadline'（延長截止日）及 'set a deadline'（設定截止日），這類動詞搭配在 Part 5 詞彙題非常常見。"],"forms":["deadline","deadlines"],"exampleSource":"Wordstep original examples"},{"word":"career","pos":"n.","meaning":"職涯","phrase":"career opportunity","category":"辦公室與工作","id":"w0012","number":12,"examples":[{"en":"This course can help your career.","zh":"這門課可以幫助你的職涯。"},{"en":"She is planning her career path after graduation.","zh":"她在畢業後正在規劃她的職業發展方向。"}],"tips":["常見搭配詞：在 TOEIC 閱讀中經常出現 career advancement (職涯晉升)、career path (職涯路徑) 與 pursue a career in (在...領域發展職業生涯)。"],"forms":["career","careers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"duty","pos":"n.","meaning":"職責","phrase":"perform duties","category":"辦公室與工作","id":"w0013","number":13,"examples":[{"en":"Checking the mail is my duty.","zh":"查看郵件是我的職責。"},{"en":"The customs officer's duty is to inspect all incoming shipments.","zh":"海關人員的職責是檢查所有進口貨物。"}],"tips":["常見搭配詞與短語：'on duty' (正在值班) 與 'off duty' (下班) 常出現在辦公室情境；'duty-free shop' (免稅店) 是機場情境的高頻詞。"],"forms":["duty","duties","duting","duted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"task","pos":"n.","meaning":"任務；工作","phrase":"complete a task","category":"辦公室與工作","id":"w0014","number":14,"examples":[{"en":"We can finish this task today.","zh":"我們今天可以完成這項任務。"},{"en":"Before the deadline, please complete all outstanding tasks.","zh":"在截止日期前，請完成所有未完成的任務。"}],"tips":["常見搭配詞：熟記 assign a task (分配任務)、complete a task (完成任務) 與 perform a task (執行任務)，這些動詞搭配常出現在 Part 5 的詞彙填空題。"],"forms":["task","tasks","tasking","tasked"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"assignment","pos":"n.","meaning":"工作任務","phrase":"finish an assignment","category":"辦公室與工作","id":"w0015","number":15,"examples":[{"en":"Your assignment is due on Monday.","zh":"你的作業任務星期一到期。"},{"en":"Please submit your assignment by Friday to avoid late penalties.","zh":"請在星期五前提交您的作業，以避免延遲罰款。"}],"tips":["常見搭配詞：'overseas assignment' (海外派駐) 與 'temporary assignment' (臨時任務) 常在閱讀測驗中描述職位變動；'complete/finish an assignment' 指完成交辦事項。"],"forms":["assignment","assignments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"workload","pos":"n.","meaning":"工作量","phrase":"heavy workload","category":"辦公室與工作","id":"w0016","number":16,"examples":[{"en":"Our workload is heavier this week.","zh":"我們這星期的工作量比較大。"},{"en":"Due to the increased demand, employees are facing a heavy workload this quarter.","zh":"由於需求增加，員工們在本季面臨繁重的工作量。"}],"tips":["常見搭配詞：形容詞常搭配 heavy (沉重的)、excessive (過度的) 或 manageable (可應付的)；動詞常搭配 handle, manage, distribute (分配) 或 reduce (減輕)。"],"forms":["workload","workloads"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"schedule","pos":"n./v.","meaning":"行程；安排","phrase":"work schedule","category":"辦公室與工作","id":"w0017","number":17,"examples":[{"en":"Please check the schedule.","zh":"請查看行程表。"},{"en":"We need to schedule a meeting.","zh":"我們需要安排一場會議。"}],"tips":["例句1的 schedule 是名詞「行程表」；例句2放在 need to 後，是動詞「安排」。"],"forms":["schedule","schedules","scheduling","scheduled"],"exampleSource":"Wordstep original examples"},{"word":"shift","pos":"n.","meaning":"輪班；班次","phrase":"night shift","category":"辦公室與工作","id":"w0018","number":18,"examples":[{"en":"My shift will end at six.","zh":"我的班次會在六點結束。"},{"en":"The company implemented a new shift system to improve productivity.","zh":"公司實施了新的輪班制度以提高生產力。"}],"tips":["在職場情境中，shift 最常作為名詞表示「輪班」，例如 day shift (日班) 或 night shift (夜班)，常見於 Part 3 的對話中討論排班或更換工作時間的需求。"],"forms":["shift","shifts","shifting","shifted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"overtime","pos":"n.","meaning":"加班","phrase":"work overtime","category":"辦公室與工作","id":"w0019","number":19,"examples":[{"en":"You can work overtime this week.","zh":"你這星期可以加班。"},{"en":"Due to the project deadline, many employees are working overtime this week.","zh":"由於專案截止日期，本週許多員工正在加班。"}],"tips":["常見搭配詞組：'work overtime' (加班) 為最常見動詞組合，名詞用法包含 'overtime pay/rates' (加班費/加班費率) 以及 'accumulate overtime' (累積加班時數)。"],"forms":["overtime","overtimes","more overtime","most overtime"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"attendance","pos":"n.","meaning":"出勤；出席","phrase":"attendance record","category":"辦公室與工作","id":"w0020","number":20,"examples":[{"en":"Attendance is required at the training session.","zh":"這次培訓要求出席。"},{"en":"The company requires a minimum attendance rate of 85% for all employees.","zh":"公司要求所有員工的最低出席率為 85%。"}],"tips":["常見搭配詞：'attendance record' (出席紀錄)、'confirm attendance' (確認出席)、'perfect attendance' (全勤) 與 'low/high attendance' (出席率低/高)。"],"forms":["attendance","attendances"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"absence","pos":"n.","meaning":"缺席","phrase":"absence from work","category":"辦公室與工作","id":"w0021","number":21,"examples":[{"en":"Your absence was noted in the report.","zh":"你的缺席已記錄在報告裡。"},{"en":"The company policy states that excessive absences may result in disciplinary action.","zh":"公司政策規定，過多的缺席可能會導致紀律處分。"}],"tips":["常見固定搭配：'leave of absence' 是多益極高頻詞彙，指「准假/休假」；'in the absence of' 表示「在缺少...的情況下」，常出現在 Part 5 或 Part 6 的介係詞短語考點中。"],"forms":["absence","absences"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"leave","pos":"n.","meaning":"休假；假期","phrase":"take leave","category":"辦公室與工作","id":"w0022","number":22,"examples":[{"en":"She is on leave this week.","zh":"她這星期休假。"},{"en":"Please request leave at least a week ahead.","zh":"請至少提前一星期申請休假。"}],"tips":["區分動詞與名詞用法：作為名詞時，leave 指「休假」，常見搭配有 annual leave（年假）、sick leave（病假）、maternity leave（產假），這在 Part 5 & 6 的辦公室福利主題中極常出現。"],"forms":["leave","leaves","leaving","left"],"exampleSource":"Wordstep original examples"},{"word":"vacation","pos":"n.","meaning":"假期","phrase":"vacation request","category":"辦公室與工作","id":"w0023","number":23,"examples":[{"en":"My vacation will begin on Saturday.","zh":"我的假期將於星期六開始。"},{"en":"The company policy allows employees to take two weeks of vacation per year.","zh":"公司政策允許員工每年休假兩週。"}],"tips":["常見搭配與片語：'be on vacation' (正在度假) 與 'take a vacation' (休假) 是多益聽力最常出現的用法，需注意介係詞的搭配。"],"forms":["vacation","vacations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"holiday","pos":"n.","meaning":"假日","phrase":"public holiday","category":"辦公室與工作","id":"w0024","number":24,"examples":[{"en":"Monday is a public holiday.","zh":"星期一是國定假日。"},{"en":"The company will be closed for the upcoming holiday season.","zh":"公司將在即將到來的假期關閉。"}],"tips":["常見搭配詞與用法：'Public holiday' (公眾假期) 或 'National holiday' (國定假日) 常在辦公室公告中出現，用來解釋公司或銀行的休息時段。'Go on holiday' 是英式用法，美式多用 'go on vacation'，在多益聽力中不同口音會交替使用。"],"forms":["holiday","holidays"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"break","pos":"n.","meaning":"休息時間","phrase":"lunch break","category":"辦公室與工作","id":"w0025","number":25,"examples":[{"en":"Let's take a short break.","zh":"我們休息一下吧。"},{"en":"The meeting will continue after the break.","zh":"會議將在休息後繼續。"}],"tips":["常見搭配詞與短語：在TOEIC聽力測驗中，常出現'take a break' (休息)或'lunch break' (午休)等辦公室情境。在閱讀部分，'break even' (收支平衡)是重要的商業術語，意指利潤與成本相等。"],"forms":["break","breaks","breaking","broke","broken"],"exampleSource":"Wordstep original examples"},{"word":"desk","pos":"n.","meaning":"辦公桌","phrase":"front desk","category":"辦公室與工作","id":"w0026","number":26,"examples":[{"en":"The keys are on your desk.","zh":"鑰匙在你的辦公桌上。"},{"en":"Please clear your desk before leaving for the day.","zh":"請在下班前清理你的辦公桌。"}],"tips":["常見搭配詞：'reception desk' (接待處)、'front desk' (前台/櫃檯)、'help desk' (服務台) 與 'information desk' (詢問處)。這些詞彙常出現在 Part 1 描述地點或 Part 3 飯店與辦公情境中。"],"forms":["desk","desks"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"workstation","pos":"n.","meaning":"工作站；工作區","phrase":"computer workstation","category":"辦公室與工作","id":"w0027","number":27,"examples":[{"en":"Your workstation is near the window.","zh":"你的工作區在窗戶旁。"},{"en":"Each employee is provided with a modern workstation equipped with a high-performance computer.","zh":"每位員工都配備一台配備高性能電腦的現代化工作站。"}],"tips":["常見搭配詞組：常用於 'ergonomic workstation'（符合人體工學的工作站）、'assigned workstation'（指派的座位）或 'shared workstation'（共享辦公位置）。在辦公家具採購或辦公室空間規劃的閱讀題中極為常見。"],"forms":["workstation","workstations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"document","pos":"n.","meaning":"文件","phrase":"prepare a document","category":"辦公室與工作","id":"w0028","number":28,"examples":[{"en":"This document is ready to print.","zh":"這份文件可以列印了。"},{"en":"Please submit all required documents by the deadline.","zh":"請在截止日期前提交所有必要的文件。"}],"tips":["詞性雙重身份：在多益中常用作名詞表示「文件」，如 'confidential document' (機密文件)；也常作動詞表示「記錄」或「提供證明」，例如 'document the process' (記錄過程)。"],"forms":["document","documents"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"file","pos":"n./v.","meaning":"檔案；歸檔","phrase":"file a report","category":"辦公室與工作","id":"w0029","number":29,"examples":[{"en":"You can save the file here.","zh":"你可以把檔案存在這裡。"},{"en":"Please file these documents in the appropriate folder.","zh":"請將這些文件歸檔到適當的資料夾中。"}],"tips":["多重詞性應用：作為動詞時，除了常見的『歸檔』，在多益中更常考『正式提出/提交』的意思，如『file a complaint』（投訴）或『file a claim』（保險理賠）。"],"forms":["file","files","filing","filed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"folder","pos":"n.","meaning":"資料夾","phrase":"shared folder","category":"辦公室與工作","id":"w0030","number":30,"examples":[{"en":"The photos are in this folder.","zh":"照片在這個資料夾裡。"},{"en":"Please save the presentation files in the 'Marketing' folder.","zh":"請將簡報檔案儲存在「行銷」資料夾中。"}],"tips":["常見搭配詞與組：'manila folder' (米色/牛皮紙資料夾)、'file folder' (檔案夾)、'shared folder' (共享資料夾)；動詞常搭配 'organize', 'label', 或 'store'。"],"forms":["folder","folders"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"form","pos":"n.","meaning":"表格","phrase":"complete a form","category":"辦公室與工作","id":"w0031","number":31,"examples":[{"en":"You can complete the form online.","zh":"你可以在線上填寫表格。"},{"en":"Please fill out this form with accurate information before submitting it.","zh":"請在提交之前，用準確的資訊填寫此表格。"}],"tips":["多重詞性辨析：在多益考試中 form 具備名詞與動詞雙重身分。名詞常指「表格」（如 application form 申請表、order form 訂購單），動詞則指「形成、組成」（如 form a partnership 建立合夥關係、form a committee 組成委員會）。"],"forms":["form","forms","forming","formed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"paperwork","pos":"n.","meaning":"文書工作；文件","phrase":"complete paperwork","category":"辦公室與工作","id":"w0032","number":32,"examples":[{"en":"The paperwork is almost finished.","zh":"文書工作快完成了。"},{"en":"We're trying to reduce paperwork by implementing a digital filing system.","zh":"我們正在嘗試透過實施數位檔案系統來減少文牘。"}],"tips":["不可數名詞特性：paperwork 在多益考試中被視為不可數名詞，不可在字尾加 s，常用於描述繁瑣的行政程序。"],"forms":["paperwork","paperworks"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"report","pos":"n./v.","meaning":"報告；報告","phrase":"submit a report","category":"辦公室與工作","id":"w0033","number":33,"examples":[{"en":"The report will be ready tomorrow.","zh":"報告明天會準備好。"},{"en":"Please report any technical issues to the IT department immediately.","zh":"請立即向 IT 部門報告任何技術問題。"}],"tips":["常見搭配詞組與商務情境：'annual report' (年度報告)、'progress report' (進度報告) 與 'weather report' (天氣預報) 是聽力與閱讀的高頻詞彙。在商務書信中，'submit a report' (提交報告) 是標準用法。"],"forms":["report","reports","reporting","reported"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"notice","pos":"n.","meaning":"通知；公告","phrase":"post a notice","category":"辦公室與工作","id":"w0034","number":34,"examples":[{"en":"The notice is beside the door.","zh":"公告在門旁。"},{"en":"Please notice the new policy regarding overtime work.","zh":"請留意關於加班的新政策。"}],"tips":["詞性辨析與常見短語：notice 作為名詞時常出現在『until further notice』（直到另行通知）或『give notice』（提離職/預先通知）中，是 Part 5 常考的固定搭配。"],"forms":["notice","notices","noticing","noticed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"memo","pos":"n.","meaning":"備忘錄","phrase":"send a memo","category":"辦公室與工作","id":"w0035","number":35,"examples":[{"en":"The memo is for all employees.","zh":"這份備忘錄是給所有員工的。"},{"en":"Please read the memo regarding the upcoming company picnic.","zh":"請閱讀關於即將舉辦的公司野餐的備忘錄。"}],"tips":["基礎概念與全稱：memo 是 memorandum 的縮寫，主要用於公司內部的資訊傳遞、政策公告或會議提醒。"],"forms":["memo","memos"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"announcement","pos":"n.","meaning":"公告；宣布","phrase":"make an announcement","category":"辦公室與工作","id":"w0036","number":36,"examples":[{"en":"The announcement will appear on our website.","zh":"公告會刊登在我們的網站上。"},{"en":"The company made an announcement regarding the upcoming restructuring.","zh":"公司發布了關於即將進行的重組公告。"}],"tips":["常見搭配詞組：'make an announcement' (發表公告)、'official announcement' (正式聲明)、'public announcement' (公開宣佈)，在多益考題中常出現在公司政策變動或人事調整的情境。"],"forms":["announcement","announcements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"correspondence","pos":"n.","meaning":"通信；往來信件","phrase":"business correspondence","category":"辦公室與工作","id":"w0037","number":37,"examples":[{"en":"This correspondence is about your order.","zh":"這封往來信件是關於你的訂單。"},{"en":"Please file all correspondence alphabetically by sender.","zh":"請按照寄件人的姓名，將所有書信往來按字母順序歸檔。"}],"tips":["常見搭配詞：最常出現在 'business correspondence' (商業往來書信) 或 'electronic correspondence' (電子通訊) 等詞組中，通常用來統稱 Email、信件或傳真。"],"forms":["correspondence","correspondences"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"mail","pos":"n./v.","meaning":"郵件；郵寄","phrase":"mail a document","category":"辦公室與工作","id":"w0038","number":38,"examples":[{"en":"Your mail is at the front desk.","zh":"你的郵件在櫃檯。"},{"en":"Please mail the contract to the legal department by Friday.","zh":"請在週五前將合約郵寄至法律部門。"}],"tips":["常見搭配詞：常與 'mail room' (郵件收發室)、'incoming mail' (寄達郵件)、'express mail' (快捷郵件) 及 'bulk mail' (大宗郵件) 連用。在 Part 1 圖片題中，常出現 'sorting mail' (整理郵件) 或 'delivering mail' (遞送郵件) 的動作描述。"],"forms":["mail","mails","mailing","mailed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"signature","pos":"n.","meaning":"簽名","phrase":"require a signature","category":"辦公室與工作","id":"w0039","number":39,"examples":[{"en":"Your signature is required here.","zh":"這裡需要你的簽名。"},{"en":"Please add your signature to the form.","zh":"請在表格上簽名。"}],"tips":["常見搭配詞：'require a signature'（需要簽名）、'authorized signature'（授權簽章）、'signature line'（簽名欄）。"],"forms":["signature","signatures","signs","signing","signed"],"exampleSource":"Wordstep original examples"},{"word":"stationery","pos":"n.","meaning":"文具","phrase":"office stationery","category":"辦公室與工作","id":"w0040","number":40,"examples":[{"en":"The stationery is in the top drawer.","zh":"文具在最上層的抽屜裡。"},{"en":"The office manager ordered a large supply of stationery, including pens, paper, and folders.","zh":"辦公室經理訂購了大量文具用品，包括筆、紙和文件夾。"}],"tips":["拼字辨析：最常與 stationary（靜止的、不動的）混淆。口訣記憶：stationEry 的 E 代表 Envelope（信封），與文具有關；stationAry 的 A 代表 Anchor（錨），與固定不動有關。"],"forms":["stationery","stationeries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"supply","pos":"n.","meaning":"用品；供應品","phrase":"office supplies","category":"辦公室與工作","id":"w0041","number":41,"examples":[{"en":"The supply of paper is low.","zh":"紙張的供應量偏低。"},{"en":"Please supply us with the necessary documents by Friday.","zh":"請在星期五前提供我們所需的相關文件。"}],"tips":["常見搭配詞：'supply chain' (供應鏈)、'office supplies' (辦公用品)、'medical supplies' (醫療物資)、'supply and demand' (供需)；特別注意名詞指物資、消耗品時多用複數 supplies。"],"forms":["supply","supplies","supplying","supplied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"cabinet","pos":"n.","meaning":"櫃子","phrase":"filing cabinet","category":"辦公室與工作","id":"w0042","number":42,"examples":[{"en":"The cabinet is full of files.","zh":"櫃子裡放滿了檔案。"},{"en":"She keeps all her financial records in a locked filing cabinet.","zh":"她把所有財務記錄都放在一個上鎖的文件櫃裡。"}],"tips":["在多益 Part 1 照片描述題中，'filing cabinet' (檔案櫃) 是極高頻詞彙，常伴隨 'be open' (開啟中) 或 'be stacked with' (堆滿了...) 等描述。"],"forms":["cabinets"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"copier","pos":"n.","meaning":"影印機","phrase":"office copier","category":"辦公室與工作","id":"w0043","number":43,"examples":[{"en":"The copier is next to the printer.","zh":"影印機在印表機旁邊。"},{"en":"The office copier is frequently used by all employees.","zh":"這台辦公室影印機被所有員工頻繁使用。"}],"tips":["常見搭配詞與同義詞：在多益中常與 photocopier 或 copy machine 互換使用。常見搭配包括 out of order (故障)、paper jam (卡紙)、run out of toner (碳粉用完)。"],"forms":["copier","copiers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"printer","pos":"n.","meaning":"印表機","phrase":"use a printer","category":"辦公室與工作","id":"w0044","number":44,"examples":[{"en":"The printer is out of paper.","zh":"印表機沒有紙了。"},{"en":"Can you connect this printer to my computer?","zh":"你可以把這台印表機連接到我的電腦嗎？"}],"tips":["常見搭配詞：包含 paper jam (卡紙)、out of ink (墨水用盡)、ink cartridge (墨水匣) 以及 laser printer (雷射印表機)。"],"forms":["printer","printers"],"exampleSource":"Wordstep original examples"},{"word":"photocopy","pos":"n./v.","meaning":"影本；影印","phrase":"photocopy a document","category":"辦公室與工作","id":"w0045","number":45,"examples":[{"en":"You can photocopy the document here.","zh":"你可以在這裡影印文件。"},{"en":"Could you please photocopy these documents for the meeting?","zh":"您能請您影印這些文件以供會議使用嗎？"}],"tips":["常見搭配詞與同義替換：在多益中，常以「make a photocopy」或簡寫為「make a copy」出現。相關設備稱為「photocopier」或「photocopy machine」。若在聽力中聽到「The machine is jammed」，通常是指影印機卡紙。"],"forms":["photocopy","photocopies","photocopying","photocopied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"organize","pos":"v.","meaning":"整理；安排","phrase":"organize files","category":"辦公室與工作","id":"w0046","number":46,"examples":[{"en":"We can organize the files by date.","zh":"我們可以按日期整理檔案。"},{"en":"The project manager needs to organize the team's tasks and deadlines.","zh":"專案經理需要組織團隊的任務和截止日期。"}],"tips":["常見搭配詞：'organize a meeting/conference' (籌辦會議/研討會)、'organize documents/files' (整理文件/檔案)、'organize a fundraiser' (組織募款活動)。"],"forms":["organize","organizes","organizing","organized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"submit","pos":"v.","meaning":"提交","phrase":"submit a form","category":"辦公室與工作","id":"w0047","number":47,"examples":[{"en":"Please submit your report today.","zh":"請在今天繳交你的報告。"},{"en":"The form was submitted online.","zh":"表格已在線上提交。"}],"tips":["例句2是被動句：The form（表格）+ was submitted（被提交）。submit 的過去式要寫 submitted。"],"forms":["submit","submits","submitting","submitted"],"exampleSource":"Wordstep original examples"},{"word":"complete","pos":"v.","meaning":"完成；填妥","phrase":"complete a report","category":"辦公室與工作","id":"w0048","number":48,"examples":[{"en":"You can complete the application today.","zh":"你今天可以完成申請。"},{"en":"Please complete the form before submitting it to HR.","zh":"請在提交給人資部門之前填寫完整表格。"}],"tips":["詞性雙重身份：在多益中常考動詞「完成、填寫」與形容詞「完整的」。在 Part 5 詞性題中，需辨識其與副詞 (completely) 或名詞 (completion) 的區別。"],"forms":["complete","more complete","most complete","completes","completing","completed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"attach","pos":"v.","meaning":"附上","phrase":"attach a document","category":"辦公室與工作","id":"w0049","number":49,"examples":[{"en":"You can attach a photo to the email.","zh":"你可以在電子郵件中附上一張照片。"},{"en":"Please attach your resume and cover letter to the email.","zh":"請將您的履歷和求職信附加到電子郵件中。"}],"tips":["常見搭配詞與介系詞：最常與介系詞 to 連用，構成 attach A to B 的結構，代表「將 A 附加於 B」。在多益中常見的搭配詞包括 attach a file (附加檔案)、attached document (隨附文件) 及 attachment (附件)。"],"forms":["attach","attaches","attaching","attached"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"forward","pos":"v.","meaning":"轉寄；轉交","phrase":"forward an email","category":"辦公室與工作","id":"w0050","number":50,"examples":[{"en":"I can forward the message to you.","zh":"我可以把訊息轉寄給你。"},{"en":"Please forward this email to the sales manager for review.","zh":"請將這封郵件轉寄給銷售經理審閱。"}],"tips":["常見搭配詞組：最常考的是「look forward to + V-ing/名詞」，考生需注意此處的 to 為介系詞，後方必須接動名詞或名詞，而非原形動詞。"],"forms":["forward","forwards","forwarding","forwarded","more forward","most forward"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"applicant","pos":"n.","meaning":"申請人；應徵者","phrase":"job applicant","category":"人事與招募","id":"w0051","number":51,"examples":[{"en":"The applicant is waiting for an interview.","zh":"應徵者正在等候面試。"},{"en":"The HR department is reviewing the applications of several qualified applicants.","zh":"人力資源部門正在審閱多位合格求職者的申請。"}],"tips":["常見搭配詞：'successful applicant' (錄取者)、'qualified applicant' (合格的應徵者)、'potential applicant' (潛在的求職者)。"],"forms":["applicant","applicants"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"application","pos":"n.","meaning":"申請；申請表","phrase":"job application","category":"人事與招募","id":"w0052","number":52,"examples":[{"en":"Your application is under review.","zh":"你的申請正在審核中。"},{"en":"Please submit your job application by Friday.","zh":"請在星期五前提交您的求職申請。"}],"tips":["一字多義辨析：在多益考試中常出現「申請/申請書」與「應用軟體/App」兩種含義，考生須依商業情境判斷。"],"forms":["application","applications","applies","applying","applied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"candidate","pos":"n.","meaning":"候選人；應徵者","phrase":"qualified candidate","category":"人事與招募","id":"w0053","number":53,"examples":[{"en":"This candidate is a good match for the job.","zh":"這位應徵者很適合這份工作。"},{"en":"The hiring manager will interview three candidates for the sales supervisor position next week.","zh":"招聘經理將於下週面試三位銷售主管職位的候選人。"}],"tips":["常見搭配詞：在多益考試中常與形容詞連用，如 \"qualified candidate\" (合格的候選人)、\"successful candidate\" (錄取者) 或 \"ideal candidate\" (理想人選)。"],"forms":["candidate","candidates"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"recruit","pos":"v./n.","meaning":"招募；新進人員","phrase":"recruit new employees","category":"人事與招募","id":"w0054","number":54,"examples":[{"en":"We will recruit five new employees.","zh":"我們將招募五位新員工。"},{"en":"We are currently recruiting for a project manager position with strong leadership skills.","zh":"我們目前正在招募一位具備強大領導能力的專案經理。"}],"tips":["詞性雙重身分：recruit 在 TOEIC 中常考動詞（招募）與名詞（新進成員）兩種用法。考生需注意名詞型態的複數形式 'new recruits' 常在辦公室情境中出現。"],"forms":["recruit","recruits","recruiting","recruited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"recruitment","pos":"n.","meaning":"招募","phrase":"recruitment process","category":"人事與招募","id":"w0055","number":55,"examples":[{"en":"Recruitment will begin next month.","zh":"招募將於下個月開始。"},{"en":"Department heads discussed the recruitment strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了recruitment策略。"}],"tips":["常見搭配詞：'recruitment agency' (招聘機構/人力仲介)、'recruitment process' (招聘流程)、'recruitment drive' (大規模招募活動)，在閱讀 Part 7 的公司內部公告中極為常見。"],"forms":["recruitment"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"hire","pos":"v.","meaning":"雇用","phrase":"hire new staff","category":"人事與招募","id":"w0056","number":56,"examples":[{"en":"We can hire another assistant.","zh":"我們可以再雇用一位助理。"},{"en":"The company plans to hire five new sales representatives this quarter.","zh":"本公司計畫在本季雇用五位新的銷售代表。"}],"tips":["詞性雙重身分：'hire' 在多益中除了作為動詞「雇用」外，最常在閱讀測驗中以名詞形式出現，指「新進員工」(a new hire)。"],"forms":["hire","hires","hiring","hired"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"interview","pos":"n./v.","meaning":"面試；訪談","phrase":"job interview","category":"人事與招募","id":"w0057","number":57,"examples":[{"en":"Your interview is at ten tomorrow.","zh":"你的面試在明天十點。"},{"en":"The HR department is scheduling interviews for the marketing manager position.","zh":"人資部門正在為行銷經理職位安排面試。"}],"tips":["常見搭配詞：在 TOEIC 中常與動詞連用，如 conduct/hold an interview (進行面試)、schedule an interview (安排面試) 或 invite someone for an interview (邀請某人面試)。"],"forms":["interview","interviews","interviewing","interviewed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"résumé","pos":"n.","meaning":"履歷","phrase":"submit a résumé","category":"人事與招募","id":"w0058","number":58,"examples":[{"en":"You can send your résumé by email.","zh":"你可以用電子郵件寄送履歷。"},{"en":"Please submit your resume and cover letter by Friday.","zh":"請在星期五前提交您的履歷和求職信。"}],"tips":["常見搭配詞：submit a résumé (遞交履歷)、update a résumé (更新履歷)、attach a résumé (隨信附上履歷)，常與 email 附件情境結合。"],"forms":["resume","resumes","résumé","résumés"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"qualification","pos":"n.","meaning":"資格；資歷","phrase":"meet the qualifications","category":"人事與招募","id":"w0059","number":59,"examples":[{"en":"A teaching qualification is required.","zh":"這份工作需要教學資格。"},{"en":"Verify the applicant's qualifications before extending a job offer.","zh":"在發出錄用通知之前，請驗證申請人的資歷。"}],"tips":["常見搭配詞組：常用於 job qualifications (職位資格)、academic qualifications (學術資歷) 或 minimum qualifications (最低要求)。"],"forms":["qualification","qualifications"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"experience","pos":"n.","meaning":"經驗","phrase":"work experience","category":"人事與招募","id":"w0060","number":60,"examples":[{"en":"Work experience is helpful for this job.","zh":"工作經驗對這份工作有幫助。"},{"en":"The candidate's extensive experience in project management makes him a strong contender.","zh":"這位候選人在專案管理的豐富經驗使他成為強勁的競爭者。"}],"tips":["區分可數與不可數用法：當表示「經驗、資歷」時為不可數名詞（如 years of experience）；當表示「一次具體的經歷」時為可數名詞（如 a rewarding experience）。"],"forms":["experience","experiences","experiencing","experienced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"skill","pos":"n.","meaning":"技能","phrase":"communication skills","category":"人事與招募","id":"w0061","number":61,"examples":[{"en":"Clear writing is a useful skill.","zh":"清楚寫作是一項實用技能。"},{"en":"Developing strong communication skills is essential for success in this role.","zh":"在職位上取得成功，培養良好的溝通技巧至關重要。"}],"tips":["常見搭配詞：在多益中常與形容詞連用形成固定組合，如 communication skills (溝通技巧)、interpersonal skills (人際關係技巧) 與 technical skills (技術技能)。"],"forms":["skill","skills"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"ability","pos":"n.","meaning":"能力","phrase":"ability to work independently","category":"人事與招募","id":"w0062","number":62,"examples":[{"en":"Your ability to solve problems is valuable.","zh":"你解決問題的能力很有價值。"},{"en":"To improve employee ability, the company offers various training programs.","zh":"為了提升員工能力，公司提供各種培訓計畫。"}],"tips":["常見語法結構：'ability' 後方最常接不定詞，形成 'ability to + V' 的結構，表示『做某事的能力』，這是多益 Part 5 文法題的常客。"],"forms":["ability","abilities"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"requirement","pos":"n.","meaning":"要求；條件","phrase":"job requirement","category":"人事與招募","id":"w0063","number":63,"examples":[{"en":"A driver's license is a job requirement.","zh":"駕照是這份工作的必要條件。"},{"en":"The project manager outlined the key requirements for the new software.","zh":"專案經理概述了新軟體的主要需求。"}],"tips":["常見動詞搭配：常與 meet, fulfill, satisfy 連用，表示「符合、滿足要求」，這在 Part 5 詞彙填空題中是高頻考點。"],"forms":["requirement","requirements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reference","pos":"n.","meaning":"推薦人；推薦資料","phrase":"provide references","category":"人事與招募","id":"w0064","number":64,"examples":[{"en":"Your former manager can be a reference.","zh":"你的前主管可以擔任推薦人。"},{"en":"The report cites several industry references to support its conclusions.","zh":"該報告引用多項業界參考資料以支撐其結論。"}],"tips":["常見搭配詞：'reference letter' 或 'letter of reference'（推薦信）、'list of references'（推薦人名單）、'for future reference'（供日後參考）。"],"forms":["reference","references","referencing","referenced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"vacancy","pos":"n.","meaning":"職缺；空缺","phrase":"fill a vacancy","category":"人事與招募","id":"w0065","number":65,"examples":[{"en":"There is a vacancy in our department.","zh":"我們的部門有一個職缺。"},{"en":"The company is advertising the vacancy on several job websites.","zh":"公司正在幾個求職網站上刊登這個職位空缺。"}],"tips":["常見搭配詞與情境：在招募情境中常出現「job vacancy」(職位空缺) 或動詞搭配「fill a vacancy」(填補空缺)；在飯店或住房情境中，常看到「No Vacancy」的告示表示「無空房」。"],"forms":["vacancy","vacancies"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"opening","pos":"n.","meaning":"職缺","phrase":"job opening","category":"人事與招募","id":"w0066","number":66,"examples":[{"en":"The job opening is listed online.","zh":"這個職缺刊登在網路上。"},{"en":"The company is planning a grand opening ceremony for its new branch.","zh":"公司正在為其新分店策劃一個盛大的開業典禮。"}],"tips":["多重語義辨析：在多益中主要有三種用法：『職缺』(job opening)、『開幕』(grand opening) 及『開端/開場白』(opening remarks)。考生需根據上下文判斷。"],"forms":["opening","openings","opens","opened","more open","most open"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"employment","pos":"n.","meaning":"就業；雇用","phrase":"employment opportunity","category":"人事與招募","id":"w0067","number":67,"examples":[{"en":"Your employment will begin in June.","zh":"你的雇用期間將於六月開始。"},{"en":"The company offers excellent benefits and opportunities for employment.","zh":"該公司提供優厚的福利和就業機會。"}],"tips":["常見搭配詞組：此單字常與 contract (合約)、agency (仲介)、history (工作經歷) 搭配使用。在 Part 5 詞彙題中，若空格後接 contract，常選 employment 組成固定詞組。"],"forms":["employment","employments"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"personnel","pos":"n.","meaning":"人事；員工","phrase":"personnel department","category":"人事與招募","id":"w0068","number":68,"examples":[{"en":"The personnel department can answer your questions.","zh":"人事部可以回答你的問題。"},{"en":"We need to reduce personnel costs to improve profitability.","zh":"我們需要減少人事費用以提高盈利能力。"}],"tips":["複數主動詞一致性：personnel 是集合名詞，指全體職員，在文法上通常接複數動詞（如：Personnel are encouraged to...），在 Part 5 短句填空中是常見陷阱。"],"forms":["personnel"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"supervisor","pos":"n.","meaning":"主管","phrase":"immediate supervisor","category":"人事與招募","id":"w0069","number":69,"examples":[{"en":"Your supervisor is in a meeting.","zh":"你的主管正在開會。"},{"en":"The project supervisor will review the team's progress every Friday.","zh":"專案主管將於每週五檢查團隊的進度。"}],"tips":["常見搭配詞：'immediate supervisor'（直屬上司）、'shift supervisor'（值班主管）、'report to a supervisor'（向主管報告），這些組合在聽力與閱讀中出現頻率極高。"],"forms":["supervisor","supervisors"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"subordinate","pos":"n.","meaning":"部屬；下屬","phrase":"supervise subordinates","category":"人事與招募","id":"w0070","number":70,"examples":[{"en":"Each subordinate will receive clear instructions.","zh":"每位部屬都會收到明確的指示。"},{"en":"As a subordinate employee, he needs to follow the manager's instructions carefully.","zh":"作為一名從屬員工，他需要仔細遵循經理的指示。"}],"tips":["常見搭配詞：最常出現在商業情境的用法是 'immediate subordinate' (直屬下屬) 以及 'subordinate to' (隸屬於/次要於)。在組織管理的閱讀測驗中，常用於描述職位高低關係。"],"forms":["subordinate","more subordinate","most subordinate","subordinates"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"trainee","pos":"n.","meaning":"受訓人員","phrase":"management trainee","category":"人事與招募","id":"w0071","number":71,"examples":[{"en":"The trainee is learning to use the system.","zh":"受訓人員正在學習使用系統。"},{"en":"The company offers a comprehensive training program for new trainees.","zh":"該公司為新實習生提供全面的培訓計畫。"}],"tips":["字尾辨析：字尾 -ee 表示動作的受事者（被培訓的人），常與 -er（做動作的人，如 trainer 培訓師）成對出現。在聽力測驗中，需注意誰是發放指示者，誰是學習者。"],"forms":["trainee","trainees"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"intern","pos":"n.","meaning":"實習生","phrase":"summer intern","category":"人事與招募","id":"w0072","number":72,"examples":[{"en":"The new intern starts on Monday.","zh":"新實習生星期一開始上班。"},{"en":"We hired an intern to help with the project.","zh":"我們聘了一位實習生協助這個專案。"}],"tips":["常見搭配詞組：'internship program' (實習計畫)、'summer intern' (暑期實習生)、'serve as an intern' (擔任實習生) 以及 'paid/unpaid intern' (有薪/無薪實習生)。"],"forms":["intern","interns"],"exampleSource":"Wordstep original examples"},{"word":"orientation","pos":"n.","meaning":"新人說明；職前介紹","phrase":"employee orientation","category":"人事與招募","id":"w0073","number":73,"examples":[{"en":"Orientation is scheduled for Monday morning.","zh":"新人說明會安排在星期一早上。"},{"en":"The compass showed the correct orientation of the building.","zh":"指南針顯示了建築物的正確方位。"}],"tips":["常見搭配詞與固定用法：在多益中最常見的組合是「new employee orientation」（新進員工入職培訓）以及「orientation session」（說明會/培訓課程）。此外，「orientation packet」（新進員工資料包）也常出現在辦公室情境中。"],"forms":["orientation","orientations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"training","pos":"n.","meaning":"培訓；訓練","phrase":"staff training","category":"人事與招募","id":"w0074","number":74,"examples":[{"en":"The training is free for employees.","zh":"這項培訓對員工免費。"},{"en":"Employees are required to attend regular safety training sessions.","zh":"員工必須參加定期的安全培訓課程。"}],"tips":["常見搭配詞：'provide/undergo training'(提供/接受培訓)、'training session'(培訓課程)、'on-the-job training'(在職訓練) 以及 'training manual'(訓練手冊)。"],"forms":["training","trainings","trains","trained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"promotion","pos":"n.","meaning":"升遷","phrase":"receive a promotion","category":"人事與招募","id":"w0075","number":75,"examples":[{"en":"She received a promotion last month.","zh":"她上個月獲得升遷。"},{"en":"He hopes to earn a promotion this year.","zh":"他希望今年能獲得升遷。"}],"tips":["雙重語義辨析：在多益中常考兩大核心意義，一為『職位晉升』(人事管理場景)，二為『促銷活動』(行銷與零售場景)。若出現在公告、備忘錄中常指升職；若出現在廣告、宣傳單中則多指特價。"],"forms":["promotion","promotions","promotes","promoting","promoted"],"exampleSource":"Wordstep original examples"},{"word":"transfer","pos":"n./v.","meaning":"調職；調動","phrase":"transfer to another branch","category":"人事與招募","id":"w0076","number":76,"examples":[{"en":"You can request a transfer to another branch.","zh":"你可以申請調到另一間分公司。"},{"en":"The company is transferring Mr. Lee to the marketing department.","zh":"公司將李先生調到行銷部門。"}],"tips":["商業與金融搭配：在多益閱讀與聽力中，transfer 常出現在銀行情境，如 'wire transfer' (電匯) 或 'bank transfer' (銀行轉帳)。"],"forms":["transfer","transfers","transferring","transferred"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"resign","pos":"v.","meaning":"辭職","phrase":"resign from a position","category":"人事與招募","id":"w0077","number":77,"examples":[{"en":"She plans to resign next month.","zh":"她打算下個月辭職。"},{"en":"Why did the manager decide to resign?","zh":"經理為什麼決定辭職？"}],"tips":["常見搭配詞組：'resign from (a position)'（辭去某職位）、'resign as (a role)'（辭去...身份，如 resign as manager）、'tender/submit one's resignation'（遞交辭職信）。"],"forms":["resign","resigns","resigning","resigned"],"exampleSource":"Wordstep original examples"},{"word":"resignation","pos":"n.","meaning":"辭職","phrase":"submit a resignation","category":"人事與招募","id":"w0078","number":78,"examples":[{"en":"Your resignation will take effect next week.","zh":"你的辭職將於下星期生效。"},{"en":"The company received his resignation letter this morning.","zh":"公司今天早上收到他的辭呈。"}],"tips":["常見搭配詞：高頻片語包括 'tender/submit one's resignation' (提出辭職) 與 'accept/refuse a resignation' (接受/拒絕辭職)，在 Part 5 語法題中常考動詞搭配。"],"forms":["resignation","resignations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"retire","pos":"v.","meaning":"退休","phrase":"retire from the company","category":"人事與招募","id":"w0079","number":79,"examples":[{"en":"Our manager will retire next year.","zh":"我們的經理明年將退休。"},{"en":"Mr. Thompson plans to retire from the company after 30 years of service.","zh":"湯普森先生計劃在為公司服務 30 年後退休。"}],"tips":["常見搭配詞與語法：最常接介係詞 'from'，如 'retire from the position' (從該職位退休)，此外 'early retirement' (提前退休) 與 'mandatory retirement age' (強制退休年齡) 是閱讀測驗的高頻詞組。"],"forms":["retire","retires","retiring","retired"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"retirement","pos":"n.","meaning":"退休","phrase":"retirement plan","category":"人事與招募","id":"w0080","number":80,"examples":[{"en":"Her retirement party is on Friday.","zh":"她的退休歡送會在星期五。"},{"en":"The company offers a generous retirement package to its long-term employees.","zh":"該公司為其長期員工提供豐厚的退休福利。"}],"tips":["常見搭配詞與情境：在 TOEIC 閱讀中常出現 'early retirement' (提早退休)、'retirement party/celebration' (退休派對) 與 'retirement plan/benefits' (退休計畫/福利)。多見於公司內部公告 (Memorandum) 或人力資源部的電子郵件。"],"forms":["retirement","retirements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"dismiss","pos":"v.","meaning":"解雇","phrase":"dismiss an employee","category":"人事與招募","id":"w0081","number":81,"examples":[{"en":"The company can dismiss employees for serious misconduct.","zh":"公司可以因嚴重不當行為解雇員工。"},{"en":"The company decided to dismiss the employee due to poor performance.","zh":"由於績效不佳，公司決定解雇這位員工。"}],"tips":["多重語意辨析：在 TOEIC 中，dismiss 主要有兩個核心語意：『解雇』與『駁回/不予理會』。當受詞是員工時，意指開除；當受詞是提議 (proposal) 或計畫 (plan) 時，則指拒絕。"],"forms":["dismiss","dismisses","dismissing","dismissed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"terminate","pos":"v.","meaning":"終止；解雇","phrase":"terminate employment","category":"人事與招募","id":"w0082","number":82,"examples":[{"en":"Either side can terminate the contract.","zh":"任何一方都可以終止合約。"},{"en":"The company decided to terminate the contract due to repeated breaches.","zh":"由於多次違約，公司決定終止合約。"}],"tips":["常見搭配詞：在TOEIC中最常出現於合約或人事議題，如'terminate a contract'（終止合約）、'terminate a lease'（終止租約）以及'terminate employment'（終止僱傭關係）。"],"forms":["terminate","terminates","terminating","terminated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"salary","pos":"n.","meaning":"薪資","phrase":"annual salary","category":"人事與招募","id":"w0083","number":83,"examples":[{"en":"Your salary will be paid on Friday.","zh":"你的薪資將於星期五支付。"},{"en":"The company offers competitive salaries and benefits to attract top talent.","zh":"該公司提供具競爭力的薪資和福利，以吸引頂尖人才。"}],"tips":["常見搭配詞與慣用語：在 TOEIC 考試中，'salary' 常與 'competitive' (具競爭力的)、'annual' (年度的)、'base' (底薪) 搭配使用。常見短語如 'salary expectations' (期望薪資) 及 'salary negotiation' (薪資談判) 經常出現在招募情境。"],"forms":["salary","salaries"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"wage","pos":"n.","meaning":"工資","phrase":"hourly wage","category":"人事與招募","id":"w0084","number":84,"examples":[{"en":"The hourly wage is higher this year.","zh":"今年的時薪比較高。"},{"en":"Employees are paid a minimum wage of $15 per hour.","zh":"員工的最低工資是每小時 15 美元。"}],"tips":["常見搭配詞與短語：TOEIC 中常考 'minimum wage' (最低工資)、'hourly wage' (時薪)、'wage increase' (加薪) 及 'wage negotiation' (薪資談判)。"],"forms":["wage","wages"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"payroll","pos":"n.","meaning":"薪資名冊；薪資系統","phrase":"payroll department","category":"人事與招募","id":"w0085","number":85,"examples":[{"en":"The payroll department is checking the figures.","zh":"薪資部門正在核對數字。"},{"en":"The HR department is responsible for processing the monthly payroll.","zh":"人資部門負責處理每月的薪資清單。"}],"tips":["常見搭配詞組：'on the payroll' 表示受雇並領取薪資中，'payroll department' 指薪資部門，'payroll processing' 指薪資核算流程。"],"forms":["payroll","payrolls"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"compensation","pos":"n.","meaning":"薪酬；補償","phrase":"compensation package","category":"人事與招募","id":"w0086","number":86,"examples":[{"en":"The compensation package includes health insurance.","zh":"薪酬方案包含健康保險。"},{"en":"Employees are entitled to compensation for overtime work.","zh":"員工有權利獲得加班工作的薪酬。"}],"tips":["雙重語義掌握：在TOEIC人力資源（HR）情境中，常指「薪資報酬」（等同於salary plus benefits），例如「compensation package」；在保險或法律情境中，則指「賠償金/補償金」，如「seek compensation for damages」。"],"forms":["compensation","compensations"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"benefit","pos":"n.","meaning":"福利","phrase":"employee benefits","category":"人事與招募","id":"w0087","number":87,"examples":[{"en":"Free meals are an employee benefit.","zh":"免費餐點是一項員工福利。"},{"en":"The company offers a comprehensive benefits package, including health insurance and paid vacation.","zh":"公司提供全面的福利待遇，包括醫療保險和帶薪休假。"}],"tips":["常見搭配詞：在 HR 與行政情境中，常考 'employee benefits' (員工福利)、'fringe benefits' (額外福利) 或 'benefit package' (福利組合)。"],"forms":["benefit","benefits","benefiting","benefited"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"bonus","pos":"n.","meaning":"獎金","phrase":"annual bonus","category":"人事與招募","id":"w0088","number":88,"examples":[{"en":"Your bonus will arrive with your salary.","zh":"你的獎金將與薪資一起入帳。"},{"en":"The company announced a generous bonus for employees who exceeded their sales targets.","zh":"公司宣布，對於超額達成銷售目標的員工，將發放豐厚的獎金。"}],"tips":["常見搭配詞與短語：'performance bonus' (績效獎金)、'annual bonus' (年終獎金)、'sign-on bonus' (簽約獎金) 以及 'year-end bonus'。"],"forms":["bonus","bonuses"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"pension","pos":"n.","meaning":"退休金","phrase":"pension plan","category":"人事與招募","id":"w0089","number":89,"examples":[{"en":"The pension plan is explained in this booklet.","zh":"退休金方案在這本手冊中有說明。"},{"en":"Department heads discussed the pension strategy during yesterday's executive meeting.","zh":"部門主管在昨天的高層會議中討論了pension策略。"}],"tips":["常見搭配詞組：pension plan (退休金計畫)、pension fund (退休基金)、pension scheme (退休制度) 以及 contribute to a pension (提撥退休金)。"],"forms":["pension"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"insurance","pos":"n.","meaning":"保險","phrase":"health insurance","category":"人事與招募","id":"w0090","number":90,"examples":[{"en":"Health insurance is included in the benefits.","zh":"福利包含健康保險。"},{"en":"The company offers comprehensive insurance coverage for its employees.","zh":"該公司為員工提供全面的保險保障。"}],"tips":["常見搭配詞組：'insurance policy' (保險單)、'insurance premium' (保險費)、'insurance coverage' (保險範圍) 與 'take out insurance' (投保)。在 Part 5 和 Part 6 中，這些固定搭配常是考點。"],"forms":["insurance","insurances"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"evaluate","pos":"v.","meaning":"評估","phrase":"evaluate performance","category":"人事與招募","id":"w0091","number":91,"examples":[{"en":"We will evaluate the results next week.","zh":"我們下星期將評估結果。"},{"en":"The manager will evaluate the employee's performance during the annual review.","zh":"經理將在年度審查中評估員工的表現。"}],"tips":["常見搭配詞組：evaluate the performance (評估績效)、evaluate the effectiveness (評估成效)、evaluate the impact (評估影響)、evaluate the feasibility (評估可行性)。"],"forms":["evaluate","evaluates","evaluating","evaluated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"evaluation","pos":"n.","meaning":"評估","phrase":"performance evaluation","category":"人事與招募","id":"w0092","number":92,"examples":[{"en":"Your evaluation will take place on Friday.","zh":"你的評估將在星期五進行。"},{"en":"Please read the evaluation before our meeting.","zh":"請在我們開會前閱讀這份評估。"}],"tips":["常見搭配詞：TOEIC 考試中常出現 'performance evaluation' (績效考核)、'conduct an evaluation' (進行評估) 以及 'preliminary evaluation' (初步評估)。"],"forms":["evaluation","evaluations","evaluates","evaluating","evaluated"],"exampleSource":"Wordstep original examples"},{"word":"performance","pos":"n.","meaning":"工作表現；績效","phrase":"employee performance","category":"人事與招募","id":"w0093","number":93,"examples":[{"en":"Her performance is improving.","zh":"她的工作表現正在進步。"},{"en":"The company is evaluating employee performance to determine salary increases.","zh":"公司正在評估員工績效，以決定薪資調整。"}],"tips":["多重含義辨析：在多益中常用於『工作表現』、『公司業績』或『機器性能』，亦可指藝術『表演』。"],"forms":["performance","performances","performs","performing","performed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"productive","pos":"adj.","meaning":"有生產力的；有效率的","phrase":"productive employee","category":"人事與招募","id":"w0094","number":94,"examples":[{"en":"We had a productive meeting today.","zh":"我們今天開了一場有效率的會議。"},{"en":"A quiet office helps me stay productive.","zh":"安靜的辦公室有助於我保持工作效率。"}],"tips":["常見搭配詞組：在商業書信或會議中，常用於 a productive meeting（富有成效的會議）、a productive workforce（具生產力的勞動力）或 a highly productive day。"],"forms":["productive","more productive","most productive"],"exampleSource":"Wordstep original examples"},{"word":"experienced","pos":"adj.","meaning":"有經驗的","phrase":"experienced applicant","category":"人事與招募","id":"w0095","number":95,"examples":[{"en":"Our new accountant is experienced.","zh":"我們的新會計師很有經驗。"},{"en":"The company values experienced employees who can mentor junior staff.","zh":"公司重視經驗豐富的員工，他們可以指導初級員工。"}],"tips":["常見搭配詞與結構：'experienced' 常與副詞 'highly', 'widely' 或 'extensively' 連用組成 'highly experienced'；在用法上常接介係詞 'in'，例如 'experienced in customer service'。"],"forms":["experienced","more experienced","most experienced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"qualified","pos":"adj.","meaning":"符合資格的","phrase":"qualified candidate","category":"人事與招募","id":"w0096","number":96,"examples":[{"en":"You are qualified for this position.","zh":"你符合這個職位的資格。"},{"en":"To be qualified for the loan, applicants must meet certain financial requirements.","zh":"要符合貸款資格，申請人必須滿足一定的財務要求。"}],"tips":["常見搭配詞與句型：在 TOEIC 中常以 be qualified for + 名詞（具備...的資格）或 be qualified to + 動詞（有資格做...）的形式出現。例如：She is qualified for the position 或 He is qualified to lead the project。"],"forms":["qualified","more qualified","most qualified"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"eligible","pos":"adj.","meaning":"符合資格的","phrase":"eligible for promotion","category":"人事與招募","id":"w0097","number":97,"examples":[{"en":"Part-time workers are eligible for this benefit.","zh":"兼職員工符合領取這項福利的資格。"},{"en":"The company is looking for eligible candidates with strong communication skills.","zh":"公司正在尋找具備良好溝通技巧的合格候選人。"}],"tips":["常見搭配詞：最常搭配介系詞 for 接名詞（如 eligible for a refund / promotion）或接 to 與原形動詞（如 eligible to receive benefits），這是 Part 5 填充題的常考點。"],"forms":["eligible","more eligible","most eligible"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"temporary","pos":"adj.","meaning":"臨時的；短期的","phrase":"temporary employee","category":"人事與招募","id":"w0098","number":98,"examples":[{"en":"This is a temporary position.","zh":"這是一個臨時職位。"},{"en":"The company offered him a temporary position to assess his skills.","zh":"公司提供他一份臨時職位以評估他的技能。"}],"tips":["常見搭配詞組：此單字經常出現在人力資源與設施維護情境，常見組合如 'temporary staff' (臨時雇員)、'temporary position' (約聘/臨時職缺) 以及 'temporary closure' (暫時關閉)。"],"forms":["temporary","more temporary","most temporary"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"permanent","pos":"adj.","meaning":"永久的；長期的","phrase":"permanent position","category":"人事與招募","id":"w0099","number":99,"examples":[{"en":"A permanent position will be available soon.","zh":"很快就會有一個長期職位。"},{"en":"The company offers permanent positions with benefits after a probationary period.","zh":"公司在試用期過後提供帶有福利的永久職位。"}],"tips":["常用於描述僱傭狀態：在 TOEIC 閱讀測驗（特別是招聘廣告）中，'permanent position'（正職/永久職位）常與 'temporary position'（臨時職位）或 'contract-based'（約聘制）做對比，考生應以此判斷福利待遇。"],"forms":["permanent","more permanent","most permanent"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"professional","pos":"adj./n.","meaning":"專業的；專業人士","phrase":"professional experience","category":"人事與招募","id":"w0100","number":100,"examples":[{"en":"The service was professional and friendly.","zh":"服務專業又親切。"},{"en":"The company hired a professional translator for the important contract.","zh":"公司聘請了一位專業翻譯人員來處理重要的合約。"}],"tips":["詞性雙重身分：professional 在 TOEIC 中極常考詞性轉換，它既是形容詞（專業的）也是名詞（專業人士，如 a healthcare professional），考生常誤以為結尾為 -al 僅能作形容詞。"],"forms":["professional","more professional","most professional","professionals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"meeting","pos":"n.","meaning":"會議","phrase":"attend a meeting","category":"會議與商務溝通","id":"w0101","number":101,"examples":[{"en":"The meeting starts at nine.","zh":"會議九點開始。"},{"en":"The meeting was moved to Friday.","zh":"會議被改到星期五。"}],"tips":["例句2的 was moved 表示「被改到」。會議本身沒有移動，是時間被更改。"],"forms":["meeting","meetings","meets","met"],"exampleSource":"Wordstep original examples"},{"word":"conference","pos":"n.","meaning":"會議；研討會","phrase":"annual conference","category":"會議與商務溝通","id":"w0102","number":102,"examples":[{"en":"The conference will last two days.","zh":"這場研討會將持續兩天。"},{"en":"The annual sales conference will be held in New York City next month.","zh":"我們下個月會在紐約市舉辦年度銷售會議。"}],"tips":["常見搭配詞組：'hold a conference'（舉辦會議）、'attend a conference'（參加會議）、'conference call'（電話會議）以及 'press conference'（記者會）。"],"forms":["conference","conferences"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"agenda","pos":"n.","meaning":"議程","phrase":"meeting agenda","category":"會議與商務溝通","id":"w0103","number":103,"examples":[{"en":"The agenda is attached to the email.","zh":"議程附在電子郵件裡。"},{"en":"The agenda for the conference includes presentations on market trends and new technologies.","zh":"這次會議的議程包含關於市場趨勢和新技術的簡報。"}],"tips":["常見搭配詞組：'on the agenda' (在議程上)、'set the agenda' (制定議程)、'hidden agenda' (隱藏動機/別有用心)、'tentative agenda' (初步議程)。"],"forms":["agenda","agendas"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"minutes","pos":"n.","meaning":"會議紀錄","phrase":"meeting minutes","category":"會議與商務溝通","id":"w0104","number":104,"examples":[{"en":"The minutes are ready for review.","zh":"會議紀錄可以審閱了。"},{"en":"The meeting is scheduled for 30 minutes.","zh":"會議預計舉行 30 分鐘。"}],"tips":["語義辨析：在 TOEIC 考試中，除了表示時間（分鐘），「minutes」最常指的是「會議紀錄」，這是商務會議情境中的核心單字。"],"forms":["minutes"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"participant","pos":"n.","meaning":"參與者","phrase":"conference participant","category":"會議與商務溝通","id":"w0105","number":105,"examples":[{"en":"Each participant will receive a name tag.","zh":"每位參與者都會收到名牌。"},{"en":"All participants are required to register online before the conference begins.","zh":"所有參與者在會議開始前都必須在網上註冊。"}],"tips":["詞性辨析：字尾 '-ant' 通常指人，在 TOEIC Part 5 中常考詞性變化，考生需區分 participant (參與者)、participation (參與-名詞) 與 participate (參與-動詞)。若空格前有形容詞或指代人時，應優先考慮 participant。"],"forms":["participant","participants"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"attendee","pos":"n.","meaning":"出席者","phrase":"meeting attendee","category":"會議與商務溝通","id":"w0106","number":106,"examples":[{"en":"Every attendee should sign in.","zh":"每位出席者都應簽到。"},{"en":"The conference had over 500 attendees from various industries around the globe.","zh":"這次會議有來自全球各行各業的 500 多名與會者。"}],"tips":["詞彙辨析：務必區分 attendee (參加者) 與 attendant (服務員/服務人員)，兩者語意完全不同，後者通常指提供服務的人(如 flight attendant)。"],"forms":["attendee","attendees"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"speaker","pos":"n.","meaning":"講者；發言者","phrase":"guest speaker","category":"會議與商務溝通","id":"w0107","number":107,"examples":[{"en":"The speaker is ready to begin.","zh":"講者準備好開始了。"},{"en":"Could you please check if the speaker's microphone is working properly?","zh":"請您確認一下演講者的麥克風是否正常工作。"}],"tips":["多義性辨析：'speaker' 在 TOEIC 中具備雙重含意，一指『演講者』，二指『揚聲器/喇叭』。考生需根據上下文（如會議情境或電子產品規格）快速切換理解。"],"forms":["speaker","speakers"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"presentation","pos":"n.","meaning":"簡報；發表","phrase":"give a presentation","category":"會議與商務溝通","id":"w0108","number":108,"examples":[{"en":"Her presentation starts at ten.","zh":"她的簡報十點開始。"},{"en":"Please prepare a short presentation for the meeting.","zh":"請為會議準備一份簡短的簡報。"}],"tips":["常見搭配詞組：在多益中最常搭配動詞 give, make 或 deliver，例如 \"give a presentation\" (進行簡報)。"],"forms":["presentation","presentations","presents","presenting","presented"],"exampleSource":"Wordstep original examples"},{"word":"discussion","pos":"n.","meaning":"討論","phrase":"group discussion","category":"會議與商務溝通","id":"w0109","number":109,"examples":[{"en":"The discussion is about next year's budget.","zh":"這次討論是關於明年的預算。"},{"en":"Let's schedule a brief discussion to address the project's current challenges.","zh":"讓我們安排一次簡短的討論，以解決專案目前面臨的挑戰。"}],"tips":["常見搭配詞組：在 TOEIC 中常出現 have a discussion with someone (與某人討論)、be under discussion (正在討論中)、a fruitful/lengthy discussion (富有成效/漫長的討論)。"],"forms":["discussion","discussions","discusses","discussing","discussed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"proposal","pos":"n.","meaning":"提案；建議","phrase":"submit a proposal","category":"會議與商務溝通","id":"w0110","number":110,"examples":[{"en":"Your proposal is on the manager's desk.","zh":"你的提案在經理的桌上。"},{"en":"The marketing team submitted a proposal for a new advertising campaign.","zh":"行銷團隊提交了一份新的廣告活動提案。"}],"tips":["常見搭配詞：在 TOEIC 中常與動詞 submit (提交)、review (審查)、approve (核准) 或 reject (退回) 連用。常見片語如 'budget proposal' (預算提案) 或 'grant proposal' (撥款申請)。"],"forms":["proposal","proposals"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"suggestion","pos":"n.","meaning":"建議","phrase":"make a suggestion","category":"會議與商務溝通","id":"w0111","number":111,"examples":[{"en":"Your suggestion is worth considering.","zh":"你的建議值得考慮。"},{"en":"The manager suggested a meeting to discuss the budget cuts.","zh":"經理建議召開會議討論預算削減。"}],"tips":["常見搭配詞：常用 make a suggestion (提建議) 而非 do a suggestion，此外 at the suggestion of someone (在某人的建議下) 是閱讀測驗中常見的固定介系詞用法。"],"forms":["suggestion","suggestions","suggests","suggesting","suggested"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"opinion","pos":"n.","meaning":"意見；看法","phrase":"express an opinion","category":"會議與商務溝通","id":"w0112","number":112,"examples":[{"en":"Your opinion is important to us.","zh":"你的意見對我們很重要。"},{"en":"The manager asked for everyone's opinion on the new marketing strategy.","zh":"經理詢問每個人對新行銷策略的意見。"}],"tips":["常見搭配詞組：常用搭配動詞包括 'express an opinion' (表達意見)、'seek an opinion' (尋求建議) 或 'give an opinion' (給予看法)；形容詞則常接 'professional opinion' (專業意見) 或 'second opinion' (第二意見，通常指醫療或技術上的多方參考)。"],"forms":["opinion","opinions"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"feedback","pos":"n.","meaning":"回饋；意見","phrase":"provide feedback","category":"會議與商務溝通","id":"w0113","number":113,"examples":[{"en":"We can collect feedback after the workshop.","zh":"我們可以在工作坊結束後收集回饋。"},{"en":"We appreciate your feedback on the new software interface.","zh":"我們感謝您對新軟體介面的回饋。"}],"tips":["語法特性：feedback 是不可數名詞，即使表達「多項建議」，絕對不能加上 s (如：some feedback 而非 feedbacks)，這是 Part 5 文法題的經典考點。"],"forms":["feedback"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"comment","pos":"n./v.","meaning":"評論；意見","phrase":"make a comment","category":"會議與商務溝通","id":"w0114","number":114,"examples":[{"en":"You can leave a comment below.","zh":"你可以在下方留言。"},{"en":"Please comment on the presentation to help us improve.","zh":"請對簡報提出評論，以幫助我們改進。"}],"tips":["常見搭配詞與語法：作動詞時後接介係詞 on (comment on something)，不可直接接對象；作名詞時常用 make a comment 表示發表評論。"],"forms":["comment","comments","commenting","commented"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"response","pos":"n.","meaning":"回覆；回應","phrase":"receive a response","category":"會議與商務溝通","id":"w0115","number":115,"examples":[{"en":"A response will be sent within two days.","zh":"回覆將在兩天內寄出。"},{"en":"The company is awaiting a response to its proposal.","zh":"公司正在等待對其提案的回應。"}],"tips":["常見搭配詞：在 TOEIC 閱讀中，常見 'in response to' (作為對...的回應) 以及形容詞搭配 'prompt/quick/timely response' (即時的回覆)，這是商業書信中極高頻的表達方式。"],"forms":["response","responses","responds","responding","responded"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"reply","pos":"n./v.","meaning":"回覆","phrase":"reply to an email","category":"會議與商務溝通","id":"w0116","number":116,"examples":[{"en":"I can reply to your email today.","zh":"我今天可以回覆你的電子郵件。"},{"en":"The manager requested a prompt reply to the email regarding the contract.","zh":"經理要求迅速回覆關於合約的電子郵件。"}],"tips":["介係詞的關鍵用法：reply 作為動詞時是不及物動詞，後方接對象必須加上 to（例如 reply to the email），而其同義詞 answer 則是及物動詞，直接接對象，這在 Part 5 文法題中是極高頻的考點。"],"forms":["reply","replies","replying","replied"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"message","pos":"n.","meaning":"訊息；留言","phrase":"leave a message","category":"會議與商務溝通","id":"w0117","number":117,"examples":[{"en":"You can leave a message for the manager.","zh":"你可以留言給經理。"},{"en":"Please forward this urgent message to the project manager immediately.","zh":"請立即將此緊急訊息轉發給專案經理。"}],"tips":["常見搭配詞與短語：在聽力測驗 Part 3 與 Part 4 中，經常出現 'take a message' (幫忙傳話/記錄留言) 或 'leave a message' (留下留言)。例如當撥打電話對方不在位子上時，接線生常問 'Would you like to leave a message?'。"],"forms":["message","messages","messaging","messaged"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"email","pos":"n./v.","meaning":"電子郵件；寄電子郵件","phrase":"send an email","category":"會議與商務溝通","id":"w0118","number":118,"examples":[{"en":"The email is from a customer.","zh":"這封電子郵件來自一位顧客。"},{"en":"Please send your resume as an email attachment.","zh":"請將您的履歷以電子郵件附件的形式寄出。"}],"tips":["常見搭配詞與動詞用法：多益常考 send/receive an email（寄送/接收）、forward an email（轉寄）以及 reply to an email（回覆）。注意 email 亦可當動詞使用，如 'Please email me the report'。"],"forms":["email","emails"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"telephone","pos":"n./v.","meaning":"電話；打電話","phrase":"telephone number","category":"會議與商務溝通","id":"w0119","number":119,"examples":[{"en":"The telephone is on the desk.","zh":"電話在桌上。"},{"en":"Could you please leave a message on the telephone?","zh":"您好，請問可以留言嗎？"}],"tips":["常見搭配詞：'telephone extension' (電話分機)、'telephone directory' (電話簿)、'by telephone' (透過電話)。"],"forms":["telephone","telephones"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"contact","pos":"n./v.","meaning":"聯絡；聯絡人","phrase":"contact a client","category":"會議與商務溝通","id":"w0120","number":120,"examples":[{"en":"You can contact us by phone.","zh":"你可以打電話聯絡我們。"},{"en":"Please contact our sales department for a quotation.","zh":"請聯絡我們的銷售部門以獲取報價。"}],"tips":["及物動詞用法陷阱：在多益 Part 5 文法題中，常考 contact 作為動詞時其後不加介系詞（如：Please contact us），不可寫成 contact with us。但當 contact 作為名詞時，則常與 with 連用（如：make contact with someone）。"],"forms":["contact","contacts","contacting","contacted"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"communicate","pos":"v.","meaning":"溝通；傳達","phrase":"communicate effectively","category":"會議與商務溝通","id":"w0121","number":121,"examples":[{"en":"We communicate by email every day.","zh":"我們每天透過電子郵件溝通。"},{"en":"Please communicate the changes to your team.","zh":"請把這些變更傳達給你的團隊。"}],"tips":["常見搭配詞與介係詞用法：務必掌握 'communicate with someone' (與某人溝通) 及 'communicate something to someone' (將某事傳達給某人) 的結構，TOEIC 詞彙題常考介係詞的搭配。"],"forms":["communicate","communicates","communicating","communicated"],"exampleSource":"Wordstep original examples"},{"word":"inform","pos":"v.","meaning":"告知","phrase":"inform employees","category":"會議與商務溝通","id":"w0122","number":122,"examples":[{"en":"I will inform the team of the change.","zh":"我會把這項變更告知團隊。"},{"en":"Please inform the accounting department of any discrepancies in the invoice.","zh":"請通知會計部門任何發票上的差異。"}],"tips":["常見句型結構為「inform someone of/about something」或「inform someone + that 子句」，多益 Part 5 常考介系詞 of 的搭配。"],"forms":["inform","informs","informing","informed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"notify","pos":"v.","meaning":"通知","phrase":"notify customers","category":"會議與商務溝通","id":"w0123","number":123,"examples":[{"en":"We will notify you when the order is ready.","zh":"訂單準備好時我們會通知你。"},{"en":"Please notify us if you need to reschedule your appointment.","zh":"如果您需要重新安排您的預約，請通知我們。"}],"tips":["語法結構重點：notify 最常見的用法是「notify someone of something」或「notify someone that + 子句」。TOEIC 考試常在 Part 5 考查介系詞「of」的搭配，考生須注意 notify 的直接受詞必須是「人」或「組織」。"],"forms":["notify","notifies","notifying","notified"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"mention","pos":"v.","meaning":"提及","phrase":"mention a problem","category":"會議與商務溝通","id":"w0124","number":124,"examples":[{"en":"You can mention the problem in your report.","zh":"你可以在報告中提及這個問題。"},{"en":"The report briefly mentions the company's new sustainability initiatives.","zh":"這份報告簡要地提到了公司的新的永續發展計畫。"}],"tips":["常見搭配詞與句型：此單字常以 'make mention of' (提到) 或 'as mentioned above/previously' (如前所述) 的形式出現在閱讀測驗中。"],"forms":["mention","mentions","mentioning","mentioned"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"explain","pos":"v.","meaning":"解釋；說明","phrase":"explain a procedure","category":"會議與商務溝通","id":"w0125","number":125,"examples":[{"en":"I can explain the process again.","zh":"我可以再說明一次流程。"},{"en":"Could you explain the reason for the project's delay to the stakeholders?","zh":"您能向利害關係人解釋專案延遲的原因嗎？"}],"tips":["句型結構陷阱：explain 最核心的考點在於其句型結構為 'explain + 事物 + to + 人'。在 Part 5 中常出現 'explain me' 的錯誤選項，正確必須是 'explain to me'，這一點與 tell 或 inform 的用法完全不同。"],"forms":["explain","explains","explaining","explained"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"describe","pos":"v.","meaning":"描述；說明","phrase":"describe the situation","category":"會議與商務溝通","id":"w0126","number":126,"examples":[{"en":"You can describe the problem in the form.","zh":"你可以在表格中描述問題。"},{"en":"Could you describe the problem you're experiencing with the software?","zh":"您能描述一下您在使用軟體時遇到的問題嗎？"}],"tips":["常見搭配詞：'describe in detail' (詳細描述) 與 'accurately describe' (精確描述) 常出現在閱讀測驗中，用來修飾產品說明或報表分析。"],"forms":["describe","describes","describing","described"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"discuss","pos":"v.","meaning":"討論","phrase":"discuss a proposal","category":"會議與商務溝通","id":"w0127","number":127,"examples":[{"en":"We can discuss the details tomorrow.","zh":"我們可以明天討論細節。"},{"en":"Let's discuss the project timeline in the meeting this afternoon.","zh":"我們今天下午的會議上來討論專案進度。"}],"tips":["及物動詞用法：這是多益文法題最常見的陷阱。記住 discuss 是及物動詞，後面必須直接接受詞（例如：discuss the matter），絕對不可接介系詞 about，這是與 talk about 最明顯的區別。"],"forms":["discuss","discusses","discussing","discussed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"recommend","pos":"v.","meaning":"推薦；建議","phrase":"recommend a solution","category":"會議與商務溝通","id":"w0128","number":128,"examples":[{"en":"I can recommend a nearby restaurant.","zh":"我可以推薦附近的一家餐廳。"},{"en":"I highly recommend this software for streamlining your workflow.","zh":"我強烈推薦這款軟體來簡化您的工作流程。"}],"tips":["語法結構：當 recommend 後接 that 子句時，子句中的動詞必須使用「原形動詞」，因為這屬於虛擬語氣（省略了 should），這在 Part 5 填充題是極高頻考點。"],"forms":["recommend","recommends","recommending","recommended"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"propose","pos":"v.","meaning":"提議；提出","phrase":"propose a change","category":"會議與商務溝通","id":"w0129","number":129,"examples":[{"en":"We will propose a new schedule.","zh":"我們將提出新的時間表。"},{"en":"The marketing team will propose a new advertising campaign to increase brand awareness.","zh":"行銷團隊將向管理層提出一個新的廣告活動，以提高品牌知名度。"}],"tips":["常見搭配詞與商務情境：'propose a solution' (提議解決方案)、'propose a budget' (提議預算) 或 'propose an amendment' (提議修正案)。在 TOEIC 閱讀 Part 6 或 Part 7 的商務電子郵件中，此單字常用於正式提出計畫或改變現狀。"],"forms":["propose","proposes","proposing","proposed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"request","pos":"n./v.","meaning":"要求；請求","phrase":"make a request","category":"會議與商務溝通","id":"w0130","number":130,"examples":[{"en":"Your request is being reviewed.","zh":"你的請求正在審核中。"},{"en":"You can request a refund online.","zh":"你可以在線上要求退款。"}],"tips":["例句1的 request 是名詞「請求」；例句2在 can 後面當動詞，表示提出要求。"],"forms":["request","requests","requesting","requested"],"exampleSource":"Wordstep original examples"},{"word":"inquire","pos":"v.","meaning":"詢問；查詢","phrase":"inquire about availability","category":"會議與商務溝通","id":"w0131","number":131,"examples":[{"en":"You can inquire about room prices by phone.","zh":"你可以打電話詢問房價。"},{"en":"The client inquired about our company's policy on returns and exchanges.","zh":"客戶詢問了我們公司關於退換貨的政策。"}],"tips":["常見搭配詞與介係詞：最常搭配 'about'，如 'inquire about the status of an order' (詢問訂單狀態)；若指調查某事則用 'inquire into'。"],"forms":["inquire","inquires","inquiring","inquired"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"confirm","pos":"v.","meaning":"確認","phrase":"confirm a meeting","category":"會議與商務溝通","id":"w0132","number":132,"examples":[{"en":"Can you confirm the time?","zh":"你可以確認時間嗎？"},{"en":"Your booking has been confirmed.","zh":"你的預訂已獲確認。"}],"tips":["Can you + 動詞原形，是常見的請求句。例句2的 confirmed 則表示已確認。"],"forms":["confirm","confirms","confirming","confirmed"],"exampleSource":"Wordstep original examples"},{"word":"clarify","pos":"v.","meaning":"澄清；說明清楚","phrase":"clarify the details","category":"會議與商務溝通","id":"w0133","number":133,"examples":[{"en":"The manager can clarify the rules.","zh":"經理可以把規則說明清楚。"},{"en":"The manager asked the team to clarify their roles and responsibilities.","zh":"經理要求團隊明確各自的角色和職責。"}],"tips":["常見搭配詞：常見搭配包括 clarify a point (澄清要點)、clarify a position (闡明立場) 或 clarify expectations (明確預期)。其名詞形式 clarification 常出現在詞組 seek clarification (尋求說明) 或 provide clarification (提供說明) 中。"],"forms":["clarify","clarifies","clarifying","clarified"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"emphasize","pos":"v.","meaning":"強調","phrase":"emphasize the importance","category":"會議與商務溝通","id":"w0134","number":134,"examples":[{"en":"The speaker will emphasize workplace safety.","zh":"講者將強調工作場所安全。"},{"en":"The presentation will emphasize the company's commitment to sustainable practices.","zh":"本次簡報將強調公司對永續發展的承諾。"}],"tips":["常見搭配與文法陷阱：emphasize 是及物動詞，其後直接接名詞受詞（例如 emphasize the importance），不可加介系詞 on；但其名詞形式 emphasis 則常與介系詞 on 連用（例如 place/put emphasis on），這是 Part 5 常見的文法考點。"],"forms":["emphasize","emphasizes","emphasizing","emphasized"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"announce","pos":"v.","meaning":"宣布；公布","phrase":"announce a decision","category":"會議與商務溝通","id":"w0135","number":135,"examples":[{"en":"We will announce the results on Friday.","zh":"我們將於星期五公布結果。"},{"en":"The airline announced a flight delay due to inclement weather.","zh":"由於惡劣天氣，航空公司宣布航班延誤。"}],"tips":["常見搭配詞組：常用於 announce a merger (宣布合併)、announce a new policy (宣布新政策) 或 make a formal announcement (發布正式聲明)。"],"forms":["announce","announces","announcing","announced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"introduce","pos":"v.","meaning":"介紹；引進","phrase":"introduce a new policy","category":"會議與商務溝通","id":"w0136","number":136,"examples":[{"en":"I will introduce our new colleague.","zh":"我將介紹我們的新同事。"},{"en":"Let me introduce Mr. Lee, our new marketing director.","zh":"讓我向大家介紹李先生，他是我們的新營銷主管。"}],"tips":["常見搭配詞：最常與介係詞 to 連用，構成「introduce A to B」(向 B 介紹 A)；此外常見「introduce a new product」(發表新產品) 或「introduce a policy」(推行新政策)。"],"forms":["introduce","introduces","introducing","introduced"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"address","pos":"v.","meaning":"處理；應對","phrase":"address a concern","category":"會議與商務溝通","id":"w0137","number":137,"examples":[{"en":"We can address your concerns today.","zh":"我們今天可以處理你的疑慮。"},{"en":"Please send the invoice to the following address.","zh":"請將發票寄至以下地址。"}],"tips":["多重詞義辨析：在 TOEIC 考試中，address 最常考的並非名詞「地址」，而是動詞用法。其核心意義包含「處理、解決（問題）」以及「向...發表演說」。"],"forms":["address","addresses","addressing","addressed"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"negotiate","pos":"v.","meaning":"協商；談判","phrase":"negotiate a contract","category":"會議與商務溝通","id":"w0138","number":138,"examples":[{"en":"We can negotiate a lower price.","zh":"我們可以協商較低的價格。"},{"en":"We need to negotiate the terms of the contract before signing it.","zh":"在簽署合約之前，我們需要協商條款。"}],"tips":["常見搭配詞組：常用於 'negotiate a contract' (洽談合約)、'negotiate with someone' (與某人協商) 以及 'under negotiation' (正在洽談中)。"],"forms":["negotiate","negotiates","negotiating","negotiated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"negotiation","pos":"n.","meaning":"協商；談判","phrase":"contract negotiation","category":"會議與商務溝通","id":"w0139","number":139,"examples":[{"en":"The negotiation will continue tomorrow.","zh":"協商將於明天繼續。"},{"en":"Successful negotiation requires strong communication skills and a willingness to compromise.","zh":"成功的談判需要強大的溝通技巧和願意妥協的意願。"}],"tips":["常見搭配詞組：'under negotiation' (正在交涉中)、'reach a negotiation' (達成協議) 或 'enter into negotiations' (開始談判)。"],"forms":["negotiation","negotiations","negotiates","negotiating","negotiated"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"agreement","pos":"n.","meaning":"協議；同意","phrase":"reach an agreement","category":"會議與商務溝通","id":"w0140","number":140,"examples":[{"en":"The agreement is ready to sign.","zh":"協議已準備好可以簽署。"},{"en":"Both parties signed the agreement to finalize the deal.","zh":"雙方簽署協議以完成交易。"}],"tips":["常見搭配詞組：熟記「reach an agreement」（達成協議）、「sign an agreement」（簽署協議）與「under the agreement」（根據協議內容），這些動詞與介系詞的組合是 Part 5 填充題的常見考點。"],"forms":["agreement","agreements"],"exampleSource":"Wordstep basic sentence; kknono668/toeic-vocab-tw context sentence"},{"word":"decision","pos":"n.","meaning":"決定"

name: Prepare complete Wordstep learning data
on:
  push:
    branches: [wordstep-site-2026]
    paths: [.github/workflows/wordstep-repair-data.yml]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover verified original 1000-entry source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 39108513705 --repo jay940106happy/test --name wordstep-vocabulary-source --dir working
      - name: Match complete bilingual examples
        run: |
          python3 - <<'PY'
          import json, re, unicodedata, urllib.request, pathlib, time, hashlib
          root = pathlib.Path('working')
          def get(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Wordstep-vocabulary-repair/1.0'})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          return r.read()
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2)
          info = json.loads(get('https://huggingface.co/api/datasets/kknono668/toeic-vocab-tw'))
          revision = info['sha']
          payload = get('https://huggingface.co/datasets/kknono668/toeic-vocab-tw/resolve/' + revision + '/data/toeic_vocabulary.json')
          corpus = json.loads(payload)
          assert isinstance(corpus, list) and len(corpus) > 1000
          source = json.loads((root/'source.json').read_text())
          assert len(source['words']) == 1000
          def norm(s):
              s = ''.join(c for c in unicodedata.normalize('NFKD', s.lower()) if not unicodedata.combining(c))
              return re.sub(r'[^a-z0-9]+', ' ', s).strip()
          lookup = {}
          for entry in corpus:
              lookup.setdefault(norm(entry.get('english_word','')), []).append(entry)
          matched, missing = [], []
          for i, word in enumerate(source['words'], 1):
              choices = lookup.get(norm(word['word']), [])
              examples, seen = [], set()
              tips, forms = [], []
              for item in choices:
                  tips += item.get('exam_tips', [])
                  forms += [f for row in item.get('word_forms', []) for f in row.get('forms', [])]
                  for ex in item.get('examples', []):
                      en, zh = ex.get('english','').strip(), ex.get('chinese','').strip()
                      key = norm(en)
                      targets = [norm(word['word'])] + [norm(f) for f in forms if isinstance(f,str)]
                      present = any(t and (' '+t+' ') in (' '+key+' ') for t in targets)
                      if en and zh and key not in seen and present and re.search(r'[\u3400-\u9fff]', zh):
                          examples.append({'en':en,'zh':zh}); seen.add(key)
              examples.sort(key=lambda ex:len(ex['en'].split()))
              record = {**word, 'id':f'w{i:04}', 'number':i, 'examples':examples[:2], 'tips':list(dict.fromkeys(tips))[:3], 'forms':list(dict.fromkeys(forms)), 'exampleSource':'kknono668/toeic-vocab-tw' if len(examples)>=2 else None}
              matched.append(record)
              if len(record['examples']) != 2:
                  missing.append(record)
          metadata = {'originalSource':source['source'], 'originalCount':1000, 'corpusSource':'https://huggingface.co/datasets/kknono668/toeic-vocab-tw', 'corpusRevision':revision, 'corpusSHA256':hashlib.sha256(payload).hexdigest(), 'corpusLicense':'CC BY-SA 4.0', 'corpusAuthor':'kknono668', 'matched':1000-len(missing), 'missing':len(missing)}
          (root/'matched.json').write_text(json.dumps(matched,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'missing.json').write_text(json.dumps(missing,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'metadata.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(metadata,ensure_ascii=False))
          print('Needs original examples:', ', '.join(w['word'] for w in missing))
          PY
      - name: Save inspectable data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wordstep-repaired-data
          path: working/
          retention-days: 14
          if-no-files-found: error

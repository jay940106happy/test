name: Verify public Wordstep GitHub Pages
on:
  push:
    branches: [wordstep-site-2026]
    paths:
      - .github/workflows/wordstep-verify-pages.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS endpoint and complete learner data
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, time
          url="https://jay940106happy.github.io/test/wordstep/"
          last=None
          for i in range(10):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Wordstep smoke test'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      html=r.read().decode('utf-8')
                      assert r.status == 200
                      assert 'text/html' in r.headers.get('Content-Type','')
                  m=re.search(r'<script id="word-data"[^>]*>(.*?)</script>',html,re.S)
                  assert m, 'Missing complete Wordstep data'
                  data=json.loads(m.group(1))
                  assert len(data)==1969, f'Expected 1969 cards, got {len(data)}'
                  assert sum(len(w['examples']) for w in data)==3938, 'Expected 3938 examples'
                  assert 'id="scope"' in html and 'speechSynthesis' in html
                  print("WORDSTEP_PAGES_VERIFIED",url,"200",len(data),"cards",3938,"examples")
                  break
              except Exception as e:
                  last=e
                  print("Attempt",i+1,":",repr(e))
                  time.sleep(6)
          else: raise RuntimeError("Public Wordstep Pages verification failed: "+repr(last))
          PY
